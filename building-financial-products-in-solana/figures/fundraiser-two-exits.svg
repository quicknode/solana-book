<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" font-family="Georgia, serif" fill="#111">
  <defs><marker id="fund-exits-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <!-- timeline -->
  <line x1="60" y1="70" x2="420" y2="70" stroke="#111" stroke-width="2"/>
  <line x1="60" y1="62" x2="60" y2="78" stroke="#111" stroke-width="2"/>
  <line x1="420" y1="62" x2="420" y2="78" stroke="#111" stroke-width="2"/>
  <text x="60" y="52" font-size="11" text-anchor="middle" font-weight="bold">day 0</text>
  <text x="420" y="52" font-size="11" text-anchor="middle" font-weight="bold">day 7</text>
  <text x="240" y="52" font-size="10.5" fill="#444" font-style="italic" text-anchor="middle">the window: contribute only</text>
  <!-- contributions flowing in -->
  <path d="M 120,120 L 120,84" stroke="#111" stroke-width="1.6" marker-end="url(#fund-exits-arr)"/>
  <path d="M 220,120 L 220,84" stroke="#111" stroke-width="1.6" marker-end="url(#fund-exits-arr)"/>
  <path d="M 320,120 L 320,84" stroke="#111" stroke-width="1.6" marker-end="url(#fund-exits-arr)"/>
  <text x="220" y="138" font-size="10.5" fill="#444" text-anchor="middle">contributions, max 10% of target each</text>
  <!-- vault box -->
  <rect x="470" y="40" width="120" height="60" fill="#f4f4f2" stroke="#111" stroke-width="2"/>
  <text x="530" y="65" font-size="12" font-weight="bold" text-anchor="middle">vault</text>
  <text x="530" y="82" font-size="10" fill="#444" text-anchor="middle">9,000 USDC target</text>
  <path d="M 424,70 L 466,70" stroke="#111" stroke-width="1.6" marker-end="url(#fund-exits-arr)"/>
  <!-- two exits -->
  <path d="M 500,104 C 440,160 320,190 220,200" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#fund-exits-arr)"/>
  <circle cx="185" cy="212" r="15" fill="none" stroke="#111" stroke-width="1.5"/>
  <path d="M 162,252 Q 185,230 208,252" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="185" y="270" font-size="12" font-weight="bold" text-anchor="middle">Maria</text>
  <path d="M 560,104 C 590,180 560,230 490,248" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#fund-exits-arr)"/>
  <g transform="translate(430,236)">
    <circle cx="12" cy="8" r="10" fill="none" stroke="#111" stroke-width="1.4"/>
    <path d="M -3,34 Q 12,20 27,34" fill="none" stroke="#111" stroke-width="1.4"/>
    <circle cx="44" cy="8" r="10" fill="none" stroke="#111" stroke-width="1.4"/>
    <path d="M 29,34 Q 44,20 59,34" fill="none" stroke="#111" stroke-width="1.4"/>
    <text x="30" y="50" font-size="10.5" text-anchor="middle">contributors</text>
  </g>
  <!-- mutually exclusive note -->
  <text x="60" y="176" font-size="10.5" fill="#444" font-style="italic">the same comparison decides both exits,</text>
  <text x="60" y="191" font-size="10.5" fill="#444" font-style="italic">so only one door is ever open</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="392" y="164" font-size="11" font-weight="bold">target met: everything to Maria</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="620" y="180" font-size="11" font-weight="bold" text-anchor="end">deadline passed,</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="620" y="195" font-size="11" font-weight="bold" text-anchor="end">target missed:</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="620" y="210" font-size="11" font-weight="bold" text-anchor="end">refunds, exactly</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="620" y="225" font-size="11" font-weight="bold" text-anchor="end">what each put in</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="392" y="179" font-size="10" fill="#444" font-style="italic">current_amount &#8805; amount_to_raise</text>
</svg>
