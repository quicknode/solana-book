<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 264" font-family="Gelasio, Georgia, serif" fill="#111">
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="16" y="24" font-size="15" font-weight="bold">The program takes nothing</text>
  <defs><marker id="escrow-program-swap-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1e7a3c"/></marker></defs>
  <!-- Alice: wallet account -->
  <rect x="36" y="88" width="112" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(44,93)"><g transform="translate(-1.607,-1.079) scale(1.076)" fill="#111"><path d="M10.561 8.073a6 6 0 0 1 3.432 5.142a.75.75 0 1 1-1.498.07a4.5 4.5 0 0 0-8.99 0a.75.75 0 0 1-1.498-.07a6 6 0 0 1 3.431-5.142a3.999 3.999 0 1 1 5.123 0M10.5 5a2.5 2.5 0 1 0-5 0a2.5 2.5 0 0 0 5 0"/></g></g>
  <text x="64" y="104" font-size="10.5" font-weight="bold">Alice (maker)</text>
  <line x1="44" y1="109" x2="140" y2="109" stroke="#888" stroke-width="0.8"/>
  <text x="44" y="120" font-size="9.5" fill="#444">1 SOL</text>
  <!-- Bob: wallet account -->
  <rect x="492" y="88" width="112" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(500,93)"><g transform="translate(-1.607,-1.079) scale(1.076)" fill="#111"><path d="M10.561 8.073a6 6 0 0 1 3.432 5.142a.75.75 0 1 1-1.498.07a4.5 4.5 0 0 0-8.99 0a.75.75 0 0 1-1.498-.07a6 6 0 0 1 3.431-5.142a3.999 3.999 0 1 1 5.123 0M10.5 5a2.5 2.5 0 1 0-5 0a2.5 2.5 0 0 0 5 0"/></g></g>
  <text x="520" y="104" font-size="10.5" font-weight="bold">Bob (taker)</text>
  <line x1="500" y1="109" x2="596" y2="109" stroke="#888" stroke-width="0.8"/>
  <text x="500" y="120" font-size="9.5" fill="#444">1 SOL</text>
  <!-- the program: an account whose rules are its bytecode, not a company -->
  <rect x="240" y="70" width="160" height="76" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(248,75)"><g transform="translate(-0.113,-0.112) scale(1.016)" fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.28"><path d="M11.808 7.727c0 .05.017.1.048.14l.667.84a.96.96 0 0 1 .082 1.08l-.392.676a.96.96 0 0 1-.975.47l-1.063-.16a.23.23 0 0 0-.145.027l-1.26.727a.23.23 0 0 0-.096.112l-.392 1a.96.96 0 0 1-.893.611h-.782a.96.96 0 0 1-.893-.61l-.392-1a.23.23 0 0 0-.096-.113L3.967 10.8a.23.23 0 0 0-.145-.028l-1.063.162a.96.96 0 0 1-.976-.47l-.39-.677a.96.96 0 0 1 .08-1.08l.67-.84a.22.22 0 0 0 .05-.14V6.273c0-.05-.018-.1-.05-.14l-.67-.84a.96.96 0 0 1-.08-1.08l.39-.676a.96.96 0 0 1 .976-.47l1.06.16a.23.23 0 0 0 .145-.027l1.262-.73a.23.23 0 0 0 .096-.113l.394-.996A.96.96 0 0 1 6.61.75h.784a.96.96 0 0 1 .893.61l.392.997q.028.075.096.116l1.26.727a.23.23 0 0 0 .145.028l1.062-.162a.96.96 0 0 1 .976.47l.391.677a.96.96 0 0 1-.081 1.08l-.67.84a.22.22 0 0 0-.049.14v1.454Z"/><path d="M7 8.996c1.277 0 1.996-.719 1.996-1.996S8.277 5.004 7 5.004S5.004 5.723 5.004 7S5.723 8.996 7 8.996"/></g></g>
  <text x="268" y="86" font-size="10.5" font-weight="bold">escrow program</text>
  <line x1="248" y1="91" x2="392" y2="91" stroke="#888" stroke-width="0.8"/>
  <text x="248" y="102" font-size="10" font-family="'DejaVu Sans Mono', Menlo, monospace">make_offer()</text>
  <text x="248" y="114" font-size="10" font-family="'DejaVu Sans Mono', Menlo, monospace">take_offer()</text>
  <text x="248" y="126" font-size="10" font-family="'DejaVu Sans Mono', Menlo, monospace">cancel_offer()</text>
  <text x="248" y="138" font-size="9" font-style="italic" fill="#444">rules are the deployed bytecode</text>
  <!-- USDC lane: Alice's token A rests in the program's vault until Bob takes -->
  <path d="M 152,100 L 236,100" fill="none" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#escrow-program-swap-arr)"/>
  <text x="170.52" y="82" font-size="10.5" font-weight="bold" fill="#1e7a3c">250 USDC</text>
  <path d="M 404,100 L 488,100" fill="none" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#escrow-program-swap-arr)"/>
  <text x="422.52" y="68" font-size="10.5" font-weight="bold" fill="#1e7a3c">250 USDC</text>
  <text x="446" y="81" font-size="9" font-style="italic" fill="#444" text-anchor="middle">(all of it)</text>
  <!-- TSLAx lane: one unbroken arrow, Bob straight to Alice; the program never holds token B -->
  <path d="M 548,132 C 552,174 510,190 440,190 C 340,192 240,192 150,190 C 106,190 94.258,173.939 92,132" fill="none" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#escrow-program-swap-arr)"/>
  <text x="299.82" y="216" font-size="10.5" font-weight="bold" fill="#1e7a3c">1 TSLAx</text>
  <text x="320" y="229" font-size="9" font-style="italic" fill="#444" text-anchor="middle">(all of it, straight to Alice; the program never holds token B)</text>
  <text x="320" y="251" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">no percentage kept; the network fee is a fraction of a cent</text>
  <g class="coin" transform="translate(156,77.5)" fill="#fff"><g stroke="#fff" stroke-width="4.5"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g><g stroke="#1e7a3c" stroke-width="1.3"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g></g>
  <g class="coin" transform="translate(408,63.5)" fill="#fff"><g stroke="#fff" stroke-width="4.5"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g><g stroke="#1e7a3c" stroke-width="1.3"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g></g>
  <g class="coin" transform="translate(285.3,211.5)" fill="#fff"><g stroke="#fff" stroke-width="4.5"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g><g stroke="#1e7a3c" stroke-width="1.3"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g></g>
</svg>
