<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Gelasio, Georgia, serif" fill="#111">
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="16" y="24" font-size="15" font-weight="bold">What each side of a 180 call makes at expiry</text>
  <defs><marker id="options-payoff-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <!-- axes: x is the NVDAx price at expiry, y is profit on the lot of five -->
  <line x1="80" y1="170" x2="600" y2="170" stroke="#888" stroke-width="1"/>
  <path d="M 80,290 L 80,56" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#options-payoff-arr)"/>
  <text x="80" y="46" font-size="10" text-anchor="middle">profit, USDC</text>
  <text x="600" y="296" font-size="10" text-anchor="end">NVDAx price at expiry</text>
  <!-- price ticks: 150 at x=120, one dollar per 8 units -->
  <line x1="360" y1="166" x2="360" y2="174" stroke="#111" stroke-width="1"/>
  <text x="354" y="186" font-size="10" text-anchor="end">180 (the strike)</text>
  <line x1="400" y1="166" x2="400" y2="174" stroke="#111" stroke-width="1"/>
  <line x1="400" y1="174" x2="400" y2="204" stroke="#888" stroke-width="1"/>
  <text x="396" y="214" font-size="10" text-anchor="end">185 (break-even)</text>
  <line x1="200" y1="166" x2="200" y2="174" stroke="#111" stroke-width="1"/>
  <text x="200" y="186" font-size="10" text-anchor="middle">160</text>
  <line x1="520" y1="166" x2="520" y2="174" stroke="#111" stroke-width="1"/>
  <text x="520" y="186" font-size="10" text-anchor="middle">200</text>
  <!-- profit ticks: 25 USDC per 20 units -->
  <line x1="76" y1="150" x2="84" y2="150" stroke="#111" stroke-width="1"/>
  <text x="70" y="153" font-size="10" text-anchor="end">+25</text>
  <line x1="76" y1="190" x2="84" y2="190" stroke="#111" stroke-width="1"/>
  <text x="70" y="193" font-size="10" text-anchor="end">&#8722;25</text>
  <line x1="76" y1="90" x2="84" y2="90" stroke="#111" stroke-width="1"/>
  <text x="70" y="93" font-size="10" text-anchor="end">+100</text>
  <line x1="76" y1="250" x2="84" y2="250" stroke="#111" stroke-width="1"/>
  <text x="70" y="253" font-size="10" text-anchor="end">&#8722;100</text>
  <!-- the holder: loses the 25 USDC premium below the strike, then gains 5 USDC per dollar -->
  <path d="M 100,190 L 360,190 L 560,90" fill="none" stroke="#111" stroke-width="2.4"/>
  <text x="566" y="86" font-size="10.5" font-weight="bold">Bob (holder)</text>
  <text x="230" y="206" font-size="9.5" fill="#444" text-anchor="middle">flat at &#8722;25: the premium is all he can lose</text>
  <!-- the writer: keeps the premium below the strike, then gives up 5 USDC per dollar -->
  <path d="M 100,150 L 360,150 L 560,250" fill="none" stroke="#111" stroke-width="2.4" stroke-dasharray="6 4"/>
  <text x="562" y="254" font-size="10.5" font-weight="bold">Alice (writer)</text>
  <text x="230" y="140" font-size="9.5" fill="#444" text-anchor="middle">flat at +25: the premium is all she can make</text>
  <!-- the shares she still holds below the strike are not in the writer's line -->
  <text x="320" y="312" font-size="9.5" fill="#444" font-style="italic" text-anchor="middle">the two lines sum to zero at every price: the option moves money between them and creates none</text>
</svg>
