<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="'Denim INK', Helvetica, Arial, sans-serif" fill="#111">
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="16" y="24" font-size="15" font-weight="bold">Four ways the week can end for the 180 call</text>
  <text x="162" y="42" font-size="9.5" fill="#444" text-anchor="middle">NVDAx ends the week at or below the strike</text>
  <text x="478" y="42" font-size="9.5" fill="#444" text-anchor="middle">NVDAx ends the week above the strike</text>
  <line x1="320" y1="34" x2="320" y2="278" stroke="#111" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="320" y="292" font-size="9.5" fill="#444" text-anchor="middle">the strike, $180</text>
  <text x="90" y="68" font-size="16" font-weight="bold" text-anchor="middle">$160</text>
  <text x="90" y="86" font-size="9.5" font-style="italic" fill="#444" text-anchor="middle">Bob lets the call expire</text>
  <text x="90" y="112" font-size="10.5" font-weight="bold" text-anchor="middle">Alice (writer)</text>
  <text x="90" y="126" font-size="9.5" text-anchor="middle">keeps the 25 premium</text>
  <text x="90" y="138" font-size="9.5" text-anchor="middle">keeps her 5 NVDAx</text>
  <text x="90" y="172" font-size="11" font-weight="bold" text-anchor="middle">+25 USDC</text>
  <line x1="34" y1="186" x2="146" y2="186" stroke="#888" stroke-width="1"/>
  <text x="90" y="206" font-size="10.5" font-weight="bold" text-anchor="middle">Bob (holder)</text>
  <text x="90" y="220" font-size="9.5" text-anchor="middle">paid the 25 premium</text>
  <text x="90" y="232" font-size="9.5" text-anchor="middle">buys nothing</text>
  <text x="90" y="266" font-size="11" font-weight="bold" text-anchor="middle">−25 USDC</text>
  <text x="235" y="68" font-size="16" font-weight="bold" text-anchor="middle">$180</text>
  <text x="235" y="86" font-size="9.5" font-style="italic" fill="#444" text-anchor="middle">exercising would gain nothing</text>
  <text x="235" y="112" font-size="10.5" font-weight="bold" text-anchor="middle">Alice (writer)</text>
  <text x="235" y="126" font-size="9.5" text-anchor="middle">keeps the 25 premium</text>
  <text x="235" y="138" font-size="9.5" text-anchor="middle">keeps her 5 NVDAx</text>
  <text x="235" y="172" font-size="11" font-weight="bold" text-anchor="middle">+25 USDC</text>
  <line x1="179" y1="186" x2="291" y2="186" stroke="#888" stroke-width="1"/>
  <text x="235" y="206" font-size="10.5" font-weight="bold" text-anchor="middle">Bob (holder)</text>
  <text x="235" y="220" font-size="9.5" text-anchor="middle">paid the 25 premium</text>
  <text x="235" y="232" font-size="9.5" text-anchor="middle">buys nothing</text>
  <text x="235" y="266" font-size="11" font-weight="bold" text-anchor="middle">−25 USDC</text>
  <text x="405" y="68" font-size="16" font-weight="bold" text-anchor="middle">$185</text>
  <text x="405" y="86" font-size="9.5" font-style="italic" fill="#444" text-anchor="middle">Bob exercises: break-even</text>
  <text x="405" y="112" font-size="10.5" font-weight="bold" text-anchor="middle">Alice (writer)</text>
  <text x="405" y="126" font-size="9.5" text-anchor="middle">keeps the 25 premium</text>
  <text x="405" y="138" font-size="9.5" text-anchor="middle">sells her 5 NVDAx for 900</text>
  <text x="405" y="150" font-size="9.5" text-anchor="middle">though they are worth 925</text>
  <text x="405" y="172" font-size="11" font-weight="bold" text-anchor="middle">0 USDC</text>
  <line x1="349" y1="186" x2="461" y2="186" stroke="#888" stroke-width="1"/>
  <text x="405" y="206" font-size="10.5" font-weight="bold" text-anchor="middle">Bob (holder)</text>
  <text x="405" y="220" font-size="9.5" text-anchor="middle">paid the 25 premium</text>
  <text x="405" y="232" font-size="9.5" text-anchor="middle">buys 5 NVDAx for 900</text>
  <text x="405" y="244" font-size="9.5" text-anchor="middle">they are worth 925</text>
  <text x="405" y="266" font-size="11" font-weight="bold" text-anchor="middle">0 USDC</text>
  <text x="550" y="68" font-size="16" font-weight="bold" text-anchor="middle">$200</text>
  <text x="550" y="86" font-size="9.5" font-style="italic" fill="#444" text-anchor="middle">Bob exercises</text>
  <text x="550" y="112" font-size="10.5" font-weight="bold" text-anchor="middle">Alice (writer)</text>
  <text x="550" y="126" font-size="9.5" text-anchor="middle">keeps the 25 premium</text>
  <text x="550" y="138" font-size="9.5" text-anchor="middle">sells her 5 NVDAx for 900</text>
  <text x="550" y="150" font-size="9.5" text-anchor="middle">though they are worth 1,000</text>
  <text x="550" y="172" font-size="11" font-weight="bold" text-anchor="middle">−75 USDC</text>
  <line x1="494" y1="186" x2="606" y2="186" stroke="#888" stroke-width="1"/>
  <text x="550" y="206" font-size="10.5" font-weight="bold" text-anchor="middle">Bob (holder)</text>
  <text x="550" y="220" font-size="9.5" text-anchor="middle">paid the 25 premium</text>
  <text x="550" y="232" font-size="9.5" text-anchor="middle">buys 5 NVDAx for 900</text>
  <text x="550" y="244" font-size="9.5" text-anchor="middle">they are worth 1,000</text>
  <text x="550" y="266" font-size="11" font-weight="bold" text-anchor="middle">+75 USDC</text>
  <text x="320" y="314" font-size="9.5" fill="#444" font-style="italic" text-anchor="middle">each result is against doing nothing, Alice keeping her shares and Bob his USDC; in every column the two sum to zero</text>
</svg>
