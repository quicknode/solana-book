<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 570" font-family="Georgia, serif" fill="#111">
  <defs>
    <marker id="fund-succ-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker>
    <marker id="fund-succ-arrg" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#777"/></marker>
  </defs>
  <!-- fundraiser PDA: gate passes, then the account closes -->
  <g>
    <circle cx="58" cy="14" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="70" y="17" font-size="8.5" letter-spacing="0.6" fill="#555">SEEDS: &#8220;FUNDRAISER&#8221; + MAKER&#8217;S ADDRESS</text>
    <rect x="50" y="24" width="205" height="96" rx="6" fill="#f4f4f2" stroke="#888"/>
    <text x="60" y="42" font-size="10.5" font-weight="bold">fundraiser</text>
    <text x="60" y="57" font-size="9.5">maker: Maria</text>
    <text x="60" y="70" font-size="9.5">mint_to_raise: USDC</text>
    <text x="60" y="83" font-size="9.5">amount_to_raise: 9,000 USDC</text>
    <text x="60" y="96" font-size="9.5">current_amount: 9,000 USDC</text>
    <text x="60" y="110" font-size="9" fill="#444">time_started: day 0 &#183; duration: 7 days</text>
    <line x1="50" y1="24" x2="255" y2="120" stroke="#999" stroke-width="1.6"/>
    <line x1="255" y1="24" x2="50" y2="120" stroke="#999" stroke-width="1.6"/>
    <text x="60" y="134" font-size="9" font-weight="bold">3. fundraiser account closed</text>
  </g>
  <!-- the fundraiser program -->
