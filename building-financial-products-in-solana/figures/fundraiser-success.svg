    <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="490" y="11" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
    <rect x="470" y="16" width="160" height="88" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <text x="480" y="32" font-size="10.5" font-weight="bold">fundraiser program</text>
    <text x="480" y="46" font-size="8.5" font-family="Menlo, monospace" fill="#888">initialize</text>
    <text x="480" y="57" font-size="8.5" font-family="Menlo, monospace" fill="#888">contribute</text>
    <text x="480" y="68" font-size="8.5" font-family="Menlo, monospace" font-weight="bold">check_contributions</text>
    <text x="480" y="79" font-size="8.5" font-family="Menlo, monospace" fill="#888">refund</text>
    <text x="480" y="90" font-size="8.5" font-family="Menlo, monospace" fill="#888">close_fundraiser</text>
  </g>
  <!-- vault: drains, then closes -->
