<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="Georgia, serif" fill="#111">
  <defs><marker id="fund-succ-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <text x="320" y="26" font-size="12" font-weight="bold" text-anchor="middle">check_contributions: one transaction, three effects</text>
  <!-- vault -->
  <rect x="70" y="60" width="150" height="80" fill="#f4f4f2" stroke="#111" stroke-width="2"/>
  <text x="145" y="88" font-size="12" font-weight="bold" text-anchor="middle">vault</text>
  <text x="145" y="106" font-size="10.5" text-anchor="middle">9,000 USDC</text>
  <text x="145" y="122" font-size="9.5" fill="#444" font-style="italic" text-anchor="middle">entire balance drains</text>
  <!-- Maria -->
  <circle cx="430" cy="80" r="16" fill="none" stroke="#111" stroke-width="1.5"/>
  <path d="M 405,124 Q 430,100 455,124" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="430" y="142" font-size="12" font-weight="bold" text-anchor="middle">Maria</text>
  <path d="M 224,100 L 404,100" stroke="#111" stroke-width="2" marker-end="url(#fund-succ-arr)"/>
  <text x="314" y="90" font-size="11" font-weight="bold" text-anchor="middle">9,000 USDC</text>
  <text x="314" y="116" font-size="9.5" fill="#444" font-style="italic" text-anchor="middle">signed by the fundraiser PDA</text>
  <!-- closes -->
  <g transform="translate(70,170)">
    <rect x="0" y="0" width="150" height="30" fill="#fff" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="75" y="19" font-size="10" fill="#444" text-anchor="middle">vault closes, rent to Maria</text>
  </g>
  <g transform="translate(240,170)">
    <rect x="0" y="0" width="170" height="30" fill="#fff" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="85" y="19" font-size="10" fill="#444" text-anchor="middle">fundraiser closes, rent to Maria</text>
  </g>
  <g transform="translate(430,170)">
    <rect x="0" y="0" width="170" height="30" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
    <text x="85" y="13" font-size="10" fill="#444" text-anchor="middle">contributor receipts survive:</text>
    <text x="85" y="25" font-size="10" fill="#444" text-anchor="middle">no handler ever closes them</text>
  </g>
  <text x="320" y="230" font-size="10.5" fill="#444" font-style="italic" text-anchor="middle">the state machine does not mark itself finished; it ceases to exist</text>
  <!-- gate note -->
  <rect x="470" y="52" width="150" height="52" fill="#fff" stroke="#888" stroke-width="1"/>
  <text x="545" y="70" font-size="10" text-anchor="middle" font-weight="bold">the one gate:</text>
  <text x="545" y="85" font-size="9.5" fill="#444" text-anchor="middle">current_amount &#8805; target</text>
  <text x="545" y="98" font-size="9.5" fill="#444" text-anchor="middle">(never the vault balance)</text>
</svg>
