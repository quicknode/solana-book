  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="140" y="232" font-size="10.5" font-weight="bold">1. check_contributions &#183; 9,000 USDC</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="160" y="245" font-size="9" font-style="italic" fill="#444">signed by the fundraiser PDA</text>
  <g transform="translate(280,247)">
