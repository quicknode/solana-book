    <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="444" y="468" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
    <rect x="380" y="482" width="104" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
