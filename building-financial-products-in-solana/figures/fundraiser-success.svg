<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" font-family="Georgia, serif" fill="#111">
  <defs><marker id="fund-succ-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <text x="320" y="24" font-size="12" font-weight="bold" text-anchor="middle">check_contributions: one transaction, three effects</text>
  <!-- the fundraiser PDA, the vault's authority -->
  <circle cx="44" cy="110" r="8" fill="#fff" stroke="#111" stroke-width="2"/>
  <line x1="53" y1="110" x2="67" y2="110" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="44" y="132" font-size="9" font-style="italic" fill="#444" text-anchor="middle">fundraiser</text>
  <text x="44" y="143" font-size="9" font-style="italic" fill="#444" text-anchor="middle">PDA</text>
  <!-- vault -->
  <rect x="70" y="70" width="150" height="80" fill="#f4f4f2" stroke="#111" stroke-width="2"/>
  <text x="145" y="94" font-size="10" font-weight="bold" text-anchor="middle">vault: the fundraiser&#8217;s USDC</text>
  <text x="145" y="112" font-size="10.5" text-anchor="middle">9,000 USDC</text>
  <text x="145" y="128" font-size="9.5" fill="#444" font-style="italic" text-anchor="middle">entire balance drains</text>
  <!-- the transfer, into Maria's token account -->
  <path d="M 224,110 L 390,110" stroke="#111" stroke-width="2" marker-end="url(#fund-succ-arr)"/>
  <text x="307" y="100" font-size="11" font-weight="bold" text-anchor="middle">9,000 USDC</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="307" y="126" font-size="9.5" fill="#444" font-style="italic" text-anchor="middle">signed by the fundraiser PDA</text>
  <rect x="394" y="86" width="128" height="48" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="458" y="106" font-size="11" font-weight="bold" text-anchor="middle">Maria&#8217;s USDC</text>
  <text x="458" y="124" font-size="10" fill="#444" text-anchor="middle">9,000 USDC</text>
  <!-- Maria -->
  <line x1="538" y1="76" x2="512" y2="86" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="548" y="85" font-size="9.5" font-style="italic" fill="#777">owner</text>
  <rect x="500" y="28" width="122" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="515" cy="45" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M 507,56 Q 515,49 523,56" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="530" y="45" font-size="10.5" font-weight="bold">Maria (maker)</text>
  <text x="530" y="61" font-size="9.5" fill="#444">0.1 SOL</text>
  <!-- gate note -->
  <rect x="470" y="144" width="150" height="52" fill="#fff" stroke="#888" stroke-width="1"/>
  <text x="545" y="162" font-size="10" text-anchor="middle" font-weight="bold">the one gate:</text>
  <text x="545" y="177" font-size="9.5" fill="#444" text-anchor="middle">current_amount &#8805; target</text>
  <text x="545" y="190" font-size="9.5" fill="#444" text-anchor="middle">(never the vault balance)</text>
  <!-- closes -->
  <g transform="translate(70,200)">
    <rect x="0" y="0" width="150" height="30" fill="#fff" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="75" y="19" font-size="10" fill="#444" text-anchor="middle">vault closes, rent to Maria</text>
  </g>
  <g transform="translate(240,200)">
    <rect x="0" y="0" width="170" height="30" fill="#fff" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="85" y="19" font-size="10" fill="#444" text-anchor="middle">fundraiser closes, rent to Maria</text>
  </g>
  <g transform="translate(430,200)">
    <rect x="0" y="0" width="170" height="30" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
    <text x="85" y="13" font-size="10" fill="#444" text-anchor="middle">contributor receipts survive:</text>
    <text x="85" y="25" font-size="10" fill="#444" text-anchor="middle">no handler ever closes them</text>
  </g>
  <text x="320" y="258" font-size="10.5" fill="#444" font-style="italic" text-anchor="middle">the state machine does not mark itself finished; it ceases to exist</text>
</svg>
