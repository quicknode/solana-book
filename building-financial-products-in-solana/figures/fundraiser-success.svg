    <circle cx="432" cy="124" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="444" y="120" font-size="8.5" letter-spacing="0.6" fill="#555">SEEDS: ATA PROGRAM + FUNDRAISER&#8217;S</text>
    <text x="444" y="131" font-size="8.5" letter-spacing="0.6" fill="#555">ADDRESS + USDC MINT ADDRESS</text>
    <rect x="440" y="136" width="170" height="68" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
