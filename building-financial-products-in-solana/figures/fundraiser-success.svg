  <path d="M 440,168 C 260,185 60,180 28,260 C 12,330 30,430 84,498" fill="none" stroke="#777" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#fund-succ-arrg)"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="2" y="256" font-size="8.5" fill="#444" font-style="italic">rent refunds</text>
  <!-- USDC token accounts -->
