  <text x="460" y="256" font-size="10" font-style="italic" fill="#444" text-anchor="middle">Carol&#8217;s USDC account</text>
  <circle cx="460" cy="275" r="7" fill="#fff" stroke="#111" stroke-width="2"/>
  <circle cx="575" cy="105" r="16" fill="none" stroke="#111" stroke-width="1.5"/>
