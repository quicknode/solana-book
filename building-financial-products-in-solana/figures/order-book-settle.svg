  <rect x="50" y="302" width="230" height="64" rx="5" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="165" y="320" font-size="11" font-weight="bold" text-anchor="middle">Bob&#8217;s market user</text>
  <text x="165" y="336" font-size="11" text-anchor="middle">unsettled_base: 3 &#8594; 0</text>
