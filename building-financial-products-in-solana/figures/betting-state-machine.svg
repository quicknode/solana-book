<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Denim INK', Helvetica, Arial, sans-serif" fill="#111">
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="16" y="24" font-size="15" font-weight="bold">The event's four states</text>
  <defs><marker id="betting-states-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <!-- Draft -->
  <rect x="16" y="150" width="92" height="50" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="62" y="172" font-size="13" font-weight="bold" text-anchor="middle">Draft</text>
  <text x="62" y="190" font-size="10" fill="#444" text-anchor="middle">no bets yet</text>
  <path d="M 42,148 C 29,110 56,117 82,148" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#betting-states-arr)"/>
  <text x="62" y="104" font-size="10.5" text-anchor="middle">add_outcome()</text>
  <!-- Open -->
  <path d="M 110,175 L 188,175" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#betting-states-arr)"/>
  <text x="149" y="167" font-size="10.5" text-anchor="middle">open_betting()</text>
  <text x="149" y="192" font-size="10.5" text-anchor="middle">(admin)</text>
  <rect x="190" y="150" width="112" height="50" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="246" y="172" font-size="13" font-weight="bold" text-anchor="middle">Open</text>
  <text x="246" y="190" font-size="10" fill="#444" text-anchor="middle">bets until the close</text>
  <path d="M 226,148 C 213,110 240,117 266,148" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#betting-states-arr)"/>
  <text x="246" y="104" font-size="10.5" text-anchor="middle">place_bet()</text>
  <!-- Settled -->
  <rect x="350" y="60" width="120" height="50" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="410" y="82" font-size="13" font-weight="bold" text-anchor="middle">Settled</text>
  <text x="410" y="100" font-size="10" fill="#444" text-anchor="middle">winner set, fee paid</text>
  <path d="M 304,160 C 320,132 330,104 348,90" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#betting-states-arr)"/>
  <text x="292" y="58" font-size="10.5" text-anchor="middle">settle_event() (admin,</text>
  <text x="292" y="71" font-size="10.5" text-anchor="middle">after the close)</text>
  <!-- Cancelled -->
  <rect x="350" y="250" width="120" height="50" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="410" y="272" font-size="13" font-weight="bold" text-anchor="middle">Cancelled</text>
  <text x="410" y="290" font-size="10" fill="#444" text-anchor="middle">no fee taken</text>
  <path d="M 304,190 C 320,218 330,248 348,262" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#betting-states-arr)"/>
  <path d="M 62,202 C 62,262 150,288 348,288" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#betting-states-arr)"/>
  <text x="200" y="316" font-size="10.5" text-anchor="middle">cancel_event() (admin)</text>
  <!-- terminal: bet account closed -->
  <rect x="520" y="150" width="104" height="56" fill="#f4f4f2" stroke="#111" stroke-width="2"/>
  <text x="572" y="170" font-size="11" font-weight="bold" text-anchor="middle">bet account</text>
  <text x="572" y="184" font-size="11" font-weight="bold" text-anchor="middle">closed</text>
  <text x="572" y="198" font-size="10" fill="#444" text-anchor="middle">rent refunded</text>
  <path d="M 472,74 C 520,74 552,100 564,148" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#betting-states-arr)"/>
  <text x="530" y="48" font-size="10.5" text-anchor="middle">claim_winnings() (winners)</text>
  <path d="M 472,100 C 494,110 508,140 518,164" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#betting-states-arr)"/>
  <text x="462" y="150" font-size="10.5" text-anchor="middle">close_losing_bet()</text>
  <text x="462" y="163" font-size="10.5" text-anchor="middle">(losers)</text>
  <path d="M 472,275 C 530,272 556,240 566,208" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#betting-states-arr)"/>
  <text x="530" y="316" font-size="10.5" text-anchor="middle">claim_refund() (exact stake back)</text>
  <!-- annotation -->
  <text x="320" y="346" font-size="10.5" fill="#444" font-style="italic" text-anchor="middle">every path ends with the bet account deleted; deletion is the double-claim defense</text>
</svg>
