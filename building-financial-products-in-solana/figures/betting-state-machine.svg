<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Georgia, serif" fill="#111">
  <defs><marker id="betting-states-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <!-- Open -->
  <rect x="40" y="118" width="130" height="50" rx="8" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="105" y="140" font-size="13" font-weight="bold" text-anchor="middle">Open</text>
  <text x="105" y="158" font-size="10" fill="#444" text-anchor="middle">betting live</text>
  <path d="M 85,116 C 72,78 138,78 125,116" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#betting-states-arr)"/>
  <text x="105" y="72" font-size="10.5" text-anchor="middle">place_bet</text>
  <!-- Settled -->
  <rect x="280" y="44" width="132" height="50" rx="8" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="346" y="66" font-size="13" font-weight="bold" text-anchor="middle">Settled</text>
  <text x="346" y="84" font-size="10" fill="#444" text-anchor="middle">winner set, fee paid</text>
  <path d="M 172,128 C 210,110 240,92 278,76" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#betting-states-arr)"/>
  <text x="198" y="74" font-size="10.5" text-anchor="middle">settle_event (admin)</text>
  <!-- Cancelled -->
  <rect x="280" y="204" width="132" height="50" rx="8" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="346" y="226" font-size="13" font-weight="bold" text-anchor="middle">Cancelled</text>
  <text x="346" y="244" font-size="10" fill="#444" text-anchor="middle">no fee taken</text>
  <path d="M 172,158 C 210,176 240,194 278,212" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#betting-states-arr)"/>
  <text x="196" y="218" font-size="10.5" text-anchor="middle">cancel_event (admin)</text>
  <!-- terminal: bet account closed -->
  <rect x="496" y="120" width="126" height="56" rx="8" fill="#f4f4f2" stroke="#111" stroke-width="2"/>
  <text x="559" y="140" font-size="11" font-weight="bold" text-anchor="middle">bet account</text>
  <text x="559" y="154" font-size="11" font-weight="bold" text-anchor="middle">closed</text>
  <text x="559" y="168" font-size="10" fill="#444" text-anchor="middle">rent refunded</text>
  <path d="M 414,58 C 470,56 510,80 540,118" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#betting-states-arr)"/>
  <text x="492" y="48" font-size="10.5" text-anchor="middle">claim_winnings (winners)</text>
  <path d="M 414,84 C 450,96 470,112 494,134" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#betting-states-arr)"/>
  <text x="440" y="158" font-size="10.5" text-anchor="middle">close_losing_bet</text>
  <text x="440" y="171" font-size="10.5" text-anchor="middle">(losers)</text>
  <path d="M 414,222 C 468,220 510,196 542,178" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#betting-states-arr)"/>
  <text x="498" y="246" font-size="10.5" text-anchor="middle">claim_refund (exact stake back)</text>
  <!-- annotation -->
  <text x="320" y="286" font-size="10.5" fill="#444" font-style="italic" text-anchor="middle">every path ends with the bet account deleted; deletion is the double-claim defense</text>
</svg>
