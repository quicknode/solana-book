<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Georgia, serif" fill="#111">
  <defs><marker id="escrow-account-map-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <!-- the curve -->
  <path d="M 40,340 Q 320,130 600,340" fill="none" stroke="#111" stroke-width="2"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="320" y="415" font-size="13" font-weight="bold" text-anchor="middle">Solana Devnet</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="320" y="432" font-size="9.5" font-style="italic" fill="#444" text-anchor="middle">only the escrow program can sign as the offer PDA</text>
  <!-- on-curve public keys -->
  <circle cx="96" cy="302" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="108" y="300" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="96" y="326" font-size="12" font-weight="bold" text-anchor="middle">Alice</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="96" y="340" font-size="10" font-style="italic" fill="#444" text-anchor="middle">(maker)</text>
  <circle cx="544" cy="302" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="532" y="300" font-size="9" letter-spacing="1" fill="#555" text-anchor="end">PUBLIC KEY</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="544" y="326" font-size="12" font-weight="bold" text-anchor="middle">Bob</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="544" y="340" font-size="10" font-style="italic" fill="#444" text-anchor="middle">(taker)</text>
  <circle cx="219" cy="249" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="219" y="268" font-size="9" letter-spacing="1" fill="#555" text-anchor="middle">PUBLIC KEY</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="219" y="283" font-size="11" font-weight="bold" text-anchor="middle">USDC mint</text>
  <circle cx="421" cy="249" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="421" y="268" font-size="9" letter-spacing="1" fill="#555" text-anchor="middle">PUBLIC KEY</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="421" y="283" font-size="11" font-weight="bold" text-anchor="middle">TSLAx mint</text>
  <circle cx="320" cy="235" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="332" y="232" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <!-- the escrow program: its address is on the curve -->
  <rect x="265" y="44" width="110" height="62" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="320" y="59" font-size="10.5" font-weight="bold" text-anchor="middle">escrow program</text>
  <text x="320" y="73" font-size="9.5" text-anchor="middle" font-family="Menlo, monospace">make_offer</text>
  <text x="320" y="85" font-size="9.5" text-anchor="middle" font-family="Menlo, monospace">take_offer</text>
  <text x="320" y="97" font-size="9.5" text-anchor="middle" font-family="Menlo, monospace">cancel_offer</text>
  <line x1="320" y1="106" x2="320" y2="227" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- offer PDA, off the curve -->
  <text x="180" y="42" font-size="9" letter-spacing="0.8" fill="#555" text-anchor="middle">ESCROW PROGRAM ID</text>
  <text x="180" y="55" font-size="9" letter-spacing="0.8" fill="#555" text-anchor="middle">+ &#8220;OFFER&#8221; + MAKER&#8217;S ADDRESS</text>
  <text x="180" y="68" font-size="9" letter-spacing="0.8" fill="#555" text-anchor="middle">+ ID</text>
  <path d="M 186,74 L 190,100" stroke="#111" stroke-width="1.3" marker-end="url(#escrow-account-map-arr)"/>
  <circle cx="190" cy="112" r="9" fill="#fff" stroke="#111" stroke-width="2"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="190" y="140" font-size="11" font-weight="bold" text-anchor="middle">offer account</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="190" y="154" font-size="9.5" font-style="italic" fill="#444" text-anchor="middle">a PDA, off the curve</text>
  <!-- vault: the offer's token account -->
  <rect x="430" y="90" width="130" height="46" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="495" y="109" font-size="10.5" font-weight="bold" text-anchor="middle">vault: the offer&#8217;s USDC</text>
  <text x="495" y="126" font-size="10" fill="#444" text-anchor="middle">250 USDC</text>
  <path d="M 201,114 L 426,110" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#escrow-account-map-arr)"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="313" y="126" font-size="10" font-weight="bold" text-anchor="middle">authority</text>
  <!-- the users' ATAs: rectangles, off the curve, next to their owners -->
  <rect x="14" y="150" width="128" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="78" y="168" font-size="11" font-weight="bold" text-anchor="middle">Alice&#8217;s USDC</text>
  <text x="78" y="185" font-size="10" fill="#444" text-anchor="middle">1,000 USDC</text>
  <rect x="14" y="362" width="128" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="78" y="380" font-size="11" font-weight="bold" text-anchor="middle">Alice&#8217;s TSLAx</text>
  <text x="78" y="397" font-size="10" fill="#444" text-anchor="middle">0 TSLAx</text>
  <rect x="498" y="150" width="128" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="562" y="168" font-size="11" font-weight="bold" text-anchor="middle">Bob&#8217;s USDC</text>
  <text x="562" y="185" font-size="10" fill="#444" text-anchor="middle">300 USDC</text>
  <rect x="498" y="362" width="128" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="562" y="380" font-size="11" font-weight="bold" text-anchor="middle">Bob&#8217;s TSLAx</text>
  <text x="562" y="397" font-size="10" fill="#444" text-anchor="middle">1 TSLAx</text>
  <!-- owner relationships -->
  <line x1="92" y1="294" x2="80" y2="196" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="76" y="248" font-size="10" font-style="italic" fill="#777" text-anchor="end">owner</text>
  <line x1="94" y1="310" x2="82" y2="360" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="548" y1="294" x2="560" y2="196" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="564" y="248" font-size="10" font-style="italic" fill="#777">owner</text>
  <line x1="546" y1="310" x2="558" y2="360" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- mint relationships -->
  <line x1="212" y1="244" x2="140" y2="196" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="226" y1="245" x2="496" y2="186" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="227" y1="243" x2="430" y2="134" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="414" y1="254" x2="144" y2="368" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="428" y1="254" x2="540" y2="360" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- maker recorded in the offer -->
  <line x1="104" y1="296" x2="184" y2="122" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="128" y="230" font-size="10" font-style="italic" fill="#777" text-anchor="middle">maker</text>
</svg>
