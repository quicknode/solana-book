<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Georgia, serif" fill="#111">
  <defs><marker id="escrow-account-map-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <!-- mints -->
  <rect x="314" y="44" width="12" height="12" fill="#111" transform="rotate(45 320 50)"/>
  <text x="320" y="28" font-size="12" font-weight="bold" text-anchor="middle">USDC mint</text>
  <rect x="314" y="366" width="12" height="12" fill="#111" transform="rotate(45 320 372)"/>
  <text x="320" y="400" font-size="12" font-weight="bold" text-anchor="middle">TSLAx mint</text>
  <!-- token accounts (ATAs, off the curve) -->
  <circle cx="170" cy="110" r="7" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="170" y="88" font-size="11" font-weight="bold" text-anchor="middle">Alice&#8217;s USDC account</text>
  <circle cx="470" cy="110" r="7" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="470" y="88" font-size="11" font-weight="bold" text-anchor="middle">Bob&#8217;s USDC account</text>
  <circle cx="170" cy="330" r="7" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="170" y="356" font-size="11" font-weight="bold" text-anchor="middle">Alice&#8217;s TSLAx account</text>
  <circle cx="470" cy="330" r="7" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="470" y="356" font-size="11" font-weight="bold" text-anchor="middle">Bob&#8217;s TSLAx account</text>
  <!-- wallets (keypairs) -->
  <circle cx="95" cy="205" r="6" fill="#111"/>
  <text x="95" y="229" font-size="12" font-weight="bold" text-anchor="middle">Alice</text>
  <text x="95" y="243" font-size="10" font-style="italic" fill="#444" text-anchor="middle">(maker)</text>
  <circle cx="545" cy="205" r="6" fill="#111"/>
  <text x="545" y="229" font-size="12" font-weight="bold" text-anchor="middle">Bob</text>
  <text x="545" y="243" font-size="10" font-style="italic" fill="#444" text-anchor="middle">(taker)</text>
  <!-- offer PDA and its vault -->
  <circle cx="250" cy="240" r="9" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="250" y="268" font-size="11" font-weight="bold" text-anchor="middle">offer account</text>
  <text x="250" y="282" font-size="10" font-style="italic" fill="#444" text-anchor="middle">seeds: &#8220;offer&#8221; + maker + id</text>
  <circle cx="420" cy="240" r="9" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="420" y="268" font-size="11" font-weight="bold" text-anchor="middle">vault</text>
  <text x="420" y="282" font-size="10" font-style="italic" fill="#444" text-anchor="middle">offer&#8217;s USDC account</text>
  <path d="M 261,240 L 409,240" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#escrow-account-map-arr)"/>
  <text x="335" y="231" font-size="10.5" font-weight="bold" text-anchor="middle">authority</text>
  <!-- the program -->
  <rect x="246" y="132" width="110" height="64" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="301" y="147" font-size="10.5" font-weight="bold" text-anchor="middle">escrow program</text>
  <text x="301" y="162" font-size="9.5" text-anchor="middle" font-family="Menlo, monospace">make_offer</text>
  <text x="301" y="175" font-size="9.5" text-anchor="middle" font-family="Menlo, monospace">take_offer</text>
  <text x="301" y="188" font-size="9.5" text-anchor="middle" font-family="Menlo, monospace">cancel_offer</text>
  <line x1="285" y1="196" x2="256" y2="229" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="335" y="302" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">only the escrow program can sign as the offer PDA</text>
  <!-- owner relationships -->
  <line x1="100" y1="198" x2="165" y2="117" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="132" y="150" font-size="10" font-style="italic" fill="#777" text-anchor="end">owner</text>
  <line x1="100" y1="212" x2="164" y2="323" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="540" y1="198" x2="475" y2="117" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="508" y="150" font-size="10" font-style="italic" fill="#777">owner</text>
  <line x1="540" y1="212" x2="476" y2="323" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- mint relationships -->
  <line x1="313" y1="55" x2="178" y2="105" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="327" y1="55" x2="462" y2="105" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="323" y1="58" x2="419" y2="229" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="313" y1="367" x2="178" y2="334" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="327" y1="367" x2="462" y2="334" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- maker recorded in the offer -->
  <line x1="101" y1="209" x2="240" y2="237" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="160" y="214" font-size="10" font-style="italic" fill="#777" text-anchor="middle">maker</text>
</svg>
