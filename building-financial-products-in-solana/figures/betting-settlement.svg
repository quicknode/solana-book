    <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="84" y="642" font-size="9" letter-spacing="1" fill="#555" text-anchor="end">PUBLIC KEY</text>
    <rect x="44" y="654" width="104" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <circle cx="59" cy="671" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
    <path d="M 51,682 Q 59,675 67,682" fill="none" stroke="#111" stroke-width="1.3"/>
    <text x="74" y="671" font-size="10.5" font-weight="bold">Alice</text>
    <text x="74" y="687" font-size="9.5" fill="#444">1 SOL</text>
  </g>
  <g opacity="0.3">
    <circle cx="208" cy="622" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="220" y="620" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
    <rect x="156" y="632" width="104" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <circle cx="171" cy="649" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
    <path d="M 163,660 Q 171,653 179,660" fill="none" stroke="#111" stroke-width="1.3"/>
    <text x="186" y="649" font-size="10.5" font-weight="bold">Bob</text>
    <text x="186" y="665" font-size="9.5" fill="#444">1 SOL</text>
  </g>
  <g opacity="0.3">
    <circle cx="320" cy="615" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="332" y="613" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
    <rect x="268" y="625" width="104" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <circle cx="283" cy="642" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
    <path d="M 275,653 Q 283,646 291,653" fill="none" stroke="#111" stroke-width="1.3"/>
    <text x="298" y="642" font-size="10.5" font-weight="bold">Carol</text>
    <text x="298" y="658" font-size="9.5" fill="#444">1 SOL</text>
  </g>
  <!-- Maria signs the settlement -->
