  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="555" y="300" font-size="10.5" font-weight="bold">4 USDC (the fee)</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="548" y="470" font-size="9" font-style="italic" fill="#444">signed by the event PDA</text>
  <g transform="translate(541,390)">
    <circle cx="4" cy="2" r="6" fill="#fff" stroke="#111" stroke-width="1.3"/>
    <circle cx="-3" cy="0" r="6" fill="#fff" stroke="#111" stroke-width="1.3"/>
    <text x="-3" y="3" font-size="8" font-weight="bold" text-anchor="middle">$</text>
  </g>
  <text x="245" y="466" font-size="10.5" fill="#444" font-style="italic" text-anchor="middle">Maria signs settle_event: Toy Story 5 wins</text>
