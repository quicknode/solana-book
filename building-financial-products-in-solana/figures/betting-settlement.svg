    <text x="56" y="559" font-size="7.5" letter-spacing="0.4" fill="#555">SEEDS: ATA PROGRAM +</text>
    <text x="56" y="568" font-size="7.5" letter-spacing="0.4" fill="#555">ALICE&#8217;S ADDRESS +</text>
    <text x="56" y="577" font-size="7.5" letter-spacing="0.4" fill="#555">USDC MINT</text>
  </g>
  <g opacity="0.3">
    <rect x="158" y="510" width="108" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <text x="168" y="527" font-size="10.5" font-weight="bold">Bob&#8217;s USDC</text>
    <text x="168" y="542" font-size="9.5" fill="#444">900 USDC</text>
    <circle cx="164" cy="562" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="174" y="559" font-size="7.5" letter-spacing="0.4" fill="#555">SEEDS: ATA PROGRAM +</text>
    <text x="174" y="568" font-size="7.5" letter-spacing="0.4" fill="#555">BOB&#8217;S ADDRESS +</text>
    <text x="174" y="577" font-size="7.5" letter-spacing="0.4" fill="#555">USDC MINT</text>
  </g>
  <g opacity="0.3">
    <rect x="276" y="510" width="108" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <text x="286" y="527" font-size="10.5" font-weight="bold">Carol&#8217;s USDC</text>
    <text x="286" y="542" font-size="9.5" fill="#444">800 USDC</text>
    <circle cx="282" cy="562" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="292" y="559" font-size="7.5" letter-spacing="0.4" fill="#555">SEEDS: ATA PROGRAM +</text>
    <text x="292" y="568" font-size="7.5" letter-spacing="0.4" fill="#555">CAROL&#8217;S ADDRESS +</text>
    <text x="292" y="577" font-size="7.5" letter-spacing="0.4" fill="#555">USDC MINT</text>
  </g>
  <!-- Maria's USDC receives the fee -->
  <g>
    <rect x="394" y="510" width="108" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <text x="404" y="527" font-size="10.5" font-weight="bold">Maria&#8217;s USDC</text>
    <text x="404" y="542" font-size="9.5" fill="#444">1,004 USDC (+4 fee)</text>
    <circle cx="400" cy="562" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="410" y="559" font-size="7.5" letter-spacing="0.4" fill="#555">SEEDS: ATA PROGRAM +</text>
    <text x="410" y="568" font-size="7.5" letter-spacing="0.4" fill="#555">MARIA&#8217;S ADDRESS +</text>
    <text x="410" y="577" font-size="7.5" letter-spacing="0.4" fill="#555">USDC MINT</text>
  </g>
  <text x="320" y="596" font-size="10" font-weight="bold" font-style="italic" text-anchor="middle">the fee only touches the losing side: a winner never receives less than they staked</text>
  <!-- the curve -->
  <path d="M 40,660 Q 320,570 600,660" fill="none" stroke="#111" stroke-width="2"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="300" y="712" font-size="13" font-weight="bold" text-anchor="middle">Solana Devnet</text>
  <!-- wallets on the curve -->
