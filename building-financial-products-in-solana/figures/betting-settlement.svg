    <circle cx="432" cy="622" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="444" y="618" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
