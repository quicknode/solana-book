  <!-- the program's address dot sits on the curve too -->
  <line x1="550" y1="134" x2="602" y2="646" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.3"/>
  <circle cx="602" cy="652" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
