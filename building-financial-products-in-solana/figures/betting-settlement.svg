    <rect x="40" y="510" width="108" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <text x="50" y="527" font-size="10.5" font-weight="bold">Alice&#8217;s USDC</text>
    <text x="50" y="542" font-size="9.5" fill="#444">700 USDC</text>
