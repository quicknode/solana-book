<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" font-family="Georgia, serif" fill="#111">
  <defs>
    <marker id="betting-settle-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker>
  </defs>
  <!-- config PDA: settle_event checks Maria against config.admin -->
  <g>
    <circle cx="178" cy="14" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="190" y="17" font-size="8.5" letter-spacing="0.6" fill="#555">SEEDS: &#8220;CONFIG&#8221;</text>
    <rect x="170" y="24" width="160" height="70" rx="6" fill="#f4f4f2" stroke="#888"/>
    <text x="180" y="40" font-size="10.5" font-weight="bold">config</text>
    <text x="180" y="54" font-size="9.5">admin: Maria</text>
    <text x="180" y="66" font-size="9.5">token_mint: USDC</text>
    <text x="180" y="78" font-size="9.5">fee_recipient: Maria</text>
    <text x="180" y="90" font-size="9" fill="#444">fee_bps: 200 (2%)</text>
  </g>
  <!-- the betting program -->
  <g>
    <circle cx="478" cy="8" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="490" y="11" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
    <rect x="470" y="16" width="160" height="118" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <text x="480" y="32" font-size="10.5" font-weight="bold">betting program</text>
    <text x="480" y="46" font-size="8.5" font-family="Menlo, monospace" fill="#888">initialize_config</text>
    <text x="480" y="56" font-size="8.5" font-family="Menlo, monospace" fill="#888">create_event</text>
    <text x="480" y="66" font-size="8.5" font-family="Menlo, monospace" fill="#888">add_outcome</text>
    <text x="480" y="76" font-size="8.5" font-family="Menlo, monospace" fill="#888">place_bet</text>
    <text x="480" y="86" font-size="8.5" font-family="Menlo, monospace" font-weight="bold">settle_event</text>
    <text x="480" y="96" font-size="8.5" font-family="Menlo, monospace" fill="#888">claim_winnings</text>
    <text x="480" y="106" font-size="8.5" font-family="Menlo, monospace" fill="#888">close_losing_bet</text>
    <text x="480" y="116" font-size="8.5" font-family="Menlo, monospace" fill="#888">cancel_event</text>
    <text x="480" y="126" font-size="8.5" font-family="Menlo, monospace" fill="#888">claim_refund</text>
  </g>
  <!-- event PDA: Maria's word becomes onchain truth -->
  <g>
    <circle cx="210" cy="104" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="222" y="107" font-size="8.5" letter-spacing="0.6" fill="#555">SEEDS: &#8220;EVENT&#8221; + EVENT ID</text>
    <rect x="210" y="114" width="220" height="66" rx="6" fill="#f4f4f2" stroke="#888"/>
    <text x="220" y="131" font-size="10.5" font-weight="bold">event</text>
    <text x="220" y="146" font-size="9.5">status: Settled &#183; winning_outcome: 0</text>
    <text x="220" y="159" font-size="9.5">distributable_losing_pool: 196</text>
    <text x="220" y="172" font-size="9" fill="#444">total_pool: 600 &#183; winning_pool: 400</text>
  </g>
  <!-- the vault after the fee leaves -->
  <g>
    <circle cx="452" cy="146" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="464" y="143" font-size="8.5" letter-spacing="0.6" fill="#555">SEEDS: ATA PROGRAM + EVENT&#8217;S</text>
    <text x="464" y="154" font-size="8.5" letter-spacing="0.6" fill="#555">ADDRESS + USDC MINT ADDRESS</text>
    <rect x="460" y="158" width="150" height="54" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <text x="470" y="176" font-size="10.5" font-weight="bold">vault: the event&#8217;s USDC</text>
    <text x="470" y="191" font-size="9.5" fill="#444">596 USDC</text>
    <text x="470" y="204" font-size="9" fill="#444" font-style="italic">authority: the event PDA</text>
  </g>
  <!-- the fee math, stored on the event -->
  <text x="214" y="192" font-size="9">losing pool: 600 &#8722; 400 = 200</text>
  <text x="214" y="203" font-size="9">fee: 2% of 200 = 4 (u128, floored once)</text>
  <text x="214" y="214" font-size="9">distributable: 200 &#8722; 4 = 196</text>
  <!-- outcome PDAs: both sides feed the math -->
  <g>
    <circle cx="62" cy="222" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="74" y="218" font-size="8.5" letter-spacing="0.6" fill="#555">SEEDS: &#8220;OUTCOME&#8221; + EVENT</text>
    <text x="74" y="229" font-size="8.5" letter-spacing="0.6" fill="#555">ADDRESS + INDEX</text>
    <rect x="70" y="234" width="180" height="48" rx="6" fill="#f4f4f2" stroke="#888"/>
    <text x="80" y="252" font-size="10.5" font-weight="bold">outcome 0: Toy Story 5</text>
    <text x="80" y="269" font-size="9.5" fill="#444">total_amount: 400 &#183; wins</text>
  </g>
  <g>
    <circle cx="382" cy="222" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="394" y="218" font-size="8.5" letter-spacing="0.6" fill="#555">SEEDS: &#8220;OUTCOME&#8221; + EVENT</text>
    <text x="394" y="229" font-size="8.5" letter-spacing="0.6" fill="#555">ADDRESS + INDEX</text>
    <rect x="390" y="234" width="180" height="48" rx="6" fill="#f4f4f2" stroke="#888"/>
    <text x="400" y="252" font-size="10.5" font-weight="bold">outcome 1: Backrooms</text>
    <text x="400" y="269" font-size="9.5" fill="#444">total_amount: 200 &#183; loses</text>
  </g>
  <!-- bet PDAs, untouched by settlement -->
  <g opacity="0.3">
    <circle cx="32" cy="318" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="44" y="314" font-size="8.5" letter-spacing="0.6" fill="#555">SEEDS: &#8220;BET&#8221; + OUTCOME</text>
    <text x="44" y="325" font-size="8.5" letter-spacing="0.6" fill="#555">ADDRESS + BETTOR ADDRESS</text>
    <rect x="40" y="330" width="130" height="44" rx="6" fill="#f4f4f2" stroke="#888"/>
    <text x="50" y="348" font-size="10.5" font-weight="bold">Alice&#8217;s bet</text>
    <text x="50" y="364" font-size="9.5" fill="#444">on outcome 0: 300 USDC</text>
  </g>
  <g opacity="0.3">
    <circle cx="192" cy="318" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="204" y="314" font-size="8.5" letter-spacing="0.6" fill="#555">SEEDS: &#8220;BET&#8221; + OUTCOME</text>
    <text x="204" y="325" font-size="8.5" letter-spacing="0.6" fill="#555">ADDRESS + BETTOR ADDRESS</text>
    <rect x="200" y="330" width="130" height="44" rx="6" fill="#f4f4f2" stroke="#888"/>
    <text x="210" y="348" font-size="10.5" font-weight="bold">Bob&#8217;s bet</text>
    <text x="210" y="364" font-size="9.5" fill="#444">on outcome 0: 100 USDC</text>
  </g>
  <g opacity="0.3">
    <circle cx="432" cy="318" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="444" y="314" font-size="8.5" letter-spacing="0.6" fill="#555">SEEDS: &#8220;BET&#8221; + OUTCOME</text>
    <text x="444" y="325" font-size="8.5" letter-spacing="0.6" fill="#555">ADDRESS + BETTOR ADDRESS</text>
    <rect x="440" y="330" width="130" height="44" rx="6" fill="#f4f4f2" stroke="#888"/>
    <text x="450" y="348" font-size="10.5" font-weight="bold">Carol&#8217;s bet</text>
    <text x="450" y="364" font-size="9.5" fill="#444">on outcome 1: 200 USDC</text>
  </g>
  <!-- user index PDAs, untouched -->
  <g opacity="0.3">
    <circle cx="32" cy="396" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="44" y="392" font-size="8.5" letter-spacing="0.6" fill="#555">SEEDS: &#8220;USER&#8221; +</text>
    <text x="44" y="403" font-size="8.5" letter-spacing="0.6" fill="#555">BETTOR ADDRESS</text>
    <rect x="40" y="410" width="130" height="40" rx="6" fill="#fff" stroke="#888"/>
    <text x="50" y="427" font-size="10.5" font-weight="bold">Alice&#8217;s user index</text>
    <text x="50" y="442" font-size="9" fill="#444">open_bets: [Alice&#8217;s bet]</text>
  </g>
  <g opacity="0.3">
    <circle cx="192" cy="396" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="204" y="392" font-size="8.5" letter-spacing="0.6" fill="#555">SEEDS: &#8220;USER&#8221; +</text>
    <text x="204" y="403" font-size="8.5" letter-spacing="0.6" fill="#555">BETTOR ADDRESS</text>
    <rect x="200" y="410" width="130" height="40" rx="6" fill="#fff" stroke="#888"/>
    <text x="210" y="427" font-size="10.5" font-weight="bold">Bob&#8217;s user index</text>
    <text x="210" y="442" font-size="9" fill="#444">open_bets: [Bob&#8217;s bet]</text>
  </g>
  <g opacity="0.3">
    <circle cx="432" cy="396" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="444" y="392" font-size="8.5" letter-spacing="0.6" fill="#555">SEEDS: &#8220;USER&#8221; +</text>
    <text x="444" y="403" font-size="8.5" letter-spacing="0.6" fill="#555">BETTOR ADDRESS</text>
    <rect x="440" y="410" width="140" height="40" rx="6" fill="#fff" stroke="#888"/>
    <text x="450" y="427" font-size="10.5" font-weight="bold">Carol&#8217;s user index</text>
    <text x="450" y="442" font-size="9" fill="#444">open_bets: [Carol&#8217;s bet]</text>
  </g>
  <!-- the fee transfer, signed by the event PDA -->
