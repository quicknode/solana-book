<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" font-family="Georgia, serif" fill="#111">
  <!-- the curve -->
  <path d="M 40,600 Q 320,500 600,600" fill="none" stroke="#111" stroke-width="2"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="150" y="512" font-size="13" font-weight="bold" text-anchor="middle">Solana Devnet</text>
  <!-- Maria: market owner wallet -->
  <circle cx="96" cy="583" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="108" y="581" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <rect x="40" y="593" width="112" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="55" cy="610" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M 47,621 Q 55,614 63,621" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="70" y="610" font-size="10" font-weight="bold">Maria (owner)</text>
  <text x="70" y="626" font-size="9.5" fill="#444">0.1 SOL</text>
  <!-- Bob: borrower wallet -->
  <circle cx="214" cy="559" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="226" y="557" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <rect x="162" y="569" width="100" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="177" cy="586" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M 169,597 Q 177,590 185,597" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="192" y="586" font-size="10" font-weight="bold">Bob</text>
  <text x="192" y="602" font-size="9.5" fill="#444">0.1 SOL</text>
  <!-- Carol: borrower wallet -->
  <circle cx="332" cy="553" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="344" y="551" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <rect x="280" y="563" width="100" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="295" cy="580" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M 287,591 Q 295,584 303,591" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="310" y="580" font-size="10" font-weight="bold">Carol</text>
  <text x="310" y="596" font-size="9.5" fill="#444">0.1 SOL</text>
  <!-- the lending program on the curve -->
  <circle cx="410" cy="557" r="6" fill="#111"/>
  <rect x="336" y="616" width="212" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="346" y="632" font-size="10" font-weight="bold">lending program</text>
  <text x="346" y="646" font-size="8.5" font-family="Menlo, monospace">deposit / borrow / repay / liquidate</text>
  <line x1="410" y1="563" x2="430" y2="616" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- the three token mints on the curve -->
  <circle cx="470" cy="566" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="470" y="554" font-size="10" font-weight="bold" text-anchor="middle">USDC mint</text>
  <circle cx="530" cy="579" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="530" y="598" font-size="10" font-weight="bold" text-anchor="middle">NVDAx mint</text>
  <circle cx="590" cy="597" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="590" y="585" font-size="10" font-weight="bold" text-anchor="middle">SPCXx mint</text>
  <!-- lending market PDA -->
  <circle cx="230" cy="18" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="242" y="21" font-size="8.5" letter-spacing="0.6" fill="#555">&#8220;LENDING_MARKET&#8221; + MARKET ID</text>
  <rect x="222" y="28" width="196" height="44" rx="6" fill="#f4f4f2" stroke="#888"/>
  <text x="232" y="46" font-size="10.5" font-weight="bold">lending market</text>
  <text x="232" y="62" font-size="9.5">owner: Maria &#183; quote: USDC</text>
  <!-- three reserves: each a PDA with a liquidity vault and a share mint (both PDAs) -->
  <!-- USDC reserve -->
  <circle cx="14" cy="106" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="26" y="102" font-size="8" letter-spacing="0.5" fill="#555">&#8220;RESERVE&#8221; + MARKET</text>
  <text x="26" y="112" font-size="8" letter-spacing="0.5" fill="#555">+ USDC MINT ADDRESS</text>
  <rect x="22" y="118" width="184" height="106" rx="6" fill="#f4f4f2" stroke="#888"/>
  <text x="32" y="135" font-size="10.5" font-weight="bold">USDC reserve</text>
  <text x="32" y="150" font-size="9" fill="#444">price feed: $1</text>
  <circle cx="34" cy="168" r="4.5" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="44" y="171" font-size="9">liquidity vault</text>
  <text x="44" y="182" font-size="7.5" letter-spacing="0.4" fill="#555">&#8220;LIQUIDITY_VAULT&#8221; + RESERVE</text>
  <circle cx="34" cy="198" r="4.5" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="44" y="201" font-size="9">share mint (a PDA mint)</text>
  <text x="44" y="212" font-size="7.5" letter-spacing="0.4" fill="#555">&#8220;SHARE_MINT&#8221; + RESERVE</text>
  <!-- NVDAx reserve -->
  <circle cx="222" cy="106" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="234" y="102" font-size="8" letter-spacing="0.5" fill="#555">&#8220;RESERVE&#8221; + MARKET</text>
  <text x="234" y="112" font-size="8" letter-spacing="0.5" fill="#555">+ NVDAX MINT ADDRESS</text>
  <rect x="230" y="118" width="184" height="106" rx="6" fill="#f4f4f2" stroke="#888"/>
  <text x="240" y="135" font-size="10.5" font-weight="bold">NVDAx reserve</text>
  <text x="240" y="150" font-size="9" fill="#444">price feed: $200</text>
  <circle cx="242" cy="168" r="4.5" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="252" y="171" font-size="9">liquidity vault</text>
  <text x="252" y="182" font-size="7.5" letter-spacing="0.4" fill="#555">&#8220;LIQUIDITY_VAULT&#8221; + RESERVE</text>
  <circle cx="242" cy="198" r="4.5" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="252" y="201" font-size="9">share mint (a PDA mint)</text>
  <text x="252" y="212" font-size="7.5" letter-spacing="0.4" fill="#555">&#8220;SHARE_MINT&#8221; + RESERVE</text>
  <!-- SPCXx reserve -->
  <circle cx="430" cy="106" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="442" y="102" font-size="8" letter-spacing="0.5" fill="#555">&#8220;RESERVE&#8221; + MARKET</text>
  <text x="442" y="112" font-size="8" letter-spacing="0.5" fill="#555">+ SPCXX MINT ADDRESS</text>
  <rect x="438" y="118" width="184" height="106" rx="6" fill="#f4f4f2" stroke="#888"/>
  <text x="448" y="135" font-size="10.5" font-weight="bold">SPCXx reserve</text>
  <text x="448" y="150" font-size="9" fill="#444">price feed: $250</text>
  <circle cx="450" cy="168" r="4.5" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="460" y="171" font-size="9">liquidity vault</text>
  <text x="460" y="182" font-size="7.5" letter-spacing="0.4" fill="#555">&#8220;LIQUIDITY_VAULT&#8221; + RESERVE</text>
  <circle cx="450" cy="198" r="4.5" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="460" y="201" font-size="9">share mint (a PDA mint)</text>
  <text x="460" y="212" font-size="7.5" letter-spacing="0.4" fill="#555">&#8220;SHARE_MINT&#8221; + RESERVE</text>
  <!-- Bob's obligation -->
  <circle cx="40" cy="300" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="52" y="296" font-size="8.5" letter-spacing="0.5" fill="#555">&#8220;OBLIGATION&#8221; + MARKET</text>
  <text x="52" y="307" font-size="8.5" letter-spacing="0.5" fill="#555">+ BOB&#8217;S ADDRESS</text>
  <rect x="48" y="314" width="252" height="92" rx="6" fill="#f4f4f2" stroke="#888"/>
  <text x="58" y="332" font-size="10.5" font-weight="bold">Bob&#8217;s obligation</text>
  <text x="58" y="349" font-size="9.5">collateral: 5 NVDAx shares</text>
  <text x="58" y="364" font-size="9.5">borrowed: 750 USDC</text>
  <circle cx="60" cy="384" r="4.5" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="70" y="387" font-size="8.5">obligation share vault</text>
  <text x="70" y="398" font-size="7.5" letter-spacing="0.4" fill="#555">&#8220;OBLIGATION_SHARE_VAULT&#8221; + RESERVE + OBLIGATION</text>
  <!-- Carol's obligation -->
  <circle cx="340" cy="300" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="352" y="296" font-size="8.5" letter-spacing="0.5" fill="#555">&#8220;OBLIGATION&#8221; + MARKET</text>
  <text x="352" y="307" font-size="8.5" letter-spacing="0.5" fill="#555">+ CAROL&#8217;S ADDRESS</text>
  <rect x="348" y="314" width="252" height="92" rx="6" fill="#f4f4f2" stroke="#888"/>
  <text x="358" y="332" font-size="10.5" font-weight="bold">Carol&#8217;s obligation</text>
  <text x="358" y="349" font-size="9.5">collateral: 1,000 USDC shares</text>
  <text x="358" y="364" font-size="9.5">borrowed: 3 SPCXx</text>
  <circle cx="360" cy="384" r="4.5" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="370" y="387" font-size="8.5">obligation share vault</text>
  <text x="370" y="398" font-size="7.5" letter-spacing="0.4" fill="#555">&#8220;OBLIGATION_SHARE_VAULT&#8221; + RESERVE + OBLIGATION</text>
  <text x="320" y="440" font-size="9.5" fill="#444" font-style="italic" text-anchor="middle">every account here is a PDA of the lending program, except the wallets and mints on the curve</text>
</svg>
