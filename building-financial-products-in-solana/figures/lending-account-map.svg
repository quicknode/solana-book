  <!-- NVDAx reserve -->
  <rect x="225" y="96" width="190" height="78" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <circle cx="243" cy="114" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
