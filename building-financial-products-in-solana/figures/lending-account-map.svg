  <circle cx="60" cy="318" r="5" fill="#fff" stroke="#111" stroke-width="1.6"/>
  <text x="72" y="322" font-size="10.5">collateral vault: 5 NVDAx shares</text>
  <text x="55" y="346" font-size="10.5">borrow entry: 750 USDC</text>
  <!-- Carol's obligation -->
  <rect x="340" y="272" width="260" height="92" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <circle cx="358" cy="292" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="371" y="296" font-size="12" font-weight="bold">Carol&#8217;s obligation</text>
  <circle cx="360" cy="318" r="5" fill="#fff" stroke="#111" stroke-width="1.6"/>
