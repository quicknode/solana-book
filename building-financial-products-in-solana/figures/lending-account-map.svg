  <rect x="166" y="389.5" width="9" height="9" fill="#111" transform="rotate(45 170.5 394)"/>
  <text x="182" y="398" font-size="10.5" fill="#444">share mint</text>
  <rect x="280" y="387" width="14" height="12" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="300" y="398" font-size="10.5" fill="#444">data account</text>
</svg>
