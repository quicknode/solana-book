  <!-- SPCXx reserve -->
  <rect x="435" y="96" width="190" height="78" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <circle cx="453" cy="114" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
