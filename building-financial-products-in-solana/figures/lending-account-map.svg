  <rect x="450.5" y="157.5" width="9" height="9" fill="#111" transform="rotate(45 455 162)"/>
  <text x="467" y="166" font-size="10.5">share mint</text>
  <!-- price feeds -->
  <line x1="110" y1="174" x2="110" y2="200" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#lending-account-map-arr)"/>
  <line x1="320" y1="174" x2="320" y2="200" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#lending-account-map-arr)"/>
  <line x1="530" y1="174" x2="530" y2="200" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#lending-account-map-arr)"/>
  <rect x="35" y="204" width="150" height="30" rx="4" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="110" y="223" font-size="10.5" text-anchor="middle">price feed: $1</text>
  <rect x="245" y="204" width="150" height="30" rx="4" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="320" y="223" font-size="10.5" text-anchor="middle">price feed: $200</text>
  <rect x="455" y="204" width="150" height="30" rx="4" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="530" y="223" font-size="10.5" text-anchor="middle">price feed: $250</text>
  <!-- seeds annotation -->
  <text x="320" y="256" font-size="10" font-style="italic" fill="#444" text-anchor="middle">reserve seeds: &#8220;reserve&#8221; + market + mint &#183; obligation seeds: &#8220;obligation&#8221; + market + owner</text>
  <!-- Bob's obligation -->
  <rect x="40" y="272" width="260" height="92" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <circle cx="58" cy="292" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
