<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Georgia, serif" fill="#111">
  <defs><marker id="lending-account-map-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#777"/></marker></defs>
  <!-- lending market PDA -->
  <rect x="225" y="16" width="190" height="46" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <circle cx="243" cy="32" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="256" y="36" font-size="12" font-weight="bold">lending market</text>
  <text x="320" y="54" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">owner: Maria &#183; quote: USDC</text>
  <!-- derivation lines to reserves -->
  <line x1="280" y1="62" x2="115" y2="94" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="320" y1="62" x2="320" y2="94" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="360" y1="62" x2="525" y2="94" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- USDC reserve -->
  <rect x="15" y="96" width="190" height="78" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <circle cx="33" cy="114" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="45" y="118" font-size="12" font-weight="bold">USDC reserve</text>
  <circle cx="35" cy="142" r="5" fill="#fff" stroke="#111" stroke-width="1.6"/>
  <text x="47" y="146" font-size="10.5">liquidity vault</text>
  <rect x="30.5" y="157.5" width="9" height="9" fill="#111" transform="rotate(45 35 162)"/>
