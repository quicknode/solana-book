<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 592" font-family="Georgia, serif" fill="#111">
  <!-- the registry (curator record) and its ApprovedAsset accounts -->
  <circle cx="14" cy="24" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="26" y="27" font-size="8.5" letter-spacing="0.5" fill="#555">&#8220;REGISTRY&#8221; + VICTOR&#8217;S ADDRESS</text>
  <rect x="22" y="34" width="188" height="40" rx="6" fill="#f4f4f2" stroke="#888"/>
  <text x="32" y="50" font-size="10.5" font-weight="bold">Registry</text>
  <text x="32" y="65" font-size="9">authority: Victor &#183; holds no list</text>
  <circle cx="14" cy="88" r="4.5" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="24" y="85" font-size="7.5" letter-spacing="0.4" fill="#555">&#8220;APPROVED_ASSET&#8221; +</text>
  <text x="24" y="94" font-size="7.5" letter-spacing="0.4" fill="#555">REGISTRY + TSLAX MINT</text>
  <rect x="22" y="98" width="188" height="24" rx="4" fill="#f4f4f2" stroke="#888"/>
  <text x="30" y="113" font-size="9"><tspan font-weight="bold">ApprovedAsset:</tspan> TSLAx &#8594; TSLA feed</text>
  <circle cx="14" cy="132" r="4.5" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="24" y="129" font-size="7.5" letter-spacing="0.4" fill="#555">&#8220;APPROVED_ASSET&#8221; +</text>
  <text x="24" y="138" font-size="7.5" letter-spacing="0.4" fill="#555">REGISTRY + NVDAX MINT</text>
  <rect x="22" y="142" width="188" height="24" rx="4" fill="#f4f4f2" stroke="#888"/>
  <text x="30" y="157" font-size="9"><tspan font-weight="bold">ApprovedAsset:</tspan> NVDAx &#8594; NVDA feed</text>
  <text x="22" y="177" font-size="8.5" fill="#444" font-style="italic">approved if it has an ApprovedAsset account</text>
  <!-- strategy PDA -->
  <circle cx="232" cy="24" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="244" y="27" font-size="8.5" letter-spacing="0.5" fill="#555">&#8220;STRATEGY&#8221; + INDEX</text>
  <rect x="240" y="34" width="188" height="70" rx="6" fill="#f4f4f2" stroke="#888"/>
  <text x="250" y="52" font-size="10.5" font-weight="bold">Strategy</text>
  <text x="250" y="68" font-size="9.5">manager: Maria &#183; fee: 1%</text>
  <text x="250" y="82" font-size="9.5">asset_count: 2</text>
  <text x="250" y="96" font-size="8.5" fill="#444" font-style="italic">router and fee fixed at creation</text>
  <!-- share mint PDA -->
  <circle cx="452" cy="24" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="464" y="27" font-size="8.5" letter-spacing="0.5" fill="#555">&#8220;SHARE_MINT&#8221; + STRATEGY</text>
  <rect x="460" y="34" width="164" height="52" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="470" y="52" font-size="10" font-weight="bold">share mint</text>
  <text x="470" y="67" font-size="9" fill="#444">a PDA mint; authority = strategy</text>
  <text x="470" y="80" font-size="9" fill="#444">supply: 1,000 shares</text>
  <!-- asset config PDAs -->
  <circle cx="14" cy="182" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="26" y="185" font-size="8.5" letter-spacing="0.5" fill="#555">&#8220;ASSET&#8221; + STRATEGY + INDEX</text>
  <rect x="22" y="192" width="200" height="62" rx="6" fill="#f4f4f2" stroke="#888"/>
  <text x="32" y="210" font-size="10.5" font-weight="bold">Asset config 0</text>
  <text x="32" y="226" font-size="9.5">TSLAx &#183; weight 4,000 bps</text>
  <text x="32" y="240" font-size="8.5" fill="#444" font-style="italic">feed copied from the ApprovedAsset</text>
  <circle cx="238" cy="182" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="250" y="185" font-size="8.5" letter-spacing="0.5" fill="#555">&#8220;ASSET&#8221; + STRATEGY + INDEX</text>
  <rect x="246" y="192" width="200" height="62" rx="6" fill="#f4f4f2" stroke="#888"/>
  <text x="256" y="210" font-size="10.5" font-weight="bold">Asset config 1</text>
  <text x="256" y="226" font-size="9.5">NVDAx &#183; weight 6,000 bps</text>
  <text x="256" y="240" font-size="8.5" fill="#444" font-style="italic">feed copied from the ApprovedAsset</text>
  <!-- Alice's and Bob's share accounts (ATAs of the share mint) -->
  <circle cx="462" cy="122" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="474" y="118" font-size="8" letter-spacing="0.4" fill="#555">ATA PROGRAM + ALICE&#8217;S</text>
  <text x="474" y="128" font-size="8" letter-spacing="0.4" fill="#555">ADDRESS + SHARE MINT ADDRESS</text>
  <rect x="470" y="134" width="154" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="480" y="151" font-size="10" font-weight="bold">Alice&#8217;s shares</text>
  <text x="480" y="166" font-size="9" fill="#444">600 shares</text>
  <circle cx="462" cy="192" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="474" y="188" font-size="8" letter-spacing="0.4" fill="#555">ATA PROGRAM + BOB&#8217;S</text>
  <text x="474" y="198" font-size="8" letter-spacing="0.4" fill="#555">ADDRESS + SHARE MINT ADDRESS</text>
  <rect x="470" y="204" width="154" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="480" y="221" font-size="10" font-weight="bold">Bob&#8217;s shares</text>
  <text x="480" y="236" font-size="9" fill="#444">400 shares</text>
  <!-- the three vaults: strategy's token accounts (ATAs) -->
  <circle cx="20" cy="286" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="32" y="282" font-size="8" letter-spacing="0.4" fill="#555">ATA PROGRAM + STRATEGY&#8217;S</text>
  <text x="32" y="292" font-size="8" letter-spacing="0.4" fill="#555">ADDRESS + TSLAX MINT ADDRESS</text>
  <rect x="28" y="298" width="176" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="38" y="316" font-size="10" font-weight="bold">TSLAx vault</text>
  <text x="38" y="332" font-size="9" fill="#444">2 TSLAx</text>
  <circle cx="228" cy="286" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="240" y="282" font-size="8" letter-spacing="0.4" fill="#555">ATA PROGRAM + STRATEGY&#8217;S</text>
  <text x="240" y="292" font-size="8" letter-spacing="0.4" fill="#555">ADDRESS + USDC MINT ADDRESS</text>
  <rect x="236" y="298" width="176" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="246" y="316" font-size="10" font-weight="bold">USDC vault</text>
  <text x="246" y="332" font-size="9" fill="#444">200 USDC</text>
  <circle cx="436" cy="286" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="448" y="282" font-size="8" letter-spacing="0.4" fill="#555">ATA PROGRAM + STRATEGY&#8217;S</text>
  <text x="448" y="292" font-size="8" letter-spacing="0.4" fill="#555">ADDRESS + NVDAX MINT ADDRESS</text>
  <rect x="444" y="298" width="176" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="454" y="316" font-size="10" font-weight="bold">NVDAx vault</text>
  <text x="454" y="332" font-size="9" fill="#444">3 NVDAx</text>
  <text x="320" y="368" font-size="9.5" fill="#444" font-style="italic" text-anchor="middle">all three vaults are token accounts owned by the strategy PDA</text>
  <!-- the curve -->
  <path d="M 40,532 Q 320,432 600,532" fill="none" stroke="#111" stroke-width="2"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="150" y="444" font-size="13" font-weight="bold" text-anchor="middle">Solana Devnet</text>
  <!-- Maria (manager) wallet -->
  <circle cx="88" cy="513" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="100" y="511" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <rect x="32" y="523" width="120" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="47" cy="540" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M 39,551 Q 47,544 55,551" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="62" y="540" font-size="10" font-weight="bold">Maria (manager)</text>
  <text x="62" y="556" font-size="9.5" fill="#444">0.1 SOL</text>
  <!-- Alice wallet -->
  <circle cx="196" cy="489" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="208" y="487" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <rect x="150" y="499" width="96" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="165" cy="516" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M 157,527 Q 165,520 173,527" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="180" y="516" font-size="10" font-weight="bold">Alice</text>
  <text x="180" y="532" font-size="9.5" fill="#444">0.1 SOL</text>
  <!-- Bob wallet -->
  <circle cx="300" cy="472" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="312" y="470" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <rect x="254" y="482" width="96" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="269" cy="499" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M 261,510 Q 269,503 277,510" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="284" y="499" font-size="10" font-weight="bold">Bob</text>
  <text x="284" y="515" font-size="9.5" fill="#444">0.1 SOL</text>
  <!-- vault-strategy program -->
  <circle cx="392" cy="470" r="6" fill="#111"/>
  <rect x="318" y="532" width="220" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="328" y="548" font-size="10" font-weight="bold">vault-strategy program</text>
  <text x="328" y="562" font-size="8.5" font-family="Menlo, monospace">deposit / withdraw / rebalance</text>
  <line x1="392" y1="476" x2="412" y2="532" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- the three token mints on the curve -->
  <circle cx="452" cy="478" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="452" y="466" font-size="10" font-weight="bold" text-anchor="middle">USDC mint</text>
  <circle cx="516" cy="491" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="516" y="510" font-size="10" font-weight="bold" text-anchor="middle">TSLAx mint</text>
  <circle cx="580" cy="509" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="580" y="497" font-size="10" font-weight="bold" text-anchor="middle">NVDAx mint</text>
</svg>
