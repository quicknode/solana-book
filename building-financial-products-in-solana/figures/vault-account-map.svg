<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Georgia, serif" fill="#111">
  <defs><marker id="vault-account-map-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <!-- registry behind everything -->
  <rect x="22" y="22" width="176" height="112" rx="8" fill="none" stroke="#888" stroke-width="1.3"/>
  <text x="110" y="44" font-size="12" font-weight="bold" text-anchor="middle">Victor&#8217;s registry</text>
  <rect x="34" y="56" width="152" height="28" rx="4" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="110" y="74" font-size="10.5" text-anchor="middle">TSLAx &#8594; TSLA feed</text>
  <rect x="34" y="92" width="152" height="28" rx="4" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="110" y="110" font-size="10.5" text-anchor="middle">NVDAx &#8594; NVDA feed</text>
  <!-- strategy PDA -->
  <rect x="250" y="24" width="190" height="70" rx="8" fill="none" stroke="#111" stroke-width="2"/>
  <circle cx="266" cy="40" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="352" y="44" font-size="13" font-weight="bold" text-anchor="middle">Strategy PDA</text>
  <text x="345" y="62" font-size="11" text-anchor="middle">manager: Maria &#183; fee: 1%</text>
  <text x="345" y="80" font-size="10" font-style="italic" fill="#444" text-anchor="middle">router and fee fixed at creation</text>
  <!-- share mint -->
  <rect x="554" y="44" width="12" height="12" fill="#111" transform="rotate(45 560 50)"/>
  <text x="560" y="30" font-size="11" font-weight="bold" text-anchor="middle">share mint</text>
  <path d="M 442,54 L 546,50" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#vault-account-map-arr)"/>
  <text x="494" y="38" font-size="10" font-style="italic" fill="#444" text-anchor="middle">mint authority</text>
  <!-- Alice and Bob share accounts -->
  <circle cx="596" cy="122" r="7" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="583" y="126" font-size="10.5" font-weight="bold" text-anchor="end">Alice&#8217;s shares</text>
  <circle cx="596" cy="180" r="7" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="583" y="184" font-size="10.5" font-weight="bold" text-anchor="end">Bob&#8217;s shares</text>
  <line x1="566" y1="56" x2="593" y2="114" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="568" y1="54" x2="597" y2="172" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- asset config PDAs -->
  <rect x="96" y="196" width="176" height="62" rx="8" fill="none" stroke="#111" stroke-width="1.5"/>
  <circle cx="112" cy="212" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="192" y="216" font-size="12" font-weight="bold" text-anchor="middle">Asset config 0</text>
  <text x="184" y="233" font-size="10.5" text-anchor="middle">TSLAx &#183; weight 4,000 bps</text>
  <text x="184" y="249" font-size="10" font-style="italic" fill="#444" text-anchor="middle">feed copied from the registry</text>
  <rect x="368" y="196" width="176" height="62" rx="8" fill="none" stroke="#111" stroke-width="1.5"/>
  <circle cx="384" cy="212" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="464" y="216" font-size="12" font-weight="bold" text-anchor="middle">Asset config 1</text>
  <text x="456" y="233" font-size="10.5" text-anchor="middle">NVDAx &#183; weight 6,000 bps</text>
  <text x="456" y="249" font-size="10" font-style="italic" fill="#444" text-anchor="middle">feed copied from the registry</text>
  <!-- derivation: strategy to configs -->
  <line x1="300" y1="94" x2="196" y2="194" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="396" y1="94" x2="444" y2="194" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- feed copy from registry entries -->
  <path d="M 186,70 C 220,110 190,160 166,194" fill="none" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M 186,106 C 260,140 330,168 396,196" fill="none" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- vaults -->
  <circle cx="184" cy="290" r="8" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="184" y="314" font-size="11" font-weight="bold" text-anchor="middle">TSLAx vault</text>
  <circle cx="320" cy="290" r="8" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="320" y="314" font-size="11" font-weight="bold" text-anchor="middle">USDC vault</text>
  <circle cx="456" cy="290" r="8" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="456" y="314" font-size="11" font-weight="bold" text-anchor="middle">NVDAx vault</text>
  <path d="M 184,258 L 184,281" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#vault-account-map-arr)"/>
  <path d="M 456,258 L 456,281" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#vault-account-map-arr)"/>
  <path d="M 320,94 L 320,281" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#vault-account-map-arr)"/>
  <text x="320" y="336" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">all vaults are token accounts owned by the strategy PDA</text>
  <!-- legend -->
  <circle cx="60" cy="372" r="5" fill="#fff" stroke="#111" stroke-width="1.6"/>
  <text x="71" y="376" font-size="10.5" fill="#444">PDA / vault</text>
  <rect x="185" y="367" width="10" height="10" fill="#111" transform="rotate(45 190 372)"/>
  <text x="202" y="376" font-size="10.5" fill="#444">mint</text>
  <rect x="270" y="364" width="26" height="16" rx="4" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="304" y="376" font-size="10.5" fill="#444">account data</text>
  <text x="430" y="376" font-size="10.5" fill="#444" font-style="italic">dashed = derivation / copied field</text>
</svg>
