<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="Georgia, serif" fill="#111">
  <defs><marker id="fund-map-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <!-- the curve -->
  <path d="M 40,360 Q 320,150 600,360" fill="none" stroke="#111" stroke-width="2"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="320" y="410" font-size="13" font-weight="bold" text-anchor="middle">Solana Devnet</text>
  <!-- Maria: maker wallet, address on the curve -->
  <circle cx="96" cy="322" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="108" y="320" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <rect x="104" y="334" width="122" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="119" cy="351" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M 111,362 Q 119,355 127,362" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="134" y="351" font-size="10.5" font-weight="bold">Maria (maker)</text>
  <text x="134" y="367" font-size="9.5" fill="#444">0.1 SOL</text>
  <!-- Alice: backer wallet, address on the curve -->
  <circle cx="544" cy="322" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="532" y="320" font-size="9" letter-spacing="1" fill="#555" text-anchor="end">PUBLIC KEY</text>
  <rect x="414" y="334" width="122" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="429" cy="351" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M 421,362 Q 429,355 437,362" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="444" y="351" font-size="10.5" font-weight="bold">Alice (backer)</text>
  <text x="444" y="367" font-size="9.5" fill="#444">0.1 SOL</text>
  <!-- USDC mint on the curve -->
  <circle cx="250" cy="266" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="250" y="285" font-size="9" letter-spacing="1" fill="#555" text-anchor="middle">PUBLIC KEY</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="250" y="253" font-size="11" font-weight="bold" text-anchor="middle">USDC mint</text>
  <!-- the fundraiser program on the curve -->
  <circle cx="360" cy="257" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="372" y="256" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <rect x="300" y="148" width="140" height="80" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="310" y="164" font-size="10.5" font-weight="bold">fundraiser program</text>
  <text x="310" y="179" font-size="9" font-family="Menlo, monospace">initialize</text>
  <text x="310" y="191" font-size="9" font-family="Menlo, monospace">contribute</text>
  <text x="310" y="203" font-size="9" font-family="Menlo, monospace">check_contributions</text>
  <text x="310" y="215" font-size="9" font-family="Menlo, monospace">refund</text>
  <text x="310" y="227" font-size="9" font-family="Menlo, monospace">close_fundraiser</text>
  <line x1="360" y1="228" x2="360" y2="251" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- fundraiser account PDA, off the curve -->
  <circle cx="66" cy="50" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="78" y="53" font-size="8.5" letter-spacing="0.6" fill="#555">&#8220;FUNDRAISER&#8221; + MAKER&#8217;S ADDRESS</text>
  <rect x="58" y="60" width="200" height="106" rx="6" fill="#f4f4f2" stroke="#888"/>
  <text x="68" y="78" font-size="10.5" font-weight="bold">fundraiser account</text>
  <text x="68" y="94" font-size="9.5">maker: Maria</text>
  <text x="68" y="108" font-size="9.5">mint_to_raise: USDC</text>
  <text x="68" y="122" font-size="9.5">amount_to_raise: 9,000 USDC</text>
  <text x="68" y="136" font-size="9.5">current_amount: 9,000 USDC</text>
  <text x="68" y="150" font-size="9.5">duration_days: 7</text>
  <text x="68" y="162" font-size="9" fill="#444">bump: 253</text>
  <!-- vault: the fundraiser's USDC ATA -->
  <circle cx="430" cy="50" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="442" y="46" font-size="8.5" letter-spacing="0.6" fill="#555">ATA PROGRAM + FUNDRAISER&#8217;S</text>
  <text x="442" y="57" font-size="8.5" letter-spacing="0.6" fill="#555">ADDRESS + USDC MINT ADDRESS</text>
  <rect x="438" y="62" width="176" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="446" y="80" font-size="10" font-weight="bold">vault: the fundraiser&#8217;s USDC</text>
  <text x="446" y="96" font-size="9.5" fill="#444">9,000 USDC</text>
  <!-- Alice's contributor receipt PDA, off the curve -->
  <circle cx="466" cy="140" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="478" y="136" font-size="8.5" letter-spacing="0.6" fill="#555">&#8220;CONTRIBUTOR&#8221; + FUNDRAISER</text>
  <text x="478" y="147" font-size="8.5" letter-spacing="0.6" fill="#555">ADDRESS + ALICE&#8217;S ADDRESS</text>
  <rect x="474" y="152" width="150" height="44" rx="6" fill="#f4f4f2" stroke="#888"/>
  <text x="484" y="170" font-size="10.5" font-weight="bold">Alice&#8217;s receipt</text>
  <text x="484" y="186" font-size="9.5" fill="#444">amount: 900 USDC</text>
  <!-- Maria's USDC ATA, off the curve -->
  <circle cx="30" cy="204" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="42" y="200" font-size="8.5" letter-spacing="0.6" fill="#555">ATA PROGRAM + MARIA&#8217;S</text>
  <text x="42" y="211" font-size="8.5" letter-spacing="0.6" fill="#555">ADDRESS + USDC MINT ADDRESS</text>
  <rect x="38" y="216" width="124" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="48" y="234" font-size="10.5" font-weight="bold">Maria&#8217;s USDC</text>
  <text x="48" y="250" font-size="9.5" fill="#444">0 USDC (until close)</text>
  <!-- Alice's USDC ATA, off the curve -->
  <circle cx="474" cy="392" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="614" y="388" font-size="8.5" letter-spacing="0.6" fill="#555" text-anchor="end">ATA PROGRAM + ALICE&#8217;S</text>
  <text x="614" y="399" font-size="8.5" letter-spacing="0.6" fill="#555" text-anchor="end">ADDRESS + USDC MINT ADDRESS</text>
  <rect x="482" y="404" width="124" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="492" y="422" font-size="10.5" font-weight="bold">Alice&#8217;s USDC</text>
  <text x="492" y="438" font-size="9.5" fill="#444">100 USDC</text>
  <!-- the other backers -->
  <text x="210" y="440" font-size="10" fill="#444" font-style="italic" text-anchor="middle">&#8230;nine more backers, each with their own receipt PDA</text>
</svg>
