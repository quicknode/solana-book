<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Georgia, serif" fill="#111">
  <defs><marker id="fund-map-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <!-- the curve -->
  <path d="M 40,340 Q 320,130 600,340" fill="none" stroke="#111" stroke-width="2"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="320" y="415" font-size="13" font-weight="bold" text-anchor="middle">Solana Devnet</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="320" y="432" font-size="9.5" font-style="italic" fill="#444" text-anchor="middle">only the fundraiser program can sign as the fundraiser PDA</text>
  <!-- relationship lines (drawn first so haloed text sits on top) -->
  <line x1="92" y1="294" x2="80" y2="242" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="104" y1="296" x2="184" y2="122" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="546" y1="310" x2="558" y2="360" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="538" y1="296" x2="489" y2="220" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="212" y1="245" x2="146" y2="232" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="225" y1="243" x2="428" y2="132" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="226" y1="254" x2="496" y2="364" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- on-curve public keys -->
  <circle cx="96" cy="302" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="108" y="300" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="96" y="326" font-size="12" font-weight="bold" text-anchor="middle">Maria</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="96" y="340" font-size="10" font-style="italic" fill="#444" text-anchor="middle">(maker)</text>
  <circle cx="219" cy="249" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="219" y="268" font-size="9" letter-spacing="1" fill="#555" text-anchor="middle">PUBLIC KEY</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="219" y="283" font-size="11" font-weight="bold" text-anchor="middle">USDC mint</text>
  <circle cx="320" cy="235" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="332" y="232" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <circle cx="544" cy="302" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="532" y="300" font-size="9" letter-spacing="1" fill="#555" text-anchor="end">PUBLIC KEY</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="544" y="326" font-size="12" font-weight="bold" text-anchor="middle">Alice</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="544" y="340" font-size="10" font-style="italic" fill="#444" text-anchor="middle">(one of ten backers)</text>
  <!-- the fundraiser program: its address is on the curve -->
  <rect x="250" y="20" width="140" height="86" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="320" y="35" font-size="10.5" font-weight="bold" text-anchor="middle">fundraiser program</text>
  <text x="320" y="49" font-size="9.5" text-anchor="middle" font-family="Menlo, monospace">initialize</text>
  <text x="320" y="61" font-size="9.5" text-anchor="middle" font-family="Menlo, monospace">contribute</text>
  <text x="320" y="73" font-size="9.5" text-anchor="middle" font-family="Menlo, monospace">check_contributions</text>
  <text x="320" y="85" font-size="9.5" text-anchor="middle" font-family="Menlo, monospace">refund</text>
  <text x="320" y="97" font-size="9.5" text-anchor="middle" font-family="Menlo, monospace">close_fundraiser</text>
  <line x1="320" y1="106" x2="320" y2="227" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- fundraiser PDA, off the curve -->
  <text x="180" y="32" font-size="9" letter-spacing="0.8" fill="#555" text-anchor="middle">FUNDRAISER PROGRAM ID</text>
  <text x="180" y="45" font-size="9" letter-spacing="0.8" fill="#555" text-anchor="middle">+ &#8220;FUNDRAISER&#8221;</text>
  <text x="180" y="58" font-size="9" letter-spacing="0.8" fill="#555" text-anchor="middle">+ MAKER&#8217;S ADDRESS</text>
  <path d="M 186,64 L 190,100" stroke="#111" stroke-width="1.3" marker-end="url(#fund-map-arr)"/>
  <circle cx="190" cy="112" r="9" fill="#fff" stroke="#111" stroke-width="2"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="190" y="140" font-size="11" font-weight="bold" text-anchor="middle">fundraiser account</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="190" y="154" font-size="9.5" font-style="italic" fill="#444" text-anchor="middle">a PDA, off the curve</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="190" y="168" font-size="9.5" font-style="italic" fill="#444" text-anchor="middle">records the terms &amp; current_amount</text>
  <!-- vault: the fundraiser's token account -->
  <rect x="430" y="84" width="164" height="46" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="512" y="103" font-size="10" font-weight="bold" text-anchor="middle">vault: the fundraiser&#8217;s USDC</text>
  <text x="512" y="120" font-size="10" fill="#444" text-anchor="middle">9,000 USDC</text>
  <path d="M 203,118 L 426,114" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#fund-map-arr)"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="313" y="131" font-size="10" font-weight="bold" text-anchor="middle">authority</text>
  <!-- Alice's contributor receipt, off the curve -->
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="480" y="158" font-size="9" letter-spacing="0.8" fill="#555" text-anchor="middle">FUNDRAISER PROGRAM ID</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="480" y="171" font-size="9" letter-spacing="0.8" fill="#555" text-anchor="middle">+ &#8220;CONTRIBUTOR&#8221; + THE FUNDRAISER</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="480" y="184" font-size="9" letter-spacing="0.8" fill="#555" text-anchor="middle">+ ALICE&#8217;S ADDRESS</text>
  <path d="M 480,189 L 480,201" stroke="#111" stroke-width="1.3" marker-end="url(#fund-map-arr)"/>
  <circle cx="480" cy="212" r="8" fill="#fff" stroke="#111" stroke-width="2"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="480" y="236" font-size="11" font-weight="bold" text-anchor="middle">Alice&#8217;s receipt</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="480" y="250" font-size="9.5" fill="#444" text-anchor="middle">amount: 900 USDC</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="528" y="272" font-size="10" font-style="italic" fill="#777">backer</text>
  <!-- the users' ATAs: rectangles, off the curve, next to their owners -->
  <rect x="14" y="196" width="128" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="78" y="214" font-size="11" font-weight="bold" text-anchor="middle">Maria&#8217;s USDC</text>
  <text x="78" y="231" font-size="10" fill="#444" text-anchor="middle">0 USDC</text>
  <rect x="498" y="362" width="128" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="562" y="380" font-size="11" font-weight="bold" text-anchor="middle">Alice&#8217;s USDC</text>
  <text x="562" y="397" font-size="10" fill="#444" text-anchor="middle">100 USDC</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="76" y="270" font-size="10" font-style="italic" fill="#777" text-anchor="end">owner</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="163" y="184" font-size="10" font-style="italic" fill="#777">maker</text>
  <!-- the other backers -->
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="320" y="378" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">&#8230;nine more backers, each with their own receipt</text>
</svg>
