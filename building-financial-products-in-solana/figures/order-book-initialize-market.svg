<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="Georgia, serif" fill="#111">
  <defs><marker id="order-book-initialize-market-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <!-- Maria -->
  <circle cx="75" cy="95" r="16" fill="none" stroke="#111" stroke-width="1.5"/>
  <path d="M 50,137 Q 75,115 100,137" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="75" y="157" font-size="12" font-weight="bold" text-anchor="middle">Maria</text>
  <!-- the call -->
  <path d="M 108,100 L 250,106" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#order-book-initialize-market-arr)"/>
  <text x="180" y="88" font-size="11" font-weight="bold" text-anchor="middle">initialize_market</text>
  <!-- the market PDA and its parameters -->
  <circle cx="285" cy="110" r="9" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="285" y="140" font-size="11" font-weight="bold" text-anchor="middle">market PDA</text>
  <line x1="285" y1="119" x2="285" y2="152" stroke="#888" stroke-width="1"/>
  <rect x="195" y="152" width="180" height="76" rx="6" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="205" y="170" font-size="11">fee: <tspan font-weight="bold">25 bps</tspan></text>
  <text x="205" y="186" font-size="11">tick size, lot sizes</text>
  <text x="205" y="202" font-size="11">min order size</text>
  <text x="205" y="218" font-size="11">authority: <tspan font-weight="bold">Maria</tspan></text>
  <!-- three empty vaults -->
  <circle cx="470" cy="70" r="7" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="484" y="68" font-size="11" font-weight="bold">base vault</text>
  <text x="484" y="81" font-size="10" font-style="italic" fill="#444">NVDAx, empty</text>
  <circle cx="470" cy="120" r="7" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="484" y="118" font-size="11" font-weight="bold">quote vault</text>
  <text x="484" y="131" font-size="10" font-style="italic" fill="#444">USDC, empty</text>
  <circle cx="470" cy="170" r="7" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="484" y="168" font-size="11" font-weight="bold">fee vault</text>
  <text x="484" y="181" font-size="10" font-style="italic" fill="#444">USDC, empty</text>
  <line x1="294" y1="107" x2="462" y2="72" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="294" y1="111" x2="462" y2="119" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="293" y1="115" x2="463" y2="167" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="470" y="202" font-size="10" font-style="italic" fill="#444" text-anchor="middle">created with the market as authority</text>
  <!-- the pre-created order book -->
  <rect x="330" y="255" width="230" height="62" rx="6" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="445" y="277" font-size="12" font-weight="bold" text-anchor="middle">order book (&#8776;180 KB)</text>
  <text x="445" y="294" font-size="10.5" text-anchor="middle">stamped: empty bid tree, empty ask tree</text>
  <path d="M 85,150 C 120,260 220,290 322,288" fill="none" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#order-book-initialize-market-arr)"/>
  <path d="M 300,228 C 320,246 350,254 385,258" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#order-book-initialize-market-arr)"/>
  <text x="430" y="241" font-size="10" font-style="italic" fill="#444" text-anchor="middle">the handler stamps the trees</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="75" y="171" font-size="10" font-style="italic" fill="#444" text-anchor="middle">market authority</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="175" y="242" font-size="10" font-style="italic" fill="#444" text-anchor="middle">created first by Maria&#8217;s client:</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="175" y="255" font-size="10" font-style="italic" fill="#444" text-anchor="middle">too big for the program to allocate</text>
</svg>
