<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 278" font-family="'Denim INK', Helvetica, Arial, sans-serif" fill="#111">
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="16" y="24" font-size="15" font-weight="bold">The crowded side pays rent</text>
  <defs><marker id="perps-fund-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <!-- axes -->
  <line x1="70" y1="200" x2="590" y2="200" stroke="#111" stroke-width="1.5" marker-end="url(#perps-fund-arr)"/>
  <line x1="70" y1="200" x2="70" y2="40" stroke="#111" stroke-width="1.5" marker-end="url(#perps-fund-arr)"/>
  <text x="588" y="192" font-size="10.5" text-anchor="end">seconds</text>
  <text x="78" y="46" font-size="10.5">cumulative_funding</text>
  <line x1="70" y1="130" x2="585" y2="130" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="64" y="134" font-size="9.5" fill="#444" text-anchor="end">0</text>
  <!-- index path: rises (longs heavy), then falls (shorts heavy), then rises -->
  <path d="M 70,130 L 230,74 L 390,138 L 560,86" fill="none" stroke="#111" stroke-width="2.4"/>
  <!-- phase labels -->
  <text x="150" y="62" font-size="10.5" font-weight="bold" text-anchor="middle">longs outweigh shorts:</text>
  <text x="150" y="76" font-size="10" fill="#444" text-anchor="middle">index climbs, longs pay</text>
  <!-- entry/exit brackets for one position -->
  <circle cx="120" cy="112" r="4.5" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="128" y="148" font-size="9.5">entry: snapshot the index</text>
  <circle cx="330" cy="114" r="4.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="336" y="104" font-size="9.5">exit: pay size &#215; index movement</text>
  <path d="M 120,120 L 120,206" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M 330,122 L 330,206" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- worked example -->
  <rect x="392" y="214" width="234" height="52" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="509" y="229" font-size="10" text-anchor="middle" font-weight="bold">run once: rate 5,000 per second,</text>
  <text x="509" y="242" font-size="10" fill="#444" text-anchor="middle">5,000 USDC position, 2,000 seconds</text>
  <text x="509" y="255" font-size="10" fill="#444" text-anchor="middle">(about 33 minutes) &#8594; 50 USDC of funding</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="322" y="168" font-size="10.5" font-weight="bold" text-anchor="end">shorts outweigh longs:</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="322" y="182" font-size="10" fill="#444" text-anchor="end">index falls, shorts pay</text>
</svg>
