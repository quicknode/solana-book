<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Georgia, serif" fill="#111">
  <defs>
    <marker id="escrow-make-offer-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker>
    <marker id="escrow-make-offer-arrg" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#777"/></marker>
  </defs>
  <!-- Alice -->
  <circle cx="70" cy="105" r="16" fill="none" stroke="#111" stroke-width="1.5"/>
  <path d="M 45,147 Q 70,125 95,147" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="70" y="167" font-size="12" font-weight="bold" text-anchor="middle">Alice</text>
  <text x="70" y="181" font-size="10" font-style="italic" fill="#444" text-anchor="middle">(maker, signs)</text>
  <!-- her token account and the vault -->
  <circle cx="185" cy="105" r="8" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="185" y="79" font-size="11" font-weight="bold" text-anchor="middle">Alice&#8217;s USDC account</text>
  <line x1="88" y1="103" x2="175" y2="104" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="450" cy="105" r="9" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="450" y="79" font-size="11" font-weight="bold" text-anchor="middle">vault</text>
  <!-- the transfer -->
  <path d="M 195,105 L 438,105" fill="none" stroke="#111" stroke-width="2" marker-end="url(#escrow-make-offer-arr)"/>
  <text x="316" y="127" font-size="11" font-weight="bold" text-anchor="middle">250,000,000 minor units of USDC</text>
  <text x="316" y="143" font-size="10" font-style="italic" fill="#444" text-anchor="middle">(250 USDC)</text>
  <text x="316" y="159" font-size="10" font-style="italic" fill="#444" text-anchor="middle">handle_send_offered_tokens_to_vault</text>
  <!-- the offer account being written -->
  <rect x="230" y="185" width="210" height="100" rx="6" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="335" y="205" font-size="11" font-weight="bold" text-anchor="middle">offer account</text>
  <text x="246" y="224" font-size="10.5">maker: Alice</text>
  <text x="246" y="240" font-size="10.5">token_mint_a: USDC</text>
  <text x="246" y="256" font-size="10.5">token_mint_b: TSLAx</text>
  <text x="246" y="272" font-size="10.5">token_b_wanted_amount: 100,000,000</text>
  <path d="M 90,150 C 140,175 180,195 226,208" fill="none" stroke="#777" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#escrow-make-offer-arrg)"/>
  <text x="115" y="238" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">handle_save_offer</text>
  <text x="115" y="252" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">writes the terms</text>
</svg>
