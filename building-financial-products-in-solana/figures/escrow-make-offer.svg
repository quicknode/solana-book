<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Georgia, serif" fill="#111">
  <defs>
    <marker id="escrow-make-offer-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker>
    <marker id="escrow-make-offer-arrg" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#777"/></marker>
  </defs>
  <!-- the curve -->
  <path d="M 40,388 Q 320,340 600,388" fill="none" stroke="#111" stroke-width="2"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="530" y="378" font-size="12" font-weight="bold">Solana Devnet</text>
  <!-- Alice -->
  <circle cx="55" cy="70" r="16" fill="none" stroke="#111" stroke-width="1.5"/>
  <path d="M 30,112 Q 55,90 80,112" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="55" y="131" font-size="12" font-weight="bold" text-anchor="middle">Alice</text>
  <text x="55" y="145" font-size="10" font-style="italic" fill="#444" text-anchor="middle">(maker, signs)</text>
  <!-- Alice's wallet address on the curve -->
  <line x1="55" y1="150" x2="59" y2="377" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="60" cy="385" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="72" y="388" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <!-- her token account -->
  <rect x="118" y="52" width="128" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="182" y="70" font-size="11" font-weight="bold" text-anchor="middle">Alice&#8217;s USDC</text>
  <text x="182" y="87" font-size="10" fill="#444" text-anchor="middle">1,000 USDC</text>
  <line x1="76" y1="86" x2="114" y2="78" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- the vault -->
  <rect x="442" y="52" width="148" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="516" y="70" font-size="10.5" font-weight="bold" text-anchor="middle">vault: the offer&#8217;s USDC</text>
  <text x="516" y="87" font-size="10" fill="#444" text-anchor="middle">250 USDC</text>
  <!-- the transfer -->
  <path d="M 250,74 L 438,74" fill="none" stroke="#111" stroke-width="2" marker-end="url(#escrow-make-offer-arr)"/>
  <text x="344" y="114" font-size="11" font-weight="bold" text-anchor="middle">250,000,000 minor units of USDC</text>
  <text x="344" y="130" font-size="10" font-style="italic" fill="#444" text-anchor="middle">(250 USDC)</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="344" y="146" font-size="10" font-style="italic" fill="#444" text-anchor="middle">handle_send_offered_tokens_to_vault</text>
  <!-- the vault's authority is the offer PDA -->
  <line x1="352" y1="219" x2="484" y2="99" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="430" y="168" font-size="10" font-style="italic" fill="#777">authority</text>
  <!-- offer PDA, off the curve -->
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="345" y="180" font-size="9" letter-spacing="0.8" fill="#555" text-anchor="middle">ESCROW PROGRAM ID + &#8220;OFFER&#8221;</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="345" y="193" font-size="9" letter-spacing="0.8" fill="#555" text-anchor="middle">+ MAKER&#8217;S ADDRESS + ID</text>
  <path d="M 345,198 L 345,213" stroke="#111" stroke-width="1.3" marker-end="url(#escrow-make-offer-arr)"/>
  <circle cx="345" cy="226" r="9" fill="#fff" stroke="#111" stroke-width="2"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="362" y="230" font-size="9.5" font-style="italic" fill="#444">a PDA, off the curve</text>
  <line x1="345" y1="235" x2="345" y2="246" stroke="#888" stroke-width="1"/>
  <!-- the offer account being written -->
  <rect x="240" y="246" width="210" height="100" rx="6" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="345" y="266" font-size="11" font-weight="bold" text-anchor="middle">offer account</text>
  <text x="256" y="286" font-size="10.5">maker: Alice</text>
  <text x="256" y="302" font-size="10.5">token_mint_a: USDC</text>
  <text x="256" y="318" font-size="10.5">token_mint_b: TSLAx</text>
  <text x="256" y="334" font-size="10.5">token_b_wanted_amount: 100,000,000</text>
  <path d="M 80,150 C 130,190 185,235 234,268" fill="none" stroke="#777" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#escrow-make-offer-arrg)"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="128" y="243" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">handle_save_offer</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="128" y="257" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">writes the terms</text>
</svg>
