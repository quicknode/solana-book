  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="420" y="226" font-size="8.5" letter-spacing="0.6" fill="#555">CONFIG&#8217;S ADDRESS + ACME &amp; USDC</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="420" y="237" font-size="8.5" letter-spacing="0.6" fill="#555">MINTS + &#8220;LIQUIDITY&#8221;</text>
