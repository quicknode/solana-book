<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 274" font-family="'Denim INK', Helvetica, Arial, sans-serif" fill="#111">
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="16" y="24" font-size="15" font-weight="bold">One flat quote versus a size ladder</text>
<g transform="translate(0,14)">
  <defs><marker id="propamm-ladder-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <!-- axes: x is trade size in NVDAx, 0.54 units per token from x=60; y is the ask per token, y = 185 - (price - 165) * 150 -->
  <line x1="60" y1="200" x2="612" y2="200" stroke="#111" stroke-width="1.5" marker-end="url(#propamm-ladder-arr)"/>
  <line x1="60" y1="200" x2="60" y2="38" stroke="#111" stroke-width="1.5" marker-end="url(#propamm-ladder-arr)"/>
  <text x="610" y="228" font-size="10" text-anchor="end">trade size (NVDAx)</text>
  <text x="67" y="46" font-size="10">ask per token</text>
  <line x1="87" y1="200" x2="87" y2="205" stroke="#111" stroke-width="1"/>
  <text x="87" y="214" font-size="9" fill="#444" text-anchor="middle">50</text>
  <line x1="195" y1="200" x2="195" y2="205" stroke="#111" stroke-width="1"/>
  <text x="195" y="214" font-size="9" fill="#444" text-anchor="middle">250</text>
  <line x1="222" y1="200" x2="222" y2="205" stroke="#111" stroke-width="1"/>
  <text x="222" y="226" font-size="9" fill="#444" text-anchor="middle">300</text>
  <line x1="600" y1="200" x2="600" y2="205" stroke="#111" stroke-width="1"/>
  <text x="600" y="214" font-size="9" fill="#444" text-anchor="middle">1,000</text>
  <!-- the oracle price -->
  <line x1="60" y1="185" x2="600" y2="185" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="55" y="189" font-size="9" fill="#444" text-anchor="end">$165</text>
  <!-- this chapter's flat quote -->
  <line x1="60" y1="160" x2="600" y2="160" stroke="#111" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="330" y="156" font-size="9.5" fill="#444">this chapter's program: $165.165 at any size</text>
  <!-- the ladder -->
  <path d="M 60,173 L 87,173 L 87,135 L 195,135 L 195,60 L 600,60" fill="none" stroke="#111" stroke-width="2.2"/>
  <text x="92" y="178" font-size="9.5" fill="#444">tier 1: 50 tokens at $165.08</text>
  <text x="200" y="146" font-size="9.5" fill="#444">tier 2: 200 tokens at $165.33</text>
  <text x="330" y="55" font-size="9.5" fill="#444">tier 3: 750 tokens at $165.83</text>
  <!-- the one annotation -->
  <text x="330" y="90" font-size="9.5" fill="#444">a 300-token buy takes tier 1 and tier 2 in full</text>
  <text x="330" y="103" font-size="9.5" fill="#444">and 50 tokens of tier 3; the ladder is set by the firm</text>
  <text x="330" y="116" font-size="9.5" fill="#444">and never read from the vault balances</text>
</g>
</svg>
