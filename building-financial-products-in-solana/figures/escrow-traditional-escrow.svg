<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Georgia, serif" fill="#111">
  <defs>
    <marker id="escrow-traditional-escrow-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker>
    <marker id="escrow-traditional-escrow-arrg" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#777"/></marker>
  </defs>
  <!-- Alice -->
  <circle cx="70" cy="120" r="16" fill="none" stroke="#111" stroke-width="1.5"/>
  <path d="M 45,162 Q 70,140 95,162" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="70" y="182" font-size="12" font-weight="bold" text-anchor="middle">Alice</text>
  <!-- Bob -->
  <circle cx="570" cy="120" r="16" fill="none" stroke="#111" stroke-width="1.5"/>
  <path d="M 545,162 Q 570,140 595,162" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="570" y="182" font-size="12" font-weight="bold" text-anchor="middle">Bob</text>
  <!-- the third party -->
  <rect x="240" y="80" width="160" height="140" rx="8" fill="none" stroke="#111" stroke-width="2"/>
  <text x="320" y="104" font-size="12" font-weight="bold" text-anchor="middle">trusted third party</text>
  <text x="320" y="120" font-size="10" font-style="italic" fill="#444" text-anchor="middle">holds both sides in escrow</text>
  <!-- USDC lane (top) -->
  <path d="M 112,110 L 236,110" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#escrow-traditional-escrow-arr)"/>
  <text x="173" y="98" font-size="10.5" font-weight="bold" text-anchor="middle">250 USDC</text>
  <path d="M 402,110 L 530,110" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#escrow-traditional-escrow-arr)"/>
  <text x="466" y="98" font-size="10.5" font-weight="bold" text-anchor="middle">250 USDC &#8722; fee</text>
  <!-- TSLAx lane (bottom) -->
  <path d="M 532,190 L 404,190" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#escrow-traditional-escrow-arr)"/>
  <text x="466" y="178" font-size="10.5" font-weight="bold" text-anchor="middle">1 TSLAx</text>
  <path d="M 238,190 L 106,190" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#escrow-traditional-escrow-arr)"/>
  <text x="173" y="178" font-size="10.5" font-weight="bold" text-anchor="middle">1 TSLAx &#8722; fee</text>
  <!-- the slice it keeps -->
  <path d="M 320,222 L 320,250" fill="none" stroke="#777" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#escrow-traditional-escrow-arrg)"/>
  <text x="320" y="270" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">keeps 1&#8211;6% of the transaction for itself</text>
</svg>
