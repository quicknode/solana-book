<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Georgia, serif" fill="#111">
  <defs>
    <marker id="escrow-traditional-escrow-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1e7a3c"/></marker>
    <marker id="escrow-traditional-escrow-arrg" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#777"/></marker>
  </defs>
  <!-- Alice: wallet account -->
  <rect x="36" y="128" width="112" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(44,134)">
    <circle cx="7" cy="4" r="3.1" fill="none" stroke="#111" stroke-width="1.3"/>
    <path d="M 1.5,13 Q 1.5,8.4 7,8.4 Q 12.5,8.4 12.5,13" fill="none" stroke="#111" stroke-width="1.3"/>
  </g>
  <text x="66" y="145" font-size="10.5" font-weight="bold">Alice (maker)</text>
  <text x="66" y="161" font-size="9.5" fill="#444">1 SOL</text>
  <!-- Bob: wallet account -->
  <rect x="492" y="128" width="112" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(500,134)">
    <circle cx="7" cy="4" r="3.1" fill="none" stroke="#111" stroke-width="1.3"/>
    <path d="M 1.5,13 Q 1.5,8.4 7,8.4 Q 12.5,8.4 12.5,13" fill="none" stroke="#111" stroke-width="1.3"/>
  </g>
  <text x="522" y="145" font-size="10.5" font-weight="bold">Bob (taker)</text>
  <text x="522" y="161" font-size="9.5" fill="#444">1 SOL</text>
  <!-- the third party -->
  <rect x="240" y="80" width="160" height="140" fill="none" stroke="#111" stroke-width="2"/>
  <text x="320" y="104" font-size="12" font-weight="bold" text-anchor="middle">trusted third party</text>
  <text x="320" y="120" font-size="10" font-style="italic" fill="#444" text-anchor="middle">holds both sides in escrow</text>
  <!-- USDC lane (top) -->
  <path d="M 152,140 L 236,140" fill="none" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#escrow-traditional-escrow-arr)"/>
  <text x="194" y="130" font-size="10.5" font-weight="bold" fill="#1e7a3c" text-anchor="middle">250 USDC</text>
  <path d="M 404,140 L 488,140" fill="none" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#escrow-traditional-escrow-arr)"/>
  <text x="446" y="130" font-size="10.5" font-weight="bold" fill="#1e7a3c" text-anchor="middle">250 USDC &#8722; fee</text>
  <g transform="translate(194,140)">
    <circle cx="4" cy="2" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <circle cx="-3" cy="0" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <text x="-3" y="3" font-size="8" font-weight="bold" fill="#1e7a3c" text-anchor="middle">$</text>
  </g>
  <g transform="translate(446,140)">
    <circle cx="4" cy="2" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <circle cx="-3" cy="0" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <text x="-3" y="3" font-size="8" font-weight="bold" fill="#1e7a3c" text-anchor="middle">$</text>
  </g>
  <!-- TSLAx lane (bottom) -->
  <path d="M 488,166 L 404,166" fill="none" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#escrow-traditional-escrow-arr)"/>
  <text x="446" y="184" font-size="10.5" font-weight="bold" fill="#1e7a3c" text-anchor="middle">1 TSLAx</text>
  <path d="M 236,166 L 152,166" fill="none" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#escrow-traditional-escrow-arr)"/>
  <text x="194" y="184" font-size="10.5" font-weight="bold" fill="#1e7a3c" text-anchor="middle">1 TSLAx &#8722; fee</text>
  <g transform="translate(446,166)">
    <circle cx="4" cy="2" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <circle cx="-3" cy="0" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <text x="-3" y="3" font-size="8" font-weight="bold" fill="#1e7a3c" text-anchor="middle">$</text>
  </g>
  <g transform="translate(194,166)">
    <circle cx="4" cy="2" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <circle cx="-3" cy="0" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <text x="-3" y="3" font-size="8" font-weight="bold" fill="#1e7a3c" text-anchor="middle">$</text>
  </g>
  <!-- the slice it keeps -->
  <path d="M 320,222 L 320,250" fill="none" stroke="#777" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#escrow-traditional-escrow-arrg)"/>
  <text x="320" y="270" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">keeps 1&#8211;6% of the transaction for itself</text>
</svg>
