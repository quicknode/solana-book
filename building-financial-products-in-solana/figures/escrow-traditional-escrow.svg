<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 212" font-family="Georgia, serif" fill="#111">
  <defs>
    <marker id="escrow-traditional-escrow-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1e7a3c"/></marker>
    <marker id="escrow-traditional-escrow-arrg" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#777"/></marker>
  </defs>
  <!-- Alice: wallet account -->
  <rect x="36" y="88" width="112" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(44,93)"><g transform="translate(-1.835,-1.841) scale(0.736)" fill="#111"><path d="M12 2.5a5.5 5.5 0 0 1 3.096 10.047a9.005 9.005 0 0 1 5.9 8.181a.75.75 0 1 1-1.499.044a7.5 7.5 0 0 0-14.993 0a.75.75 0 0 1-1.5-.045a9.005 9.005 0 0 1 5.9-8.18A5.5 5.5 0 0 1 12 2.5M8 8a4 4 0 1 0 8 0a4 4 0 0 0-8 0"/></g></g>
  <text x="64" y="104" font-size="10.5" font-weight="bold">Alice (maker)</text>
  <line x1="44" y1="109" x2="140" y2="109" stroke="#888" stroke-width="0.8"/>
  <text x="44" y="120" font-size="9.5" fill="#444">1 SOL</text>
  <!-- Bob: wallet account -->
  <rect x="492" y="88" width="112" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(500,93)"><g transform="translate(-1.835,-1.841) scale(0.736)" fill="#111"><path d="M12 2.5a5.5 5.5 0 0 1 3.096 10.047a9.005 9.005 0 0 1 5.9 8.181a.75.75 0 1 1-1.499.044a7.5 7.5 0 0 0-14.993 0a.75.75 0 0 1-1.5-.045a9.005 9.005 0 0 1 5.9-8.18A5.5 5.5 0 0 1 12 2.5M8 8a4 4 0 1 0 8 0a4 4 0 0 0-8 0"/></g></g>
  <text x="520" y="104" font-size="10.5" font-weight="bold">Bob (taker)</text>
  <line x1="500" y1="109" x2="596" y2="109" stroke="#888" stroke-width="0.8"/>
  <text x="500" y="120" font-size="9.5" fill="#444">1 SOL</text>
  <!-- the third party: a company, not an account; square corners say so -->
  <rect x="240" y="70" width="160" height="76" fill="none" stroke="#111" stroke-width="2"/>
  <text x="320" y="102" font-size="12" font-weight="bold" text-anchor="middle">trusted third party</text>
  <text x="320" y="120" font-size="9.5" font-style="italic" fill="#444" text-anchor="middle">holds both sides in escrow</text>
  <!-- USDC lane (top) -->
  <path d="M 152,100 L 236,100" fill="none" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#escrow-traditional-escrow-arr)"/>
  <text x="194" y="82" font-size="10.5" font-weight="bold" fill="#1e7a3c" text-anchor="middle">250 USDC</text>
  <path d="M 404,100 L 488,100" fill="none" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#escrow-traditional-escrow-arr)"/>
  <text x="446" y="82" font-size="10.5" font-weight="bold" fill="#1e7a3c" text-anchor="middle">250 USDC &#8722; fee</text>
  <!-- TSLAx lane (bottom) -->
  <path d="M 488,126 L 404,126" fill="none" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#escrow-traditional-escrow-arr)"/>
  <text x="446" y="150" font-size="10.5" font-weight="bold" fill="#1e7a3c" text-anchor="middle">1 TSLAx</text>
  <path d="M 236,126 L 152,126" fill="none" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#escrow-traditional-escrow-arr)"/>
  <text x="194" y="150" font-size="10.5" font-weight="bold" fill="#1e7a3c" text-anchor="middle">1 TSLAx &#8722; fee</text>
  <!-- the slice it keeps -->
  <path d="M 320,150 L 320,178" fill="none" stroke="#777" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#escrow-traditional-escrow-arrg)"/>
  <text x="320" y="198" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">keeps 1&#8211;6% of the transaction for itself</text>
  <g class="coin" transform="translate(156,77.5)" fill="#fff"><g stroke="#fff" stroke-width="4.5"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g><g stroke="#1e7a3c" stroke-width="1.3"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g></g>
  <g class="coin" transform="translate(496.1,77.5)" fill="#fff"><g stroke="#fff" stroke-width="4.5"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g><g stroke="#1e7a3c" stroke-width="1.3"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g></g>
  <g class="coin" transform="translate(411.3,145.5)" fill="#fff"><g stroke="#fff" stroke-width="4.5"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g><g stroke="#1e7a3c" stroke-width="1.3"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g></g>
  <g class="coin" transform="translate(147.3,145.5)" fill="#fff"><g stroke="#fff" stroke-width="4.5"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g><g stroke="#1e7a3c" stroke-width="1.3"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g></g>
</svg>
