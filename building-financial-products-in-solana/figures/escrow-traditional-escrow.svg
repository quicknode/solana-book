<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 212" font-family="'Denim INK', Helvetica, Arial, sans-serif" fill="#111">
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="16" y="24" font-size="15" font-weight="bold">The middleman takes a slice</text>
  <defs>
    <marker id="escrow-traditional-escrow-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1e7a3c"/></marker>
    <marker id="escrow-traditional-escrow-arrg" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#777"/></marker>
  </defs>
  <!-- Alice: wallet account -->
  <rect x="36" y="88" width="112" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(44,91.5)"><g transform="translate(0.36,0.767) scale(0.8301)" fill="#111"><path d="M10.561 8.073a6 6 0 0 1 3.432 5.142a.75.75 0 1 1-1.498.07a4.5 4.5 0 0 0-8.99 0a.75.75 0 0 1-1.498-.07a6 6 0 0 1 3.431-5.142a3.999 3.999 0 1 1 5.123 0M10.5 5a2.5 2.5 0 1 0-5 0a2.5 2.5 0 0 0 5 0"/></g></g>
  <text x="64" y="102.175" font-size="10.5" font-weight="bold">Alice (maker)</text>
  <line x1="44" y1="109" x2="140" y2="109" stroke="#888" stroke-width="0.8"/>
  <text x="44" y="120" font-size="9.5" fill="#444">1 SOL</text>
  <!-- Bob: wallet account -->
  <rect x="492" y="88" width="112" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(500,91.5)"><g transform="translate(0.36,0.767) scale(0.8301)" fill="#111"><path d="M10.561 8.073a6 6 0 0 1 3.432 5.142a.75.75 0 1 1-1.498.07a4.5 4.5 0 0 0-8.99 0a.75.75 0 0 1-1.498-.07a6 6 0 0 1 3.431-5.142a3.999 3.999 0 1 1 5.123 0M10.5 5a2.5 2.5 0 1 0-5 0a2.5 2.5 0 0 0 5 0"/></g></g>
  <text x="520" y="102.175" font-size="10.5" font-weight="bold">Bob (taker)</text>
  <line x1="500" y1="109" x2="596" y2="109" stroke="#888" stroke-width="0.8"/>
  <text x="500" y="120" font-size="9.5" fill="#444">1 SOL</text>
  <!-- the third party: a company, not an account; square corners say so -->
  <rect x="240" y="70" width="160" height="76" fill="none" stroke="#111" stroke-width="2"/>
  <text x="320" y="102" font-size="12" font-weight="bold" text-anchor="middle">trusted third party</text>
  <text x="320" y="120" font-size="9.5" font-style="italic" fill="#444" text-anchor="middle">holds both sides in escrow</text>
  <!-- USDC lane (top) -->
  <path d="M 152,100 L 236,100" fill="none" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#escrow-traditional-escrow-arr)"/>
  <text x="170.53" y="86.87" font-size="10.5" font-weight="bold" fill="#1e7a3c">250 USDC</text>
  <path d="M 404,100 L 488,100" fill="none" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#escrow-traditional-escrow-arr)"/>
  <text x="445.93" y="86.87" font-size="10.5" font-weight="bold" fill="#1e7a3c" text-anchor="middle">250 USDC &#8722; fee</text>
  <!-- TSLAx lane (bottom) -->
  <path d="M 488,116 L 404,116" fill="none" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#escrow-traditional-escrow-arr)"/>
  <text x="425.79" y="136.6" font-size="10.5" font-weight="bold" fill="#1e7a3c">1 TSLAx</text>
  <path d="M 236,116 L 152,116" fill="none" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#escrow-traditional-escrow-arr)"/>
  <text x="161.75" y="136.6" font-size="10.5" font-weight="bold" fill="#1e7a3c">1 TSLAx &#8722; fee</text>
  <!-- the slice it keeps -->
  <path d="M 320,150 L 320,178" fill="none" stroke="#777" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#escrow-traditional-escrow-arrg)"/>
  <text x="320" y="198" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">keeps 1&#8211;6% of the transaction for itself</text>
  <g class="coin" transform="translate(194,100)" fill="#fff"><g stroke="#fff" stroke-width="4.5"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g><g stroke="#1e7a3c" stroke-width="1.3"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g></g>
  <g class="coin" transform="translate(446,100)" fill="#fff"><g stroke="#fff" stroke-width="4.5"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g><g stroke="#1e7a3c" stroke-width="1.3"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g></g>
  <g class="coin" transform="translate(446,116)" fill="#fff"><g stroke="#fff" stroke-width="4.5"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g><g stroke="#1e7a3c" stroke-width="1.3"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g></g>
  <g class="coin" transform="translate(194,116)" fill="#fff"><g stroke="#fff" stroke-width="4.5"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g><g stroke="#1e7a3c" stroke-width="1.3"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g></g>
</svg>
