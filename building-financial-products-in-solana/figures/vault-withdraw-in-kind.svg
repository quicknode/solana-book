<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Georgia, serif" fill="#111">
  <defs><marker id="vault-withdraw-in-kind-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <!-- burn first: the share mint is a PDA mint -->
  <circle cx="300" cy="30" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="288" y="34" font-size="11" font-weight="bold" text-anchor="end">share mint</text>
  <path d="M 566,120 C 520,54 420,32 314,30" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#vault-withdraw-in-kind-arr)"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="430" y="26" font-size="11" font-weight="bold" text-anchor="middle">1. burn her 900 shares</text>
  <!-- the strategy's vaults, as token-account rectangles -->
  <rect x="20" y="66" width="120" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="30" y="84" font-size="10" font-weight="bold">USDC vault</text>
  <text x="30" y="99" font-size="9" fill="#444">200 USDC</text>
  <rect x="20" y="140" width="120" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="30" y="158" font-size="10" font-weight="bold">TSLAx vault</text>
  <text x="30" y="173" font-size="9" fill="#444">2 TSLAx</text>
  <rect x="20" y="214" width="120" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="30" y="232" font-size="10" font-weight="bold">NVDAx vault</text>
  <text x="30" y="247" font-size="9" fill="#444">3 NVDAx</text>
  <!-- proportional slices out -->
  <path d="M 142,86 L 448,86" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#vault-withdraw-in-kind-arr)"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="295" y="78" font-size="10.5" font-weight="bold" text-anchor="middle">2. her USDC slice</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="295" y="101" font-size="10" font-style="italic" fill="#444" text-anchor="middle">min_usdc_out floor</text>
  <path d="M 142,160 L 448,160" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#vault-withdraw-in-kind-arr)"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="295" y="152" font-size="10.5" font-weight="bold" text-anchor="middle">&#8776;1.5 TSLAx</text>
  <path d="M 142,234 L 448,234" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#vault-withdraw-in-kind-arr)"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="295" y="226" font-size="10.5" font-weight="bold" text-anchor="middle">&#8776;2.8 NVDAx</text>
  <!-- Alice's token accounts, as rectangles -->
  <rect x="450" y="66" width="120" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="460" y="84" font-size="10" font-weight="bold">Alice&#8217;s USDC</text>
  <text x="460" y="99" font-size="9" fill="#444">+ her slice</text>
  <rect x="450" y="140" width="120" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="460" y="158" font-size="10" font-weight="bold">Alice&#8217;s TSLAx</text>
  <text x="460" y="173" font-size="9" fill="#444">+ 1.5 TSLAx</text>
  <rect x="450" y="214" width="120" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="460" y="232" font-size="10" font-weight="bold">Alice&#8217;s NVDAx</text>
  <text x="460" y="247" font-size="9" fill="#444">+ 2.8 NVDAx</text>
  <!-- Alice -->
  <circle cx="600" cy="150" r="15" fill="none" stroke="#111" stroke-width="1.5"/>
  <path d="M 577,190 Q 600,169 623,190" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="600" y="210" font-size="12" font-weight="bold" text-anchor="middle">Alice</text>
  <line x1="572" y1="120" x2="572" y2="230" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="586" y="122" font-size="8.5" fill="#777" font-style="italic">owner</text>
  <!-- rules -->
  <text x="320" y="286" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">each amount floored; each destination verified as hers and of the right mint</text>
  <text x="320" y="302" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">shares burn before any token moves (checks-effects-interactions)</text>
</svg>
