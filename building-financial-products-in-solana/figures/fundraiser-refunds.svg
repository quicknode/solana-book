<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" font-family="Georgia, serif" fill="#111">
  <defs><marker id="fund-ref-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <text x="320" y="26" font-size="12" font-weight="bold" text-anchor="middle">day 7, only 3,600 raised: refunds open, each contributor pulls their own</text>
  <!-- vault -->
  <rect x="240" y="50" width="160" height="80" fill="#f4f4f2" stroke="#111" stroke-width="2"/>
  <text x="320" y="74" font-size="10.5" font-weight="bold" text-anchor="middle">vault: the fundraiser&#8217;s USDC</text>
  <text x="320" y="92" font-size="10.5" text-anchor="middle">3,600 USDC</text>
  <text x="320" y="108" font-size="9.5" fill="#444" font-style="italic" text-anchor="middle">drains receipt by receipt</text>
  <!-- Alice refund: back into her own token account -->
  <path d="M 236,86 C 200,88 170,96 146,106" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#fund-ref-arr)"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="182" y="84" font-size="11" font-weight="bold" text-anchor="middle">900</text>
  <rect x="20" y="110" width="128" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="84" y="128" font-size="11" font-weight="bold" text-anchor="middle">Alice&#8217;s USDC</text>
  <text x="84" y="145" font-size="10" fill="#444" text-anchor="middle">1,000 USDC</text>
  <line x1="84" y1="156" x2="84" y2="186" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="23" y="190" width="122" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="38" cy="207" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M 30,218 Q 38,211 46,218" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="53" y="207" font-size="10.5" font-weight="bold">Alice (backer)</text>
  <text x="53" y="223" font-size="9.5" fill="#444">0.1 SOL</text>
  <text x="84" y="265" font-size="9.5" fill="#444" text-anchor="middle">exactly her recorded amount</text>
  <!-- Bob refund -->
  <path d="M 320,134 L 320,156" stroke="#111" stroke-width="1.8" marker-end="url(#fund-ref-arr)"/>
  <text x="332" y="150" font-size="11" font-weight="bold">900</text>
  <rect x="256" y="160" width="128" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="320" y="178" font-size="11" font-weight="bold" text-anchor="middle">Bob&#8217;s USDC</text>
  <text x="320" y="195" font-size="10" fill="#444" text-anchor="middle">1,000 USDC</text>
  <line x1="320" y1="208" x2="320" y2="234" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="259" y="238" width="122" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="274" cy="255" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M 266,266 Q 274,259 282,266" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="289" y="255" font-size="10.5" font-weight="bold">Bob (backer)</text>
  <text x="289" y="271" font-size="9.5" fill="#444">0.1 SOL</text>
  <!-- Carol refund -->
  <path d="M 404,86 C 436,90 462,96 488,106" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#fund-ref-arr)"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="440" y="104" font-size="11" font-weight="bold" text-anchor="middle">900</text>
  <rect x="492" y="110" width="128" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="556" y="128" font-size="11" font-weight="bold" text-anchor="middle">Carol&#8217;s USDC</text>
  <text x="556" y="145" font-size="10" fill="#444" text-anchor="middle">1,000 USDC</text>
  <line x1="556" y1="156" x2="556" y2="186" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="495" y="190" width="122" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="510" cy="207" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M 502,218 Q 510,211 518,218" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="525" y="207" font-size="10.5" font-weight="bold">Carol (backer)</text>
  <text x="525" y="223" font-size="9.5" fill="#444">0.1 SOL</text>
  <text x="556" y="265" font-size="9.5" fill="#444" text-anchor="middle">receipt closes as it pays</text>
  <!-- order note -->
  <rect x="440" y="44" width="186" height="44" fill="#fff" stroke="#888" stroke-width="1"/>
  <text x="533" y="60" font-size="9.5" fill="#444" text-anchor="middle">zero the receipt, decrement the</text>
  <text x="533" y="73" font-size="9.5" fill="#444" text-anchor="middle">counter, then transfer: effects</text>
  <text x="533" y="85" font-size="9.5" fill="#444" text-anchor="middle">before interactions</text>
</svg>
