      <line x1="11" y1="6.5" x2="11" y2="11"/>
      <line x1="1.5" y1="12.5" x2="12.5" y2="12.5"/>
    </g>
    <text x="526" y="52" font-size="10.5" font-weight="bold">USDC mint</text>
  </g>
  <!-- Alice: asleep, but paid and refunded -->
  <g>
    <circle cx="140" cy="39" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <text stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" x="140" y="53" font-size="7.5" letter-spacing="0.8" fill="#555" text-anchor="middle">PUBLIC KEY</text>
    <rect x="16" y="60" width="140" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <g transform="translate(24,67)">
