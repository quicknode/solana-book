  <g opacity="0.3">
    <circle cx="24" cy="144" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="34" y="139" font-size="7" letter-spacing="0.3" fill="#555">SEEDS: ATA PROGRAM +</text>
    <text x="34" y="148" font-size="7" letter-spacing="0.3" fill="#555">ALICE&#8217;S ADDRESS +</text>
    <text x="34" y="157" font-size="7" letter-spacing="0.3" fill="#555">USDC MINT</text>
    <rect x="16" y="162" width="140" height="26" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <g transform="translate(24,168)">
