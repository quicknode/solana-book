    <circle cx="208" cy="224" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="218" y="219" font-size="7" letter-spacing="0.3" fill="#555">SEEDS: ATA PROGRAM +</text>
    <text x="218" y="228" font-size="7" letter-spacing="0.3" fill="#555">BOB&#8217;S ADDRESS +</text>
    <text x="218" y="237" font-size="7" letter-spacing="0.3" fill="#555">TSLAX MINT</text>
