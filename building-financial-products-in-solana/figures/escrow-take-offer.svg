    <text x="227" y="78" font-size="10.5" font-weight="bold">Bob (taker)</text>
    <text x="227" y="94" font-size="9.5" fill="#444">1 SOL</text>
  </g>
  <!-- Bob's USDC receives the vault's balance -->
  <g>
    <circle cx="208" cy="144" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="218" y="139" font-size="7" letter-spacing="0.3" fill="#555">SEEDS: ATA PROGRAM +</text>
    <text x="218" y="148" font-size="7" letter-spacing="0.3" fill="#555">BOB&#8217;S ADDRESS +</text>
    <text x="218" y="157" font-size="7" letter-spacing="0.3" fill="#555">USDC MINT</text>
