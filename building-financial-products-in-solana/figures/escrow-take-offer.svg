<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 458" font-family="Georgia, serif" fill="#111">
  <!-- Bob takes the offer: TSLAx to Alice, USDC to Bob, everything closes -->
  <defs>
    <marker id="escrow-take-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1e7a3c"/></marker>
    <marker id="escrow-take-arrg" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#777"/></marker>
  </defs>
  <!-- the curve on top: every on-curve address dot sits on it, everything hangs below -->
  <path d="M 0,36 Q 400,36 640,116" fill="none" stroke="#111" stroke-width="3.5"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="628" y="24" font-size="13" font-weight="bold" text-anchor="end">Solana Devnet</text>
  <!-- TSLAx mint, untouched -->
  <g opacity="0.3">
    <circle cx="68" cy="37" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <text stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" x="68" y="51" font-size="7.5" letter-spacing="0.8" fill="#555" text-anchor="middle">PUBLIC KEY</text>
    <rect x="16" y="2" width="104" height="28" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <g transform="translate(24,6)" stroke="#111" stroke-width="1.2" fill="none">
      <path d="M 1,5 L 7,1 L 13,5 Z"/>
      <line x1="3" y1="6.5" x2="3" y2="11"/>
      <line x1="7" y1="6.5" x2="7" y2="11"/>
      <line x1="11" y1="6.5" x2="11" y2="11"/>
      <line x1="1.5" y1="12.5" x2="12.5" y2="12.5"/>
    </g>
    <text x="42" y="20" font-size="10.5" font-weight="bold">TSLAx mint</text>
  </g>
  <!-- USDC mint, untouched -->
  <g opacity="0.3">
    <circle cx="552" cy="91" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <text stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" x="552" y="76" font-size="7.5" letter-spacing="0.8" fill="#555" text-anchor="middle">PUBLIC KEY</text>
    <rect x="500" y="34" width="104" height="28" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <g transform="translate(508,38)" stroke="#111" stroke-width="1.2" fill="none">
