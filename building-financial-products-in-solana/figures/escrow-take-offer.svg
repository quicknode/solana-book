      <line x1="1" y1="5.4" x2="13" y2="5.4"/>
      <line x1="5.5" y1="5.4" x2="5.5" y2="12"/>
    </g>
    <text x="492" y="233" font-size="10.5" font-weight="bold">offer account</text>
    <text x="474" y="247" font-size="9.5">maker: Alice</text>
    <text x="474" y="259" font-size="9.5">token_mint_a: USDC</text>
    <text x="474" y="271" font-size="9.5">token_mint_b: TSLAx</text>
    <text x="474" y="283" font-size="8.5">token_b_wanted_amount: 100,000,000</text>
    <text x="474" y="295" font-size="9.5">bump: 254</text>
    <line x1="464" y1="216" x2="632" y2="300" stroke="#999" stroke-width="1.6"/>
    <line x1="632" y1="216" x2="464" y2="300" stroke="#999" stroke-width="1.6"/>
  </g>
  <!-- vault: drained to Bob, then closed -->
  <g>
    <circle cx="472" cy="326" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="484" y="322" font-size="7.5" letter-spacing="0.4" fill="#555">SEEDS: ATA PROGRAM + OFFER&#8217;S</text>
    <text x="484" y="331" font-size="7.5" letter-spacing="0.4" fill="#555">ADDRESS + USDC MINT ADDRESS</text>
    <rect x="464" y="338" width="168" height="54" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <g transform="translate(474,343)">
      <path d="M 2.6,7.8 Q 0.6,7.4 0.9,5.6 Q 1.1,4.4 2.3,4.9" fill="none" stroke="#111" stroke-width="1"/><ellipse cx="8" cy="7" rx="5.4" ry="4.4" fill="none" stroke="#111" stroke-width="1.2"/>
      <ellipse cx="12.9" cy="6.4" rx="1.8" ry="1.5" fill="#fff" stroke="#111" stroke-width="1"/><circle cx="12.35" cy="6.4" r="0.35" fill="#111"/><circle cx="13.45" cy="6.4" r="0.35" fill="#111"/>
      <line x1="5.2" y1="11.4" x2="5.2" y2="13" stroke="#111" stroke-width="1.2"/>
      <line x1="10.6" y1="11.4" x2="10.6" y2="13" stroke="#111" stroke-width="1.2"/>
      <line x1="6.8" y1="4.4" x2="9.2" y2="4.4" stroke="#111" stroke-width="1"/>
    </g>
    <text x="492" y="355" font-size="10.5" font-weight="bold">vault: the offer&#8217;s USDC</text>
    <text x="474" y="371" font-size="9.5" fill="#444">250 USDC</text>
    <text x="474" y="384" font-size="9" fill="#444" font-style="italic">authority: the offer account</text>
    <line x1="464" y1="338" x2="632" y2="392" stroke="#999" stroke-width="1.6"/>
    <line x1="632" y1="338" x2="464" y2="392" stroke="#999" stroke-width="1.6"/>
  </g>
  <!-- 1: Bob's TSLAx goes straight to Alice's TSLAx -->
  <path d="M 268,284 C 240,324 116,324 88,286" fill="none" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#escrow-take-arr)"/>
  <g transform="translate(178,312)">
    <circle cx="4" cy="2" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <circle cx="-3" cy="0" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <text x="-3" y="3" font-size="8" font-weight="bold" fill="#1e7a3c" text-anchor="middle">$</text>
  </g>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="178" y="340" font-size="10.5" font-weight="bold" fill="#1e7a3c" text-anchor="middle">1. take_offer() &#183; 1 TSLAx</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="178" y="353" font-size="9" font-style="italic" fill="#444" text-anchor="middle">(100,000,000 minor units; Bob signs)</text>
  <!-- 2: the vault drains to Bob's USDC -->
  <path d="M 464,354 C 420,322 386,236 344,198" fill="none" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#escrow-take-arr)"/>
  <g transform="translate(404,278)">
    <circle cx="4" cy="2" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <circle cx="-3" cy="0" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <text x="-3" y="3" font-size="8" font-weight="bold" fill="#1e7a3c" text-anchor="middle">$</text>
  </g>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="408" y="312" font-size="10.5" font-weight="bold" fill="#1e7a3c" text-anchor="end">2. 250 USDC</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="408" y="325" font-size="9" font-style="italic" fill="#444" text-anchor="end">(offer PDA signs)</text>
  <!-- 3: both program-created accounts close; rent returns to Alice -->
  <text x="548" y="408" font-size="9" font-weight="bold" text-anchor="middle">3. vault and offer account closed</text>
  <path d="M 464,284 C 400,416 120,442 22,368 C 4,318 4,190 24,110" fill="none" stroke="#777" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#escrow-take-arrg)"/>
  <path d="M 464,380 C 380,444 140,458 24,384 C 2,318 2,180 34,110" fill="none" stroke="#777" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#escrow-take-arrg)"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="256" y="422" font-size="8.5" font-style="italic" fill="#444" text-anchor="middle">rent refunds to Alice</text>
</svg>
