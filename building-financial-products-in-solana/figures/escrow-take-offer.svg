<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="Georgia, serif" fill="#111">
  <!-- Bob takes the offer: TSLAx to Alice, USDC to Bob, everything closes -->
  <defs>
    <marker id="escrow-take-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1e7a3c"/></marker>
    <marker id="escrow-take-arrg" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#777"/></marker>
  </defs>
  <!-- the curve on top: every on-curve address dot sits on it, everything hangs below -->
  <path d="M 40,40 Q 320,130 600,40" fill="none" stroke="#111" stroke-width="3.5"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="320" y="62" font-size="13" font-weight="bold" text-anchor="middle">Solana Devnet</text>
  <!-- USDC mint, untouched -->
  <g opacity="0.3">
    <circle cx="60" cy="46" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <text stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" x="60" y="62" font-size="7.5" letter-spacing="0.8" fill="#555" text-anchor="middle">PUBLIC KEY</text>
    <rect x="6" y="6" width="104" height="28" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <g transform="translate(14,10)" stroke="#111" stroke-width="1.2" fill="none">
      <path d="M 1,5 L 7,1 L 13,5 Z"/>
      <line x1="3" y1="6.5" x2="3" y2="11"/>
      <line x1="7" y1="6.5" x2="7" y2="11"/>
      <line x1="11" y1="6.5" x2="11" y2="11"/>
      <line x1="1.5" y1="12.5" x2="12.5" y2="12.5"/>
    </g>
    <text x="32" y="24" font-size="10.5" font-weight="bold">USDC mint</text>
  </g>
  <!-- TSLAx mint, untouched -->
  <g opacity="0.3">
    <circle cx="580" cy="46" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <text stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" x="580" y="62" font-size="7.5" letter-spacing="0.8" fill="#555" text-anchor="middle">PUBLIC KEY</text>
    <rect x="500" y="6" width="104" height="28" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <g transform="translate(508,10)" stroke="#111" stroke-width="1.2" fill="none">
      <path d="M 1,5 L 7,1 L 13,5 Z"/>
      <line x1="3" y1="6.5" x2="3" y2="11"/>
      <line x1="7" y1="6.5" x2="7" y2="11"/>
      <line x1="11" y1="6.5" x2="11" y2="11"/>
      <line x1="1.5" y1="12.5" x2="12.5" y2="12.5"/>
    </g>
    <text x="526" y="24" font-size="10.5" font-weight="bold">TSLAx mint</text>
  </g>
  <!-- Alice: asleep, but paid and refunded -->
  <g>
    <circle cx="140" cy="66" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <text stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" x="140" y="54" font-size="7.5" letter-spacing="0.8" fill="#555" text-anchor="middle">PUBLIC KEY</text>
    <rect x="16" y="72" width="140" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <g transform="translate(24,79)">
      <circle cx="7" cy="4" r="3.1" fill="none" stroke="#111" stroke-width="1.3"/>
      <path d="M 1.5,13 Q 1.5,8.4 7,8.4 Q 12.5,8.4 12.5,13" fill="none" stroke="#111" stroke-width="1.3"/>
    </g>
    <text x="43" y="90" font-size="10.5" font-weight="bold">Alice (maker)</text>
    <text x="43" y="106" font-size="9.5" fill="#444">1 SOL</text>
  </g>
  <g opacity="0.3">
    <circle cx="24" cy="152" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="34" y="147" font-size="7" letter-spacing="0.3" fill="#555">SEEDS: ATA PROGRAM +</text>
    <text x="34" y="156" font-size="7" letter-spacing="0.3" fill="#555">ALICE&#8217;S ADDRESS +</text>
    <text x="34" y="165" font-size="7" letter-spacing="0.3" fill="#555">USDC MINT</text>
    <rect x="16" y="170" width="140" height="26" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <g transform="translate(24,176)">
      <path d="M 2.6,7.8 Q 0.6,7.4 0.9,5.6 Q 1.1,4.4 2.3,4.9" fill="none" stroke="#111" stroke-width="1"/><ellipse cx="8" cy="7" rx="5.4" ry="4.4" fill="none" stroke="#111" stroke-width="1.2"/>
      <ellipse cx="12.9" cy="6.4" rx="1.8" ry="1.5" fill="#fff" stroke="#111" stroke-width="1"/><circle cx="12.35" cy="6.4" r="0.35" fill="#111"/><circle cx="13.45" cy="6.4" r="0.35" fill="#111"/>
      <line x1="5.2" y1="11.4" x2="5.2" y2="13" stroke="#111" stroke-width="1.2"/>
      <line x1="10.6" y1="11.4" x2="10.6" y2="13" stroke="#111" stroke-width="1.2"/>
      <line x1="6.8" y1="4.4" x2="9.2" y2="4.4" stroke="#111" stroke-width="1"/>
    </g>
    <text x="42" y="187" font-size="10.5" font-weight="bold">Alice&#8217;s USDC</text>
  </g>
  <!-- Alice's TSLAx receives Bob's payment -->
  <g>
    <circle cx="24" cy="232" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="34" y="227" font-size="7" letter-spacing="0.3" fill="#555">SEEDS: ATA PROGRAM +</text>
    <text x="34" y="236" font-size="7" letter-spacing="0.3" fill="#555">ALICE&#8217;S ADDRESS +</text>
    <text x="34" y="245" font-size="7" letter-spacing="0.3" fill="#555">TSLAX MINT</text>
    <rect x="16" y="250" width="140" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <g transform="translate(24,255)">
      <path d="M 2.6,7.8 Q 0.6,7.4 0.9,5.6 Q 1.1,4.4 2.3,4.9" fill="none" stroke="#111" stroke-width="1"/><ellipse cx="8" cy="7" rx="5.4" ry="4.4" fill="none" stroke="#111" stroke-width="1.2"/>
      <ellipse cx="12.9" cy="6.4" rx="1.8" ry="1.5" fill="#fff" stroke="#111" stroke-width="1"/><circle cx="12.35" cy="6.4" r="0.35" fill="#111"/><circle cx="13.45" cy="6.4" r="0.35" fill="#111"/>
      <line x1="5.2" y1="11.4" x2="5.2" y2="13" stroke="#111" stroke-width="1.2"/>
      <line x1="10.6" y1="11.4" x2="10.6" y2="13" stroke="#111" stroke-width="1.2"/>
      <line x1="6.8" y1="4.4" x2="9.2" y2="4.4" stroke="#111" stroke-width="1"/>
    </g>
    <text x="42" y="267" font-size="10.5" font-weight="bold">Alice&#8217;s TSLAx</text>
    <text x="26" y="283" font-size="9" fill="#444">1 TSLAx</text>
  </g>
  <!-- Bob signs the take -->
  <g>
    <circle cx="300" cy="85" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <text stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" x="300" y="73" font-size="7.5" letter-spacing="0.8" fill="#555" text-anchor="middle">PUBLIC KEY</text>
    <rect x="200" y="91" width="140" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <g transform="translate(208,98)">
      <circle cx="7" cy="4" r="3.1" fill="none" stroke="#111" stroke-width="1.3"/>
      <path d="M 1.5,13 Q 1.5,8.4 7,8.4 Q 12.5,8.4 12.5,13" fill="none" stroke="#111" stroke-width="1.3"/>
    </g>
    <text x="227" y="109" font-size="10.5" font-weight="bold">Bob (taker)</text>
    <text x="227" y="125" font-size="9.5" fill="#444">1 SOL</text>
  </g>
  <!-- Bob's USDC receives the vault's balance -->
  <g>
    <circle cx="208" cy="152" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="218" y="147" font-size="7" letter-spacing="0.3" fill="#555">SEEDS: ATA PROGRAM +</text>
    <text x="218" y="156" font-size="7" letter-spacing="0.3" fill="#555">BOB&#8217;S ADDRESS +</text>
    <text x="218" y="165" font-size="7" letter-spacing="0.3" fill="#555">USDC MINT</text>
    <rect x="200" y="170" width="140" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <g transform="translate(208,175)">
      <path d="M 2.6,7.8 Q 0.6,7.4 0.9,5.6 Q 1.1,4.4 2.3,4.9" fill="none" stroke="#111" stroke-width="1"/><ellipse cx="8" cy="7" rx="5.4" ry="4.4" fill="none" stroke="#111" stroke-width="1.2"/>
      <ellipse cx="12.9" cy="6.4" rx="1.8" ry="1.5" fill="#fff" stroke="#111" stroke-width="1"/><circle cx="12.35" cy="6.4" r="0.35" fill="#111"/><circle cx="13.45" cy="6.4" r="0.35" fill="#111"/>
      <line x1="5.2" y1="11.4" x2="5.2" y2="13" stroke="#111" stroke-width="1.2"/>
      <line x1="10.6" y1="11.4" x2="10.6" y2="13" stroke="#111" stroke-width="1.2"/>
      <line x1="6.8" y1="4.4" x2="9.2" y2="4.4" stroke="#111" stroke-width="1"/>
    </g>
    <text x="226" y="187" font-size="10.5" font-weight="bold">Bob&#8217;s USDC</text>
    <text x="210" y="203" font-size="9" fill="#444">1,250 USDC</text>
  </g>
  <!-- Bob's TSLAx pays Alice directly -->
  <g>
    <circle cx="208" cy="232" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="218" y="227" font-size="7" letter-spacing="0.3" fill="#555">SEEDS: ATA PROGRAM +</text>
    <text x="218" y="236" font-size="7" letter-spacing="0.3" fill="#555">BOB&#8217;S ADDRESS +</text>
    <text x="218" y="245" font-size="7" letter-spacing="0.3" fill="#555">TSLAX MINT</text>
    <rect x="200" y="250" width="140" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <g transform="translate(208,255)">
      <path d="M 2.6,7.8 Q 0.6,7.4 0.9,5.6 Q 1.1,4.4 2.3,4.9" fill="none" stroke="#111" stroke-width="1"/><ellipse cx="8" cy="7" rx="5.4" ry="4.4" fill="none" stroke="#111" stroke-width="1.2"/>
      <ellipse cx="12.9" cy="6.4" rx="1.8" ry="1.5" fill="#fff" stroke="#111" stroke-width="1"/><circle cx="12.35" cy="6.4" r="0.35" fill="#111"/><circle cx="13.45" cy="6.4" r="0.35" fill="#111"/>
      <line x1="5.2" y1="11.4" x2="5.2" y2="13" stroke="#111" stroke-width="1.2"/>
      <line x1="10.6" y1="11.4" x2="10.6" y2="13" stroke="#111" stroke-width="1.2"/>
      <line x1="6.8" y1="4.4" x2="9.2" y2="4.4" stroke="#111" stroke-width="1"/>
    </g>
    <text x="226" y="267" font-size="10.5" font-weight="bold">Bob&#8217;s TSLAx</text>
    <text x="210" y="283" font-size="9" fill="#444">0 TSLAx</text>
  </g>
  <!-- the escrow program: take_offer() is the step -->
  <g>
    <circle cx="482" cy="70" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <text stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" x="482" y="58" font-size="7.5" letter-spacing="0.8" fill="#555" text-anchor="middle">PUBLIC KEY</text>
    <rect x="464" y="76" width="168" height="58" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <g transform="translate(474,81)">
      <circle cx="7" cy="7" r="3.4" fill="none" stroke="#111" stroke-width="1.3"/>
      <circle cx="7" cy="7" r="1.2" fill="none" stroke="#111" stroke-width="1"/>
      <g stroke="#111" stroke-width="1.3">
        <line x1="7" y1="1" x2="7" y2="3"/><line x1="7" y1="11" x2="7" y2="13"/>
        <line x1="1" y1="7" x2="3" y2="7"/><line x1="11" y1="7" x2="13" y2="7"/>
        <line x1="2.8" y1="2.8" x2="4.2" y2="4.2"/><line x1="9.8" y1="9.8" x2="11.2" y2="11.2"/>
        <line x1="11.2" y1="2.8" x2="9.8" y2="4.2"/><line x1="2.8" y1="11.2" x2="4.2" y2="9.8"/>
      </g>
    </g>
    <text x="492" y="92" font-size="10.5" font-weight="bold">escrow program</text>
    <text x="474" y="106" font-size="8.5" font-family="Menlo, monospace" fill="#888">make_offer()</text>
    <text x="474" y="116" font-size="8.5" font-family="Menlo, monospace" font-weight="bold" fill="#1e7a3c">take_offer()</text>
    <text x="474" y="126" font-size="8.5" font-family="Menlo, monospace" fill="#888">cancel_offer()</text>
  </g>
  <!-- offer account PDA, closing -->
  <g>
    <circle cx="472" cy="160" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="484" y="156" font-size="7.5" letter-spacing="0.4" fill="#555">SEEDS: &#8220;OFFER&#8221; + MAKER&#8217;S</text>
    <text x="484" y="165" font-size="7.5" letter-spacing="0.4" fill="#555">ADDRESS + ID</text>
    <rect x="464" y="172" width="168" height="84" rx="6" fill="#f4f4f2" stroke="#888"/>
    <g transform="translate(474,177)" stroke="#111" stroke-width="1.2" fill="none">
      <rect x="1" y="2" width="12" height="10"/>
      <line x1="1" y1="5.4" x2="13" y2="5.4"/>
      <line x1="7" y1="5.4" x2="7" y2="12"/>
    </g>
    <text x="492" y="189" font-size="10.5" font-weight="bold">offer account</text>
    <text x="474" y="203" font-size="9.5">maker: Alice</text>
    <text x="474" y="215" font-size="9.5">token_mint_a: USDC</text>
    <text x="474" y="227" font-size="9.5">token_mint_b: TSLAx</text>
    <text x="474" y="239" font-size="8.5">token_b_wanted_amount: 100,000,000</text>
    <text x="474" y="251" font-size="9.5">bump: 254</text>
    <line x1="464" y1="172" x2="632" y2="256" stroke="#999" stroke-width="1.6"/>
    <line x1="632" y1="172" x2="464" y2="256" stroke="#999" stroke-width="1.6"/>
  </g>
  <!-- vault: drained to Bob, then closed -->
  <g>
    <circle cx="472" cy="282" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="484" y="278" font-size="7.5" letter-spacing="0.4" fill="#555">SEEDS: ATA PROGRAM + OFFER&#8217;S</text>
    <text x="484" y="287" font-size="7.5" letter-spacing="0.4" fill="#555">ADDRESS + USDC MINT ADDRESS</text>
    <rect x="464" y="294" width="168" height="54" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <g transform="translate(474,299)">
      <path d="M 2.6,7.8 Q 0.6,7.4 0.9,5.6 Q 1.1,4.4 2.3,4.9" fill="none" stroke="#111" stroke-width="1"/><ellipse cx="8" cy="7" rx="5.4" ry="4.4" fill="none" stroke="#111" stroke-width="1.2"/>
      <ellipse cx="12.9" cy="6.4" rx="1.8" ry="1.5" fill="#fff" stroke="#111" stroke-width="1"/><circle cx="12.35" cy="6.4" r="0.35" fill="#111"/><circle cx="13.45" cy="6.4" r="0.35" fill="#111"/>
      <line x1="5.2" y1="11.4" x2="5.2" y2="13" stroke="#111" stroke-width="1.2"/>
      <line x1="10.6" y1="11.4" x2="10.6" y2="13" stroke="#111" stroke-width="1.2"/>
      <line x1="6.8" y1="4.4" x2="9.2" y2="4.4" stroke="#111" stroke-width="1"/>
    </g>
    <text x="492" y="311" font-size="10.5" font-weight="bold">vault: the offer&#8217;s USDC</text>
    <text x="474" y="327" font-size="9.5" fill="#444">250 USDC</text>
    <text x="474" y="340" font-size="9" fill="#444" font-style="italic">authority: the offer account</text>
    <line x1="464" y1="294" x2="632" y2="348" stroke="#999" stroke-width="1.6"/>
    <line x1="632" y1="294" x2="464" y2="348" stroke="#999" stroke-width="1.6"/>
  </g>
  <!-- 1: Bob's TSLAx goes straight to Alice's TSLAx -->
  <path d="M 268,292 C 240,332 116,332 88,294" fill="none" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#escrow-take-arr)"/>
  <g transform="translate(178,322)">
    <circle cx="4" cy="2" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <circle cx="-3" cy="0" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <text x="-3" y="3" font-size="8" font-weight="bold" fill="#1e7a3c" text-anchor="middle">$</text>
  </g>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="178" y="348" font-size="10.5" font-weight="bold" fill="#1e7a3c" text-anchor="middle">1. take_offer() &#183; 1 TSLAx</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="178" y="361" font-size="9" font-style="italic" fill="#444" text-anchor="middle">(100,000,000 minor units; Bob signs)</text>
  <!-- 2: the vault drains to Bob's USDC -->
  <path d="M 464,310 C 420,282 386,240 344,206" fill="none" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#escrow-take-arr)"/>
  <g transform="translate(408,262)">
    <circle cx="4" cy="2" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <circle cx="-3" cy="0" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <text x="-3" y="3" font-size="8" font-weight="bold" fill="#1e7a3c" text-anchor="middle">$</text>
  </g>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="378" y="232" font-size="10.5" font-weight="bold" fill="#1e7a3c" text-anchor="middle">2. 250 USDC</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="378" y="245" font-size="9" font-style="italic" fill="#444" text-anchor="middle">(offer PDA signs)</text>
  <!-- 3: both program-created accounts close; rent returns to Alice -->
  <text x="548" y="368" font-size="9" font-weight="bold" text-anchor="middle">3. vault and offer account closed</text>
  <path d="M 464,240 C 400,380 120,410 22,340 C 4,290 4,180 24,116" fill="none" stroke="#777" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#escrow-take-arrg)"/>
  <path d="M 464,336 C 380,410 140,428 24,354 C 2,290 6,180 36,118" fill="none" stroke="#777" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#escrow-take-arrg)"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="88" y="134" font-size="8.5" font-style="italic" fill="#444" text-anchor="middle">rent refunds to Alice</text>
</svg>
