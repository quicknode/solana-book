      <ellipse cx="12.9" cy="6.4" rx="1.8" ry="1.5" fill="#fff" stroke="#111" stroke-width="1"/><circle cx="12.35" cy="6.4" r="0.35" fill="#111"/><circle cx="13.45" cy="6.4" r="0.35" fill="#111"/>
      <line x1="5.2" y1="11.4" x2="5.2" y2="13" stroke="#111" stroke-width="1.2"/>
      <line x1="10.6" y1="11.4" x2="10.6" y2="13" stroke="#111" stroke-width="1.2"/>
      <line x1="6.8" y1="4.4" x2="9.2" y2="4.4" stroke="#111" stroke-width="1"/>
    </g>
    <text x="226" y="259" font-size="10.5" font-weight="bold">Bob&#8217;s TSLAx</text>
    <text x="210" y="275" font-size="9" fill="#444">0 TSLAx</text>
  </g>
  <!-- the escrow program: take_offer() is the step -->
  <g>
    <circle cx="472" cy="73" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <text stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" x="472" y="87" font-size="7.5" letter-spacing="0.8" fill="#555" text-anchor="middle">PUBLIC KEY</text>
    <rect x="464" y="120" width="168" height="58" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <g transform="translate(474,125)">
      <circle cx="7" cy="7" r="3.4" fill="none" stroke="#111" stroke-width="1.3"/>
      <circle cx="7" cy="7" r="1.2" fill="none" stroke="#111" stroke-width="1"/>
      <g stroke="#111" stroke-width="1.3">
        <line x1="7" y1="1" x2="7" y2="3"/><line x1="7" y1="11" x2="7" y2="13"/>
        <line x1="1" y1="7" x2="3" y2="7"/><line x1="11" y1="7" x2="13" y2="7"/>
        <line x1="2.8" y1="2.8" x2="4.2" y2="4.2"/><line x1="9.8" y1="9.8" x2="11.2" y2="11.2"/>
        <line x1="11.2" y1="2.8" x2="9.8" y2="4.2"/><line x1="2.8" y1="11.2" x2="4.2" y2="9.8"/>
      </g>
    </g>
    <text x="492" y="136" font-size="10.5" font-weight="bold">escrow program</text>
    <text x="474" y="150" font-size="8.5" font-family="Menlo, monospace" fill="#888">make_offer()</text>
    <text x="474" y="160" font-size="8.5" font-family="Menlo, monospace" font-weight="bold" fill="#1e7a3c">take_offer()</text>
    <text x="474" y="170" font-size="8.5" font-family="Menlo, monospace" fill="#888">cancel_offer()</text>
  </g>
  <!-- offer account PDA, closing -->
  <g>
    <circle cx="472" cy="204" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="484" y="200" font-size="7.5" letter-spacing="0.4" fill="#555">SEEDS: &#8220;OFFER&#8221; + MAKER&#8217;S</text>
    <text x="484" y="209" font-size="7.5" letter-spacing="0.4" fill="#555">ADDRESS + ID</text>
    <rect x="464" y="216" width="168" height="84" rx="6" fill="#f4f4f2" stroke="#888"/>
    <g transform="translate(474,221)" stroke="#111" stroke-width="1.2" fill="none">
