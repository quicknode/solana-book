<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" font-family="Georgia, serif" fill="#111">
  <defs>
    <marker id="escrow-take-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker>
    <marker id="escrow-take-arrg" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#777"/></marker>
  </defs>
  <!-- offer account PDA, closing -->
  <g>
    <circle cx="58" cy="14" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="70" y="17" font-size="8.5" letter-spacing="0.6" fill="#555">SEEDS: &#8220;OFFER&#8221; + MAKER&#8217;S ADDRESS + ID</text>
    <rect x="50" y="24" width="210" height="100" rx="6" fill="#f4f4f2" stroke="#888"/>
    <text x="60" y="41" font-size="10.5" font-weight="bold">offer account</text>
    <text x="60" y="56" font-size="9.5">maker: Alice</text>
    <text x="60" y="69" font-size="9.5">token_mint_a: USDC</text>
    <text x="60" y="82" font-size="9.5">token_mint_b: TSLAx</text>
    <text x="60" y="95" font-size="9.5">token_b_wanted_amount: 100,000,000</text>
    <text x="60" y="108" font-size="9.5">bump: 254</text>
    <line x1="50" y1="24" x2="260" y2="124" stroke="#999" stroke-width="1.6"/>
    <line x1="260" y1="24" x2="50" y2="124" stroke="#999" stroke-width="1.6"/>
    <text x="60" y="140" font-size="9" font-weight="bold">3. vault and offer account closed</text>
  </g>
  <!-- the escrow program -->
  <g>
    <circle cx="478" cy="8" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="490" y="11" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
    <rect x="470" y="16" width="160" height="66" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <text x="480" y="32" font-size="10.5" font-weight="bold">escrow program</text>
    <text x="480" y="46" font-size="8.5" font-family="Menlo, monospace" fill="#888">make_offer</text>
    <text x="480" y="57" font-size="8.5" font-family="Menlo, monospace" font-weight="bold">take_offer</text>
    <text x="480" y="68" font-size="8.5" font-family="Menlo, monospace" fill="#888">cancel_offer</text>
  </g>
  <!-- vault: drained to Bob, then closed -->
  <g>
    <circle cx="452" cy="140" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="464" y="137" font-size="8.5" letter-spacing="0.6" fill="#555">SEEDS: ATA PROGRAM + OFFER&#8217;S</text>
    <text x="464" y="148" font-size="8.5" letter-spacing="0.6" fill="#555">ADDRESS + USDC MINT ADDRESS</text>
    <rect x="460" y="152" width="150" height="58" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <text x="470" y="176" font-size="10" font-weight="bold">vault: the offer&#8217;s USDC</text>
    <text x="470" y="189" font-size="9.5" fill="#444">250 USDC</text>
    <text x="470" y="201" font-size="9" fill="#444" font-style="italic">authority: the offer account</text>
    <line x1="460" y1="152" x2="610" y2="210" stroke="#999" stroke-width="1.6"/>
    <line x1="610" y1="152" x2="460" y2="210" stroke="#999" stroke-width="1.6"/>
  </g>
  <!-- 1: Bob's TSLAx goes straight to Alice -->
  <path d="M 498,246 C 440,192 330,192 258,246" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#escrow-take-arr)"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="383" y="178" font-size="10.5" font-weight="bold" text-anchor="middle">1. take_offer &#183; 1 TSLAx</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="383" y="191" font-size="9" font-style="italic" fill="#444" text-anchor="middle">(100,000,000 minor units; Bob signs)</text>
  <g transform="translate(383,206)">
    <circle cx="4" cy="2" r="6" fill="#fff" stroke="#111" stroke-width="1.3"/>
    <circle cx="-3" cy="0" r="6" fill="#fff" stroke="#111" stroke-width="1.3"/>
    <text x="-3" y="3" font-size="8" font-weight="bold" text-anchor="middle">$</text>
  </g>
  <!-- 2: the vault drains to Bob -->
  <path d="M 500,212 C 480,228 455,240 428,248" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#escrow-take-arr)"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="555" y="228" font-size="10.5" font-weight="bold" text-anchor="middle">2. 250 USDC</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="555" y="241" font-size="9" font-style="italic" fill="#444" text-anchor="middle">(offer PDA signs)</text>
  <g transform="translate(452,239)">
    <circle cx="4" cy="2" r="6" fill="#fff" stroke="#111" stroke-width="1.3"/>
    <circle cx="-3" cy="0" r="6" fill="#fff" stroke="#111" stroke-width="1.3"/>
    <text x="-3" y="3" font-size="8" font-weight="bold" text-anchor="middle">$</text>
  </g>
  <!-- rent from both closed accounts returns to Alice -->
  <path d="M 55,128 C 35,240 45,340 88,408" fill="none" stroke="#777" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#escrow-take-arrg)"/>
  <path d="M 458,158 C 300,118 90,130 30,220 C 8,300 20,360 76,406" fill="none" stroke="#777" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#escrow-take-arrg)"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="100" y="230" font-size="8.5" font-style="italic" fill="#444" text-anchor="middle">rent refunds to Alice</text>
  <!-- token accounts -->
  <g opacity="0.3">
    <rect x="40" y="250" width="130" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <text x="50" y="267" font-size="10.5" font-weight="bold">Alice&#8217;s USDC</text>
    <text x="50" y="282" font-size="9.5" fill="#444">750 USDC</text>
    <circle cx="46" cy="302" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="56" y="299" font-size="7.5" letter-spacing="0.4" fill="#555">SEEDS: ATA PROGRAM +</text>
    <text x="56" y="308" font-size="7.5" letter-spacing="0.4" fill="#555">ALICE&#8217;S ADDRESS +</text>
    <text x="56" y="317" font-size="7.5" letter-spacing="0.4" fill="#555">USDC MINT</text>
  </g>
  <g>
    <rect x="190" y="250" width="130" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <text x="200" y="267" font-size="10.5" font-weight="bold">Alice&#8217;s TSLAx</text>
    <text x="200" y="282" font-size="9.5" fill="#444">1 TSLAx</text>
    <circle cx="196" cy="302" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="206" y="299" font-size="7.5" letter-spacing="0.4" fill="#555">SEEDS: ATA PROGRAM +</text>
    <text x="206" y="308" font-size="7.5" letter-spacing="0.4" fill="#555">ALICE&#8217;S ADDRESS +</text>
    <text x="206" y="317" font-size="7.5" letter-spacing="0.4" fill="#555">TSLAX MINT</text>
  </g>
  <g>
    <rect x="340" y="250" width="130" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <text x="350" y="267" font-size="10.5" font-weight="bold">Bob&#8217;s USDC</text>
    <text x="350" y="282" font-size="9.5" fill="#444">1,250 USDC</text>
    <circle cx="346" cy="302" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="356" y="299" font-size="7.5" letter-spacing="0.4" fill="#555">SEEDS: ATA PROGRAM +</text>
    <text x="356" y="308" font-size="7.5" letter-spacing="0.4" fill="#555">BOB&#8217;S ADDRESS +</text>
    <text x="356" y="317" font-size="7.5" letter-spacing="0.4" fill="#555">USDC MINT</text>
  </g>
  <g>
    <rect x="490" y="250" width="130" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <text x="500" y="267" font-size="10.5" font-weight="bold">Bob&#8217;s TSLAx</text>
    <text x="500" y="282" font-size="9.5" fill="#444">0 TSLAx</text>
    <circle cx="496" cy="302" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="506" y="299" font-size="7.5" letter-spacing="0.4" fill="#555">SEEDS: ATA PROGRAM +</text>
    <text x="506" y="308" font-size="7.5" letter-spacing="0.4" fill="#555">BOB&#8217;S ADDRESS +</text>
    <text x="506" y="317" font-size="7.5" letter-spacing="0.4" fill="#555">TSLAX MINT</text>
  </g>
  <!-- the curve -->
  <path d="M 40,420 Q 320,330 600,420" fill="none" stroke="#111" stroke-width="2"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="320" y="478" font-size="13" font-weight="bold" text-anchor="middle">Solana Devnet</text>
  <!-- wallets on the curve -->
  <g>
    <circle cx="96" cy="404" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="84" y="402" font-size="9" letter-spacing="1" fill="#555" text-anchor="end">PUBLIC KEY</text>
    <rect x="44" y="414" width="112" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <circle cx="59" cy="431" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
    <path d="M 51,442 Q 59,435 67,442" fill="none" stroke="#111" stroke-width="1.3"/>
    <text x="74" y="431" font-size="10.5" font-weight="bold">Alice (maker)</text>
    <text x="74" y="447" font-size="9.5" fill="#444">1 SOL</text>
  </g>
  <g>
    <circle cx="230" cy="380" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="242" y="378" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
    <rect x="178" y="390" width="112" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <circle cx="193" cy="407" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
    <path d="M 185,418 Q 193,411 201,418" fill="none" stroke="#111" stroke-width="1.3"/>
    <text x="208" y="407" font-size="10.5" font-weight="bold">Bob (taker)</text>
    <text x="208" y="423" font-size="9.5" fill="#444">1 SOL</text>
  </g>
  <!-- mints on the curve -->
  <g opacity="0.3">
    <circle cx="360" cy="376" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="372" y="372" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
    <rect x="310" y="386" width="100" height="34" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <text x="320" y="407" font-size="10.5" font-weight="bold">USDC mint</text>
  </g>
  <g opacity="0.3">
    <circle cx="480" cy="390" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="492" y="386" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
    <rect x="430" y="400" width="100" height="34" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <text x="440" y="421" font-size="10.5" font-weight="bold">TSLAx mint</text>
  </g>
  <!-- the program's address dot sits on the curve too -->
  <line x1="625" y1="82" x2="598" y2="412" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.3"/>
  <circle cx="598" cy="418" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
</svg>
