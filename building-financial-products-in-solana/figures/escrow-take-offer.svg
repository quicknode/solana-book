    <text x="26" y="275" font-size="9" fill="#444">1 TSLAx</text>
  </g>
  <!-- Bob signs the take -->
  <g>
    <circle cx="300" cy="49" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <text stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" x="300" y="37" font-size="7.5" letter-spacing="0.8" fill="#555" text-anchor="middle">PUBLIC KEY</text>
