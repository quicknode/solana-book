<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Georgia, serif" fill="#111">
  <defs><marker id="order-book-cancel-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <!-- the curve -->
  <path d="M 40,350 Q 320,300 600,350" fill="none" stroke="#111" stroke-width="2"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="588" y="384" font-size="12" font-weight="bold" text-anchor="end">Solana Devnet</text>
  <!-- Bob: wallet account, address on the curve -->
  <circle cx="85" cy="343" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="97" y="340" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <rect x="93" y="355" width="112" height="42" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="108" cy="372" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M 100,383 Q 108,376 116,383" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="122" y="372" font-size="10.5" font-weight="bold">Bob</text>
  <text x="122" y="387" font-size="9.5" fill="#444">1 SOL</text>
  <!-- the call -->
  <path d="M 85,334 C 100,240 150,140 192,90" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#order-book-cancel-arr)"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="130" y="190" font-size="11" font-weight="bold" text-anchor="end">cancel_order</text>
  <!-- the leaf, removed: Bob's order account -->
  <circle cx="196" cy="36" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="208" y="32" font-size="8.5" letter-spacing="0.6" fill="#555">&#8220;ORDER&#8221; + MARKET ADDRESS</text>
  <text x="208" y="43" font-size="8.5" letter-spacing="0.6" fill="#555">+ ORDER ID</text>
  <rect x="190" y="50" width="200" height="62" fill="none" stroke="#999" stroke-width="1.3"/>
  <line x1="190" y1="50" x2="390" y2="112" stroke="#999" stroke-width="1.6"/>
  <line x1="390" y1="50" x2="190" y2="112" stroke="#999" stroke-width="1.6"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="290" y="76" font-size="11.5" font-weight="bold" fill="#444" text-anchor="middle">bid leaf: 1 @ 250</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="290" y="98" font-size="10" fill="#444" text-anchor="middle">removed from the bid tree</text>
  <text x="290" y="130" font-size="10" font-style="italic" fill="#444" text-anchor="middle">order account &#8594; Cancelled</text>
  <text x="290" y="144" font-size="10" font-style="italic" fill="#444" text-anchor="middle">ID leaves Bob&#8217;s open-order list</text>
  <!-- the refund -->
  <rect x="430" y="50" width="185" height="50" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="440" y="68" font-size="10.5" font-weight="bold">quote vault</text>
  <text x="440" y="86" font-size="9.5" fill="#444">1 &#215; 250 = 250 USDC still locked</text>
  <line x1="605" y1="102" x2="562" y2="336" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="560" cy="343" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="548" y="339" font-size="9" letter-spacing="1" fill="#555" text-anchor="end">PUBLIC KEY</text>
  <path d="M 560,104 L 560,178" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#order-book-cancel-arr)"/>
  <text x="552" y="140" font-size="10" font-style="italic" fill="#444" text-anchor="end">credited on cancel</text>
  <circle cx="418" cy="168" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="430" y="164" font-size="8.5" letter-spacing="0.6" fill="#555">&#8220;MARKET_USER&#8221; + MARKET</text>
  <text x="430" y="175" font-size="8.5" letter-spacing="0.6" fill="#555">&amp; BOB ADDRESSES</text>
  <rect x="420" y="182" width="150" height="48" rx="6" fill="#f4f4f2" stroke="#888"/>
  <text x="430" y="200" font-size="10.5" font-weight="bold">Bob&#8217;s market user</text>
  <text x="430" y="216" font-size="9.5">unsettled_quote: +250 USDC</text>
  <text x="320" y="262" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">the tokens stay in the vault; the claim moves to Bob&#8217;s ledger line</text>
</svg>
