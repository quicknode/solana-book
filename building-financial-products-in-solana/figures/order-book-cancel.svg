<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="Georgia, serif" fill="#111">
  <defs><marker id="order-book-cancel-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <!-- Bob -->
  <circle cx="70" cy="90" r="16" fill="none" stroke="#111" stroke-width="1.5"/>
  <path d="M 45,132 Q 70,110 95,132" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="70" y="152" font-size="12" font-weight="bold" text-anchor="middle">Bob</text>
  <path d="M 103,92 L 184,91" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#order-book-cancel-arr)"/>
  <text x="143" y="77" font-size="11" font-weight="bold" text-anchor="middle">cancel_order</text>
  <!-- the leaf, removed -->
  <rect x="190" y="60" width="200" height="62" rx="5" fill="none" stroke="#999" stroke-width="1.3"/>
  <line x1="190" y1="60" x2="390" y2="122" stroke="#999" stroke-width="1.6"/>
  <line x1="390" y1="60" x2="190" y2="122" stroke="#999" stroke-width="1.6"/>
  <text x="290" y="142" font-size="10" font-style="italic" fill="#444" text-anchor="middle">order account &#8594; Cancelled</text>
  <text x="290" y="156" font-size="10" font-style="italic" fill="#444" text-anchor="middle">id leaves Bob&#8217;s open-order list</text>
  <!-- the refund -->
  <rect x="430" y="55" width="185" height="50" rx="5" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="522" y="74" font-size="11" font-weight="bold" text-anchor="middle">still locked in quote vault</text>
  <text x="522" y="91" font-size="11" text-anchor="middle">1 &#215; 250 = 250 USDC</text>
  <path d="M 522,107 L 522,166" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#order-book-cancel-arr)"/>
  <text x="514" y="140" font-size="10" font-style="italic" fill="#444" text-anchor="end">credited on cancel</text>
  <rect x="430" y="172" width="185" height="48" rx="5" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="522" y="191" font-size="11" font-weight="bold" text-anchor="middle">Bob&#8217;s unsettled_quote</text>
  <text x="522" y="208" font-size="11" text-anchor="middle">+250 USDC</text>
  <text x="320" y="252" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">the tokens stay in the vault; the claim moves to Bob&#8217;s ledger line</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="290" y="82" font-size="11.5" font-weight="bold" fill="#444" text-anchor="middle">bid leaf: 1 @ 250</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="290" y="112" font-size="10.5" fill="#444" text-anchor="middle">removed from the bid tree</text>
</svg>
