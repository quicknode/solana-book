<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="Georgia, serif" fill="#111">
  <defs><marker id="propamm-band-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <!-- the band -->
  <rect x="115" y="80" width="335" height="90" fill="#f4f4f2"/>
  <!-- ask line -->
  <line x1="115" y1="80" x2="450" y2="80" stroke="#111" stroke-width="2.2"/>
  <text x="105" y="84" font-size="11" font-weight="bold" text-anchor="end">ask $165.165</text>
  <!-- oracle line -->
  <line x1="115" y1="125" x2="450" y2="125" stroke="#111" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="105" y="129" font-size="10.5" text-anchor="end">oracle $165.00</text>
  <!-- bid line -->
  <line x1="115" y1="170" x2="450" y2="170" stroke="#111" stroke-width="2.2"/>
  <text x="105" y="174" font-size="11" font-weight="bold" text-anchor="end">bid $164.835</text>
  <!-- spread annotations inside band -->
  <text x="282" y="102" font-size="9.5" fill="#444" text-anchor="middle">+10 bps, rounded up</text>
  <text x="282" y="158" font-size="9.5" fill="#444" text-anchor="middle">&#8722;10 bps, rounded down</text>
  <text x="282" y="130" font-size="9" fill="#888" text-anchor="middle" stroke="#f4f4f2" stroke-width="4" paint-order="stroke" stroke-linejoin="round">the band is Maria's revenue</text>
  <!-- buyer arrow -->
  <path d="M 490,40 L 490,74" stroke="#111" stroke-width="1.6" marker-end="url(#propamm-band-arr)"/>
  <g transform="translate(490,55)">
    <circle cx="4" cy="2" r="6" fill="#fff" stroke="#111" stroke-width="1.3"/>
    <circle cx="-3" cy="0" r="6" fill="#fff" stroke="#111" stroke-width="1.3"/>
    <text x="-3" y="3" font-size="8" font-weight="bold" text-anchor="middle">$</text>
  </g>
  <text x="490" y="30" font-size="10.5" font-weight="bold" text-anchor="middle">buyers pay the ask</text>
  <text x="533" y="60" font-size="9.5" font-weight="bold">825.825 USDC</text>
  <text x="533" y="73" font-size="9.5" font-weight="bold">&#8594; 5 NVDAx</text>
  <!-- seller arrow -->
  <path d="M 490,210 L 490,176" stroke="#111" stroke-width="1.6" marker-end="url(#propamm-band-arr)"/>
  <g transform="translate(490,193)">
    <circle cx="4" cy="2" r="6" fill="#fff" stroke="#111" stroke-width="1.3"/>
    <circle cx="-3" cy="0" r="6" fill="#fff" stroke="#111" stroke-width="1.3"/>
    <text x="-3" y="3" font-size="8" font-weight="bold" text-anchor="middle">$</text>
  </g>
  <text x="490" y="228" font-size="10.5" font-weight="bold" text-anchor="middle">sellers receive the bid</text>
  <text x="533" y="190" font-size="9.5" font-weight="bold">5 NVDAx &#8594;</text>
  <text x="533" y="203" font-size="9.5" font-weight="bold">824.175 USDC</text>
  <!-- round trip note -->
  <rect x="70" y="196" width="300" height="40" fill="#fff" stroke="#888" stroke-width="1"/>
  <text x="220" y="213" font-size="10" font-weight="bold" text-anchor="middle">round trip: 825.825 in, 824.175 back</text>
  <text x="220" y="228" font-size="9.5" fill="#444" text-anchor="middle">the 1.65 USDC difference is the whole fee</text>
</svg>
