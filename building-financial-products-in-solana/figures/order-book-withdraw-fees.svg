<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Georgia, serif" fill="#111">
  <defs>
    <marker id="order-book-withdraw-fees-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker>
    <marker id="order-book-withdraw-fees-arr-gray" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#999"/></marker>
  </defs>
  <!-- the curve -->
  <path d="M 40,350 Q 320,300 600,350" fill="none" stroke="#111" stroke-width="2"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="110" y="380" font-size="12" font-weight="bold" text-anchor="middle">Solana Devnet</text>
  <!-- the fee vault: a plain token account, keypair address on the curve -->
  <rect x="40" y="74" width="140" height="46" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="50" y="92" font-size="10.5" font-weight="bold">fee vault</text>
  <text x="50" y="109" font-size="9.5" fill="#444">1.875 USDC so far</text>
  <line x1="52" y1="120" x2="59" y2="341" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="60" cy="347" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="72" y="344" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <!-- the money, through the gate -->
  <path d="M 184,97 L 246,97" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#order-book-withdraw-fees-arr)"/>
  <text x="215" y="86" font-size="11" font-weight="bold" text-anchor="middle">1.875 USDC</text>
  <rect x="250" y="69" width="160" height="56" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="330" y="89" font-size="11" font-weight="bold" text-anchor="middle">authority check</text>
  <text x="330" y="106" font-size="10" text-anchor="middle" font-family="Menlo, monospace">signer == authority</text>
  <path d="M 410,97 L 434,97" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#order-book-withdraw-fees-arr)"/>
  <!-- Maria's token account -->
  <circle cx="442" cy="52" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="454" y="48" font-size="8.5" letter-spacing="0.6" fill="#555">ATA PROGRAM + MARIA&#8217;S</text>
  <text x="454" y="59" font-size="8.5" letter-spacing="0.6" fill="#555">ADDRESS + USDC MINT ADDRESS</text>
  <rect x="438" y="66" width="130" height="46" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="448" y="84" font-size="10.5" font-weight="bold">Maria&#8217;s USDC</text>
  <text x="448" y="101" font-size="9.5" fill="#444">+1.875 USDC</text>
  <!-- Maria: wallet account, address on the curve -->
  <circle cx="488" cy="334" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="500" y="331" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <rect x="486" y="352" width="104" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="501" cy="369" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M 493,380 Q 501,373 509,380" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="515" y="368" font-size="10.5" font-weight="bold">Maria</text>
  <text x="515" y="384" font-size="9.5" fill="#444">1 SOL</text>
  <!-- the rejected path -->
  <path d="M 330,210 L 330,131" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#order-book-withdraw-fees-arr-gray)"/>
  <line x1="322" y1="162" x2="338" y2="178" stroke="#999" stroke-width="1.6"/>
  <line x1="338" y1="162" x2="322" y2="178" stroke="#999" stroke-width="1.6"/>
  <text x="330" y="230" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">anyone else &#8594; NotMarketAuthority</text>
  <text x="150" y="210" font-size="10" font-style="italic" fill="#444" text-anchor="middle">empty vault: succeeds as a no-op,</text>
  <text x="150" y="224" font-size="10" font-style="italic" fill="#444" text-anchor="middle">so Maria can run it on a schedule</text>
</svg>
