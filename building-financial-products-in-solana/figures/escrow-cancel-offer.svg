    <text x="474" y="368" font-size="9" fill="#444" font-style="italic">authority: the offer account</text>
    <line x1="464" y1="322" x2="632" y2="376" stroke="#999" stroke-width="1.6"/>
    <line x1="632" y1="322" x2="464" y2="376" stroke="#999" stroke-width="1.6"/>
  </g>
  <!-- the vault drains back to Alice's USDC -->
  <path d="M 464,344 C 360,372 220,352 158,220" fill="none" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#escrow-cancel-arr)"/>
  <g transform="translate(292,340)">
