    <text x="34" y="239" font-size="7" letter-spacing="0.3" fill="#555">SEEDS: ATA PROGRAM +</text>
    <text x="34" y="248" font-size="7" letter-spacing="0.3" fill="#555">ALICE&#8217;S ADDRESS +</text>
