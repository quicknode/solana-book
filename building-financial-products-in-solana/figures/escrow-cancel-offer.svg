    <marker id="escrow-cancel-arrg" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#777"/></marker>
  </defs>
  <!-- the curve on top: every on-curve address dot sits on it, everything hangs below -->
