    <text x="484" y="306" font-size="7.5" letter-spacing="0.4" fill="#555">SEEDS: ATA PROGRAM + OFFER&#8217;S</text>
    <text x="484" y="315" font-size="7.5" letter-spacing="0.4" fill="#555">ADDRESS + USDC MINT ADDRESS</text>
