    <circle cx="-3" cy="0" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <text x="-3" y="3" font-size="8" font-weight="bold" fill="#1e7a3c" text-anchor="middle">$</text>
  </g>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="310" y="320" font-size="10.5" font-weight="bold" fill="#1e7a3c" text-anchor="middle">cancel_offer() &#183; 250 USDC</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="310" y="333" font-size="9" font-style="italic" fill="#444" text-anchor="middle">(250,000,000 minor units; offer PDA signs)</text>
