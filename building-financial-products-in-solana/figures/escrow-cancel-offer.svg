<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="Georgia, serif" fill="#111">
  <defs>
    <marker id="escrow-cancel-offer-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker>
    <marker id="escrow-cancel-offer-arrg" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#777"/></marker>
  </defs>
  <!-- Alice -->
  <circle cx="70" cy="110" r="16" fill="none" stroke="#111" stroke-width="1.5"/>
  <path d="M 45,152 Q 70,130 95,152" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="70" y="172" font-size="12" font-weight="bold" text-anchor="middle">Alice</text>
  <text x="70" y="186" font-size="10" font-style="italic" fill="#444" text-anchor="middle">(maker, signs)</text>
  <!-- her token account -->
  <circle cx="200" cy="100" r="8" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="200" y="74" font-size="11" font-weight="bold" text-anchor="middle">Alice&#8217;s USDC account</text>
  <line x1="86" y1="103" x2="190" y2="101" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- the vault, draining back -->
  <circle cx="470" cy="100" r="9" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="470" y="74" font-size="11" font-weight="bold" text-anchor="middle">vault</text>
  <path d="M 459,100 L 211,100" fill="none" stroke="#111" stroke-width="2" marker-end="url(#escrow-cancel-offer-arr)"/>
  <text x="335" y="88" font-size="12" font-weight="bold" text-anchor="middle">250 USDC</text>
  <text x="335" y="120" font-size="10" font-style="italic" fill="#444" text-anchor="middle">(250,000,000 minor units, offer PDA signs)</text>
  <!-- offer account, closing -->
  <rect x="405" y="160" width="130" height="32" rx="5" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <line x1="456" y1="86" x2="484" y2="114" stroke="#999" stroke-width="1.6"/>
  <line x1="484" y1="86" x2="456" y2="114" stroke="#999" stroke-width="1.6"/>
  <line x1="405" y1="160" x2="535" y2="192" stroke="#999" stroke-width="1.6"/>
  <line x1="535" y1="160" x2="405" y2="192" stroke="#999" stroke-width="1.6"/>
  <text x="470" y="216" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">vault and offer closed</text>
  <!-- rent home to Alice -->
  <path d="M 458,110 C 380,155 250,155 100,136" fill="none" stroke="#777" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#escrow-cancel-offer-arrg)"/>
  <path d="M 403,176 C 300,200 180,190 98,158" fill="none" stroke="#777" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#escrow-cancel-offer-arrg)"/>
  <text x="250" y="232" font-size="10" font-style="italic" fill="#444" text-anchor="middle">rent lamports return to Alice</text>
  <text stroke="#f4f4f2" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="470" y="180" font-size="11" text-anchor="middle">offer account</text>
</svg>
