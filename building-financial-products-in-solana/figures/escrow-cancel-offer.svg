  <path d="M 464,268 C 400,416 130,442 22,370 C 4,320 4,208 24,148" fill="none" stroke="#777" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#escrow-cancel-arrg)"/>
  <path d="M 464,364 C 380,440 140,456 24,384 C 2,320 6,208 36,150" fill="none" stroke="#777" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#escrow-cancel-arrg)"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="256" y="446" font-size="8.5" font-style="italic" fill="#444" text-anchor="middle">rent refunds to Alice</text>
