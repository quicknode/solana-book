<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Georgia, serif" fill="#111">
  <defs>
    <marker id="escrow-cancel-offer-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker>
    <marker id="escrow-cancel-offer-arrg" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#777"/></marker>
  </defs>
  <!-- the curve -->
  <path d="M 40,330 Q 320,240 600,330" fill="none" stroke="#111" stroke-width="2"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="320" y="366" font-size="13" font-weight="bold" text-anchor="middle">Solana Devnet</text>
  <!-- Alice: wallet account, address on the curve -->
  <circle cx="96" cy="314" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="108" y="312" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <rect x="104" y="326" width="112" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="119" cy="343" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M 111,354 Q 119,347 127,354" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="134" y="343" font-size="10.5" font-weight="bold">Alice (maker)</text>
  <text x="134" y="359" font-size="9.5" fill="#444">0.1 SOL</text>
  <!-- Alice's USDC token account -->
  <circle cx="56" cy="50" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="68" y="46" font-size="8.5" letter-spacing="0.6" fill="#555">ATA PROGRAM + ALICE&#8217;S</text>
  <text x="68" y="57" font-size="8.5" letter-spacing="0.6" fill="#555">ADDRESS + USDC MINT ADDRESS</text>
  <rect x="64" y="64" width="120" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="74" y="82" font-size="10.5" font-weight="bold">Alice&#8217;s USDC</text>
  <text x="74" y="98" font-size="9.5" fill="#444">750 USDC</text>
  <!-- the vault, draining back and closing -->
  <circle cx="432" cy="50" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="444" y="46" font-size="8.5" letter-spacing="0.6" fill="#555">ATA PROGRAM + OFFER&#8217;S ADDRESS</text>
  <text x="444" y="57" font-size="8.5" letter-spacing="0.6" fill="#555">+ USDC MINT ADDRESS</text>
  <rect x="440" y="64" width="146" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <line x1="440" y1="64" x2="586" y2="108" stroke="#999" stroke-width="1.6"/>
  <line x1="586" y1="64" x2="440" y2="108" stroke="#999" stroke-width="1.6"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="448" y="82" font-size="10" font-weight="bold">vault: the offer&#8217;s USDC</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="448" y="98" font-size="9.5" fill="#444">250 USDC</text>
  <path d="M 436,86 L 188,86" fill="none" stroke="#111" stroke-width="2" marker-end="url(#escrow-cancel-offer-arr)"/>
  <text x="312" y="78" font-size="12" font-weight="bold" text-anchor="middle">250 USDC</text>
  <text x="312" y="126" font-size="10" font-style="italic" fill="#444" text-anchor="middle">(250,000,000 minor units, offer PDA signs)</text>
  <!-- offer account, closing -->
  <circle cx="392" cy="162" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="404" y="165" font-size="8.5" letter-spacing="0.6" fill="#555">&#8220;OFFER&#8221; + MAKER&#8217;S ADDRESS + ID</text>
  <rect x="400" y="170" width="130" height="32" rx="5" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <line x1="400" y1="170" x2="530" y2="202" stroke="#999" stroke-width="1.6"/>
  <line x1="530" y1="170" x2="400" y2="202" stroke="#999" stroke-width="1.6"/>
  <text x="465" y="190" font-size="11" text-anchor="middle" stroke="#f4f4f2" stroke-width="5" paint-order="stroke" stroke-linejoin="round">offer account</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="465" y="226" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">vault and offer closed</text>
  <!-- rent home to Alice -->
  <path d="M 446,112 C 340,150 235,205 196,314" fill="none" stroke="#777" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#escrow-cancel-offer-arrg)"/>
  <path d="M 396,190 C 310,245 228,270 180,322" fill="none" stroke="#777" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#escrow-cancel-offer-arrg)"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="300" y="268" font-size="10" font-style="italic" fill="#444" text-anchor="middle">rent lamports return to Alice</text>
</svg>
