  <rect x="187.5" y="141.5" width="9" height="9" fill="#111" transform="rotate(45 192 146)"/>
  <text x="204" y="150" font-size="10.5">share mint</text>
  <path d="M 138,100 C 148,94 157,96 166,102" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#lending-deposit-shares-arr)"/>
  <text x="124" y="84" font-size="11" font-weight="bold" text-anchor="middle">1,000 USDC</text>
  <path d="M 168,148 C 154,152 145,146 138,136" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#lending-deposit-shares-arr)"/>
  <text x="148" y="192" font-size="11" text-anchor="middle">1,000 shares minted</text>
  <text x="155" y="218" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">the first deposit mints one to one</text>
  <!-- right panel: redeem -->
  <text x="480" y="28" font-size="12" font-weight="bold" text-anchor="middle">2. redeem, weeks later</text>
  <rect x="345" y="60" width="132" height="118" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="411" y="80" font-size="11" font-weight="bold" text-anchor="middle">USDC reserve</text>
  <circle cx="367" cy="104" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="379" y="108" font-size="10.5">liquidity vault</text>
  <rect x="362.5" y="141.5" width="9" height="9" fill="#111" transform="rotate(45 367 146)"/>
  <text x="379" y="150" font-size="10.5">share mint</text>
  <rect x="514" y="96" width="124" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="529" cy="113" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M 521,124 Q 529,117 537,124" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="544" y="113" font-size="10.5" font-weight="bold">Alice (supplier)</text>
  <text x="544" y="129" font-size="9.5" fill="#444">0.1 SOL</text>
  <path d="M 510,132 C 498,144 490,148 481,148" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#lending-deposit-shares-arr)"/>
  <text x="496" y="192" font-size="11" text-anchor="middle">1,000 shares burned</text>
  <path d="M 481,100 C 494,94 502,96 510,102" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#lending-deposit-shares-arr)"/>
  <text x="548" y="86" font-size="11" font-weight="bold" text-anchor="middle">&#8776; $1,003.50 USDC</text>
  <text x="480" y="212" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">interest swelled the pool while the share</text>
  <text x="480" y="226" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">supply stayed put: each share is worth more</text>
</svg>
