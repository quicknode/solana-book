<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" font-family="Georgia, serif" fill="#111">
  <defs><marker id="lending-deposit-shares-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <!-- panel divider -->
  <line x1="322" y1="24" x2="322" y2="222" stroke="#999" stroke-width="1" stroke-dasharray="2 4"/>
  <!-- left panel: deposit -->
  <text x="155" y="28" font-size="12" font-weight="bold" text-anchor="middle">1. deposit</text>
  <rect x="10" y="96" width="124" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="25" cy="113" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M 17,124 Q 25,117 33,124" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="40" y="113" font-size="10.5" font-weight="bold">Alice (supplier)</text>
  <text x="40" y="129" font-size="9.5" fill="#444">0.1 SOL</text>
  <rect x="170" y="60" width="132" height="118" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="236" y="80" font-size="11" font-weight="bold" text-anchor="middle">USDC reserve</text>
  <circle cx="192" cy="104" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
