<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Georgia, serif" fill="#111">
  <defs>
    <marker id="amm-first-deposit-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#111"/>
    </marker>
  </defs>
  <!-- the curve -->
  <path d="M 40,330 Q 320,280 600,330" fill="none" stroke="#111" stroke-width="2"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="595" y="320" font-size="12" font-weight="bold" text-anchor="end">Solana Devnet</text>
  <!-- Maria: wallet account, address on the curve -->
  <circle cx="70" cy="325" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="82" y="312" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <rect x="78" y="337" width="112" height="48" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="93" cy="355" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M 85,366 Q 93,359 101,366" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="108" y="355" font-size="10.5" font-weight="bold">Maria</text>
  <text x="108" y="371" font-size="9.5" fill="#444">1 SOL</text>
  <!-- deposits into the vaults -->
  <path d="M 150,362 C 185,240 235,115 294,60" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#amm-first-deposit-arr)"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="190" y="150" font-size="11" font-weight="bold" text-anchor="middle">400 ACME</text>
  <path d="M 162,362 C 200,270 245,180 294,132" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#amm-first-deposit-arr)"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="170" y="252" font-size="11" font-weight="bold" text-anchor="middle">900 USDC</text>
  <!-- the vaults: PDAs, dots off the curve -->
  <circle cx="292" cy="22" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="304" y="18" font-size="8.5" letter-spacing="0.6" fill="#555">ATA PROGRAM + POOL AUTHORITY</text>
  <text x="304" y="29" font-size="8.5" letter-spacing="0.6" fill="#555">+ ACME MINT ADDRESS</text>
  <rect x="300" y="36" width="150" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="308" y="54" font-size="10" font-weight="bold">pool_a: the pool&#8217;s ACME</text>
  <text x="308" y="71" font-size="9.5" fill="#444">400 ACME</text>
  <circle cx="292" cy="96" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="304" y="92" font-size="8.5" letter-spacing="0.6" fill="#555">ATA PROGRAM + POOL AUTHORITY</text>
  <text x="304" y="103" font-size="8.5" letter-spacing="0.6" fill="#555">+ USDC MINT ADDRESS</text>
  <rect x="300" y="110" width="150" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="308" y="128" font-size="10" font-weight="bold">pool_b: the pool&#8217;s USDC</text>
  <text x="308" y="145" font-size="9.5" fill="#444">900 USDC</text>
  <!-- the LP mint: a PDA, its dot off the curve -->
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="340" y="196" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">mints &#8730;(400 &#215; 900) = 600 LP tokens</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="330" y="213" font-size="11" font-weight="bold" text-anchor="middle">LP mint</text>
  <circle cx="330" cy="225" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <!-- the locked floor (drawn before the seed text so the halo stays readable) -->
  <path d="M 334,232 L 420,262" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#amm-first-deposit-arr)"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="378" y="256" font-size="10.5" font-weight="bold" text-anchor="middle">0.0001</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="342" y="221" font-size="8.5" letter-spacing="0.6" fill="#555">CONFIG&#8217;S ADDRESS + ACME &amp;</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="342" y="232" font-size="8.5" letter-spacing="0.6" fill="#555">USDC MINTS + &#8220;LIQUIDITY&#8221;</text>
  <rect x="424" y="246" width="196" height="48" rx="6" fill="#fff" stroke="#999" stroke-width="1.3"/>
  <text x="522" y="266" font-size="10" font-weight="bold" text-anchor="middle">MINIMUM_LIQUIDITY: 100 minor units</text>
  <text x="522" y="283" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">locked forever, minted to nobody</text>
  <!-- LP tokens to Maria's token account -->
  <path d="M 330,233 C 328,280 322,330 312,362" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#amm-first-deposit-arr)"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="338" y="322" font-size="11" font-weight="bold">599.9999 LP</text>
  <circle cx="198" cy="352" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="210" y="337" font-size="8.5" letter-spacing="0.6" fill="#555">ATA PROGRAM +</text>
  <text x="210" y="348" font-size="8.5" letter-spacing="0.6" fill="#555">MARIA&#8217;S ADDRESS</text>
  <text x="210" y="359" font-size="8.5" letter-spacing="0.6" fill="#555">+ LP MINT ADDRESS</text>
  <rect x="206" y="366" width="130" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="214" y="384" font-size="10.5" font-weight="bold">Maria&#8217;s LP tokens</text>
  <text x="214" y="401" font-size="9.5" fill="#444">599.9999 LP</text>
</svg>
