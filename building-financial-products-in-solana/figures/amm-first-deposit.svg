<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="Georgia, serif" fill="#111">
  <defs>
    <marker id="amm-first-deposit-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#111"/>
    </marker>
  </defs>
  <!-- Maria -->
  <circle cx="70" cy="96" r="16" fill="none" stroke="#111" stroke-width="1.5"/>
  <path d="M 45,138 Q 70,116 95,138" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="70" y="158" font-size="12" font-weight="bold" text-anchor="middle">Maria</text>
  <!-- deposits into the vaults -->
  <path d="M 102,86 C 170,68 230,62 296,60" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#amm-first-deposit-arr)"/>
  <text x="195" y="50" font-size="11" font-weight="bold" text-anchor="middle">400 ACME</text>
  <path d="M 102,106 C 170,116 230,124 296,128" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#amm-first-deposit-arr)"/>
  <text x="195" y="144" font-size="11" font-weight="bold" text-anchor="middle">900 USDC</text>
  <!-- the vaults -->
  <circle cx="310" cy="60" r="9" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="328" y="56" font-size="11" font-weight="bold">pool_a</text>
  <text x="328" y="70" font-size="10.5" fill="#444">ACME vault</text>
  <circle cx="310" cy="128" r="9" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="328" y="124" font-size="11" font-weight="bold">pool_b</text>
  <text x="328" y="138" font-size="10.5" fill="#444">USDC vault</text>
  <!-- the LP mint -->
  <text x="310" y="196" font-size="11" font-weight="bold" text-anchor="middle">LP mint</text>
  <rect x="303.5" y="208.5" width="13" height="13" fill="#111" transform="rotate(45 310 215)"/>
  <text x="310" y="248" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">mints &#8730;(400 &#215; 900) = 600 LP tokens</text>
  <!-- LP tokens to Maria -->
  <path d="M 298,218 C 210,215 140,185 92,150" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#amm-first-deposit-arr)"/>
  <!-- the locked floor -->
  <path d="M 322,212 L 430,206" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#amm-first-deposit-arr)"/>
  <text x="376" y="198" font-size="10.5" font-weight="bold" text-anchor="middle">0.0001</text>
  <rect x="436" y="180" width="194" height="56" rx="6" fill="none" stroke="#999" stroke-width="1.3"/>
  <text x="533" y="204" font-size="10" font-weight="bold" text-anchor="middle">MINIMUM_LIQUIDITY: 100 minor units</text>
  <text x="533" y="222" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">locked forever, minted to nobody</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="152" y="202" font-size="11" font-weight="bold" text-anchor="middle">600 LP tokens</text>
</svg>
