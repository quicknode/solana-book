  <line x1="248" y1="123" x2="392" y2="123" stroke="#888" stroke-width="0.8"/>
  <!-- Carol, first of the liquidity providers -->
  <rect x="28" y="96" width="112" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(36,99.5)"><g transform="translate(0.36,0.767) scale(0.8301)" fill="#111"><path d="M10.561 8.073a6 6 0 0 1 3.432 5.142a.75.75 0 1 1-1.498.07a4.5 4.5 0 0 0-8.99 0a.75.75 0 0 1-1.498-.07a6 6 0 0 1 3.431-5.142a3.999 3.999 0 1 1 5.123 0M10.5 5a2.5 2.5 0 1 0-5 0a2.5 2.5 0 0 0 5 0"/></g></g>
  <text x="56" y="110.175" font-size="10.5" font-weight="bold">Carol (LP)</text>
  <line x1="36" y1="117" x2="132" y2="117" stroke="#888" stroke-width="0.8"/>
  <text x="36" y="128" font-size="9.5" fill="#444">1 SOL</text>
  <path d="M 144,108 L 234,112" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#perps-cp-arr)"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="188.99" y="96.87" font-size="10.5" font-weight="bold" fill="#1e7a3c" text-anchor="middle">1,000 USDC in</text>
  <!-- Alice goes long against the pool -->
  <rect x="496" y="44" width="112" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(504,47.5)"><g transform="translate(0.36,0.767) scale(0.8301)" fill="#111"><path d="M10.561 8.073a6 6 0 0 1 3.432 5.142a.75.75 0 1 1-1.498.07a4.5 4.5 0 0 0-8.99 0a.75.75 0 0 1-1.498-.07a6 6 0 0 1 3.431-5.142a3.999 3.999 0 1 1 5.123 0M10.5 5a2.5 2.5 0 1 0-5 0a2.5 2.5 0 0 0 5 0"/></g></g>
  <text x="524" y="58.175" font-size="10.5" font-weight="bold">Alice (long)</text>
  <line x1="504" y1="65" x2="600" y2="65" stroke="#888" stroke-width="0.8"/>
  <text x="504" y="76" font-size="9.5" fill="#444">1 SOL</text>
  <path d="M 492,74 C 478,77.5 464,81.77 450.67,86.46 C 433.36,92.56 417.14,101.74 402,114" fill="none" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#perps-cp-arr)"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="447.17" y="74.58" font-size="10" font-weight="bold" fill="#1e7a3c" text-anchor="middle">1,000 USDC</text>
  <!-- Bob takes the mirror-image short, against the same pool -->
  <rect x="496" y="160" width="112" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(504,163.5)"><g transform="translate(0.36,0.767) scale(0.8301)" fill="#111"><path d="M10.561 8.073a6 6 0 0 1 3.432 5.142a.75.75 0 1 1-1.498.07a4.5 4.5 0 0 0-8.99 0a.75.75 0 0 1-1.498-.07a6 6 0 0 1 3.431-5.142a3.999 3.999 0 1 1 5.123 0M10.5 5a2.5 2.5 0 1 0-5 0a2.5 2.5 0 0 0 5 0"/></g></g>
  <text x="524" y="174.175" font-size="10.5" font-weight="bold">Bob (short)</text>
  <line x1="504" y1="181" x2="600" y2="181" stroke="#888" stroke-width="0.8"/>
  <text x="504" y="192" font-size="9.5" fill="#444">1 SOL</text>
  <path d="M 492,172 C 455,166 400,164 384,130" fill="none" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#perps-cp-arr)"/>
  <text text-anchor="end" stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="473.85" y="187.92" font-size="10" font-weight="bold" fill="#1e7a3c">1,000 USDC</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="452" y="124" font-size="9.5" fill="#444" font-style="italic" text-anchor="middle">collateral in,</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="452" y="137" font-size="9.5" fill="#444" font-style="italic" text-anchor="middle">payout out</text>
  <!-- what flows, and what does not exist -->
  <text x="320" y="226" font-size="10.5" fill="#444" text-anchor="middle">traders' losses and the heavier side's funding flow to the pool; wins and the lighter side's funding flow out</text>
  <g class="coin" transform="translate(189,110)" fill="#fff"><g stroke="#fff" stroke-width="4.5"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g><g stroke="#1e7a3c" stroke-width="1.3"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g></g>
  <g class="coin" transform="translate(447.17,87.71)" fill="#fff"><g stroke="#fff" stroke-width="4.5"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g><g stroke="#1e7a3c" stroke-width="1.3"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g></g>
  <g class="coin" transform="translate(447.74,167.86)" fill="#fff"><g stroke="#fff" stroke-width="4.5"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g><g stroke="#1e7a3c" stroke-width="1.3"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g></g>
