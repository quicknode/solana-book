<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="Georgia, serif" fill="#111">
  <defs><marker id="perps-cp-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1e7a3c"/></marker></defs>
  <!-- pool center -->
  <rect x="240" y="90" width="160" height="100" rx="6" fill="#f4f4f2" stroke="#111" stroke-width="2"/>
  <g transform="translate(272,105)" stroke="#111" stroke-width="1.2" fill="none">
    <rect x="1" y="2" width="12" height="10"/>
    <line x1="1" y1="5.4" x2="13" y2="5.4"/>
    <line x1="7" y1="5.4" x2="7" y2="12"/>
  </g>
  <text x="330" y="118" font-size="13" font-weight="bold" text-anchor="middle">the pool</text>
  <text x="320" y="136" font-size="10" fill="#444" text-anchor="middle">one vault, one ledger:</text>
  <text x="320" y="151" font-size="10" fill="#444" text-anchor="middle">liquidity + collateral + fees</text>
  <text x="320" y="172" font-size="10.5" font-style="italic" text-anchor="middle">counterparty to every trade</text>
  <!-- LPs left: Carol's wallet -->
  <rect x="28" y="94" width="112" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(36,101)">
    <circle cx="7" cy="4" r="3.1" fill="none" stroke="#111" stroke-width="1.3"/>
    <path d="M 1.5,13 Q 1.5,8.4 7,8.4 Q 12.5,8.4 12.5,13" fill="none" stroke="#111" stroke-width="1.3"/>
  </g>
  <text x="58" y="111" font-size="10.5" font-weight="bold">Carol (LP)</text>
  <text x="58" y="127" font-size="9.5" fill="#444">1 SOL</text>
  <text x="80" y="152" font-size="10" fill="#444" font-style="italic" text-anchor="middle">first of twelve LPs</text>
  <path d="M 144,106 L 236,114" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#perps-cp-arr)"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="190" y="98" font-size="10.5" font-weight="bold" fill="#1e7a3c" text-anchor="middle">1,000 USDC in</text>
  <g transform="translate(190,110)">
    <circle cx="4" cy="2" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <circle cx="-3" cy="0" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <text x="-3" y="3" font-size="8" font-weight="bold" fill="#1e7a3c" text-anchor="middle">$</text>
  </g>
  <path d="M 236,142 L 148,128" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#perps-cp-arr)"/>
  <g transform="translate(196,136)">
    <circle cx="4" cy="2" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <circle cx="-3" cy="0" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <text x="-3" y="3" font-size="8" font-weight="bold" fill="#1e7a3c" text-anchor="middle">$</text>
  </g>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="182" y="160" font-size="10" font-weight="bold" fill="#1e7a3c" text-anchor="middle">LP shares, priced at</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="182" y="173" font-size="10" font-weight="bold" fill="#1e7a3c" text-anchor="middle">marked AUM</text>
  <!-- traders right: Alice's wallet -->
  <rect x="496" y="44" width="112" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(504,51)">
    <circle cx="7" cy="4" r="3.1" fill="none" stroke="#111" stroke-width="1.3"/>
    <path d="M 1.5,13 Q 1.5,8.4 7,8.4 Q 12.5,8.4 12.5,13" fill="none" stroke="#111" stroke-width="1.3"/>
  </g>
  <text x="526" y="61" font-size="10.5" font-weight="bold">Alice (long)</text>
  <text x="526" y="77" font-size="9.5" fill="#444">1 SOL</text>
  <path d="M 492,72 C 460,82 432,92 404,102" fill="none" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#perps-cp-arr)"/>
  <g transform="translate(418,96)">
    <circle cx="4" cy="2" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <circle cx="-3" cy="0" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <text x="-3" y="3" font-size="8" font-weight="bold" fill="#1e7a3c" text-anchor="middle">$</text>
  </g>
  <!-- Bob's wallet -->
  <rect x="496" y="156" width="112" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(504,163)">
    <circle cx="7" cy="4" r="3.1" fill="none" stroke="#111" stroke-width="1.3"/>
    <path d="M 1.5,13 Q 1.5,8.4 7,8.4 Q 12.5,8.4 12.5,13" fill="none" stroke="#111" stroke-width="1.3"/>
  </g>
  <text x="526" y="173" font-size="10.5" font-weight="bold">Bob (short)</text>
  <text x="526" y="189" font-size="9.5" fill="#444">1 SOL</text>
  <path d="M 492,174 C 460,172 432,168 404,164" fill="none" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#perps-cp-arr)"/>
  <g transform="translate(420,167)">
    <circle cx="4" cy="2" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <circle cx="-3" cy="0" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <text x="-3" y="3" font-size="8" font-weight="bold" fill="#1e7a3c" text-anchor="middle">$</text>
  </g>
  <!-- flows below -->
  <text x="320" y="222" font-size="10.5" fill="#444" text-anchor="middle">traders' losses and funding flow to the pool; traders' wins flow out of it</text>
  <text x="320" y="238" font-size="10.5" fill="#444" font-style="italic" text-anchor="middle">no order book, no matching: the pool takes the other side of both Alice and Bob</text>
  <!-- solvency question -->
  <text x="320" y="52" font-size="11" font-weight="bold" text-anchor="middle">"can I pay every winner?" must be answerable</text>
  <text x="320" y="68" font-size="11" font-weight="bold" text-anchor="middle">without reading a single position account</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="460" y="86" font-size="10" fill="#444" text-anchor="middle">collateral in,</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="460" y="99" font-size="10" fill="#444" text-anchor="middle">payout out</text>
</svg>
