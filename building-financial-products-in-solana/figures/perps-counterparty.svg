<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 264" font-family="'Denim INK', Helvetica, Arial, sans-serif" fill="#111">
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="16" y="24" font-size="15" font-weight="bold">The pool takes the other side</text>
  <defs><marker id="perps-cp-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1e7a3c"/></marker></defs>
  <!-- the pool sits at the centre -->
