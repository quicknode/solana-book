<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="Georgia, serif" fill="#111">
  <defs><marker id="perps-cp-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <!-- pool center -->
  <rect x="240" y="90" width="160" height="100" fill="#f4f4f2" stroke="#111" stroke-width="2"/>
  <text x="320" y="118" font-size="13" font-weight="bold" text-anchor="middle">the pool</text>
  <text x="320" y="136" font-size="10" fill="#444" text-anchor="middle">one vault, one ledger:</text>
  <text x="320" y="151" font-size="10" fill="#444" text-anchor="middle">liquidity + collateral + fees</text>
  <text x="320" y="172" font-size="10.5" font-style="italic" text-anchor="middle">counterparty to every trade</text>
  <!-- LPs left -->
  <circle cx="80" cy="110" r="15" fill="none" stroke="#111" stroke-width="1.5"/>
  <path d="M 57,150 Q 80,128 103,150" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="80" y="168" font-size="12" font-weight="bold" text-anchor="middle">Carol</text>
  <text x="80" y="183" font-size="10" fill="#444" font-style="italic" text-anchor="middle">liquidity provider</text>
  <path d="M 108,118 L 236,124" stroke="#111" stroke-width="1.8" marker-end="url(#perps-cp-arr)"/>
  <text x="170" y="110" font-size="10.5" text-anchor="middle">100,000 USDC in</text>
  <path d="M 236,146 L 108,140" stroke="#111" stroke-width="1.4" marker-end="url(#perps-cp-arr)"/>
  <text x="170" y="160" font-size="10" fill="#444" text-anchor="middle">LP shares, priced at</text>
  <text x="170" y="173" font-size="10" fill="#444" text-anchor="middle">marked AUM</text>
  <!-- traders right -->
  <circle cx="545" cy="62" r="14" fill="none" stroke="#111" stroke-width="1.5"/>
  <path d="M 523,100 Q 545,80 567,100" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="545" y="118" font-size="11" font-weight="bold" text-anchor="middle">Alice, long</text>
  <path d="M 524,80 C 480,90 440,98 404,104" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#perps-cp-arr)"/>
  <text x="468" y="80" font-size="10" fill="#444" text-anchor="middle">collateral in,</text>
  <text x="468" y="93" font-size="10" fill="#444" text-anchor="middle">payout out</text>
  <circle cx="545" cy="172" r="14" fill="none" stroke="#111" stroke-width="1.5"/>
  <path d="M 523,210 Q 545,190 567,210" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="545" y="228" font-size="11" font-weight="bold" text-anchor="middle">Bob, short</text>
  <path d="M 524,178 C 480,174 440,168 404,164" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#perps-cp-arr)"/>
  <!-- flows below -->
  <text x="320" y="222" font-size="10.5" fill="#444" text-anchor="middle">traders' losses and funding flow to the pool; traders' wins flow out of it</text>
  <text x="320" y="238" font-size="10.5" fill="#444" font-style="italic" text-anchor="middle">no order book, no matching: the pool takes the other side of both Alice and Bob</text>
  <!-- solvency question -->
  <text x="320" y="52" font-size="11" font-weight="bold" text-anchor="middle">"can I pay every winner?" must be answerable</text>
  <text x="320" y="68" font-size="11" font-weight="bold" text-anchor="middle">without reading a single position account</text>
</svg>
