<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="Georgia, serif" fill="#111">
  <defs><marker id="perps-cp-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1e7a3c"/></marker></defs>
  <!-- the question the whole account model exists to answer -->
  <text x="300" y="62" font-size="11" font-weight="bold" text-anchor="middle">&#8220;can I pay every winner?&#8221; must be answerable</text>
  <text x="300" y="78" font-size="11" font-weight="bold" text-anchor="middle">without reading a single position account</text>
  <!-- the pool sits at the centre -->
  <rect x="240" y="102" width="160" height="64" rx="6" fill="#f4f4f2" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(248,107)" stroke="#111" stroke-width="1.2" fill="none">
    <rect x="1" y="2" width="12" height="10"/>
    <line x1="1" y1="5.4" x2="13" y2="5.4"/>
    <line x1="5.5" y1="5.4" x2="5.5" y2="12"/>
  </g>
  <text x="268" y="118" font-size="12" font-weight="bold">the pool</text>
  <line x1="248" y1="123" x2="392" y2="123" stroke="#888" stroke-width="0.8"/>
  <text x="248" y="134" font-size="9" fill="#444" font-style="italic">one vault, one ledger:</text>
  <text x="248" y="146" font-size="8" fill="#444" font-style="italic">liquidity + total_collateral + protocol_fees</text>
  <text x="248" y="158" font-size="9.5" font-style="italic">counterparty to every trade</text>
  <!-- Carol, first of the liquidity providers -->
  <rect x="28" y="96" width="112" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(36,101)">
    <circle cx="7" cy="4" r="3.1" fill="none" stroke="#111" stroke-width="1.3"/>
    <path d="M 1.5,13 Q 1.5,8.4 7,8.4 Q 12.5,8.4 12.5,13" fill="none" stroke="#111" stroke-width="1.3"/>
  </g>
  <text x="56" y="112" font-size="10.5" font-weight="bold">Carol (LP)</text>
  <line x1="36" y1="117" x2="132" y2="117" stroke="#888" stroke-width="0.8"/>
  <text x="36" y="128" font-size="9.5" fill="#444">1 SOL</text>
  <text x="84" y="152" font-size="9.5" fill="#444" font-style="italic" text-anchor="middle">first of twelve LPs</text>
  <path d="M 144,108 L 234,112" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#perps-cp-arr)"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="188" y="98" font-size="10.5" font-weight="bold" fill="#1e7a3c" text-anchor="middle">1,000 USDC in</text>
  <g transform="translate(189,111)">
    <circle cx="4" cy="2" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <circle cx="-3" cy="0" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <text x="-3" y="3" font-size="8" font-weight="bold" fill="#1e7a3c" text-anchor="middle">$</text>
  </g>
  <path d="M 238,152 L 146,134" fill="none" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#perps-cp-arr)"/>
  <g transform="translate(193,144)">
    <circle cx="4" cy="2" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <circle cx="-3" cy="0" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <text x="-3" y="3" font-size="8" font-weight="bold" fill="#1e7a3c" text-anchor="middle">$</text>
  </g>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="190" y="172" font-size="10.5" font-weight="bold" fill="#1e7a3c" text-anchor="middle">999.999 LP shares</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="190" y="185" font-size="9" fill="#444" font-style="italic" text-anchor="middle">priced at AUM marked to market</text>
  <!-- Alice goes long against the pool -->
  <rect x="496" y="44" width="112" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(504,49)">
    <circle cx="7" cy="4" r="3.1" fill="none" stroke="#111" stroke-width="1.3"/>
    <path d="M 1.5,13 Q 1.5,8.4 7,8.4 Q 12.5,8.4 12.5,13" fill="none" stroke="#111" stroke-width="1.3"/>
  </g>
  <text x="524" y="60" font-size="10.5" font-weight="bold">Alice (long)</text>
  <line x1="504" y1="65" x2="600" y2="65" stroke="#888" stroke-width="0.8"/>
  <text x="504" y="76" font-size="9.5" fill="#444">1 SOL</text>
  <path d="M 492,74 C 460,82 428,94 404,106" fill="none" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#perps-cp-arr)"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="438" y="74" font-size="10" font-weight="bold" fill="#1e7a3c" text-anchor="middle">1,000 USDC</text>
  <g transform="translate(449,89)">
    <circle cx="4" cy="2" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <circle cx="-3" cy="0" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <text x="-3" y="3" font-size="8" font-weight="bold" fill="#1e7a3c" text-anchor="middle">$</text>
  </g>
  <!-- Bob takes the mirror-image short, against the same pool -->
  <rect x="496" y="160" width="112" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(504,165)">
    <circle cx="7" cy="4" r="3.1" fill="none" stroke="#111" stroke-width="1.3"/>
    <path d="M 1.5,13 Q 1.5,8.4 7,8.4 Q 12.5,8.4 12.5,13" fill="none" stroke="#111" stroke-width="1.3"/>
  </g>
  <text x="524" y="176" font-size="10.5" font-weight="bold">Bob (short)</text>
  <line x1="504" y1="181" x2="600" y2="181" stroke="#888" stroke-width="0.8"/>
  <text x="504" y="192" font-size="9.5" fill="#444">1 SOL</text>
  <path d="M 492,172 C 460,170 428,166 404,160" fill="none" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#perps-cp-arr)"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="438" y="192" font-size="10" font-weight="bold" fill="#1e7a3c" text-anchor="middle">1,000 USDC</text>
  <g transform="translate(449,173)">
    <circle cx="4" cy="2" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <circle cx="-3" cy="0" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <text x="-3" y="3" font-size="8" font-weight="bold" fill="#1e7a3c" text-anchor="middle">$</text>
  </g>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="452" y="124" font-size="9.5" fill="#444" font-style="italic" text-anchor="middle">collateral in,</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="452" y="137" font-size="9.5" fill="#444" font-style="italic" text-anchor="middle">payout out</text>
  <!-- what flows, and what does not exist -->
  <text x="320" y="226" font-size="10.5" fill="#444" text-anchor="middle">traders&#8217; losses and funding flow to the pool; traders&#8217; wins flow out of it</text>
  <text x="320" y="242" font-size="10.5" fill="#444" font-style="italic" text-anchor="middle">no order book, no matching: the pool takes the other side of both Alice and Bob</text>
</svg>
