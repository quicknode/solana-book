<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" font-family="Georgia, serif" fill="#111">
  <defs><marker id="perps-map-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <!-- pool -->
  <circle cx="238" cy="52" r="9" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="252" y="48" font-size="9" font-style="italic" fill="#444">seeds: "pool" + collateral mint + feed</text>
  <rect x="160" y="70" width="200" height="118" fill="#f4f4f2" stroke="#111" stroke-width="2"/>
  <text x="260" y="88" font-size="12" font-weight="bold" text-anchor="middle">Pool (PDA)</text>
  <text x="170" y="104" font-size="9.5">liquidity: 12,000</text>
  <text x="170" y="117" font-size="9.5">reserved_liquidity: 10,000</text>
  <text x="170" y="130" font-size="9.5">total_collateral: 1,990</text>
  <text x="170" y="143" font-size="9.5">protocol_fees: 10</text>
  <text x="170" y="156" font-size="9.5">long_size: 5,000 &#183; short_size: 5,000</text>
  <text x="170" y="169" font-size="9.5">cumulative_funding: 0</text>
  <text x="170" y="182" font-size="9" fill="#444" font-style="italic">+ scaled accumulators, risk parameters</text>
  <!-- authority PDA -->
  <circle cx="450" cy="90" r="8" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="450" y="72" font-size="10.5" font-weight="bold" text-anchor="middle">pool authority (PDA)</text>
  <text x="420" y="112" font-size="9" fill="#444" text-anchor="middle">holds no data;</text>
  <text x="420" y="124" font-size="9" fill="#444" text-anchor="middle">exists to sign</text>
  <path d="M 364,102 L 436,94" stroke="#888" stroke-width="1.2"/>
  <!-- vault + lp mint -->
  <rect x="400" y="150" width="110" height="58" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="455" y="170" font-size="11" font-weight="bold" text-anchor="middle">custody vault</text>
  <text x="455" y="186" font-size="9" fill="#444" text-anchor="middle">every token in the</text>
  <text x="455" y="198" font-size="9" fill="#444" text-anchor="middle">market lives here</text>
  <g transform="translate(545,152)">
    <rect x="14" y="14" width="28" height="28" transform="rotate(45 28 28)" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="28" y="66" font-size="10.5" font-weight="bold" text-anchor="middle">LP share mint</text>
  </g>
  <path d="M 458,100 L 455,146" stroke="#111" stroke-width="1.4" marker-end="url(#perps-map-arr)"/>
  <path d="M 462,96 C 520,110 560,130 572,148" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#perps-map-arr)"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="498" y="107" font-size="9" fill="#444" font-style="italic">token authority + mint authority</text>
  <!-- oracle feed -->
  <rect x="30" y="70" width="100" height="64" fill="#fff" stroke="#111" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="80" y="92" font-size="11" font-weight="bold" text-anchor="middle">oracle feed</text>
  <text x="80" y="108" font-size="9" fill="#444" text-anchor="middle">price, scale, slot,</text>
  <text x="80" y="120" font-size="9" fill="#444" text-anchor="middle">confidence</text>
  <path d="M 134,102 L 156,102" stroke="#111" stroke-width="1.4" marker-end="url(#perps-map-arr)"/>
  <text x="80" y="150" font-size="9" fill="#444" font-style="italic" text-anchor="middle">pinned at creation;</text>
  <text x="80" y="162" font-size="9" fill="#444" font-style="italic" text-anchor="middle">interrogated on every read</text>
  <!-- positions -->
  <circle cx="90" cy="240" r="14" fill="none" stroke="#111" stroke-width="1.5"/>
  <path d="M 68,278 Q 90,258 112,278" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="90" y="296" font-size="11" font-weight="bold" text-anchor="middle">Alice</text>
  <circle cx="222" cy="212" r="7" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="234" y="216" font-size="9" font-style="italic" fill="#444">seeds: "position" + pool + owner + side</text>
  <rect x="210" y="222" width="180" height="72" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="220" y="238" font-size="10" font-weight="bold">Position (PDA), long</text>
  <text x="220" y="252" font-size="9">collateral: 995</text>
  <text x="220" y="264" font-size="9">size: 5,000</text>
  <text x="220" y="276" font-size="9">entry_price: $100</text>
  <text x="220" y="288" font-size="9">entry_funding: 0</text>
  <path d="M 108,244 L 206,248" stroke="#111" stroke-width="1.4" marker-end="url(#perps-map-arr)"/>
  <circle cx="222" cy="316" r="7" fill="#fff" stroke="#111" stroke-width="2"/>
  <rect x="210" y="326" width="180" height="36" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="220" y="342" font-size="10" font-weight="bold">Position (PDA), short</text>
  <text x="220" y="356" font-size="9">one per (pool, owner, side)</text>
  <text x="146" y="322" font-size="10" font-weight="bold">Bob</text>
  <path d="M 168,326 L 206,336" stroke="#111" stroke-width="1.4" marker-end="url(#perps-map-arr)"/>
  <!-- account-local note -->
  <rect x="420" y="252" width="200" height="66" fill="#fff" stroke="#888" stroke-width="1"/>
  <text x="520" y="270" font-size="10" font-weight="bold" text-anchor="middle">account-local settlement:</text>
  <text x="520" y="285" font-size="9.5" fill="#444" text-anchor="middle">closing or liquidating one position</text>
  <text x="520" y="298" font-size="9.5" fill="#444" text-anchor="middle">touches that position and the pool,</text>
  <text x="520" y="311" font-size="9.5" fill="#444" text-anchor="middle">never anyone else's</text>
</svg>
