<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="Georgia, serif" fill="#111">
  <!-- the curve -->
  <path d="M 40,500 Q 320,410 600,500" fill="none" stroke="#111" stroke-width="2"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="150" y="420" font-size="13" font-weight="bold" text-anchor="middle">Solana Devnet</text>
  <!-- Alice wallet -->
  <circle cx="96" cy="484" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="108" y="482" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <rect x="40" y="494" width="112" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="55" cy="511" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M 47,522 Q 55,515 63,522" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="70" y="511" font-size="10" font-weight="bold">Alice (long)</text>
  <text x="70" y="527" font-size="9.5" fill="#444">0.1 SOL</text>
  <!-- Bob wallet -->
  <circle cx="214" cy="461" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="226" y="459" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <rect x="162" y="471" width="104" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="177" cy="488" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M 169,499 Q 177,492 185,499" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="192" y="488" font-size="10" font-weight="bold">Bob (short)</text>
  <text x="192" y="504" font-size="9.5" fill="#444">0.1 SOL</text>
  <!-- perps program -->
  <circle cx="320" cy="455" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="332" y="452" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <rect x="286" y="514" width="220" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="296" y="530" font-size="10" font-weight="bold">perps program</text>
  <text x="296" y="544" font-size="8.5" font-family="Menlo, monospace">open / close / liquidate / add_liquidity</text>
  <line x1="320" y1="461" x2="360" y2="514" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- USDC (collateral) mint -->
  <circle cx="430" cy="462" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="430" y="450" font-size="10" font-weight="bold" text-anchor="middle">USDC mint</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="430" y="481" font-size="8.5" letter-spacing="1" fill="#555" text-anchor="middle">PUBLIC KEY</text>
  <!-- oracle feed: external account on the curve -->
  <circle cx="544" cy="483" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="544" y="471" font-size="10" font-weight="bold" text-anchor="middle">oracle feed</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="544" y="502" font-size="8" letter-spacing="0.5" fill="#555" text-anchor="middle">external account, pinned at creation</text>
  <!-- Pool PDA -->
  <circle cx="212" cy="20" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="224" y="16" font-size="8.5" letter-spacing="0.5" fill="#555">&#8220;POOL&#8221; + COLLATERAL MINT</text>
  <text x="224" y="27" font-size="8.5" letter-spacing="0.5" fill="#555">+ ORACLE FEED</text>
  <rect x="204" y="32" width="212" height="126" rx="6" fill="#f4f4f2" stroke="#888"/>
  <text x="214" y="50" font-size="10.5" font-weight="bold">Pool</text>
  <text x="214" y="66" font-size="9.5">liquidity: 12,000 USDC</text>
  <text x="214" y="80" font-size="9.5">reserved_liquidity: 10,000</text>
  <text x="214" y="94" font-size="9.5">total_collateral: 1,990</text>
  <text x="214" y="108" font-size="9.5">protocol_fees: 10</text>
  <text x="214" y="122" font-size="9.5">long_size: 5,000 &#183; short_size: 5,000</text>
  <text x="214" y="136" font-size="9.5">cumulative_funding: 0</text>
  <text x="214" y="150" font-size="9" fill="#444" font-style="italic">+ scaled accumulators, risk parameters</text>
  <!-- pool authority PDA -->
  <circle cx="440" cy="40" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="452" y="43" font-size="8.5" letter-spacing="0.5" fill="#555">&#8220;AUTHORITY&#8221; + POOL</text>
  <rect x="448" y="50" width="176" height="40" rx="6" fill="#f4f4f2" stroke="#888"/>
  <text x="458" y="67" font-size="10" font-weight="bold">pool authority</text>
  <text x="458" y="82" font-size="9" fill="#444">holds no data; signs vault &amp; mint</text>
  <!-- custody vault PDA -->
  <circle cx="440" cy="106" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="452" y="109" font-size="8.5" letter-spacing="0.5" fill="#555">&#8220;VAULT&#8221; + POOL</text>
  <rect x="448" y="116" width="176" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="458" y="134" font-size="10" font-weight="bold">custody vault</text>
  <text x="458" y="150" font-size="9.5" fill="#444">every token in the market: 14,000 USDC</text>
  <!-- LP share mint PDA -->
  <circle cx="440" cy="176" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="452" y="179" font-size="8.5" letter-spacing="0.5" fill="#555">&#8220;LP_MINT&#8221; + POOL</text>
  <rect x="448" y="186" width="176" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="458" y="203" font-size="10" font-weight="bold">LP share mint</text>
  <text x="458" y="218" font-size="9" fill="#444">a PDA mint; authority = pool authority</text>
  <!-- Alice's long position PDA -->
  <circle cx="20" cy="216" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="32" y="212" font-size="8.5" letter-spacing="0.5" fill="#555">&#8220;POSITION&#8221; + POOL</text>
  <text x="32" y="223" font-size="8.5" letter-spacing="0.5" fill="#555">+ ALICE&#8217;S ADDRESS + LONG</text>
  <rect x="28" y="230" width="184" height="86" rx="6" fill="#f4f4f2" stroke="#888"/>
  <text x="38" y="248" font-size="10.5" font-weight="bold">Alice&#8217;s position (long)</text>
  <text x="38" y="264" font-size="9.5">collateral: 995 USDC</text>
  <text x="38" y="278" font-size="9.5">size: 5,000</text>
  <text x="38" y="292" font-size="9.5">entry_price: $100</text>
  <text x="38" y="306" font-size="9.5">entry_funding: 0</text>
  <!-- Bob's short position PDA -->
  <circle cx="240" cy="216" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="252" y="212" font-size="8.5" letter-spacing="0.5" fill="#555">&#8220;POSITION&#8221; + POOL</text>
  <text x="252" y="223" font-size="8.5" letter-spacing="0.5" fill="#555">+ BOB&#8217;S ADDRESS + SHORT</text>
  <rect x="248" y="230" width="184" height="86" rx="6" fill="#f4f4f2" stroke="#888"/>
  <text x="258" y="248" font-size="10.5" font-weight="bold">Bob&#8217;s position (short)</text>
  <text x="258" y="264" font-size="9.5">collateral: 995 USDC</text>
  <text x="258" y="278" font-size="9.5">size: 5,000</text>
  <text x="258" y="292" font-size="9.5">entry_price: $100</text>
  <text x="258" y="306" font-size="9">one per (pool, owner, side)</text>
  <!-- Alice's USDC ATA -->
  <circle cx="20" cy="336" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="32" y="332" font-size="8.5" letter-spacing="0.5" fill="#555">ATA PROGRAM + ALICE&#8217;S</text>
  <text x="32" y="343" font-size="8.5" letter-spacing="0.5" fill="#555">ADDRESS + USDC MINT ADDRESS</text>
  <rect x="28" y="350" width="124" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="38" y="368" font-size="10.5" font-weight="bold">Alice&#8217;s USDC</text>
  <text x="38" y="384" font-size="9.5" fill="#444">5 USDC</text>
  <!-- Bob's USDC ATA -->
  <circle cx="248" cy="336" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="260" y="332" font-size="8.5" letter-spacing="0.5" fill="#555">ATA PROGRAM + BOB&#8217;S</text>
  <text x="260" y="343" font-size="8.5" letter-spacing="0.5" fill="#555">ADDRESS + USDC MINT ADDRESS</text>
  <rect x="256" y="350" width="124" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="266" y="368" font-size="10.5" font-weight="bold">Bob&#8217;s USDC</text>
  <text x="266" y="384" font-size="9.5" fill="#444">5 USDC</text>
  <!-- note -->
  <rect x="452" y="250" width="172" height="72" rx="6" fill="#fff" stroke="#888"/>
  <text x="538" y="268" font-size="9.5" font-weight="bold" text-anchor="middle">account-local settlement</text>
  <text x="538" y="284" font-size="9" fill="#444" text-anchor="middle">closing or liquidating a position</text>
  <text x="538" y="297" font-size="9" fill="#444" text-anchor="middle">touches that position and the pool,</text>
  <text x="538" y="310" font-size="9" fill="#444" text-anchor="middle">never anyone else&#8217;s</text>
</svg>
