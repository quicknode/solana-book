<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="Georgia, serif" fill="#111">
  <defs><marker id="perps-map-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <!-- pool -->
  <circle cx="238" cy="52" r="9" fill="#fff" stroke="#111" stroke-width="2"/>
  <rect x="160" y="70" width="200" height="108" fill="#f4f4f2" stroke="#111" stroke-width="2"/>
  <text x="260" y="90" font-size="12" font-weight="bold" text-anchor="middle">Pool (PDA)</text>
  <text x="170" y="107" font-size="9.5">seeds: "pool" + collateral mint + feed</text>
  <text x="170" y="122" font-size="9.5">liquidity, reserved_liquidity</text>
  <text x="170" y="137" font-size="9.5">total_collateral, protocol_fees</text>
  <text x="170" y="152" font-size="9.5">long/short size + scaled accumulators</text>
  <text x="170" y="167" font-size="9.5">cumulative_funding, risk parameters</text>
  <!-- authority PDA -->
  <circle cx="450" cy="90" r="8" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="450" y="72" font-size="10.5" font-weight="bold" text-anchor="middle">pool authority (PDA)</text>
  <text x="450" y="112" font-size="9" fill="#444" text-anchor="middle">holds no data;</text>
  <text x="450" y="124" font-size="9" fill="#444" text-anchor="middle">exists to sign</text>
  <path d="M 364,110 L 436,96" stroke="#888" stroke-width="1.2"/>
  <!-- vault + lp mint -->
  <rect x="400" y="150" width="110" height="58" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="455" y="170" font-size="11" font-weight="bold" text-anchor="middle">custody vault</text>
  <text x="455" y="186" font-size="9" fill="#444" text-anchor="middle">every token in the</text>
  <text x="455" y="198" font-size="9" fill="#444" text-anchor="middle">market lives here</text>
  <g transform="translate(545,152)">
    <rect x="14" y="14" width="28" height="28" transform="rotate(45 28 28)" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="28" y="66" font-size="10.5" font-weight="bold" text-anchor="middle">LP share mint</text>
  </g>
  <path d="M 458,100 L 455,146" stroke="#111" stroke-width="1.4" marker-end="url(#perps-map-arr)"/>
  <path d="M 462,96 C 520,110 560,130 572,148" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#perps-map-arr)"/>
  <text x="530" y="120" font-size="9" fill="#444" font-style="italic">token authority + mint authority</text>
  <!-- oracle feed -->
  <rect x="30" y="70" width="100" height="64" fill="#fff" stroke="#111" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="80" y="92" font-size="11" font-weight="bold" text-anchor="middle">oracle feed</text>
  <text x="80" y="108" font-size="9" fill="#444" text-anchor="middle">price, scale, slot,</text>
  <text x="80" y="120" font-size="9" fill="#444" text-anchor="middle">confidence</text>
  <path d="M 134,102 L 156,102" stroke="#111" stroke-width="1.4" marker-end="url(#perps-map-arr)"/>
  <text x="80" y="150" font-size="9" fill="#444" font-style="italic" text-anchor="middle">pinned at creation;</text>
  <text x="80" y="162" font-size="9" fill="#444" font-style="italic" text-anchor="middle">interrogated on every read</text>
  <!-- positions -->
  <circle cx="90" cy="232" r="14" fill="none" stroke="#111" stroke-width="1.5"/>
  <path d="M 68,270 Q 90,250 112,270" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="90" y="288" font-size="11" font-weight="bold" text-anchor="middle">Alice</text>
  <circle cx="196" cy="240" r="7" fill="#fff" stroke="#111" stroke-width="2"/>
  <rect x="210" y="218" width="180" height="58" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="220" y="235" font-size="10" font-weight="bold">Position (PDA), long</text>
  <text x="220" y="250" font-size="9">seeds: "position" + pool + owner + side</text>
  <text x="220" y="264" font-size="9">collateral, size, entry_price, entry_funding</text>
  <path d="M 108,238 L 186,240" stroke="#111" stroke-width="1.4" marker-end="url(#perps-map-arr)"/>
  <circle cx="196" cy="308" r="7" fill="#fff" stroke="#111" stroke-width="2"/>
  <rect x="210" y="290" width="180" height="36" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="220" y="306" font-size="10" font-weight="bold">Position (PDA), short</text>
  <text x="220" y="320" font-size="9">one per (pool, owner, side)</text>
  <text x="140" y="316" font-size="10" font-weight="bold">Bob</text>
  <path d="M 158,312 L 186,309" stroke="#111" stroke-width="1.4" marker-end="url(#perps-map-arr)"/>
  <!-- account-local note -->
  <rect x="420" y="240" width="200" height="66" fill="#fff" stroke="#888" stroke-width="1"/>
  <text x="520" y="258" font-size="10" font-weight="bold" text-anchor="middle">account-local settlement:</text>
  <text x="520" y="273" font-size="9.5" fill="#444" text-anchor="middle">closing or liquidating one position</text>
  <text x="520" y="286" font-size="9.5" fill="#444" text-anchor="middle">touches that position and the pool,</text>
  <text x="520" y="299" font-size="9.5" fill="#444" text-anchor="middle">never anyone else's</text>
</svg>
