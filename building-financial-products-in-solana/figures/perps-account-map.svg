<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 690" font-family="Georgia, serif" fill="#111">
  <!-- Pool PDA -->
  <g>
    <circle cx="28" cy="18" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="40" y="15" font-size="8.5" letter-spacing="0.6" fill="#555">SEEDS: &#8220;POOL&#8221; + COLLATERAL MINT</text>
    <text x="40" y="26" font-size="8.5" letter-spacing="0.6" fill="#555">+ ORACLE FEED ADDRESS</text>
    <rect x="20" y="32" width="224" height="132" rx="6" fill="#f4f4f2" stroke="#888"/>
    <text x="30" y="50" font-size="10.5" font-weight="bold">Pool</text>
    <text x="30" y="66" font-size="9.5">liquidity: 12,000 USDC</text>
    <text x="30" y="80" font-size="9.5">reserved_liquidity: 10,000</text>
    <text x="30" y="94" font-size="9.5">total_collateral: 1,990</text>
    <text x="30" y="108" font-size="9.5">protocol_fees: 10</text>
    <text x="30" y="122" font-size="9.5">long_size: 5,000 &#183; short_size: 5,000</text>
    <text x="30" y="136" font-size="9.5">cumulative_funding: 0</text>
    <text x="30" y="150" font-size="9" fill="#444" font-style="italic">+ scaled accumulators, risk parameters</text>
  </g>
  <!-- pool authority PDA -->
  <g>
    <circle cx="268" cy="18" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="280" y="21" font-size="8.5" letter-spacing="0.6" fill="#555">SEEDS: &#8220;AUTHORITY&#8221; + POOL</text>
    <rect x="260" y="28" width="180" height="46" rx="6" fill="#f4f4f2" stroke="#888"/>
    <text x="270" y="45" font-size="10.5" font-weight="bold">pool authority</text>
    <text x="270" y="60" font-size="9" fill="#444">holds no data; signs vault &amp; mint</text>
  </g>
  <!-- custody vault -->
