    <circle cx="268" cy="92" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="280" y="95" font-size="8.5" letter-spacing="0.6" fill="#555">SEEDS: &#8220;VAULT&#8221; + POOL</text>
