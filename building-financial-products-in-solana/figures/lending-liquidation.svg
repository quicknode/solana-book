<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Georgia, serif" fill="#111">
  <defs>
    <marker id="lending-liquidation-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker>
    <pattern id="lending-liquidation-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#888" stroke-width="1.4"/></pattern>
  </defs>
  <!-- Dave -->
  <rect x="10" y="52" width="134" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="25" cy="69" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M 17,80 Q 25,73 33,80" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="40" y="69" font-size="10.5" font-weight="bold">Dave (liquidator)</text>
  <text x="40" y="85" font-size="9.5" fill="#444">0.1 SOL</text>
  <!-- SPCXx reserve -->
  <rect x="430" y="28" width="180" height="66" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <circle cx="448" cy="50" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="461" y="54" font-size="12" font-weight="bold">SPCXx reserve</text>
  <circle cx="450" cy="76" r="5" fill="#fff" stroke="#111" stroke-width="1.6"/>
  <text x="462" y="80" font-size="10.5">liquidity vault</text>
  <!-- repay flow -->
  <path d="M 148,64 C 240,38 330,36 426,48" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#lending-liquidation-arr)"/>
  <text x="255" y="26" font-size="11" font-weight="bold" text-anchor="middle">repays 1.5 SPCXx ($450)</text>
  <!-- Carol's obligation -->
  <rect x="250" y="140" width="330" height="118" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <circle cx="268" cy="162" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="281" y="166" font-size="12" font-weight="bold">Carol&#8217;s obligation</text>
  <text x="268" y="190" font-size="11">borrow: 3 SPCXx ($900)</text>
  <rect x="268" y="198" width="100" height="13" fill="url(#lending-liquidation-hatch)" stroke="none"/>
  <rect x="268" y="198" width="200" height="13" fill="none" stroke="#111" stroke-width="1.2"/>
  <line x1="368" y1="198" x2="368" y2="211" stroke="#111" stroke-width="1.2"/>
  <text x="318" y="224" font-size="10" fill="#444" text-anchor="middle">this call: 1.5</text>
  <text x="418" y="224" font-size="10" fill="#444" text-anchor="middle">untouched: 1.5</text>
  <text x="478" y="202" font-size="10" font-style="italic" fill="#444">close factor</text>
  <text x="478" y="214" font-size="10" font-style="italic" fill="#444">caps at 50%</text>
  <circle cx="270" cy="242" r="5" fill="#fff" stroke="#111" stroke-width="1.6"/>
  <text x="282" y="246" font-size="10.5">collateral vault: USDC shares ($1,000)</text>
  <!-- seize flow -->
  <path d="M 246,242 C 175,245 115,185 82,100" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#lending-liquidation-arr)"/>
  <text x="150" y="268" font-size="11" font-weight="bold" text-anchor="middle">seizes $472.50 of USDC shares</text>
  <text x="150" y="283" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">$450 &#215; 1.05 liquidation bonus</text>
  <!-- health gauge -->
  <text x="40" y="310" font-size="11" font-weight="bold">Carol&#8217;s health: debt as a share of collateral</text>
  <rect x="40" y="320" width="378" height="13" fill="url(#lending-liquidation-hatch)" stroke="none"/>
  <rect x="40" y="320" width="420" height="13" fill="none" stroke="#111" stroke-width="1.2"/>
  <text x="470" y="331" font-size="10.5"><tspan font-weight="bold">before:</tspan> 90%, liquidatable</text>
  <rect x="40" y="344" width="323" height="13" fill="url(#lending-liquidation-hatch)" stroke="none"/>
  <rect x="40" y="344" width="420" height="13" fill="none" stroke="#111" stroke-width="1.2"/>
  <text x="470" y="355" font-size="10.5"><tspan font-weight="bold">after:</tspan> 77%, healthy</text>
  <line x1="376" y1="314" x2="376" y2="362" stroke="#111" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="382" y="311" font-size="10.5">liquidation threshold 80%</text>
  <text x="320" y="388" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">two passes: $675 repaid, $708.75 seized, $33.75 to Dave for keeping the market solvent</text>
</svg>
