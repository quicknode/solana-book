<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 274" font-family="Gelasio, Georgia, serif" fill="#111">
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="16" y="24" font-size="15" font-weight="bold">Curve pricing versus quote pricing</text>
<g transform="translate(0,14)">
  <defs><marker id="propamm-cvq-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <!-- left panel: the curve -->
  <text x="165" y="26" font-size="11.5" font-weight="bold" text-anchor="middle">the curve reprices as you buy</text>
  <line x1="55" y1="200" x2="290" y2="200" stroke="#111" stroke-width="1.5" marker-end="url(#propamm-cvq-arr)"/>
  <line x1="55" y1="200" x2="55" y2="45" stroke="#111" stroke-width="1.5" marker-end="url(#propamm-cvq-arr)"/>
  <text x="288" y="214" font-size="10" text-anchor="end">trade size</text>
  <text x="62" y="52" font-size="10">effective unit price</text>
  <line x1="55" y1="160" x2="285" y2="160" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="50" y="164" font-size="9" fill="#444" text-anchor="end">$165</text>
  <path d="M 55,160 C 130,156 210,120 275,72" fill="none" stroke="#111" stroke-width="2.2"/>
  <text x="70" y="95" font-size="9.5" fill="#444">every extra token</text>
  <text x="70" y="108" font-size="9.5" fill="#444">costs more than the last</text>
  <!-- right panel: the quote -->
  <text x="480" y="26" font-size="11.5" font-weight="bold" text-anchor="middle">the quote is flat until it refuses</text>
  <line x1="370" y1="200" x2="605" y2="200" stroke="#111" stroke-width="1.5" marker-end="url(#propamm-cvq-arr)"/>
  <line x1="370" y1="200" x2="370" y2="45" stroke="#111" stroke-width="1.5" marker-end="url(#propamm-cvq-arr)"/>
  <text x="603" y="214" font-size="10" text-anchor="end">trade size</text>
  <line x1="370" y1="150" x2="600" y2="150" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="365" y="154" font-size="9" fill="#444" text-anchor="end">$165</text>
  <path d="M 370,143 L 530,143" stroke="#111" stroke-width="2.2"/>
  <text x="420" y="133" font-size="9.5" fill="#444">ask $165.165, any size</text>
  <!-- inventory boundary -->
  <line x1="530" y1="200" x2="530" y2="70" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="530" y="60" font-size="9.5" fill="#444" text-anchor="middle">inventory runs out</text>
  <path d="M 541,132 L 555,150 M 555,132 L 541,150" stroke="#111" stroke-width="2"/>
  <text x="575" y="146" font-size="9.5" fill="#444">refused,</text>
  <text x="575" y="159" font-size="9.5" fill="#444">not repriced</text>
</g>
</svg>
