<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Gelasio, Georgia, serif" fill="#111">
  <defs><marker id="arr7" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <!-- bot -->
  <rect x="50" y="110" width="80" height="60" fill="none" stroke="#111" stroke-width="2"/>
  <circle cx="75" cy="132" r="5" fill="#111"/><circle cx="105" cy="132" r="5" fill="#111"/>
  <line x1="72" y1="152" x2="108" y2="152" stroke="#111" stroke-width="1.6"/>
  <line x1="90" y1="110" x2="90" y2="96" stroke="#111" stroke-width="1.6"/><circle cx="90" cy="92" r="3" fill="#111"/>
  <text x="90" y="192" font-size="11.5" text-anchor="middle" font-weight="bold">anyone&#8217;s bot,</text>
  <text x="90" y="206" font-size="11" text-anchor="middle">on a schedule</text>
  <path d="M 134,140 h 90" stroke="#111" stroke-width="1.6" marker-end="url(#arr7)"/>
  <text x="179" y="130" font-size="10" fill="#444" text-anchor="middle" font-style="italic">calls, every hour</text>
  <!-- handler -->
  <rect x="228" y="110" width="150" height="60" fill="none" stroke="#111" stroke-width="2"/>
  <text x="303" y="136" font-size="11.5" font-weight="bold" text-anchor="middle">permissionless</text>
  <text x="303" y="152" font-size="11.5" font-weight="bold" text-anchor="middle">instruction handler</text>
  <!-- outcomes -->
  <path d="M 382,120 C 430,100 450,86 486,72" stroke="#111" stroke-width="1.4" marker-end="url(#arr7)" fill="none"/>
  <rect x="490" y="46" width="130" height="48" fill="#f4f4f2" stroke="#888"/>
  <text x="555" y="65" font-size="10.5" font-weight="bold" text-anchor="middle">work done</text>
  <text x="555" y="81" font-size="9" fill="#444" text-anchor="middle">incentive paid to the caller</text>
  <path d="M 382,140 h 104" stroke="#111" stroke-width="1.4" marker-end="url(#arr7)"/>
  <rect x="490" y="118" width="130" height="48" fill="#f4f4f2" stroke="#888"/>
  <text x="555" y="137" font-size="10.5" font-weight="bold" text-anchor="middle">nothing to do</text>
  <text x="555" y="153" font-size="10" fill="#444" text-anchor="middle">clean no-op success</text>
  <path d="M 382,160 C 430,180 450,194 486,208" stroke="#111" stroke-width="1.4" marker-end="url(#arr7)" fill="none"/>
  <rect x="490" y="190" width="130" height="48" fill="#f4f4f2" stroke="#888"/>
  <text x="555" y="209" font-size="10.5" font-weight="bold" text-anchor="middle">invalid state</text>
  <text x="555" y="225" font-size="10" fill="#444" text-anchor="middle">refused: state forbids it</text>
  <text x="303" y="260" font-size="10.5" fill="#444" text-anchor="middle" font-style="italic">the handler checks state, not identity: any signature will do</text>
</svg>
