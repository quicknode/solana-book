<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Georgia, serif" fill="#111">
  <defs><marker id="vault-fee-dilution-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1e7a3c"/></marker></defs>
  <!-- before pie: 1,350 shares -->
  <text x="150" y="46" font-size="12" font-weight="bold" text-anchor="middle">before: 1,350 shares</text>
  <path d="M 150,140 L 150,80 A 60,60 0 1 1 98.04,170 Z" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <path d="M 150,140 L 98.04,170 A 60,60 0 0 1 150,80 Z" fill="#f4f4f2" stroke="#111" stroke-width="1.5"/>
  <text x="174" y="160" font-size="10.5" text-anchor="middle">Alice 900</text>
  <text x="121" y="124" font-size="10.5" text-anchor="middle">Bob 450</text>
  <!-- collect_fees -->
  <path d="M 222,140 L 356,140" fill="none" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#vault-fee-dilution-arr)"/>
  <text x="289" y="108" font-size="10.5" font-weight="bold" fill="#1e7a3c" font-family="Menlo, monospace" text-anchor="middle">collect_fees()</text>
  <text x="289" y="124" font-size="11" font-weight="bold" fill="#1e7a3c" text-anchor="middle">mint 13.5 shares to Maria</text>
  <text x="289" y="162" font-size="10" font-style="italic" fill="#444" text-anchor="middle">1% &#215; 1,350 shares &#215; 1 year</text>
  <!-- after pie: 1,363.5 shares -->
  <text x="430" y="46" font-size="12" font-weight="bold" text-anchor="middle">after: 1,363.5 shares</text>
  <path d="M 430,140 L 430,80 A 60,60 0 1 1 379.3,172.1 Z" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <path d="M 430,140 L 379.3,172.1 A 60,60 0 0 1 426.2,80.1 Z" fill="#f4f4f2" stroke="#111" stroke-width="1.5"/>
  <path d="M 430,140 L 426.2,80.1 A 60,60 0 0 1 430,80 Z" fill="#111" stroke="#111" stroke-width="1.5"/>
  <text x="454" y="160" font-size="10.5" text-anchor="middle">Alice 900</text>
  <text x="401" y="124" font-size="10.5" text-anchor="middle">Bob 450</text>
  <line x1="533" y1="68" x2="432" y2="82" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="538" y="72" font-size="11" font-weight="bold">Maria 13.5</text>
  <!-- what did not happen -->
  <text x="320" y="248" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">every holder&#8217;s slice of the same pie shrinks proportionally; no tokens leave any vault</text>
  <text x="320" y="264" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">callable by anyone; the fee rate is fixed at creation, with no setter</text>
  <g class="coin" transform="translate(214.3,119.5)" fill="#fff"><g stroke="#fff" stroke-width="4.5"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g><g stroke="#1e7a3c" stroke-width="1.3"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g></g>
</svg>
