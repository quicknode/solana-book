<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 364" font-family="'Denim INK', Helvetica, Arial, sans-serif" fill="#111">
  <defs><marker id="betting-pools-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <text x="135.0" y="22" font-size="12" font-weight="bold" text-anchor="middle">Before: the bets</text>
  <text x="135.0" y="36" font-size="10.5" fill="#444" font-style="italic" text-anchor="middle">600 USDC in the vault</text>
  <text x="420.0" y="22" font-size="12" font-weight="bold" text-anchor="middle">After: the payouts</text>
  <text x="420.0" y="36" font-size="10.5" fill="#444" font-style="italic" text-anchor="middle">the same 600 USDC</text>
  <rect x="40" y="44.0" width="190" height="120.0" fill="#fff" stroke="#888" stroke-width="1"/>
  <rect x="40" y="164.0" width="190" height="40.0" fill="#fff" stroke="#888" stroke-width="1"/>
  <rect x="40" y="204.0" width="190" height="80.0" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <rect x="40" y="44.0" width="190" height="240.0" fill="none" stroke="#111" stroke-width="2"/>
  <text x="135.0" y="102.0" font-size="11" font-weight="bold" text-anchor="middle">Alice: 300</text>
  <text x="135.0" y="116.0" font-size="10.5" fill="#444" text-anchor="middle">on Toy Story 5</text>
  <text x="135.0" y="188.0" font-size="11" text-anchor="middle"><tspan font-weight="bold">Bob: 100</tspan> <tspan fill="#444" font-size="10.5">on Toy Story 5</tspan></text>
  <text x="135.0" y="242.0" font-size="11" font-weight="bold" text-anchor="middle">Carol: 200</text>
  <text x="135.0" y="256.0" font-size="10.5" fill="#444" text-anchor="middle">on Backrooms</text>
  <rect x="330" y="44.0" width="180" height="120.0" fill="#fff" stroke="#888" stroke-width="1"/>
  <rect x="330" y="164.0" width="180" height="58.8" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <rect x="330" y="222.8" width="180" height="40.0" fill="#fff" stroke="#888" stroke-width="1"/>
  <rect x="330" y="262.8" width="180" height="19.6" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <rect x="330" y="282.4" width="180" height="1.6" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <rect x="330" y="44.0" width="180" height="240.0" fill="none" stroke="#111" stroke-width="2"/>
  <text x="420.0" y="108.0" font-size="10.5" text-anchor="middle">300 stake back</text>
  <text x="420.0" y="197.4" font-size="10.5" text-anchor="middle">+147 winnings</text>
  <text x="420.0" y="246.8" font-size="10.5" text-anchor="middle">100 stake back</text>
  <text x="420.0" y="275.9" font-size="9.5" text-anchor="middle">+49 winnings</text>
  <path d="M 514,45.0 L 518,45.0 L 518,219.8 L 514,219.8" fill="none" stroke="#111" stroke-width="1.2"/>
  <text x="526" y="137.4" font-size="11" font-weight="bold">Alice receives 447</text>
  <path d="M 514,225.8 L 518,225.8 L 518,281.4 L 514,281.4" fill="none" stroke="#111" stroke-width="1.2"/>
  <text x="526" y="256.6" font-size="11" font-weight="bold">Bob receives 149</text>
  <path d="M 512,283.2 L 522,293.2" fill="none" stroke="#111" stroke-width="1"/>
  <text x="526" y="298.2" font-size="11" font-weight="bold">Maria receives 4</text>
  <text x="526" y="311.2" font-size="10" fill="#444" font-style="italic">the 2% fee</text>
  <text x="526" y="329.2" font-size="11" font-weight="bold">Carol receives 0</text>
  <path d="M 238,164.0 L 329,164.0" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#betting-pools-arr)"/>
  <text x="280.0" y="142.0" font-size="10.5" text-anchor="middle">betting closes,</text>
  <text x="280.0" y="156.0" font-size="10.5" font-weight="bold" text-anchor="middle">Toy Story 5 wins</text>
  <text x="320" y="354" font-size="10.5" fill="#444" font-style="italic" text-anchor="middle">Shaded: Carol's 200 USDC, shared by the winners in proportion to their stakes after the fee.</text>
</svg>
