  <text x="88" y="230" font-size="9.5" fill="#444">0 USDC, Maria&#8217;s</text>
  <line x1="100" y1="238" x2="100" y2="374" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="100" cy="380" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="112" y="377" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
