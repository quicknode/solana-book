  <text x="260" y="386" font-size="9.5" font-family="Menlo, monospace">initialize_market</text>
  <text x="260" y="399" font-size="9.5" font-family="Menlo, monospace">create_market_user</text>
  <text x="260" y="412" font-size="9.5" font-family="Menlo, monospace">place_order</text>
  <text x="260" y="425" font-size="9.5" font-family="Menlo, monospace">cancel_order</text>
  <text x="260" y="438" font-size="9.5" font-family="Menlo, monospace">settle_funds</text>
  <text x="260" y="451" font-size="9.5" font-family="Menlo, monospace">withdraw_fees</text>
