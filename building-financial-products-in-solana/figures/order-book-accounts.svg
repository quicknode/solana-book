<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" font-family="Georgia, serif" fill="#111">
  <defs><marker id="order-book-accounts-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#777"/></marker></defs>
  <!-- the curve -->
  <path d="M 40,420 Q 320,210 600,420" fill="none" stroke="#111" stroke-width="2"/>
