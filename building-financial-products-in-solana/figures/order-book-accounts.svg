  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="197" y="368" font-size="11" font-weight="bold" text-anchor="middle">NVDAx mint</text>
  <circle cx="421" cy="329" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="421" y="348" font-size="9" letter-spacing="1" fill="#555" text-anchor="middle">PUBLIC KEY</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="421" y="362" font-size="11" font-weight="bold" text-anchor="middle">USDC mint</text>
