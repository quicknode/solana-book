  <rect x="50" y="120" width="148" height="42" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="60" y="138" font-size="10.5" font-weight="bold">quote vault</text>
  <text x="60" y="154" font-size="9.5" fill="#444">1,000 USDC locked</text>
  <line x1="72" y1="162" x2="72" y2="391" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
