  <rect x="146" y="520" width="148" height="124" rx="6" fill="#f4f4f2" stroke="#888"/>
  <text x="156" y="538" font-size="10.5" font-weight="bold">Alice&#8217;s order</text>
  <text x="156" y="554" font-size="9.5">order_id: 1</text>
  <text x="156" y="567" font-size="9.5">side: Ask</text>
  <text x="156" y="580" font-size="9.5">price: 265</text>
  <text x="156" y="593" font-size="9.5">original_quantity: 10</text>
  <text x="156" y="606" font-size="9.5">filled_quantity: 0</text>
  <text x="156" y="619" font-size="9.5">status: Open</text>
  <text x="156" y="632" font-size="9.5">timestamp</text>
