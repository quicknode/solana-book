  <text x="326" y="554" font-size="9.5">market: NVDAx/USDC</text>
  <text x="326" y="567" font-size="9.5">owner: Alice</text>
  <text x="326" y="580" font-size="9.5">open_orders: [1]</text>
  <text x="326" y="593" font-size="9.5">unsettled_base: 0</text>
