  <circle cx="248" cy="36" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="260" y="32" font-size="8.5" letter-spacing="0.6" fill="#555">&#8220;MARKET&#8221; + NVDAX &amp;</text>
  <text x="260" y="43" font-size="8.5" letter-spacing="0.6" fill="#555">USDC MINT ADDRESSES</text>
  <rect x="240" y="50" width="172" height="146" rx="6" fill="#f4f4f2" stroke="#888"/>
