  <text x="430" y="90" font-size="9.5" font-style="italic" fill="#444">not a PDA: created by the client</text>
  <line x1="480" y1="112" x2="377" y2="313" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
