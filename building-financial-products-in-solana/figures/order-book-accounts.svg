  <circle cx="150" cy="506" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="162" y="502" font-size="8.5" letter-spacing="0.6" fill="#555">&#8220;ORDER&#8221; + MARKET ADDRESS</text>
