  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="84" y="394" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <rect x="78" y="196" width="148" height="42" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
