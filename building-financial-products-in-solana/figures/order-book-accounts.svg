<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Georgia, serif" fill="#111">
  <!-- order book: a plain data account, NOT a PDA -->
  <rect x="215" y="34" width="210" height="58" rx="6" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="320" y="54" font-size="12" font-weight="bold" text-anchor="middle">order book (&#8776;180 KB)</text>
  <text x="320" y="70" font-size="10.5" text-anchor="middle">bid tree + ask tree, zero-copy</text>
  <text x="320" y="84" font-size="10" font-style="italic" fill="#444" text-anchor="middle">not a PDA: created by the client</text>
  <line x1="320" y1="92" x2="320" y2="167" stroke="#111" stroke-width="1.5"/>
  <text x="328" y="130" font-size="10" font-style="italic" fill="#444">has_one</text>
  <!-- the market PDA at the center -->
  <circle cx="320" cy="175" r="8" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="320" y="156" font-size="12" font-weight="bold" text-anchor="middle">market</text>
  <text x="320" y="200" font-size="10" font-style="italic" fill="#444" text-anchor="middle">PDA: &#8220;market&#8221; + the two mints</text>
  <text x="320" y="213" font-size="10" font-style="italic" fill="#444" text-anchor="middle">fee 25 bps, ticks, lots, authority: Maria</text>
  <!-- three vaults -->
  <circle cx="105" cy="110" r="7" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="90" y="107" font-size="11" font-weight="bold" text-anchor="end">base vault</text>
  <text x="90" y="120" font-size="10" font-style="italic" fill="#444" text-anchor="end">NVDAx</text>
  <circle cx="105" cy="185" r="7" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="90" y="182" font-size="11" font-weight="bold" text-anchor="end">quote vault</text>
  <text x="90" y="195" font-size="10" font-style="italic" fill="#444" text-anchor="end">USDC</text>
  <circle cx="105" cy="260" r="7" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="90" y="257" font-size="11" font-weight="bold" text-anchor="end">fee vault</text>
  <text x="90" y="270" font-size="10" font-style="italic" fill="#444" text-anchor="end">USDC, Maria&#8217;s</text>
  <line x1="312" y1="172" x2="113" y2="113" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="312" y1="176" x2="113" y2="185" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="312" y1="179" x2="113" y2="257" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="180" y="296" font-size="10" font-style="italic" fill="#444" text-anchor="middle">the market is the vaults&#8217; authority</text>
  <!-- each trader -->
  <circle cx="545" cy="70" r="16" fill="none" stroke="#111" stroke-width="1.5"/>
  <path d="M 520,112 Q 545,90 570,112" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="545" y="130" font-size="12" font-weight="bold" text-anchor="middle">each trader</text>
  <text x="545" y="144" font-size="10" font-style="italic" fill="#444" text-anchor="middle">Alice, Bob, Carol</text>
  <!-- market user (one per trader) -->
  <circle cx="460" cy="205" r="7" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="460" y="187" font-size="11" font-weight="bold" text-anchor="middle">market user</text>
  <text x="460" y="225" font-size="10" font-style="italic" fill="#444" text-anchor="middle">unsettled_base, unsettled_quote</text>
  <text x="460" y="238" font-size="10" font-style="italic" fill="#444" text-anchor="middle">open orders (&#8804;20)</text>
  <!-- order account (one per order) -->
  <circle cx="460" cy="300" r="7" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="460" y="283" font-size="11" font-weight="bold" text-anchor="middle">order</text>
  <text x="460" y="320" font-size="10" font-style="italic" fill="#444" text-anchor="middle">one per order: side, price, filled, status</text>
  <line x1="328" y1="178" x2="452" y2="203" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="326" y1="181" x2="454" y2="295" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="538" y1="115" x2="464" y2="197" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- token accounts at the edge -->
  <text x="600" y="180" font-size="10" font-style="italic" fill="#444" text-anchor="middle">token accounts</text>
  <circle cx="600" cy="200" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="600" y="220" font-size="10" text-anchor="middle">NVDAx</text>
  <circle cx="600" cy="245" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="600" y="265" font-size="10" text-anchor="middle">USDC</text>
  <line x1="556" y1="112" x2="597" y2="194" stroke="#888" stroke-width="1"/>
  <line x1="558" y1="116" x2="598" y2="238" stroke="#888" stroke-width="1"/>
  <!-- legend -->
  <circle cx="60" cy="372" r="5" fill="#fff" stroke="#111" stroke-width="1.6"/>
  <text x="72" y="376" font-size="10.5" fill="#444">PDA or vault (program-controlled)</text>
  <rect x="300" y="364" width="14" height="12" rx="2" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="322" y="376" font-size="10.5" fill="#444">data account</text>
</svg>
