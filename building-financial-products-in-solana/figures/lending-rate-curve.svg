<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 337" font-family="'Denim INK', Helvetica, Arial, sans-serif" fill="#111">
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="16" y="24" font-size="15" font-weight="bold">The rate kinks at the target</text>
<g transform="translate(0,17)">
  <defs><marker id="lending-rate-curve-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <!-- panel divider -->
  <line x1="342" y1="30" x2="342" y2="300" stroke="#999" stroke-width="1" stroke-dasharray="2 4"/>
  <!-- left panel: the kinked curve -->
  <text x="40" y="24" font-size="12" font-weight="bold">the kinked rate curve</text>
  <line x1="70" y1="262" x2="70" y2="52" stroke="#111" stroke-width="1.5" marker-end="url(#lending-rate-curve-arr)"/>
  <line x1="70" y1="262" x2="322" y2="262" stroke="#111" stroke-width="1.5" marker-end="url(#lending-rate-curve-arr)"/>
  <text x="76" y="46" font-size="11" font-weight="bold">borrow APR</text>
  <text x="190" y="296" font-size="10.5" text-anchor="middle">utilization (borrowed &#247; total)</text>
  <!-- guides -->
  <line x1="70" y1="236.7" x2="262" y2="236.7" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="70" y1="72" x2="310" y2="72" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="262" y1="262" x2="262" y2="236.7" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- the curve: 2% at 0, 20% at the 80% kink, 150% at 100% -->
  <path d="M 70,259.5 L 262,236.7 L 310,72" fill="none" stroke="#111" stroke-width="2.2"/>
  <circle cx="262" cy="236.7" r="3" fill="#111"/>
  <!-- ticks and labels -->
  <line x1="262" y1="262" x2="262" y2="267" stroke="#111" stroke-width="1.2"/>
  <line x1="310" y1="262" x2="310" y2="267" stroke="#111" stroke-width="1.2"/>
  <text x="70" y="278" font-size="10" text-anchor="middle">0</text>
  <text x="262" y="278" font-size="10" font-weight="bold" text-anchor="middle">80%</text>
  <text x="310" y="278" font-size="10" text-anchor="middle">100%</text>
  <text x="64" y="257" font-size="10" text-anchor="end">2%</text>
  <text x="64" y="240" font-size="10" text-anchor="end">20%</text>
  <text x="64" y="76" font-size="10" text-anchor="end">150%</text>
  <text x="252" y="140" font-size="10.5" font-style="italic" fill="#444" text-anchor="end">past the kink the rate spikes,</text>
  <text x="252" y="154" font-size="10.5" font-style="italic" fill="#444" text-anchor="end">pushing borrowers to repay</text>
  <text x="252" y="168" font-size="10.5" font-style="italic" fill="#444" text-anchor="end">and pulling depositors in</text>
  <!-- right panel: the factor -->
  <text x="360" y="24" font-size="12" font-weight="bold">the factor compounds at each refresh</text>
  <line x1="360" y1="262" x2="620" y2="262" stroke="#111" stroke-width="1.5" marker-end="url(#lending-rate-curve-arr)"/>
  <path d="M 372,232 H 410 V 218 H 448 V 202 H 486 V 184 H 524 V 162 H 562 V 136 H 600" fill="none" stroke="#111" stroke-width="2"/>
  <circle cx="410" cy="218" r="3.5" fill="#111"/>
  <circle cx="448" cy="202" r="3.5" fill="#111"/>
  <circle cx="486" cy="184" r="3.5" fill="#111"/>
  <circle cx="524" cy="162" r="3.5" fill="#111"/>
  <circle cx="562" cy="136" r="3.5" fill="#111"/>
  <g stroke="#111" stroke-width="1.2">
    <line x1="410" y1="259" x2="410" y2="265"/><line x1="448" y1="259" x2="448" y2="265"/>
    <line x1="486" y1="259" x2="486" y2="265"/><line x1="524" y1="259" x2="524" y2="265"/>
    <line x1="562" y1="259" x2="562" y2="265"/>
  </g>
  <text x="486" y="278" font-size="10" font-style="italic" fill="#444" text-anchor="middle">refreshes, over five weeks</text>
  <text x="368" y="236" font-size="10.5" text-anchor="end">1.0</text>
  <text x="600" y="126" font-size="10.5" font-weight="bold" text-anchor="end">&#8776; 1.0100</text>
  <text x="490" y="298" font-size="10.5" text-anchor="middle">Bob's debt = principal &#215; factor: $750 &#8594; &#8776; $757.50</text>
  <text x="490" y="313" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">one number reprices every loan in the reserve</text>
</g>
</svg>
