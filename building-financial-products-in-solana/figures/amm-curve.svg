<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Georgia, serif" fill="#111">
  <defs>
    <marker id="amm-curve-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#111"/>
    </marker>
  </defs>
  <!-- axes -->
  <line x1="90" y1="310" x2="90" y2="38" stroke="#111" stroke-width="1.8" marker-end="url(#amm-curve-arr)"/>
  <line x1="90" y1="310" x2="614" y2="310" stroke="#111" stroke-width="1.8" marker-end="url(#amm-curve-arr)"/>
  <text x="100" y="30" font-size="13" font-weight="bold">Y: USDC in pool</text>
  <text x="612" y="334" font-size="13" font-weight="bold" text-anchor="end">X: ACME in pool</text>
  <!-- the hyperbola X * Y = K -->
  <path d="M 110,48 C 130,76 148,97 168,116 C 194,140 221,159 247,175 C 286,198 326,216 365,230 C 404,244 443,255 482,264 C 521,273 561,280 600,287" fill="none" stroke="#111" stroke-width="2"/>
  <text x="470" y="298" font-size="12" font-weight="bold" text-anchor="middle">X &#215; Y = K = 140,000,000</text>
  <!-- guides to the pool's current point -->
  <line x1="247" y1="175" x2="247" y2="308" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="92" y1="175" x2="247" y2="175" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="247" y="330" font-size="12" font-weight="bold" text-anchor="middle">1,000</text>
  <text x="84" y="179" font-size="12" font-weight="bold" text-anchor="end">140,000</text>
  <!-- before and after points -->
  <circle cx="247" cy="175" r="6" fill="#111"/>
  <text x="240" y="194" font-size="12" font-weight="bold" text-anchor="end">before</text>
  <circle cx="168" cy="116" r="6" fill="#111"/>
  <text x="182" y="92" font-size="12" font-weight="bold">after the buy</text>
  <text x="196" y="106" font-size="10.5" fill="#444">X = 800, Y = 175,000 (K unchanged)</text>
  <!-- the trade slides along the curve -->
  <path d="M 253,167 Q 220,145 188,118" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#amm-curve-arr)"/>
  <text x="250" y="56" font-size="11" font-style="italic" fill="#444">a buy slides the pool along the curve:</text>
  <text x="250" y="72" font-size="11" font-style="italic" fill="#444">USDC in, ACME out</text>
  <!-- price = slope -->
  <line x1="252" y1="178" x2="352" y2="238" stroke="#777" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="270" y="266" font-size="11" font-style="italic" fill="#444">slope = spot price = $140</text>
</svg>
