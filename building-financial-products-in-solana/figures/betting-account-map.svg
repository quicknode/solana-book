<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" font-family="Georgia, serif" fill="#111">
  <!-- config -->
  <rect x="240" y="16" width="160" height="48" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="320" y="36" font-size="12" font-weight="bold" text-anchor="middle">config PDA</text>
  <text x="320" y="52" font-size="10" fill="#444" text-anchor="middle">admin: Maria &#183; USDC &#183; fee 2%</text>
