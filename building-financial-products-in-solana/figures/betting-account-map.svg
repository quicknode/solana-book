<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" font-family="Georgia, serif" fill="#111">
  <!-- config -->
  <rect x="240" y="10" width="160" height="62" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="320" y="28" font-size="12" font-weight="bold" text-anchor="middle">config PDA</text>
  <text x="252" y="43" font-size="9.5" fill="#444">admin: Maria</text>
  <text x="252" y="55" font-size="9.5" fill="#444">token_mint: USDC</text>
  <text x="252" y="67" font-size="9.5" fill="#444">fee_bps: 200 (2%)</text>
  <text x="230" y="40" font-size="10" fill="#777" font-style="italic" text-anchor="end">seed: &#8220;config&#8221;</text>
  <line x1="320" y1="72" x2="320" y2="94" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- event -->
  <rect x="210" y="96" width="220" height="72" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="320" y="114" font-size="12" font-weight="bold" text-anchor="middle">event PDA</text>
  <text x="222" y="130" font-size="9.5" fill="#444">status: Open</text>
  <text x="222" y="143" font-size="9.5" fill="#444">total_pool: 600</text>
  <text x="222" y="156" font-size="9.5" fill="#444">fee_bps: 200, snapshotted at creation</text>
  <text x="200" y="128" font-size="10" fill="#777" font-style="italic" text-anchor="end">seeds: &#8220;event&#8221;, id</text>
  <!-- vault -->
  <line x1="432" y1="125" x2="508" y2="125" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="520" cy="125" r="10" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="520" y="98" font-size="11" font-weight="bold" text-anchor="middle">vault</text>
  <text x="520" y="152" font-size="10" fill="#444" text-anchor="middle">ATA, authority = event</text>
  <!-- outcomes -->
  <line x1="280" y1="168" x2="175" y2="194" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="360" y1="168" x2="465" y2="194" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="70" y="196" width="180" height="48" rx="6" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="160" y="215" font-size="11" font-weight="bold" text-anchor="middle">outcome 0: Toy Story 5</text>
  <text x="160" y="232" font-size="10" fill="#444" text-anchor="middle">total_amount: 400</text>
  <rect x="390" y="196" width="180" height="48" rx="6" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="480" y="215" font-size="11" font-weight="bold" text-anchor="middle">outcome 1: Backrooms</text>
  <text x="480" y="232" font-size="10" fill="#444" text-anchor="middle">total_amount: 200</text>
  <text x="320" y="216" font-size="10" fill="#777" font-style="italic" text-anchor="middle">seeds: &#8220;outcome&#8221;,</text>
  <text x="320" y="230" font-size="10" fill="#777" font-style="italic" text-anchor="middle">event, index</text>
  <!-- bets -->
  <line x1="120" y1="244" x2="105" y2="276" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="205" y1="244" x2="250" y2="276" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="480" y1="244" x2="525" y2="276" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="40" y="278" width="130" height="44" rx="5" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="105" y="296" font-size="11" font-weight="bold" text-anchor="middle">Alice&#8217;s bet</text>
  <text x="105" y="312" font-size="10" fill="#444" text-anchor="middle">amount: 300 USDC</text>
  <rect x="185" y="278" width="130" height="44" rx="5" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="250" y="296" font-size="11" font-weight="bold" text-anchor="middle">Bob&#8217;s bet</text>
  <text x="250" y="312" font-size="10" fill="#444" text-anchor="middle">amount: 100 USDC</text>
  <rect x="460" y="278" width="130" height="44" rx="5" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="525" y="296" font-size="11" font-weight="bold" text-anchor="middle">Carol&#8217;s bet</text>
  <text x="525" y="312" font-size="10" fill="#444" text-anchor="middle">amount: 200 USDC</text>
  <text x="388" y="292" font-size="10" fill="#777" font-style="italic" text-anchor="middle">seeds: &#8220;bet&#8221;,</text>
  <text x="388" y="306" font-size="10" fill="#777" font-style="italic" text-anchor="middle">outcome, bettor</text>
  <!-- user index PDAs -->
  <line x1="105" y1="322" x2="105" y2="356" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="250" y1="322" x2="250" y2="356" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="525" y1="322" x2="525" y2="356" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="45" y="358" width="120" height="36" rx="5" fill="#fff" stroke="#888" stroke-width="1"/>
  <text x="105" y="380" font-size="10.5" font-weight="bold" text-anchor="middle">Alice&#8217;s user PDA</text>
  <rect x="190" y="358" width="120" height="36" rx="5" fill="#fff" stroke="#888" stroke-width="1"/>
  <text x="250" y="380" font-size="10.5" font-weight="bold" text-anchor="middle">Bob&#8217;s user PDA</text>
  <rect x="465" y="358" width="120" height="36" rx="5" fill="#fff" stroke="#888" stroke-width="1"/>
  <text x="525" y="380" font-size="10.5" font-weight="bold" text-anchor="middle">Carol&#8217;s user PDA</text>
  <text x="388" y="372" font-size="10.5" fill="#444" font-style="italic" text-anchor="middle">each user PDA indexes</text>
  <text x="388" y="386" font-size="10.5" fill="#444" font-style="italic" text-anchor="middle">its open bets (max 32)</text>
</svg>
