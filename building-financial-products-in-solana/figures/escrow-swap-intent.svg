<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" font-family="Georgia, serif" fill="#111">
  <defs><marker id="escrow-swap-intent-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <!-- Alice: wallet account -->
  <rect x="48" y="72" width="112" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="63" cy="89" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M 55,100 Q 63,93 71,100" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="78" y="89" font-size="10.5" font-weight="bold">Alice (maker)</text>
  <text x="78" y="105" font-size="9.5" fill="#444">0.1 SOL</text>
  <text x="104" y="136" font-size="11" text-anchor="middle">holds 250 USDC</text>
  <text x="104" y="152" font-size="11" font-style="italic" fill="#444" text-anchor="middle">wants 1 TSLAx</text>
  <!-- Bob: wallet account -->
  <rect x="480" y="72" width="112" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="495" cy="89" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M 487,100 Q 495,93 503,100" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="510" y="89" font-size="10.5" font-weight="bold">Bob (taker)</text>
  <text x="510" y="105" font-size="9.5" fill="#444">0.1 SOL</text>
  <text x="536" y="136" font-size="11" text-anchor="middle">holds 1 TSLAx</text>
  <text x="536" y="152" font-size="11" font-style="italic" fill="#444" text-anchor="middle">wants 250 USDC</text>
  <!-- intended swap -->
  <path d="M 164,82 L 476,82" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#escrow-swap-intent-arr)"/>
  <text x="320" y="72" font-size="12" font-weight="bold" text-anchor="middle">250 USDC</text>
  <path d="M 476,106 L 164,106" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#escrow-swap-intent-arr)"/>
  <text x="320" y="126" font-size="12" font-weight="bold" text-anchor="middle">1 TSLAx</text>
  <text x="320" y="214" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">each holds what the other wants; neither wants to send first</text>
</svg>
