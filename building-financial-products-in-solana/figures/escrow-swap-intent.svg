<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" font-family="Georgia, serif" fill="#111">
  <defs><marker id="escrow-swap-intent-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1e7a3c"/></marker></defs>
  <!-- Alice: wallet account -->
  <rect x="48" y="72" width="112" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(56,77)">
    <circle cx="7" cy="4" r="3.1" fill="none" stroke="#111" stroke-width="1.3"/>
    <path d="M 1.5,13 Q 1.5,8.4 7,8.4 Q 12.5,8.4 12.5,13" fill="none" stroke="#111" stroke-width="1.3"/>
  </g>
  <text x="76" y="88" font-size="10.5" font-weight="bold">Alice (maker)</text>
  <line x1="56" y1="93" x2="152" y2="93" stroke="#888" stroke-width="0.8"/>
  <text x="56" y="104" font-size="9.5" fill="#444">1 SOL</text>
  <text x="104" y="136" font-size="11" text-anchor="middle">holds 250 USDC</text>
  <text x="104" y="152" font-size="11" font-style="italic" fill="#444" text-anchor="middle">wants 1 TSLAx</text>
  <!-- Bob: wallet account -->
  <rect x="480" y="72" width="112" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(488,77)">
    <circle cx="7" cy="4" r="3.1" fill="none" stroke="#111" stroke-width="1.3"/>
    <path d="M 1.5,13 Q 1.5,8.4 7,8.4 Q 12.5,8.4 12.5,13" fill="none" stroke="#111" stroke-width="1.3"/>
  </g>
  <text x="508" y="88" font-size="10.5" font-weight="bold">Bob (taker)</text>
  <line x1="488" y1="93" x2="584" y2="93" stroke="#888" stroke-width="0.8"/>
  <text x="488" y="104" font-size="9.5" fill="#444">1 SOL</text>
  <text x="536" y="136" font-size="11" text-anchor="middle">holds 1 TSLAx</text>
  <text x="536" y="152" font-size="11" font-style="italic" fill="#444" text-anchor="middle">wants 250 USDC</text>
  <!-- intended swap -->
  <path d="M 164,82 L 476,82" fill="none" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#escrow-swap-intent-arr)"/>
  <text x="320" y="72" font-size="12" font-weight="bold" fill="#1e7a3c" text-anchor="middle">250 USDC</text>
  <path d="M 476,106 L 164,106" fill="none" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#escrow-swap-intent-arr)"/>
  <text x="320" y="126" font-size="12" font-weight="bold" fill="#1e7a3c" text-anchor="middle">1 TSLAx</text>
  <text x="320" y="214" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">each holds what the other wants; neither wants to send first</text>
  <g class="coin" transform="translate(278.7,67.3)" fill="#fff"><g stroke="#fff" stroke-width="4.5"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g><g stroke="#1e7a3c" stroke-width="1.3"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g></g>
  <g class="coin" transform="translate(282.4,121.3)" fill="#fff"><g stroke="#fff" stroke-width="4.5"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g><g stroke="#1e7a3c" stroke-width="1.3"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g></g>
</svg>
