<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" font-family="'Denim INK', Helvetica, Arial, sans-serif" fill="#111">
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="16" y="24" font-size="15" font-weight="bold">Each holds what the other wants</text>
  <defs><marker id="escrow-swap-intent-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1e7a3c"/></marker></defs>
  <!-- Alice: wallet account -->
  <rect x="48" y="72" width="112" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(56,75.5)"><g transform="translate(0.36,0.767) scale(0.8301)" fill="#111"><path d="M10.561 8.073a6 6 0 0 1 3.432 5.142a.75.75 0 1 1-1.498.07a4.5 4.5 0 0 0-8.99 0a.75.75 0 0 1-1.498-.07a6 6 0 0 1 3.431-5.142a3.999 3.999 0 1 1 5.123 0M10.5 5a2.5 2.5 0 1 0-5 0a2.5 2.5 0 0 0 5 0"/></g></g>
  <text x="76" y="86.175" font-size="10.5" font-weight="bold">Alice</text>
  <line x1="56" y1="93" x2="152" y2="93" stroke="#888" stroke-width="0.8"/>
  <text x="56" y="104" font-size="9.5" fill="#444">1 SOL</text>
  <text x="104" y="136" font-size="11" text-anchor="middle">offers 250 USDC</text>
  <text x="104" y="152" font-size="11" font-style="italic" fill="#444" text-anchor="middle">wants 1 TSLAx</text>
  <!-- Bob: wallet account -->
  <rect x="480" y="72" width="112" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(488,75.5)"><g transform="translate(0.36,0.767) scale(0.8301)" fill="#111"><path d="M10.561 8.073a6 6 0 0 1 3.432 5.142a.75.75 0 1 1-1.498.07a4.5 4.5 0 0 0-8.99 0a.75.75 0 0 1-1.498-.07a6 6 0 0 1 3.431-5.142a3.999 3.999 0 1 1 5.123 0M10.5 5a2.5 2.5 0 1 0-5 0a2.5 2.5 0 0 0 5 0"/></g></g>
  <text x="508" y="86.175" font-size="10.5" font-weight="bold">Bob</text>
  <line x1="488" y1="93" x2="584" y2="93" stroke="#888" stroke-width="0.8"/>
  <text x="488" y="104" font-size="9.5" fill="#444">1 SOL</text>
  <text x="536" y="136" font-size="11" text-anchor="middle">holds 1 TSLAx</text>
  <text x="536" y="152" font-size="11" font-style="italic" fill="#444" text-anchor="middle">wants 250 USDC</text>
  <!-- intended swap -->
  <path d="M 164,82 L 476,82" fill="none" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#escrow-swap-intent-arr)"/>
  <text x="293.16" y="68.33" font-size="12" font-weight="bold" fill="#1e7a3c">250 USDC</text>
  <path d="M 476,100 L 164,100" fill="none" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#escrow-swap-intent-arr)"/>
  <text x="296.73" y="127.67" font-size="12" font-weight="bold" fill="#1e7a3c">1 TSLAx</text>
  <text x="320" y="214" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">neither wants to send first</text>
  <g class="coin" transform="translate(320,82)" fill="#fff"><g stroke="#fff" stroke-width="4.5"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g><g stroke="#1e7a3c" stroke-width="1.3"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g></g>
  <g class="coin" transform="translate(320,100)" fill="#fff"><g stroke="#fff" stroke-width="4.5"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g><g stroke="#1e7a3c" stroke-width="1.3"><circle cx="5" cy="1.5" r="4.5"/><circle cx="0" cy="0" r="4.5"/><circle cx="-5" cy="1.5" r="4.5"/></g></g>
</svg>
