<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" font-family="Georgia, serif" fill="#111">
  <defs><marker id="escrow-swap-intent-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <!-- Alice -->
  <circle cx="110" cy="84" r="16" fill="none" stroke="#111" stroke-width="1.5"/>
  <path d="M 85,126 Q 110,104 135,126" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="110" y="146" font-size="12" font-weight="bold" text-anchor="middle">Alice</text>
  <text x="110" y="166" font-size="11" text-anchor="middle">holds 250 USDC</text>
  <text x="110" y="182" font-size="11" font-style="italic" fill="#444" text-anchor="middle">wants 1 TSLAx</text>
  <!-- Bob -->
  <circle cx="530" cy="84" r="16" fill="none" stroke="#111" stroke-width="1.5"/>
  <path d="M 505,126 Q 530,104 555,126" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="530" y="146" font-size="12" font-weight="bold" text-anchor="middle">Bob</text>
  <text x="530" y="166" font-size="11" text-anchor="middle">holds 1 TSLAx</text>
  <text x="530" y="182" font-size="11" font-style="italic" fill="#444" text-anchor="middle">wants 250 USDC</text>
  <!-- intended swap -->
  <path d="M 170,76 L 470,76" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#escrow-swap-intent-arr)"/>
  <text x="320" y="66" font-size="12" font-weight="bold" text-anchor="middle">250 USDC</text>
  <path d="M 470,110 L 170,110" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#escrow-swap-intent-arr)"/>
  <text x="320" y="132" font-size="12" font-weight="bold" text-anchor="middle">1 TSLAx</text>
  <text x="320" y="214" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">each holds what the other wants; neither wants to send first</text>
</svg>
