    <circle cx="282" cy="562" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="292" y="559" font-size="7.5" letter-spacing="0.4" fill="#555">SEEDS: ATA PROGRAM +</text>
    <text x="292" y="568" font-size="7.5" letter-spacing="0.4" fill="#555">CAROL&#8217;S ADDRESS +</text>
    <text x="292" y="577" font-size="7.5" letter-spacing="0.4" fill="#555">USDC MINT</text>
  </g>
  <g opacity="0.3">
