    <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="220" y="620" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
    <rect x="156" y="632" width="104" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <circle cx="171" cy="649" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
    <path d="M 163,660 Q 171,653 179,660" fill="none" stroke="#111" stroke-width="1.3"/>
    <text x="186" y="649" font-size="10.5" font-weight="bold">Bob</text>
