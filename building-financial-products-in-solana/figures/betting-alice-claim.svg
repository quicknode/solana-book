<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" font-family="Georgia, serif" fill="#111">
  <defs>
    <marker id="betting-claim-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker>
    <marker id="betting-claim-arrg" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#777"/></marker>
  </defs>
  <!-- config PDA, untouched by claim_winnings -->
  <g opacity="0.3">
    <circle cx="178" cy="14" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="190" y="17" font-size="8.5" letter-spacing="0.6" fill="#555">SEEDS: &#8220;CONFIG&#8221;</text>
    <rect x="170" y="24" width="160" height="70" rx="6" fill="#f4f4f2" stroke="#888"/>
    <text x="180" y="40" font-size="10.5" font-weight="bold">config</text>
    <text x="180" y="54" font-size="9.5">admin: Maria</text>
    <text x="180" y="66" font-size="9.5">token_mint: USDC</text>
    <text x="180" y="78" font-size="9.5">fee_recipient: Maria</text>
    <text x="180" y="90" font-size="9" fill="#444">fee_bps: 200 (2%)</text>
  </g>
  <!-- the betting program -->
  <g>
    <circle cx="478" cy="8" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="490" y="11" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
    <rect x="470" y="16" width="160" height="118" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <text x="480" y="32" font-size="10.5" font-weight="bold">betting program</text>
    <text x="480" y="46" font-size="8.5" font-family="Menlo, monospace" fill="#888">initialize_config</text>
    <text x="480" y="57" font-size="8.5" font-family="Menlo, monospace" fill="#888">create_event</text>
    <text x="480" y="68" font-size="8.5" font-family="Menlo, monospace" fill="#888">add_outcome</text>
    <text x="480" y="79" font-size="8.5" font-family="Menlo, monospace" fill="#888">place_bet</text>
    <text x="480" y="90" font-size="8.5" font-family="Menlo, monospace" fill="#888">settle_event</text>
    <text x="480" y="101" font-size="8.5" font-family="Menlo, monospace" fill="#888">cancel_event</text>
    <text x="480" y="112" font-size="8.5" font-family="Menlo, monospace" font-weight="bold">claim_winnings</text>
    <text x="480" y="123" font-size="8.5" font-family="Menlo, monospace" fill="#888">claim_refund</text>
  </g>
  <!-- event PDA: read for the payout math -->
  <g>
    <circle cx="210" cy="104" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="222" y="107" font-size="8.5" letter-spacing="0.6" fill="#555">SEEDS: &#8220;EVENT&#8221; + EVENT ID</text>
    <rect x="210" y="114" width="220" height="66" rx="6" fill="#f4f4f2" stroke="#888"/>
    <text x="220" y="131" font-size="10.5" font-weight="bold">event</text>
    <text x="220" y="146" font-size="9.5">status: Settled &#183; winning_outcome: 0</text>
    <text x="220" y="159" font-size="9.5">distributable_losing_pool: 196</text>
    <text x="220" y="172" font-size="9" fill="#444">winning_pool: 400</text>
  </g>
  <!-- the vault pays Alice -->
  <g>
    <circle cx="452" cy="146" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="464" y="143" font-size="8.5" letter-spacing="0.6" fill="#555">SEEDS: ATA PROGRAM + EVENT&#8217;S</text>
    <text x="464" y="154" font-size="8.5" letter-spacing="0.6" fill="#555">ADDRESS + USDC MINT ADDRESS</text>
    <rect x="460" y="158" width="150" height="54" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <text x="470" y="176" font-size="10.5" font-weight="bold">vault: the event&#8217;s USDC</text>
    <text x="470" y="191" font-size="9.5" fill="#444">149 USDC</text>
    <text x="470" y="204" font-size="9" fill="#444" font-style="italic">149 left: Bob&#8217;s exact claim</text>
  </g>
