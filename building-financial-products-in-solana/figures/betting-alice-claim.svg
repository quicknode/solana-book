    <text x="404" y="527" font-size="10.5" font-weight="bold">Maria&#8217;s USDC</text>
    <text x="404" y="542" font-size="9.5" fill="#444">1,004 USDC</text>
    <circle cx="400" cy="562" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="410" y="559" font-size="7.5" letter-spacing="0.4" fill="#555">SEEDS: ATA PROGRAM +</text>
    <text x="410" y="568" font-size="7.5" letter-spacing="0.4" fill="#555">MARIA&#8217;S ADDRESS +</text>
    <text x="410" y="577" font-size="7.5" letter-spacing="0.4" fill="#555">USDC MINT</text>
