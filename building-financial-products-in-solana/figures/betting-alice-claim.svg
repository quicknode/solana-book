<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Georgia, serif" fill="#111">
  <defs><marker id="betting-claim-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <!-- vault -->
  <circle cx="90" cy="104" r="16" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="90" y="72" font-size="12" font-weight="bold" text-anchor="middle">vault</text>
  <text x="90" y="134" font-size="10" fill="#444" text-anchor="middle">holds 596 after fee</text>
  <text x="90" y="150" font-size="10" fill="#444" font-style="italic" text-anchor="middle">&#8594; 149 left: Bob&#8217;s exact claim</text>
  <!-- Alice: wallet account -->
  <rect x="500" y="82" width="104" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="515" cy="99" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M 507,110 Q 515,103 523,110" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="530" y="99" font-size="10.5" font-weight="bold">Alice</text>
  <text x="530" y="115" font-size="9.5" fill="#444">0.1 SOL</text>
  <!-- payout transfer -->
  <path d="M 108,100 L 496,100" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#betting-claim-arr)"/>
  <text x="310" y="54" font-size="12" font-weight="bold" text-anchor="middle">2. transfer: 447 USDC to Alice</text>
  <text x="310" y="72" font-size="10.5" fill="#444" text-anchor="middle">300 stake + floor(300 &#215; 196 &#247; 400) = 300 + 147</text>
  <text x="310" y="118" font-size="10" fill="#444" font-style="italic" text-anchor="middle">signed by the event PDA</text>
  <!-- user index drops the bet first -->
  <rect x="40" y="190" width="180" height="52" rx="5" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="130" y="208" font-size="11" font-weight="bold" text-anchor="middle">Alice&#8217;s user PDA</text>
  <text x="130" y="226" font-size="10.5" text-anchor="middle">bet: Toy Story 5</text>
  <line x1="85" y1="222" x2="175" y2="222" stroke="#999" stroke-width="1.4"/>
  <text x="130" y="258" font-size="10.5" font-weight="bold" text-anchor="middle">1. index entry removed first</text>
  <text x="130" y="272" font-size="10" fill="#444" font-style="italic" text-anchor="middle">effects before interactions</text>
  <!-- bet account closes -->
  <rect x="290" y="190" width="150" height="40" rx="5" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <line x1="290" y1="190" x2="440" y2="230" stroke="#999" stroke-width="1.6"/>
  <line x1="440" y1="190" x2="290" y2="230" stroke="#999" stroke-width="1.6"/>
  <text x="365" y="258" font-size="10.5" font-weight="bold" text-anchor="middle">3. bet account closed</text>
  <text x="365" y="272" font-size="10" fill="#444" font-style="italic" text-anchor="middle">no account, no double claim</text>
  <!-- rent refund -->
  <path d="M 442,196 C 482,182 512,158 534,131" fill="none" stroke="#111" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#betting-claim-arr)"/>
  <text x="502" y="214" font-size="10" fill="#444" font-style="italic" text-anchor="middle">rent refunded to Alice</text>
  <text stroke="#f4f4f2" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="365" y="214" font-size="11" text-anchor="middle">Alice&#8217;s bet: 300</text>
</svg>
