<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 278" font-family="Georgia, serif" fill="#111">
  <!-- thermometer: ten slices, each one contributor's cap -->
  <rect x="80" y="40" width="120" height="220" fill="#fff" stroke="#111" stroke-width="2"/>
  <g>
    <rect x="80" y="238" width="120" height="22" fill="#fff" stroke="#888" stroke-width="0.8"/>
    <rect x="80" y="216" width="120" height="22" fill="#f4f4f2" stroke="#888" stroke-width="0.8"/>
    <rect x="80" y="194" width="120" height="22" fill="#fff" stroke="#888" stroke-width="0.8"/>
    <rect x="80" y="172" width="120" height="22" fill="#f4f4f2" stroke="#888" stroke-width="0.8"/>
    <rect x="80" y="150" width="120" height="22" fill="#fff" stroke="#888" stroke-width="0.8"/>
    <rect x="80" y="128" width="120" height="22" fill="#f4f4f2" stroke="#888" stroke-width="0.8"/>
    <rect x="80" y="106" width="120" height="22" fill="#fff" stroke="#888" stroke-width="0.8"/>
    <rect x="80" y="84" width="120" height="22" fill="#f4f4f2" stroke="#888" stroke-width="0.8"/>
    <rect x="80" y="62" width="120" height="22" fill="#fff" stroke="#888" stroke-width="0.8"/>
    <rect x="80" y="40" width="120" height="22" fill="#f4f4f2" stroke="#888" stroke-width="0.8"/>
  </g>
  <rect x="80" y="40" width="120" height="220" fill="none" stroke="#111" stroke-width="2"/>
  <text x="140" y="252" font-size="9.5" text-anchor="middle">Alice 900</text>
  <text x="140" y="230" font-size="9.5" text-anchor="middle">Bob 900</text>
  <text x="140" y="208" font-size="9.5" text-anchor="middle">Carol 450 + 450</text>
  <text x="140" y="186" font-size="9.5" fill="#444" text-anchor="middle">seven</text>
  <text x="140" y="164" font-size="9.5" fill="#444" text-anchor="middle">more</text>
  <text x="140" y="142" font-size="9.5" fill="#444" text-anchor="middle">backers</text>
  <text x="140" y="120" font-size="9.5" fill="#444" text-anchor="middle">at</text>
  <text x="140" y="98" font-size="9.5" fill="#444" text-anchor="middle">900</text>
  <text x="140" y="76" font-size="9.5" fill="#444" text-anchor="middle">each</text>
  <text x="140" y="54" font-size="9.5" fill="#444" text-anchor="middle">&#8230;</text>
  <!-- target line -->
  <line x1="60" y1="40" x2="220" y2="40" stroke="#111" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="140" y="28" font-size="11" font-weight="bold" text-anchor="middle">target: 9,000 USDC</text>
  <!-- one slice, bracketed -->
  <path d="M 210,251 L 210,239" stroke="#111" stroke-width="1.2"/>
  <line x1="205" y1="238" x2="215" y2="238" stroke="#111" stroke-width="1.2"/>
  <line x1="205" y1="260" x2="215" y2="260" stroke="#111" stroke-width="1.2"/>
  <text x="226" y="247" font-size="10.5">one slice = the cap:</text>
  <text x="226" y="262" font-size="10.5">10% of target = 900 USDC</text>
  <!-- right-side explanation -->
  <text x="330" y="96" font-size="12" font-weight="bold">ten slices fill the thermometer</text>
  <text x="330" y="118" font-size="10.5" fill="#444">no contributor may carry more than one slice,</text>
  <text x="330" y="134" font-size="10.5" fill="#444">and the cap is cumulative across their contributions,</text>
  <text x="330" y="150" font-size="10.5" fill="#444">so a successful raise needs at least ten distinct backers</text>
  <text x="330" y="178" font-size="10.5" fill="#444" font-style="italic">over the cap in one call: ContributionTooBig</text>
  <text x="330" y="194" font-size="10.5" fill="#444" font-style="italic">over the cap across calls: MaximumContributionsReached</text>
  <text x="330" y="210" font-size="10.5" fill="#444" font-style="italic">under one major unit: ContributionTooSmall</text>
</svg>
