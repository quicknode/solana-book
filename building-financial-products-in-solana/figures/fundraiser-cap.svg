<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 278" font-family="Georgia, serif" fill="#111">
  <!-- thermometer: one slice per backer, each slice's height its contribution -->
  <rect x="80" y="40" width="120" height="220" fill="#fff" stroke="#111" stroke-width="2"/>
  <g>
    <rect x="80" y="238" width="120" height="22" fill="#fff" stroke="#888" stroke-width="0.8"/>
    <rect x="80" y="216" width="120" height="22" fill="#f4f4f2" stroke="#888" stroke-width="0.8"/>
    <rect x="80" y="194" width="120" height="22" fill="#fff" stroke="#888" stroke-width="0.8"/>
    <rect x="80" y="174.444" width="120" height="19.556" fill="#f4f4f2" stroke="#888" stroke-width="0.8"/>
    <rect x="80" y="152.444" width="120" height="22" fill="#fff" stroke="#888" stroke-width="0.8"/>
    <rect x="80" y="135.333" width="120" height="17.111" fill="#f4f4f2" stroke="#888" stroke-width="0.8"/>
    <rect x="80" y="113.333" width="120" height="22" fill="#fff" stroke="#888" stroke-width="0.8"/>
    <rect x="80" y="95" width="120" height="18.333" fill="#f4f4f2" stroke="#888" stroke-width="0.8"/>
    <rect x="80" y="73" width="120" height="22" fill="#fff" stroke="#888" stroke-width="0.8"/>
    <rect x="80" y="59.556" width="120" height="13.444" fill="#f4f4f2" stroke="#888" stroke-width="0.8"/>
    <rect x="80" y="40" width="120" height="19.556" fill="#fff" stroke="#888" stroke-width="0.8"/>
  </g>
  <rect x="80" y="40" width="120" height="220" fill="none" stroke="#111" stroke-width="2"/>
  <text x="140" y="252.2" font-size="9.5" text-anchor="middle">Alice 900</text>
  <text x="140" y="230.2" font-size="9.5" text-anchor="middle">Bob 900</text>
  <text x="140" y="208.2" font-size="9.5" text-anchor="middle">Carol 450 + 450</text>
  <text x="140" y="187.4" font-size="9.5" text-anchor="middle">Dave 800</text>
  <text x="140" y="166.6" font-size="9.5" text-anchor="middle">Erin 900</text>
  <text x="140" y="147.1" font-size="9" text-anchor="middle">Frank 700</text>
  <text x="140" y="127.5" font-size="9.5" text-anchor="middle">Grace 900</text>
  <text x="140" y="107.4" font-size="9.5" text-anchor="middle">Henry 750</text>
  <text x="140" y="87.2" font-size="9.5" text-anchor="middle">Iris 900</text>
  <text x="140" y="69.3" font-size="8.5" text-anchor="middle">Jack 550</text>
  <text x="140" y="53" font-size="9.5" text-anchor="middle">Kira 800</text>
  <!-- target line -->
  <line x1="60" y1="40" x2="220" y2="40" stroke="#111" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="140" y="28" font-size="11" font-weight="bold" text-anchor="middle">target: 9,000 USDC</text>
  <!-- the cap, measured against the tallest slice a backer may have -->
  <path d="M 210,238 L 210,260" stroke="#111" stroke-width="1.2"/>
  <line x1="205" y1="238" x2="215" y2="238" stroke="#111" stroke-width="1.2"/>
  <line x1="205" y1="260" x2="215" y2="260" stroke="#111" stroke-width="1.2"/>
  <text x="226" y="247" font-size="10.5">the cap: 10% of target,</text>
  <text x="226" y="262" font-size="10.5">so 900 USDC, and no slice is taller</text>
  <!-- right-side explanation -->
  <text x="330" y="96" font-size="12" font-weight="bold">the cap forces a crowd</text>
  <text x="330" y="118" font-size="10.5" fill="#444">no backer may exceed 900, and the cap is cumulative</text>
  <text x="330" y="134" font-size="10.5" fill="#444">across their contributions, so a successful raise needs</text>
  <text x="330" y="150" font-size="10.5" fill="#444">at least ten distinct backers. This one took eleven,</text>
  <text x="330" y="166" font-size="10.5" fill="#444">because most of them gave less than the cap.</text>
  <text x="330" y="194" font-size="10.5" fill="#444" font-style="italic">over the cap in one call: ContributionTooBig</text>
  <text x="330" y="210" font-size="10.5" fill="#444" font-style="italic">over the cap across calls: MaximumContributionsReached</text>
  <text x="330" y="226" font-size="10.5" fill="#444" font-style="italic">under one major unit: ContributionTooSmall</text>
</svg>
