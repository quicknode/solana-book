<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="Georgia, serif" fill="#111">
  <!-- thermometer -->
  <rect x="80" y="40" width="120" height="180" fill="#fff" stroke="#111" stroke-width="2"/>
  <g font-size="9.5" fill="#444" text-anchor="middle">
    <rect x="80" y="202" width="120" height="18" fill="#fff" stroke="#888" stroke-width="0.8"/>
    <rect x="80" y="184" width="120" height="18" fill="#f4f4f2" stroke="#888" stroke-width="0.8"/>
    <rect x="80" y="166" width="120" height="18" fill="#fff" stroke="#888" stroke-width="0.8"/>
    <rect x="80" y="148" width="120" height="18" fill="#f4f4f2" stroke="#888" stroke-width="0.8"/>
    <rect x="80" y="130" width="120" height="18" fill="#fff" stroke="#888" stroke-width="0.8"/>
    <rect x="80" y="112" width="120" height="18" fill="#f4f4f2" stroke="#888" stroke-width="0.8"/>
    <rect x="80" y="94" width="120" height="18" fill="#fff" stroke="#888" stroke-width="0.8"/>
    <rect x="80" y="76" width="120" height="18" fill="#f4f4f2" stroke="#888" stroke-width="0.8"/>
    <rect x="80" y="58" width="120" height="18" fill="#fff" stroke="#888" stroke-width="0.8"/>
    <rect x="80" y="40" width="120" height="18" fill="#f4f4f2" stroke="#888" stroke-width="0.8"/>
  </g>
  <rect x="80" y="40" width="120" height="180" fill="none" stroke="#111" stroke-width="2"/>
  <text x="140" y="215" font-size="9.5" text-anchor="middle">Alice 900</text>
  <text x="140" y="197" font-size="9.5" text-anchor="middle">Bob 900</text>
  <text x="140" y="179" font-size="9.5" text-anchor="middle">Carol 450 + 450</text>
  <text x="140" y="161" font-size="9.5" fill="#444" text-anchor="middle">seven</text>
  <text x="140" y="143" font-size="9.5" fill="#444" text-anchor="middle">more</text>
  <text x="140" y="125" font-size="9.5" fill="#444" text-anchor="middle">backers</text>
  <text x="140" y="107" font-size="9.5" fill="#444" text-anchor="middle">at</text>
  <text x="140" y="89" font-size="9.5" fill="#444" text-anchor="middle">900</text>
  <text x="140" y="71" font-size="9.5" fill="#444" text-anchor="middle">each</text>
  <text x="140" y="53" font-size="9.5" fill="#444" text-anchor="middle">&#8230;</text>
  <!-- target line -->
  <line x1="60" y1="40" x2="220" y2="40" stroke="#111" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="140" y="28" font-size="11" font-weight="bold" text-anchor="middle">target: 9,000 USDC</text>
  <!-- cap annotation -->
  <path d="M 210,211 L 210,203" stroke="#111" stroke-width="1.2"/>
  <line x1="205" y1="202" x2="215" y2="202" stroke="#111" stroke-width="1.2"/>
  <line x1="205" y1="220" x2="215" y2="220" stroke="#111" stroke-width="1.2"/>
  <text x="226" y="215" font-size="10.5">one slice = the cap:</text>
  <text x="226" y="230" font-size="10.5">10% of target = 900 USDC</text>
  <!-- right-side explanation -->
  <text x="330" y="70" font-size="12" font-weight="bold">ten slices fill the thermometer</text>
  <text x="330" y="92" font-size="10.5" fill="#444">no contributor may carry more than one slice,</text>
  <text x="330" y="108" font-size="10.5" fill="#444">and the cap is cumulative across their contributions,</text>
  <text x="330" y="124" font-size="10.5" fill="#444">so a successful raise needs at least ten distinct backers</text>
  <text x="330" y="152" font-size="10.5" fill="#444" font-style="italic">over the cap in one call: ContributionTooBig</text>
  <text x="330" y="168" font-size="10.5" fill="#444" font-style="italic">over the cap across calls: MaximumContributionsReached</text>
  <text x="330" y="184" font-size="10.5" fill="#444" font-style="italic">under one major unit: ContributionTooSmall</text>
</svg>
