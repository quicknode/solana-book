<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 373" font-family="Gelasio, Georgia, serif" fill="#111">
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="16" y="24" font-size="15" font-weight="bold">The book as a tree</text>
<g transform="translate(0,13)">
  <defs><marker id="order-book-critbit-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <text x="30" y="28" font-size="12" font-weight="bold">key = price bits &#183; sequence bits</text>
  <text x="30" y="44" font-size="10.5" font-style="italic" fill="#444">the tree branches at the first bit where keys differ</text>
  <!-- inner nodes: the critical bits -->
  <circle cx="330" cy="80" r="16" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="330" y="84" font-size="10" text-anchor="middle">bit 0</text>
  <circle cx="175" cy="160" r="16" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="175" y="164" font-size="10" text-anchor="middle">bit 3</text>
  <text x="150" y="156" font-size="10" font-style="italic" fill="#444" text-anchor="end">bits 1 and 2 are the same,</text>
  <text x="150" y="169" font-size="10" font-style="italic" fill="#444" text-anchor="end">so the split moves to bit 3</text>
  <circle cx="485" cy="160" r="16" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="485" y="164" font-size="10" text-anchor="middle">bit 1</text>
  <!-- edges, labelled with the bit taken -->
  <line x1="317" y1="90" x2="188" y2="151" stroke="#111" stroke-width="1.5"/>
  <text x="242" y="112" font-size="10" font-weight="bold">0</text>
  <line x1="343" y1="90" x2="472" y2="151" stroke="#111" stroke-width="1.5"/>
  <text x="412" y="112" font-size="10" font-weight="bold">1</text>
  <line x1="166" y1="174" x2="110" y2="226" stroke="#111" stroke-width="1.5"/>
  <text x="124" y="198" font-size="10" font-weight="bold">0</text>
  <line x1="184" y1="174" x2="240" y2="226" stroke="#111" stroke-width="1.5"/>
  <text x="222" y="198" font-size="10" font-weight="bold">1</text>
  <line x1="476" y1="174" x2="420" y2="226" stroke="#111" stroke-width="1.5"/>
  <text x="434" y="198" font-size="10" font-weight="bold">0</text>
  <line x1="494" y1="174" x2="550" y2="226" stroke="#111" stroke-width="1.5"/>
  <text x="532" y="198" font-size="10" font-weight="bold">1</text>
  <!-- four leaves: resting orders -->
  <rect x="50" y="230" width="110" height="64" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="105" y="248" font-size="13" font-weight="bold" text-anchor="middle" font-family="'DejaVu Sans Mono', Menlo, monospace"><tspan text-decoration="underline">0</tspan>10<tspan text-decoration="underline">0</tspan></text>
  <text x="105" y="266" font-size="10" font-style="italic" fill="#444" text-anchor="middle">Price: 1 (01)</text>
  <text x="105" y="282" font-size="10" font-style="italic" fill="#444" text-anchor="middle">Sequence: 0 (00)</text>
  <rect x="190" y="230" width="110" height="64" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="245" y="248" font-size="13" font-weight="bold" text-anchor="middle" font-family="'DejaVu Sans Mono', Menlo, monospace"><tspan text-decoration="underline">0</tspan>10<tspan text-decoration="underline">1</tspan></text>
  <text x="245" y="266" font-size="10" font-style="italic" fill="#444" text-anchor="middle">Price: 1 (01)</text>
  <text x="245" y="282" font-size="10" font-style="italic" fill="#444" text-anchor="middle">Sequence: 1 (01)</text>
  <rect x="360" y="230" width="110" height="64" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="415" y="248" font-size="13" font-weight="bold" text-anchor="middle" font-family="'DejaVu Sans Mono', Menlo, monospace"><tspan text-decoration="underline">10</tspan>00</text>
  <text x="415" y="266" font-size="10" font-style="italic" fill="#444" text-anchor="middle">Price: 2 (10)</text>
  <text x="415" y="282" font-size="10" font-style="italic" fill="#444" text-anchor="middle">Sequence: 0 (00)</text>
  <rect x="500" y="230" width="110" height="64" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="555" y="248" font-size="13" font-weight="bold" text-anchor="middle" font-family="'DejaVu Sans Mono', Menlo, monospace"><tspan text-decoration="underline">11</tspan>00</text>
  <text x="555" y="266" font-size="10" font-style="italic" fill="#444" text-anchor="middle">Price: 3 (11)</text>
  <text x="555" y="282" font-size="10" font-style="italic" fill="#444" text-anchor="middle">Sequence: 0 (00)</text>
  <!-- walk order -->
  <text x="105" y="308" font-size="11" font-weight="bold" text-anchor="middle">1st</text>
  <text x="245" y="308" font-size="11" font-weight="bold" text-anchor="middle">2nd</text>
  <text x="415" y="308" font-size="11" font-weight="bold" text-anchor="middle">3rd</text>
  <text x="555" y="308" font-size="11" font-weight="bold" text-anchor="middle">4th</text>
  <path d="M 60,324 L 600,324" fill="none" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#order-book-critbit-arr)"/>
  <text x="330" y="344" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">walk order: best price first; within a price, earliest sequence first (price-time priority)</text>
</g>
</svg>
