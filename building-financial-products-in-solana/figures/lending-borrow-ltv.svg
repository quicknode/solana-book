<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" font-family="Georgia, serif" fill="#111">
  <defs>
    <marker id="lending-borrow-ltv-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker>
    <pattern id="lending-borrow-ltv-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#888" stroke-width="1.4"/></pattern>
  </defs>
  <!-- Bob -->
  <rect x="10" y="64" width="112" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="25" cy="81" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M 17,92 Q 25,85 33,92" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="40" y="81" font-size="10.5" font-weight="bold">Bob</text>
  <text x="40" y="97" font-size="9.5" fill="#444">0.1 SOL</text>
  <!-- Bob's obligation -->
  <rect x="180" y="36" width="225" height="118" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <circle cx="198" cy="58" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="211" y="62" font-size="12" font-weight="bold">Bob&#8217;s obligation</text>
  <circle cx="202" cy="88" r="5" fill="#fff" stroke="#111" stroke-width="1.6"/>
  <text x="214" y="92" font-size="11">collateral vault</text>
  <text x="214" y="108" font-size="10.5" fill="#444">5 NVDAx shares &#8776; $1,000</text>
  <text x="197" y="136" font-size="11">borrow: 750 USDC</text>
  <!-- USDC reserve -->
  <rect x="465" y="42" width="155" height="76" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="542" y="64" font-size="12" font-weight="bold" text-anchor="middle">USDC reserve</text>
  <circle cx="487" cy="92" r="5" fill="#fff" stroke="#111" stroke-width="1.6"/>
  <text x="499" y="96" font-size="10.5">liquidity vault</text>
  <!-- flows -->
  <path d="M 126,78 C 145,68 158,62 176,60" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#lending-borrow-ltv-arr)"/>
  <text x="112" y="44" font-size="11" font-weight="bold" text-anchor="middle">5 NVDAx shares</text>
  <path d="M 465,112 C 420,190 190,185 84,112" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#lending-borrow-ltv-arr)"/>
  <text x="280" y="196" font-size="12" font-weight="bold" text-anchor="middle">$750 USDC</text>
  <!-- health gauge -->
  <text x="40" y="240" font-size="11" font-weight="bold">Bob&#8217;s position, marked to market</text>
  <rect x="40" y="252" width="360" height="18" fill="url(#lending-borrow-ltv-hatch)" stroke="none"/>
  <rect x="40" y="252" width="480" height="18" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="528" y="261" font-size="10.5" fill="#444">collateral</text>
  <text x="528" y="274" font-size="10.5" fill="#444">$1,000</text>
  <line x1="400" y1="248" x2="400" y2="274" stroke="#111" stroke-width="1.8"/>
  <text x="396" y="290" font-size="10.5" font-weight="bold" text-anchor="end">debt $750</text>
  <text x="396" y="303" font-size="10.5" fill="#444" text-anchor="end">(75% max LTV)</text>
  <line x1="424" y1="244" x2="424" y2="280" stroke="#111" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="430" y="248" font-size="10.5">liquidation threshold $800 (80%)</text>
  <text x="320" y="332" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">only $50 of buffer between the most he may borrow and the point he can be liquidated</text>
</svg>
