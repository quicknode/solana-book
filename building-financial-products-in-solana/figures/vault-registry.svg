  <text x="492" y="135.37" font-size="10.5" font-weight="bold">vault-strategy program</text>
  <line x1="472" y1="140.37" x2="624" y2="140.37" stroke="#888" stroke-width="0.8"/>
  <text x="472" y="151.37" font-size="8.5" font-family="Menlo, monospace" font-weight="bold" fill="#1e7a3c">initialize_registry()</text>
  <text x="472" y="161.37" font-size="8.5" font-family="Menlo, monospace" font-weight="bold" fill="#1e7a3c">approve_asset()</text>
  <text x="472" y="171.37" font-size="8.5" font-family="Menlo, monospace">initialize_strategy()</text>
  <text x="472" y="181.37" font-size="8.5" font-family="Menlo, monospace">add_asset()</text>
  <text x="472" y="191.37" font-size="8.5" font-family="Menlo, monospace">set_weight()</text>
  <text x="472" y="201.37" font-size="8.5" font-family="Menlo, monospace">deposit()</text>
  <text x="472" y="211.37" font-size="8.5" font-family="Menlo, monospace">rebalance()</text>
  <text x="472" y="221.37" font-size="8.5" font-family="Menlo, monospace">collect_fees()</text>
