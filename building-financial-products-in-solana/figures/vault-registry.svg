<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 568" font-family="Georgia, serif" fill="#111">
  <!-- Victor builds the approved set: initialize_registry() once, approve_asset() per mint -->
  <defs>
    <marker id="vault-registry-arrx" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#999"/></marker>
  </defs>
  <!-- the curve on top: every on-curve address dot sits on it, everything hangs below -->
  <path d="M 0,36 Q 400,36 640,116" fill="none" stroke="#111" stroke-width="3.5"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="628" y="24" font-size="13" font-weight="bold" text-anchor="end">Solana Devnet</text>
  <!-- TSLAx mint, tucked in the pocket above the curve's left end -->
  <g>
    <circle cx="288" cy="48" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <rect x="280" y="2" width="104" height="28" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <g transform="translate(288,6)" stroke="#111" stroke-width="1.2" fill="none">
      <path d="M 1,5 L 7,1 L 13,5 Z"/>
      <line x1="3" y1="6.5" x2="3" y2="11"/>
      <line x1="7" y1="6.5" x2="7" y2="11"/>
      <line x1="11" y1="6.5" x2="11" y2="11"/>
      <line x1="1.5" y1="12.5" x2="12.5" y2="12.5"/>
    </g>
    <text x="306" y="20" font-size="10.5" font-weight="bold">TSLAx mint</text>
  </g>
  <!-- NVDAx mint, tucked in the pocket left of the apex -->
  <g>
    <circle cx="428" cy="66" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <rect x="390" y="10" width="104" height="28" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <g transform="translate(398,14)" stroke="#111" stroke-width="1.2" fill="none">
      <path d="M 1,5 L 7,1 L 13,5 Z"/>
      <line x1="3" y1="6.5" x2="3" y2="11"/>
      <line x1="7" y1="6.5" x2="7" y2="11"/>
      <line x1="11" y1="6.5" x2="11" y2="11"/>
      <line x1="1.5" y1="12.5" x2="12.5" y2="12.5"/>
    </g>
    <text x="416" y="28" font-size="10.5" font-weight="bold">NVDAx mint</text>
  </g>
  <!-- USDC mint, tucked in the pocket above the curve's right end -->
  <g opacity="0.3">
    <circle cx="552" cy="91" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <rect x="500" y="34" width="104" height="28" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <g transform="translate(508,38)" stroke="#111" stroke-width="1.2" fill="none">
      <path d="M 1,5 L 7,1 L 13,5 Z"/>
      <line x1="3" y1="6.5" x2="3" y2="11"/>
      <line x1="7" y1="6.5" x2="7" y2="11"/>
      <line x1="11" y1="6.5" x2="11" y2="11"/>
      <line x1="1.5" y1="12.5" x2="12.5" y2="12.5"/>
    </g>
    <text x="526" y="52" font-size="10.5" font-weight="bold">USDC mint</text>
  </g>
  <g>
    <circle cx="104" cy="37" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <rect x="16" y="44" width="104" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <g transform="translate(24,51)">
      <circle cx="7" cy="4" r="3.1" fill="none" stroke="#111" stroke-width="1.3"/>
      <path d="M 1.5,13 Q 1.5,8.4 7,8.4 Q 12.5,8.4 12.5,13" fill="none" stroke="#111" stroke-width="1.3"/>
    </g>
    <text x="43" y="62" font-size="9.5" font-weight="bold">Victor (curator)</text>
    <text x="43" y="78" font-size="9.5" fill="#444">1 SOL</text>
  </g>
  <g opacity="0.3">
    <circle cx="210" cy="42" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <rect x="128" y="50" width="104" height="26" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <g transform="translate(136,56)">
      <circle cx="7" cy="4" r="3.1" fill="none" stroke="#111" stroke-width="1.3"/>
      <path d="M 1.5,13 Q 1.5,8.4 7,8.4 Q 12.5,8.4 12.5,13" fill="none" stroke="#111" stroke-width="1.3"/>
    </g>
    <text x="155" y="67" font-size="10.5" font-weight="bold">Alice</text>
  </g>
  <g opacity="0.3">
    <circle cx="320" cy="51" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <rect x="240" y="60" width="104" height="26" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <g transform="translate(248,66)">
      <circle cx="7" cy="4" r="3.1" fill="none" stroke="#111" stroke-width="1.3"/>
      <path d="M 1.5,13 Q 1.5,8.4 7,8.4 Q 12.5,8.4 12.5,13" fill="none" stroke="#111" stroke-width="1.3"/>
    </g>
    <text x="267" y="77" font-size="10.5" font-weight="bold">Bob</text>
  </g>
  <g>
    <circle cx="404" cy="62" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <rect x="352" y="76" width="104" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <g transform="translate(360,83)">
      <circle cx="7" cy="4" r="3.1" fill="none" stroke="#111" stroke-width="1.3"/>
      <path d="M 1.5,13 Q 1.5,8.4 7,8.4 Q 12.5,8.4 12.5,13" fill="none" stroke="#111" stroke-width="1.3"/>
    </g>
    <text x="379" y="94" font-size="9.5" font-weight="bold">Maria (manager)</text>
    <text x="379" y="110" font-size="9.5" fill="#444">1 SOL</text>
  </g>
  <!-- registry PDA: the curator record at the root of the approved set -->
  <g>
    <circle cx="24" cy="144" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="34" y="143" font-size="7" letter-spacing="0.3" fill="#555">&#8220;REGISTRY&#8221; +</text>
    <text x="34" y="152" font-size="7" letter-spacing="0.3" fill="#555">VICTOR&#8217;S ADDRESS</text>
    <rect x="16" y="162" width="104" height="46" rx="6" fill="#f4f4f2" stroke="#888"/>
    <g transform="translate(24,167)" stroke="#111" stroke-width="1.2" fill="none">
      <rect x="1" y="2" width="12" height="10"/>
      <line x1="1" y1="5.4" x2="13" y2="5.4"/>
      <line x1="5.5" y1="5.4" x2="5.5" y2="12"/>
    </g>
    <text x="42" y="179" font-size="10.5" font-weight="bold">registry</text>
    <text x="26" y="191" font-size="8.5">authority: Victor</text>
    <text x="26" y="201" font-size="8" fill="#444" font-style="italic">holds no list</text>
    <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="114" y="201" font-size="9" font-weight="bold" letter-spacing="1" fill="#1e7a3c" text-anchor="end">NEW</text>
  </g>
  <g>
    <circle cx="24" cy="218" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="34" y="214" font-size="7" letter-spacing="0.3" fill="#555">&#8220;APPROVED_ASSET&#8221; +</text>
    <text x="34" y="223" font-size="7" letter-spacing="0.3" fill="#555">REGISTRY +</text>
    <text x="34" y="232" font-size="7" letter-spacing="0.3" fill="#555">TSLAX MINT</text>
    <rect x="16" y="238" width="104" height="46" rx="6" fill="#f4f4f2" stroke="#888"/>
    <g transform="translate(24,243)" stroke="#111" stroke-width="1.2" fill="none">
      <rect x="1" y="2" width="12" height="10"/>
      <line x1="1" y1="5.4" x2="13" y2="5.4"/>
      <line x1="5.5" y1="5.4" x2="5.5" y2="12"/>
    </g>
    <text x="42" y="255" font-size="9.5" font-weight="bold">ApprovedAsset</text>
    <text x="26" y="266" font-size="8">mint: TSLAx</text>
    <text x="26" y="276" font-size="8">price_feed: Pyth TSLA</text>
    <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="114" y="266" font-size="9" font-weight="bold" letter-spacing="1" fill="#1e7a3c" text-anchor="end">NEW</text>
  </g>
  <g>
    <circle cx="24" cy="294" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="34" y="290" font-size="7" letter-spacing="0.3" fill="#555">&#8220;APPROVED_ASSET&#8221; +</text>
    <text x="34" y="299" font-size="7" letter-spacing="0.3" fill="#555">REGISTRY +</text>
    <text x="34" y="308" font-size="7" letter-spacing="0.3" fill="#555">NVDAX MINT</text>
    <rect x="16" y="314" width="104" height="46" rx="6" fill="#f4f4f2" stroke="#888"/>
    <g transform="translate(24,319)" stroke="#111" stroke-width="1.2" fill="none">
      <rect x="1" y="2" width="12" height="10"/>
      <line x1="1" y1="5.4" x2="13" y2="5.4"/>
      <line x1="5.5" y1="5.4" x2="5.5" y2="12"/>
    </g>
    <text x="42" y="331" font-size="9.5" font-weight="bold">ApprovedAsset</text>
    <text x="26" y="342" font-size="8">mint: NVDAx</text>
    <text x="26" y="352" font-size="8">price_feed: Pyth NVDA</text>
    <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="114" y="342" font-size="9" font-weight="bold" letter-spacing="1" fill="#1e7a3c" text-anchor="end">NEW</text>
  </g>
  <g opacity="0.3">
    <circle cx="136" cy="144" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="146" y="139" font-size="7" letter-spacing="0.3" fill="#555">ATA PROGRAM +</text>
    <text x="146" y="148" font-size="7" letter-spacing="0.3" fill="#555">ALICE&#8217;S ADDRESS +</text>
    <text x="146" y="157" font-size="7" letter-spacing="0.3" fill="#555">USDC MINT</text>
    <rect x="128" y="162" width="104" height="26" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <g transform="translate(136,168)">
      <path d="M 2.6,7.8 Q 0.6,7.4 0.9,5.6 Q 1.1,4.4 2.3,4.9" fill="none" stroke="#111" stroke-width="1"/><ellipse cx="8" cy="7" rx="5.4" ry="4.4" fill="none" stroke="#111" stroke-width="1.2"/>
      <ellipse cx="12.9" cy="6.4" rx="1.8" ry="1.5" fill="#fff" stroke="#111" stroke-width="1"/><circle cx="12.35" cy="6.4" r="0.35" fill="#111"/><circle cx="13.45" cy="6.4" r="0.35" fill="#111"/>
      <line x1="5.2" y1="11.4" x2="5.2" y2="13" stroke="#111" stroke-width="1.2"/>
      <line x1="10.6" y1="11.4" x2="10.6" y2="13" stroke="#111" stroke-width="1.2"/>
      <line x1="6.8" y1="4.4" x2="9.2" y2="4.4" stroke="#111" stroke-width="1"/>
    </g>
    <text x="154" y="179" font-size="10.5" font-weight="bold">Alice&#8217;s USDC</text>
  </g>
  <g opacity="0.3">
    <circle cx="248" cy="144" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="258" y="139" font-size="7" letter-spacing="0.3" fill="#555">ATA PROGRAM +</text>
    <text x="258" y="148" font-size="7" letter-spacing="0.3" fill="#555">BOB&#8217;S ADDRESS +</text>
    <text x="258" y="157" font-size="7" letter-spacing="0.3" fill="#555">USDC MINT</text>
    <rect x="240" y="162" width="104" height="26" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <g transform="translate(248,168)">
      <path d="M 2.6,7.8 Q 0.6,7.4 0.9,5.6 Q 1.1,4.4 2.3,4.9" fill="none" stroke="#111" stroke-width="1"/><ellipse cx="8" cy="7" rx="5.4" ry="4.4" fill="none" stroke="#111" stroke-width="1.2"/>
      <ellipse cx="12.9" cy="6.4" rx="1.8" ry="1.5" fill="#fff" stroke="#111" stroke-width="1"/><circle cx="12.35" cy="6.4" r="0.35" fill="#111"/><circle cx="13.45" cy="6.4" r="0.35" fill="#111"/>
      <line x1="5.2" y1="11.4" x2="5.2" y2="13" stroke="#111" stroke-width="1.2"/>
      <line x1="10.6" y1="11.4" x2="10.6" y2="13" stroke="#111" stroke-width="1.2"/>
      <line x1="6.8" y1="4.4" x2="9.2" y2="4.4" stroke="#111" stroke-width="1"/>
    </g>
    <text x="266" y="179" font-size="10.5" font-weight="bold">Bob&#8217;s USDC</text>
  </g>
  <!-- the vault-strategy program -->
  <g>
    <circle cx="472" cy="73" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <rect x="464" y="120" width="168" height="118" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <g transform="translate(474,125)">
      <circle cx="7" cy="7" r="3.4" fill="none" stroke="#111" stroke-width="1.3"/>
      <circle cx="7" cy="7" r="1.2" fill="none" stroke="#111" stroke-width="1"/>
      <g stroke="#111" stroke-width="1.3">
        <line x1="7" y1="1" x2="7" y2="3"/><line x1="7" y1="11" x2="7" y2="13"/>
        <line x1="1" y1="7" x2="3" y2="7"/><line x1="11" y1="7" x2="13" y2="7"/>
        <line x1="2.8" y1="2.8" x2="4.2" y2="4.2"/><line x1="9.8" y1="9.8" x2="11.2" y2="11.2"/>
        <line x1="11.2" y1="2.8" x2="9.8" y2="4.2"/><line x1="2.8" y1="11.2" x2="4.2" y2="9.8"/>
      </g>
    </g>
    <text x="492" y="136" font-size="10.5" font-weight="bold">vault-strategy program</text>
    <text x="474" y="150" font-size="8.5" font-family="Menlo, monospace" font-weight="bold" fill="#1e7a3c">initialize_registry()</text>
    <text x="474" y="160" font-size="8.5" font-family="Menlo, monospace" font-weight="bold" fill="#1e7a3c">approve_asset() &#215;2</text>
    <text x="474" y="170" font-size="8.5" font-family="Menlo, monospace" fill="#888">initialize_strategy()</text>
    <text x="474" y="180" font-size="8.5" font-family="Menlo, monospace" fill="#888">add_asset()</text>
    <text x="474" y="190" font-size="8.5" font-family="Menlo, monospace" fill="#888">set_weight()</text>
    <text x="474" y="200" font-size="8.5" font-family="Menlo, monospace" fill="#888">deposit()</text>
    <text x="474" y="210" font-size="8.5" font-family="Menlo, monospace" fill="#888">rebalance()</text>
    <text x="474" y="220" font-size="8.5" font-family="Menlo, monospace" fill="#888">collect_fees()</text>
    <text x="474" y="230" font-size="8.5" font-family="Menlo, monospace" fill="#888">withdraw()</text>
  </g>
  <!-- the swap router: a second program, fixed at strategy creation -->
  <g opacity="0.3">
    <circle cx="452" cy="546" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <rect x="464" y="534" width="168" height="26" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <g transform="translate(474,540)">
      <circle cx="7" cy="7" r="3.4" fill="none" stroke="#111" stroke-width="1.3"/>
      <circle cx="7" cy="7" r="1.2" fill="none" stroke="#111" stroke-width="1"/>
      <g stroke="#111" stroke-width="1.3">
        <line x1="7" y1="1" x2="7" y2="3"/><line x1="7" y1="11" x2="7" y2="13"/>
        <line x1="1" y1="7" x2="3" y2="7"/><line x1="11" y1="7" x2="13" y2="7"/>
        <line x1="2.8" y1="2.8" x2="4.2" y2="4.2"/><line x1="9.8" y1="9.8" x2="11.2" y2="11.2"/>
        <line x1="11.2" y1="2.8" x2="9.8" y2="4.2"/><line x1="2.8" y1="11.2" x2="4.2" y2="9.8"/>
      </g>
    </g>
    <text x="492" y="551" font-size="10.5" font-weight="bold">swap router program</text>
  </g>
  <text x="16" y="380" font-size="9.5" font-weight="bold">1. initialize_registry(), once</text>
  <text x="16" y="396" font-size="9.5" font-weight="bold">2. approve_asset() &#215;2</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="16" y="410" font-size="8.5" fill="#444" font-style="italic">each call binds one mint to one Pyth feed</text>
  <g>
    <path d="M 398,124 C 390,168 364,205 338,232" fill="none" stroke="#999" stroke-width="1.4" marker-end="url(#vault-registry-arrx)"/>
    <rect x="240" y="240" width="172" height="36" fill="none" stroke="#999" stroke-width="1.3"/>
    <line x1="240" y1="240" x2="412" y2="276" stroke="#999" stroke-width="1.6"/>
    <line x1="412" y1="240" x2="240" y2="276" stroke="#999" stroke-width="1.6"/>
    <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="326" y="262" font-size="10" fill="#444" text-anchor="middle">approve_asset() signed by Maria</text>
    <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="326" y="292" font-size="9" fill="#444" font-style="italic" text-anchor="middle">fails: only the registry authority approves</text>
  </g>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="233" y="452" font-size="9.5" fill="#444" font-style="italic" text-anchor="middle">an asset is approved if its ApprovedAsset account exists,</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="233" y="466" font-size="9.5" fill="#444" font-style="italic" text-anchor="middle">and not approved if it does not. Maria will later select from this</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="233" y="480" font-size="9.5" fill="#444" font-style="italic" text-anchor="middle">set with add_asset(), which derives the ApprovedAsset address for</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="233" y="494" font-size="9.5" fill="#444" font-style="italic" text-anchor="middle">the mint it is handed and fails if the account is missing; the feed</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="233" y="508" font-size="9.5" fill="#444" font-style="italic" text-anchor="middle">she can never supply is copied out of the ApprovedAsset she presents.</text>
</svg>
