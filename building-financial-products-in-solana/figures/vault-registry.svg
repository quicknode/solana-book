      </g>
    </g>
    <text x="492" y="92" font-size="10.5" font-weight="bold">vault-strategy program</text>
    <text x="474" y="106" font-size="8.5" font-family="Menlo, monospace" font-weight="bold" fill="#1e7a3c">initialize_registry()</text>
    <text x="474" y="116" font-size="8.5" font-family="Menlo, monospace" font-weight="bold" fill="#1e7a3c">approve_asset() &#215;2</text>
    <text x="474" y="126" font-size="8.5" font-family="Menlo, monospace" fill="#888">initialize_strategy()</text>
    <text x="474" y="136" font-size="8.5" font-family="Menlo, monospace" fill="#888">add_asset()</text>
    <text x="474" y="146" font-size="8.5" font-family="Menlo, monospace" fill="#888">set_weight()</text>
    <text x="474" y="156" font-size="8.5" font-family="Menlo, monospace" fill="#888">deposit()</text>
    <text x="474" y="166" font-size="8.5" font-family="Menlo, monospace" fill="#888">rebalance()</text>
    <text x="474" y="176" font-size="8.5" font-family="Menlo, monospace" fill="#888">collect_fees()</text>
    <text x="474" y="186" font-size="8.5" font-family="Menlo, monospace" fill="#888">withdraw()</text>
  </g>
  <!-- the swap router: a second program, fixed at strategy creation -->
  <g opacity="0.3">
    <circle cx="452" cy="688" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <text stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" x="446" y="672" font-size="7.5" letter-spacing="0.8" fill="#555" text-anchor="end">PUBLIC KEY</text>
    <rect x="464" y="676" width="168" height="26" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
