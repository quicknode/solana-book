  <text x="240" y="498" font-size="9" fill="#444" font-style="italic" text-anchor="start">the route Maria&#8217;s strategy will be fixed to;</text>
  <text x="240" y="514" font-size="9" fill="#444" font-style="italic" text-anchor="start">Victor&#8217;s registry says nothing about it</text>
