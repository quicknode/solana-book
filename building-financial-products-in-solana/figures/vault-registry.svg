      <circle cx="7" cy="7" r="1.2" fill="none" stroke="#111" stroke-width="1"/>
      <g stroke="#111" stroke-width="1.3">
        <line x1="7" y1="1" x2="7" y2="3"/><line x1="7" y1="11" x2="7" y2="13"/>
        <line x1="1" y1="7" x2="3" y2="7"/><line x1="11" y1="7" x2="13" y2="7"/>
        <line x1="2.8" y1="2.8" x2="4.2" y2="4.2"/><line x1="9.8" y1="9.8" x2="11.2" y2="11.2"/>
        <line x1="11.2" y1="2.8" x2="9.8" y2="4.2"/><line x1="2.8" y1="11.2" x2="4.2" y2="9.8"/>
      </g>
    </g>
    <text x="492" y="693" font-size="10.5" font-weight="bold">swap router program</text>
  </g>
  <text x="16" y="388" font-size="9.5" font-weight="bold">1. initialize_registry(), once</text>
  <text x="16" y="404" font-size="9.5" font-weight="bold">2. approve_asset() &#215;2</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="16" y="418" font-size="8.5" fill="#444" font-style="italic">each call binds one mint to one Pyth feed</text>
  <g>
    <path d="M 398,135 C 386,180 360,220 336,256" fill="none" stroke="#999" stroke-width="1.4" marker-end="url(#vault-registry-arrx)"/>
    <rect x="240" y="260" width="172" height="36" fill="none" stroke="#999" stroke-width="1.3"/>
    <line x1="240" y1="260" x2="412" y2="296" stroke="#999" stroke-width="1.6"/>
    <line x1="412" y1="260" x2="240" y2="296" stroke="#999" stroke-width="1.6"/>
    <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="326" y="282" font-size="10" fill="#444" text-anchor="middle">approve_asset() signed by Maria</text>
    <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="326" y="312" font-size="9" fill="#444" font-style="italic" text-anchor="middle">fails: only the registry authority approves</text>
  </g>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="233" y="460" font-size="9.5" fill="#444" font-style="italic" text-anchor="middle">an asset is approved if its ApprovedAsset account exists,</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="233" y="474" font-size="9.5" fill="#444" font-style="italic" text-anchor="middle">and not approved if it does not. Maria will later select from this</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="233" y="488" font-size="9.5" fill="#444" font-style="italic" text-anchor="middle">set with add_asset(), which derives the ApprovedAsset address for</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="233" y="502" font-size="9.5" fill="#444" font-style="italic" text-anchor="middle">the mint it is handed and fails if the account is missing; the feed</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="233" y="516" font-size="9.5" fill="#444" font-style="italic" text-anchor="middle">she can never supply is copied out of the ApprovedAsset she presents.</text>
</svg>
