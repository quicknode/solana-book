<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Georgia, serif" fill="#111">
  <defs><marker id="vault-registry-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <!-- Victor's wallet -->
  <rect x="16" y="44" width="136" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="31" cy="61" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M 23,72 Q 31,65 39,72" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="46" y="61" font-size="10.5" font-weight="bold">Victor (authority)</text>
  <text x="46" y="77" font-size="9.5" fill="#444">0.1 SOL</text>
  <!-- Victor whitelists -->
  <path d="M 156,60 C 192,54 222,56 246,64" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#vault-registry-arr)"/>
  <text x="196" y="36" font-size="11" font-weight="bold" text-anchor="middle">whitelist_asset</text>
  <text x="140" y="102" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">binds one mint to one Pyth feed</text>
  <!-- Registry -->
  <rect x="250" y="28" width="240" height="150" rx="8" fill="none" stroke="#111" stroke-width="2"/>
  <text x="370" y="50" font-size="13" font-weight="bold" text-anchor="middle">Registry</text>
  <text x="370" y="64" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">one whitelist entry PDA per asset</text>
  <rect x="266" y="76" width="208" height="30" rx="4" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="370" y="95" font-size="11" text-anchor="middle">TSLAx mint &#8594; Pyth TSLA feed</text>
  <rect x="266" y="114" width="208" height="30" rx="4" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="370" y="133" font-size="11" text-anchor="middle">NVDAx mint &#8594; Pyth NVDA feed</text>
  <!-- Maria's wallet -->
  <rect x="16" y="186" width="112" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="31" cy="203" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M 23,214 Q 31,207 39,214" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="46" y="203" font-size="10.5" font-weight="bold">Maria (mgr)</text>
  <text x="46" y="219" font-size="9.5" fill="#444">0.1 SOL</text>
  <!-- Maria selects from the list -->
  <path d="M 132,192 C 180,176 216,158 258,136" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#vault-registry-arr)"/>
  <text x="248" y="196" font-size="11" font-weight="bold" text-anchor="middle">add_asset: selects an entry</text>
  <text x="248" y="209" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">the feed is copied from Victor&#8217;s entry</text>
  <!-- Maria cannot add -->
  <path d="M 132,224 C 200,248 268,248 352,236" fill="none" stroke="#999" stroke-width="1.4" marker-end="url(#vault-registry-arr)"/>
  <rect x="356" y="212" width="200" height="40" rx="5" fill="none" stroke="#999" stroke-width="1.3"/>
  <line x1="356" y1="212" x2="556" y2="252" stroke="#999" stroke-width="1.6"/>
  <line x1="556" y1="212" x2="356" y2="252" stroke="#999" stroke-width="1.6"/>
  <text x="456" y="272" font-size="10.5" fill="#444" font-style="italic" text-anchor="middle">fails: only the registry authority may add assets</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="456" y="236" font-size="11" fill="#444" text-anchor="middle">whitelist_asset signed by Maria</text>
</svg>
