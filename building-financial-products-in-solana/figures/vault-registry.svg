<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Georgia, serif" fill="#111">
  <defs><marker id="vault-registry-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <!-- Victor -->
  <circle cx="70" cy="64" r="16" fill="none" stroke="#111" stroke-width="1.5"/>
  <path d="M 45,106 Q 70,84 95,106" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="70" y="126" font-size="12" font-weight="bold" text-anchor="middle">Victor</text>
  <text x="70" y="140" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">registry authority</text>
  <!-- Victor whitelists -->
  <path d="M 103,64 C 150,54 200,56 246,66" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#vault-registry-arr)"/>
  <text x="174" y="38" font-size="11" font-weight="bold" text-anchor="middle">whitelist_asset</text>
  <text x="174" y="51" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">binds one mint to one Pyth feed</text>
  <!-- Registry -->
  <rect x="250" y="28" width="240" height="150" rx="8" fill="none" stroke="#111" stroke-width="2"/>
  <text x="370" y="50" font-size="13" font-weight="bold" text-anchor="middle">Registry</text>
  <text x="370" y="64" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">one whitelist entry PDA per asset</text>
  <rect x="266" y="76" width="208" height="30" rx="4" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="370" y="95" font-size="11" text-anchor="middle">TSLAx mint &#8594; Pyth TSLA feed</text>
  <rect x="266" y="114" width="208" height="30" rx="4" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="370" y="133" font-size="11" text-anchor="middle">NVDAx mint &#8594; Pyth NVDA feed</text>
  <!-- Maria -->
  <circle cx="70" cy="204" r="16" fill="none" stroke="#111" stroke-width="1.5"/>
  <path d="M 45,246 Q 70,224 95,246" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="70" y="266" font-size="12" font-weight="bold" text-anchor="middle">Maria</text>
  <text x="70" y="280" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">fund manager</text>
  <!-- Maria selects from the list -->
  <path d="M 103,198 C 170,180 210,160 258,136" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#vault-registry-arr)"/>
  <text x="210" y="196" font-size="11" font-weight="bold" text-anchor="middle">add_asset: selects an entry</text>
  <text x="210" y="209" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">the feed is copied from Victor&#8217;s entry</text>
  <!-- Maria cannot add -->
  <path d="M 100,218 C 180,246 260,246 352,234" fill="none" stroke="#999" stroke-width="1.4" marker-end="url(#vault-registry-arr)"/>
  <rect x="356" y="212" width="200" height="40" rx="5" fill="none" stroke="#999" stroke-width="1.3"/>
  <text x="456" y="236" font-size="11" fill="#444" text-anchor="middle">whitelist_asset signed by Maria</text>
  <line x1="356" y1="212" x2="556" y2="252" stroke="#999" stroke-width="1.6"/>
  <line x1="556" y1="212" x2="356" y2="252" stroke="#999" stroke-width="1.6"/>
  <text x="456" y="272" font-size="10.5" fill="#444" font-style="italic" text-anchor="middle">fails: only the registry authority may add assets</text>
</svg>
