  <rect x="240" y="300" width="200" height="34" fill="#fff" stroke="#888"/>
  <text x="340" y="321" font-size="9.5" text-anchor="middle" font-family="Menlo, monospace">approve_asset() by Maria</text>
  <line x1="244" y1="304" x2="436" y2="330" stroke="#999" stroke-width="1.6"/>
  <line x1="244" y1="330" x2="436" y2="304" stroke="#999" stroke-width="1.6"/>
  <text x="340" y="348" font-size="8.5" fill="#444" font-style="italic" text-anchor="middle">fails: only the registry authority approves</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="240" y="250" font-size="10" fill="#1e7a3c" font-weight="bold" text-anchor="start">1. initialize_registry(), once</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="240" y="266" font-size="10" fill="#1e7a3c" font-weight="bold" text-anchor="start">2. approve_asset() &#215;2</text>
  <text x="240" y="282" font-size="8.5" fill="#444" font-style="italic" text-anchor="start">each call binds one mint to one Pyth feed</text>
  <text x="16" y="396" font-size="9" fill="#444" font-style="italic" text-anchor="start">Victor is not a fund manager: he curates the set of assets managers may invest in at all,</text>
  <text x="16" y="412" font-size="9" fill="#444" font-style="italic" text-anchor="start">and the feed that is the truth for each. Maria will select from this set with add_asset(),</text>
  <text x="16" y="428" font-size="9" fill="#444" font-style="italic" text-anchor="start">which derives the ApprovedAsset address for the mint it is handed and fails if the account</text>
  <text x="16" y="444" font-size="9" fill="#444" font-style="italic" text-anchor="start">is missing; the feed she can never supply is copied out of the account she points at.</text>
