  <text x="24" y="518" font-size="8.5" font-family="Menlo, monospace">swap_asset_for_usdc()</text>
  <text x="24" y="532" font-size="7.5" font-style="italic" fill="#444">a mock Jupiter, fixed at strategy creation</text>
