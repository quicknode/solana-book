<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" font-family="'Denim INK', Helvetica, Arial, sans-serif" fill="#111">
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="16" y="24" font-size="15" font-weight="bold">An order's four states</text>
  <defs><marker id="ob-sm-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <g transform="translate(0,30)">
  <!-- entries: an order that rests on arrival is Open; a taker's order that crosses on arrival is stamped Filled without resting -->
  <path d="M 100,24 L 100,86" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#ob-sm-arr)"/>
  <text x="100" y="18" font-size="10" fill="#444" text-anchor="middle">an order that rests</text>
  <!-- states -->
  <rect x="40" y="90" width="120" height="44" fill="#f4f4f2" stroke="#111" stroke-width="2"/>
  <text x="100" y="117" font-size="12" font-weight="bold" text-anchor="middle">Open</text>
  <rect x="250" y="90" width="140" height="44" fill="#f4f4f2" stroke="#111" stroke-width="2"/>
  <text x="320" y="117" font-size="12" font-weight="bold" text-anchor="middle">PartiallyFilled</text>
  <rect x="480" y="30" width="120" height="44" fill="#fff" stroke="#111" stroke-width="2.4"/>
  <text x="540" y="57" font-size="12" font-weight="bold" text-anchor="middle">Filled</text>
  <rect x="480" y="156" width="120" height="44" fill="#fff" stroke="#111" stroke-width="2.4"/>
  <text x="540" y="183" font-size="12" font-weight="bold" text-anchor="middle">Cancelled</text>
  <path d="M 540,-10 L 540,26" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#ob-sm-arr)"/>
  <text x="540" y="-16" font-size="10" fill="#444" text-anchor="middle">a taker's order that crosses on arrival</text>
  <!-- transitions -->
  <path d="M 164,105 L 246,105" stroke="#111" stroke-width="1.6" marker-end="url(#ob-sm-arr)"/>
  <text x="205" y="97" font-size="10" fill="#444" text-anchor="middle">a fill lands</text>
  <path d="M 394,100 C 430,84 450,68 476,58" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#ob-sm-arr)"/>
  <text x="438" y="100" font-size="10" fill="#444" text-anchor="middle">last lot fills</text>
  <path d="M 120,86 C 200,10 380,6 476,44" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#ob-sm-arr)"/>
  <text x="290" y="14" font-size="10" fill="#444" text-anchor="middle">one taker crosses the whole order</text>
  <path d="M 320,70 L 320,86" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#ob-sm-arr)"/>
  <text x="320" y="64" font-size="10" fill="#444" text-anchor="middle">a taker's order that crosses part of itself</text>
  <path d="M 130,134 C 220,200 380,196 476,180" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#ob-sm-arr)"/>
  <text x="280" y="212" font-size="10" fill="#444" text-anchor="middle">cancel_order() or eviction, held tokens credited back</text>
  <path d="M 370,134 C 410,158 440,168 476,172" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#ob-sm-arr)"/>
  <text x="362" y="160" font-size="10" fill="#444" text-anchor="end">cancel_order() or eviction</text>
  <!-- terminal note -->
  <text x="540" y="90" font-size="9.5" fill="#444" text-anchor="middle">terminal: OrderNotCancellable</text>
  <text x="540" y="216" font-size="9.5" fill="#444" text-anchor="middle">terminal: leaf out of the tree</text>
  <text x="100" y="152" font-size="9.5" fill="#444" text-anchor="middle">resting in the tree</text>
  </g>
</svg>
