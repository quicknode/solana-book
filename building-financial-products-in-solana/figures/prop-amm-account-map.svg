<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 545" font-family="Georgia, serif" fill="#111">
  <!-- oracle feed: an external account, derived by its own program -->
  <g>
    <circle cx="20" cy="44" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="32" y="41" font-size="8.5" letter-spacing="0.6" fill="#555">DERIVED BY THE</text>
    <text x="32" y="52" font-size="8.5" letter-spacing="0.6" fill="#555">ORACLE PROGRAM</text>
    <rect x="8" y="60" width="104" height="58" rx="6" fill="#fff" stroke="#111" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="18" y="78" font-size="10.5" font-weight="bold">oracle feed</text>
    <text x="18" y="93" font-size="9" fill="#444">NVDAx: $165.00</text>
    <text x="18" y="106" font-size="9" fill="#444">scale, slot, confidence</text>
  </g>
  <!-- the market is pinned to the feed -->
  <line x1="112" y1="100" x2="140" y2="100" stroke="#777" stroke-width="1.2" stroke-dasharray="5 3"/>
  <!-- market: the program's struct account, a PDA -->
  <g>
    <circle cx="148" cy="14" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="160" y="11" font-size="8.5" letter-spacing="0.6" fill="#555">SEEDS: &#8220;MARKET&#8221; + NVDAX &amp;</text>
    <text x="160" y="22" font-size="8.5" letter-spacing="0.6" fill="#555">USDC MINT ADDRESSES</text>
    <rect x="140" y="30" width="176" height="128" rx="6" fill="#f4f4f2" stroke="#888"/>
    <text x="150" y="48" font-size="10.5" font-weight="bold">market</text>
    <text x="150" y="64" font-size="9.5">operator: Maria</text>
    <text x="150" y="78" font-size="9.5">oracle_feed: pinned at creation</text>
    <text x="150" y="92" font-size="9.5">oracle_scale: 10^8</text>
    <text x="150" y="106" font-size="9.5">token decimals: 6 / 6, pinned</text>
    <text x="150" y="120" font-size="9.5">spread_bps: 10</text>
    <text x="150" y="134" font-size="9.5">max_confidence_bps: 100</text>
    <text x="150" y="148" font-size="9.5">paused: false</text>
  </g>
  <!-- the prop amm program -->
  <g>
    <circle cx="478" cy="8" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="490" y="11" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
    <rect x="470" y="16" width="160" height="90" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <text x="480" y="32" font-size="10.5" font-weight="bold">prop amm program</text>
    <text x="480" y="46" font-size="8.5" font-family="Menlo, monospace">initialize_market</text>
    <text x="480" y="57" font-size="8.5" font-family="Menlo, monospace">set_quote</text>
    <text x="480" y="68" font-size="8.5" font-family="Menlo, monospace">deposit_inventory</text>
    <text x="480" y="79" font-size="8.5" font-family="Menlo, monospace">withdraw_inventory</text>
    <text x="480" y="90" font-size="8.5" font-family="Menlo, monospace">swap</text>
  </g>
  <!-- market authority: dataless PDA that signs for the vaults -->
  <g>
    <circle cx="28" cy="176" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="40" y="173" font-size="8.5" letter-spacing="0.6" fill="#555">SEEDS: &#8220;AUTHORITY&#8221; +</text>
    <text x="40" y="184" font-size="8.5" letter-spacing="0.6" fill="#555">MARKET&#8217;S ADDRESS</text>
    <rect x="20" y="190" width="170" height="40" rx="6" fill="#f4f4f2" stroke="#888"/>
    <text x="30" y="207" font-size="10.5" font-weight="bold">market authority</text>
    <text x="30" y="222" font-size="9" fill="#444">holds no data; signs for the vaults</text>
  </g>
  <!-- base vault -->
  <g>
    <circle cx="238" cy="176" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="250" y="173" font-size="8.5" letter-spacing="0.6" fill="#555">SEEDS: &#8220;BASE_VAULT&#8221; +</text>
    <text x="250" y="184" font-size="8.5" letter-spacing="0.6" fill="#555">MARKET&#8217;S ADDRESS</text>
    <rect x="230" y="190" width="150" height="56" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <text x="240" y="207" font-size="10.5" font-weight="bold">base vault</text>
    <text x="240" y="222" font-size="9.5" fill="#444">1,000 NVDAx</text>
    <text x="240" y="237" font-size="9" fill="#444" font-style="italic">authority: the market authority</text>
  </g>
  <!-- quote vault -->
  <g>
    <circle cx="428" cy="176" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="440" y="173" font-size="8.5" letter-spacing="0.6" fill="#555">SEEDS: &#8220;QUOTE_VAULT&#8221; +</text>
    <text x="440" y="184" font-size="8.5" letter-spacing="0.6" fill="#555">MARKET&#8217;S ADDRESS</text>
    <rect x="420" y="190" width="150" height="56" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <text x="430" y="207" font-size="10.5" font-weight="bold">quote vault</text>
    <text x="430" y="222" font-size="9.5" fill="#444">200,000 USDC</text>
    <text x="430" y="237" font-size="9" fill="#444" font-style="italic">authority: the market authority</text>
  </g>
  <!-- Maria's USDC ATA -->
  <g>
    <rect x="40" y="300" width="108" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <text x="50" y="317" font-size="10.5" font-weight="bold">Maria&#8217;s USDC</text>
    <text x="50" y="332" font-size="9.5" fill="#444">1,000 USDC</text>
    <circle cx="46" cy="352" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="56" y="349" font-size="7.5" letter-spacing="0.4" fill="#555">SEEDS: ATA PROGRAM +</text>
    <text x="56" y="358" font-size="7.5" letter-spacing="0.4" fill="#555">MARIA&#8217;S ADDRESS +</text>
    <text x="56" y="367" font-size="7.5" letter-spacing="0.4" fill="#555">USDC MINT</text>
  </g>
  <!-- Alice's USDC ATA -->
  <g>
    <rect x="158" y="300" width="108" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <text x="168" y="317" font-size="10.5" font-weight="bold">Alice&#8217;s USDC</text>
    <text x="168" y="332" font-size="9.5" fill="#444">1,000 USDC</text>
    <circle cx="164" cy="352" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="174" y="349" font-size="7.5" letter-spacing="0.4" fill="#555">SEEDS: ATA PROGRAM +</text>
    <text x="174" y="358" font-size="7.5" letter-spacing="0.4" fill="#555">ALICE&#8217;S ADDRESS +</text>
    <text x="174" y="367" font-size="7.5" letter-spacing="0.4" fill="#555">USDC MINT</text>
  </g>
  <!-- Bob's USDC ATA -->
  <g>
    <rect x="276" y="300" width="108" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <text x="286" y="317" font-size="10.5" font-weight="bold">Bob&#8217;s USDC</text>
    <text x="286" y="332" font-size="9.5" fill="#444">1,000 USDC</text>
    <circle cx="282" cy="352" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="292" y="349" font-size="7.5" letter-spacing="0.4" fill="#555">SEEDS: ATA PROGRAM +</text>
    <text x="292" y="358" font-size="7.5" letter-spacing="0.4" fill="#555">BOB&#8217;S ADDRESS +</text>
    <text x="292" y="367" font-size="7.5" letter-spacing="0.4" fill="#555">USDC MINT</text>
  </g>
  <!-- Bob's NVDAx ATA -->
  <g>
    <rect x="394" y="300" width="108" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <text x="404" y="317" font-size="10.5" font-weight="bold">Bob&#8217;s NVDAx</text>
    <text x="404" y="332" font-size="9.5" fill="#444">5 NVDAx</text>
    <circle cx="400" cy="352" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="410" y="349" font-size="7.5" letter-spacing="0.4" fill="#555">SEEDS: ATA PROGRAM +</text>
    <text x="410" y="358" font-size="7.5" letter-spacing="0.4" fill="#555">BOB&#8217;S ADDRESS +</text>
    <text x="410" y="367" font-size="7.5" letter-spacing="0.4" fill="#555">NVDAX MINT</text>
  </g>
  <!-- the curve -->
  <path d="M 40,470 Q 320,380 600,470" fill="none" stroke="#111" stroke-width="2"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="320" y="532" font-size="13" font-weight="bold" text-anchor="middle">Solana Devnet</text>
  <!-- the program's address dot sits on the curve too -->
  <line x1="620" y1="106" x2="598" y2="463" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.3"/>
  <circle cx="598" cy="469" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <!-- wallets on the curve -->
  <g>
    <circle cx="96" cy="454" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="84" y="452" font-size="9" letter-spacing="1" fill="#555" text-anchor="end">PUBLIC KEY</text>
    <rect x="28" y="464" width="124" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <circle cx="43" cy="481" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
    <path d="M 35,492 Q 43,485 51,492" fill="none" stroke="#111" stroke-width="1.3"/>
    <text x="58" y="481" font-size="10.5" font-weight="bold">Maria (operator)</text>
    <text x="58" y="497" font-size="9.5" fill="#444">1 SOL</text>
  </g>
  <g>
    <circle cx="208" cy="432" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="220" y="430" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
    <rect x="156" y="442" width="108" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <circle cx="171" cy="459" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
    <path d="M 163,470 Q 171,463 179,470" fill="none" stroke="#111" stroke-width="1.3"/>
    <text x="186" y="459" font-size="10.5" font-weight="bold">Alice (trader)</text>
    <text x="186" y="475" font-size="9.5" fill="#444">1 SOL</text>
  </g>
  <g>
    <circle cx="320" cy="425" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="332" y="423" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
    <rect x="268" y="435" width="104" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <circle cx="283" cy="452" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
    <path d="M 275,463 Q 283,456 291,463" fill="none" stroke="#111" stroke-width="1.3"/>
    <text x="298" y="452" font-size="10.5" font-weight="bold">Bob (trader)</text>
    <text x="298" y="468" font-size="9.5" fill="#444">1 SOL</text>
  </g>
  <!-- mints on the curve -->
  <g>
    <circle cx="432" cy="432" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="444" y="428" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
    <rect x="380" y="442" width="92" height="32" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <text x="390" y="462" font-size="10.5" font-weight="bold">NVDAx mint</text>
  </g>
  <g>
    <circle cx="520" cy="448" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="532" y="444" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
    <rect x="482" y="458" width="92" height="32" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <text x="492" y="478" font-size="10.5" font-weight="bold">USDC mint</text>
  </g>
</svg>
