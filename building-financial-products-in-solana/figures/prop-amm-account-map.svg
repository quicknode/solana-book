<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 510" font-family="Georgia, serif" fill="#111">
  <!-- the curve -->
  <path d="M 40,400 Q 320,190 600,400" fill="none" stroke="#111" stroke-width="2"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="320" y="468" font-size="13" font-weight="bold" text-anchor="middle">Solana Devnet</text>
  <!-- oracle feed: an external account, derived by its own program -->
  <circle cx="14" cy="90" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="26" y="87" font-size="8.5" letter-spacing="0.6" fill="#555">DERIVED BY THE</text>
  <text x="26" y="98" font-size="8.5" letter-spacing="0.6" fill="#555">ORACLE PROGRAM</text>
  <rect x="12" y="106" width="96" height="58" rx="6" fill="#fff" stroke="#111" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="22" y="124" font-size="10.5" font-weight="bold">oracle feed</text>
  <text x="22" y="138" font-size="9" fill="#444">price, scale, slot,</text>
  <text x="22" y="150" font-size="9" fill="#444">confidence</text>
  <!-- market: the program's struct account, a PDA -->
  <circle cx="112" cy="52" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="124" y="44" font-size="8.5" letter-spacing="0.6" fill="#555">&#8220;MARKET&#8221; + NVDAX &amp; USDC</text>
  <text x="124" y="55" font-size="8.5" letter-spacing="0.6" fill="#555">MINT ADDRESSES</text>
  <rect x="120" y="64" width="170" height="112" rx="6" fill="#f4f4f2" stroke="#888"/>
  <text x="130" y="82" font-size="10.5" font-weight="bold">market</text>
  <text x="130" y="98" font-size="9.5">operator: Maria</text>
  <text x="130" y="112" font-size="9.5">oracle_feed: pinned at creation</text>
  <text x="130" y="126" font-size="9.5">oracle_scale: 10^8</text>
  <text x="130" y="140" font-size="9.5">spread_bps: 10</text>
  <text x="130" y="154" font-size="9.5">max_confidence_bps: 100</text>
  <text x="130" y="168" font-size="9.5">paused: false</text>
  <!-- the prop amm program: address on the curve -->
  <rect x="300" y="150" width="122" height="92" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="308" y="166" font-size="10.5" font-weight="bold">prop amm program</text>
  <text x="308" y="182" font-size="9.5" font-family="Menlo, monospace">initialize_market</text>
  <text x="308" y="195" font-size="9.5" font-family="Menlo, monospace">set_quote</text>
  <text x="308" y="208" font-size="9.5" font-family="Menlo, monospace">deposit_inventory</text>
  <text x="308" y="221" font-size="9.5" font-family="Menlo, monospace">withdraw_inventory</text>
  <text x="308" y="234" font-size="9.5" font-family="Menlo, monospace">swap</text>
  <line x1="320" y1="242" x2="320" y2="289" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="320" cy="295" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="320" y="314" font-size="9" letter-spacing="1" fill="#555" text-anchor="middle">PUBLIC KEY</text>
  <!-- market authority: dataless PDA that signs for the vaults -->
  <circle cx="446" cy="36" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="458" y="39" font-size="8.5" letter-spacing="0.6" fill="#555">&#8220;AUTHORITY&#8221; + MARKET&#8217;S ADDRESS</text>
  <rect x="452" y="46" width="140" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="460" y="64" font-size="10.5" font-weight="bold">market authority</text>
  <text x="460" y="78" font-size="9" fill="#444">holds no data; signs vault CPIs</text>
  <!-- base vault -->
  <circle cx="446" cy="102" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="458" y="105" font-size="8.5" letter-spacing="0.6" fill="#555">&#8220;BASE_VAULT&#8221; + MARKET&#8217;S ADDRESS</text>
  <rect x="452" y="112" width="130" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="460" y="130" font-size="10.5" font-weight="bold">base vault</text>
  <text x="460" y="146" font-size="9.5" fill="#444">1,000 NVDAx</text>
  <!-- quote vault -->
  <circle cx="446" cy="172" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="458" y="175" font-size="8.5" letter-spacing="0.6" fill="#555">&#8220;QUOTE_VAULT&#8221; + MARKET&#8217;S ADDRESS</text>
  <rect x="452" y="182" width="130" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="460" y="200" font-size="10.5" font-weight="bold">quote vault</text>
  <text x="460" y="216" font-size="9.5" fill="#444">200,000 USDC</text>
  <!-- mints: addresses on the curve -->
  <circle cx="219" cy="309" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="219" y="276" font-size="11" font-weight="bold" text-anchor="middle">NVDAx mint</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="219" y="290" font-size="9" letter-spacing="1" fill="#555" text-anchor="middle">PUBLIC KEY</text>
  <circle cx="421" cy="309" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="421" y="276" font-size="11" font-weight="bold" text-anchor="middle">USDC mint</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="421" y="290" font-size="9" letter-spacing="1" fill="#555" text-anchor="middle">PUBLIC KEY</text>
  <!-- Maria: wallet account, address on the curve -->
  <circle cx="96" cy="362" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="108" y="360" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <rect x="104" y="374" width="132" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="119" cy="391" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M 111,402 Q 119,395 127,402" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="134" y="391" font-size="10.5" font-weight="bold">Maria (operator)</text>
  <text x="134" y="407" font-size="9.5" fill="#444">1 SOL</text>
  <!-- Alice: wallet account, address on the curve -->
  <circle cx="477" cy="328" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="489" y="326" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <rect x="352" y="334" width="116" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="367" cy="351" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M 359,362 Q 367,355 375,362" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="382" y="351" font-size="10.5" font-weight="bold">Alice (trader)</text>
  <text x="382" y="367" font-size="9.5" fill="#444">1 SOL</text>
  <!-- Bob: wallet account, address on the curve -->
  <circle cx="544" cy="362" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="556" y="360" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <rect x="424" y="380" width="112" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="439" cy="397" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M 431,408 Q 439,401 447,408" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="454" y="397" font-size="10.5" font-weight="bold">Bob (trader)</text>
  <text x="454" y="413" font-size="9.5" fill="#444">1 SOL</text>
  <!-- Maria's USDC ATA -->
  <circle cx="28" cy="204" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="40" y="200" font-size="8.5" letter-spacing="0.6" fill="#555">ATA PROGRAM + MARIA&#8217;S</text>
  <text x="40" y="211" font-size="8.5" letter-spacing="0.6" fill="#555">ADDRESS + USDC MINT ADDRESS</text>
  <rect x="36" y="218" width="120" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="46" y="236" font-size="10.5" font-weight="bold">Maria&#8217;s USDC</text>
  <text x="46" y="252" font-size="9.5" fill="#444">1,000 USDC</text>
  <!-- Alice's USDC ATA -->
  <circle cx="240" cy="394" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="252" y="390" font-size="8.5" letter-spacing="0.6" fill="#555">ATA PROGRAM + ALICE&#8217;S</text>
  <text x="252" y="401" font-size="8.5" letter-spacing="0.6" fill="#555">ADDRESS + USDC MINT ADDRESS</text>
  <rect x="248" y="408" width="120" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="258" y="426" font-size="10.5" font-weight="bold">Alice&#8217;s USDC</text>
  <text x="258" y="442" font-size="9.5" fill="#444">1,000 USDC</text>
  <!-- Bob's NVDAx ATA -->
  <circle cx="452" cy="438" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="464" y="434" font-size="8.5" letter-spacing="0.6" fill="#555">ATA PROGRAM + BOB&#8217;S</text>
  <text x="464" y="445" font-size="8.5" letter-spacing="0.6" fill="#555">ADDRESS + NVDAX MINT ADDRESS</text>
  <rect x="460" y="452" width="120" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="470" y="470" font-size="10.5" font-weight="bold">Bob&#8217;s NVDAx</text>
  <text x="470" y="486" font-size="9.5" fill="#444">5 NVDAx</text>
</svg>
