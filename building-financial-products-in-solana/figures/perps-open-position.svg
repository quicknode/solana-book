<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" font-family="Georgia, serif" fill="#111">
  <defs><marker id="perps-open-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <!-- Alice's wallet -->
  <rect x="8" y="76" width="112" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="23" cy="93" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M 15,104 Q 23,97 31,104" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="38" y="93" font-size="10.5" font-weight="bold">Alice (long)</text>
  <text x="38" y="109" font-size="9.5" fill="#444">0.1 SOL</text>
  <!-- 1000 in -->
  <path d="M 124,92 L 176,82" stroke="#111" stroke-width="2" marker-end="url(#perps-open-arr)"/>
  <text x="139" y="72" font-size="10.5" font-weight="bold" text-anchor="middle">1,000 USDC</text>
  <!-- split bar -->
  <rect x="180" y="46" width="30" height="180" fill="#f4f4f2" stroke="#111" stroke-width="2"/>
  <rect x="180" y="46" width="30" height="1.2" fill="#111"/>
  <text x="195" y="40" font-size="10" fill="#444" text-anchor="middle">in the vault</text>
  <!-- fee slice -->
  <rect x="180" y="46" width="30" height="9" fill="#c9c9c4" stroke="#111" stroke-width="1"/>
  <path d="M 214,50 L 268,50" stroke="#111" stroke-width="1.4" marker-end="url(#perps-open-arr)"/>
  <text x="276" y="47" font-size="10.5" font-weight="bold">open fee: 5 USDC to protocol_fees</text>
  <text x="276" y="61" font-size="9.5" fill="#444" font-style="italic">10 bps of the 5,000 notional, not of the deposit</text>
  <!-- collateral -->
  <path d="M 214,150 L 268,150" stroke="#111" stroke-width="1.4" marker-end="url(#perps-open-arr)"/>
  <text x="276" y="146" font-size="10.5" font-weight="bold">working collateral: 995 USDC</text>
  <text x="276" y="161" font-size="9.5" fill="#444">carries 5,000 of exposure &#8776; 5x leverage</text>
  <text x="276" y="175" font-size="9.5" fill="#444">gates: size &#8804; 995 &#215; 10 = 9,950 (max leverage)</text>
  <text x="276" y="189" font-size="9.5" fill="#444">and 995 &gt; 250, the 5% maintenance margin</text>
  <!-- reservation -->
  <rect x="276" y="208" width="330" height="46" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="286" y="226" font-size="10.5" font-weight="bold">the pool reserves 5,000 from its liquidity</text>
  <text x="286" y="242" font-size="9.5" fill="#444">her best case is prepaid: close profit is capped at size</text>
  <path d="M 210,220 L 272,228" stroke="#111" stroke-width="1.4" marker-end="url(#perps-open-arr)"/>
  <text x="120" y="230" font-size="10" fill="#444" font-style="italic" text-anchor="middle">reserved_liquidity</text>
  <text x="120" y="244" font-size="10" fill="#444" font-style="italic" text-anchor="middle">+ 5,000 &#8804; liquidity</text>
</svg>
