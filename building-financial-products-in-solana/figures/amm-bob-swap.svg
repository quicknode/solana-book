<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="Georgia, serif" fill="#111">
  <defs>
    <marker id="amm-bob-swap-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#111"/>
    </marker>
  </defs>
  <!-- the curve -->
  <path d="M 30,360 Q 230,318 430,360" fill="none" stroke="#111" stroke-width="2"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="368" y="348" font-size="12" font-weight="bold" text-anchor="middle">Solana Devnet</text>
  <!-- Bob: wallet account, address on the curve -->
  <circle cx="70" cy="352" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="82" y="339" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <rect x="78" y="364" width="112" height="48" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="93" cy="382" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M 85,393 Q 93,386 101,393" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="108" y="382" font-size="10.5" font-weight="bold">Bob</text>
  <text x="108" y="398" font-size="9.5" fill="#444">1 SOL</text>
  <!-- 100 USDC in -->
  <path d="M 150,362 C 168,300 180,220 202,174" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#amm-bob-swap-arr)"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="145" y="244" font-size="11" font-weight="bold" text-anchor="middle">100 USDC</text>
  <!-- fee gate -->
  <rect x="185" y="120" width="128" height="50" rx="6" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="249" y="140" font-size="11" font-weight="bold" text-anchor="middle">fee off the top</text>
  <text x="249" y="156" font-size="10.5" fill="#444" text-anchor="middle">$0.30 = 30 bps</text>
  <!-- admin's virtual claim -->
  <rect x="150" y="30" width="208" height="46" rx="6" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="254" y="48" font-size="11" font-weight="bold" text-anchor="middle">Maria&#8217;s virtual claim</text>
  <text x="254" y="64" font-size="10.5" text-anchor="middle">admin_fees_owed_b += $0.05</text>
  <path d="M 246,118 L 252,80" fill="none" stroke="#777" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#amm-bob-swap-arr)"/>
  <text x="262" y="100" font-size="10.5" font-weight="bold">$0.05</text>
  <!-- taxed input and LP fee into the vault -->
  <path d="M 313,138 C 336,132 356,138 380,152" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#amm-bob-swap-arr)"/>
  <text x="330" y="116" font-size="11" font-weight="bold" text-anchor="middle">taxed input: 99.70</text>
  <path d="M 310,168 C 334,186 352,184 380,172" fill="none" stroke="#111" stroke-width="1.3" marker-end="url(#amm-bob-swap-arr)"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="360" y="204" font-size="10.5" font-style="italic" fill="#444" text-anchor="end">LPs&#8217; $0.25 stays in the vault</text>
  <!-- the vaults: PDAs, dots off the curve -->
  <circle cx="376" cy="128" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="388" y="124" font-size="8.5" letter-spacing="0.6" fill="#555">ATA PROGRAM + POOL AUTHORITY</text>
  <text x="388" y="135" font-size="8.5" letter-spacing="0.6" fill="#555">+ USDC MINT ADDRESS</text>
  <rect x="384" y="142" width="168" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="392" y="158" font-size="10.5" font-weight="bold">pool_b: the pool&#8217;s USDC</text>
  <text x="392" y="175" font-size="10" fill="#444">1,224.70 USDC</text>
  <circle cx="376" cy="196" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="388" y="192" font-size="8.5" letter-spacing="0.6" fill="#555">ATA PROGRAM + POOL AUTHORITY</text>
  <text x="388" y="203" font-size="8.5" letter-spacing="0.6" fill="#555">+ ACME MINT ADDRESS</text>
  <rect x="384" y="210" width="168" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="392" y="226" font-size="10.5" font-weight="bold">pool_a: the pool&#8217;s ACME</text>
  <text x="392" y="243" font-size="10" fill="#444">&#8776; 459.3 ACME</text>
  <!-- 40.7 ACME out -->
  <path d="M 380,236 C 300,290 240,330 196,380" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#amm-bob-swap-arr)"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="270" y="372" font-size="11" font-weight="bold" text-anchor="middle">&#8776; 40.7 ACME out</text>
  <!-- price slide inset -->
  <text x="538" y="272" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">spot price slides up the curve</text>
  <line x1="450" y1="380" x2="450" y2="285" stroke="#111" stroke-width="1.5" marker-end="url(#amm-bob-swap-arr)"/>
  <line x1="450" y1="380" x2="628" y2="380" stroke="#111" stroke-width="1.5" marker-end="url(#amm-bob-swap-arr)"/>
  <path d="M 468,292 C 480,330 510,352 560,362 C 585,366 610,368 626,370" fill="none" stroke="#111" stroke-width="1.8"/>
  <circle cx="539" cy="357" r="5" fill="#111"/>
  <text x="556" y="354" font-size="12" font-weight="bold">$2.25</text>
  <circle cx="480" cy="317" r="5" fill="#111"/>
  <path d="M 526,365 Q 498,352 474,328" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#amm-bob-swap-arr)"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="480" y="302" font-size="12" font-weight="bold" text-anchor="middle">$2.67</text>
</svg>
