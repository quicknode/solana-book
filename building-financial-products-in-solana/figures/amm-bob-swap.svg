<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Georgia, serif" fill="#111">
  <defs>
    <marker id="amm-bob-swap-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#111"/>
    </marker>
  </defs>
  <!-- Bob -->
  <circle cx="60" cy="170" r="16" fill="none" stroke="#111" stroke-width="1.5"/>
  <path d="M 35,212 Q 60,190 85,212" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="60" y="232" font-size="12" font-weight="bold" text-anchor="middle">Bob</text>
  <!-- 14,000 USDC in -->
  <path d="M 92,160 C 120,150 150,145 181,143" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#amm-bob-swap-arr)"/>
  <text x="135" y="112" font-size="11" font-weight="bold" text-anchor="middle">14,000 USDC</text>
  <!-- fee gate -->
  <rect x="185" y="120" width="128" height="50" rx="6" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="249" y="140" font-size="11" font-weight="bold" text-anchor="middle">fee off the top</text>
  <text x="249" y="156" font-size="10.5" fill="#444" text-anchor="middle">$42 = 30 bps</text>
  <!-- admin's virtual claim -->
  <rect x="150" y="30" width="208" height="46" rx="6" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="254" y="48" font-size="11" font-weight="bold" text-anchor="middle">Maria&#8217;s virtual claim</text>
  <text x="254" y="64" font-size="10.5" text-anchor="middle">admin_fees_owed_b += $7</text>
  <path d="M 246,118 L 252,80" fill="none" stroke="#777" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#amm-bob-swap-arr)"/>
  <text x="262" y="100" font-size="10.5" font-weight="bold">$7</text>
  <!-- taxed input and LP fee into the vault -->
  <path d="M 313,138 C 345,133 380,140 409,158" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#amm-bob-swap-arr)"/>
  <text x="355" y="122" font-size="11" font-weight="bold" text-anchor="middle">taxed input: 13,958</text>
  <path d="M 310,168 C 340,190 365,188 406,172" fill="none" stroke="#111" stroke-width="1.3" marker-end="url(#amm-bob-swap-arr)"/>
  <text x="374" y="208" font-size="10.5" font-style="italic" fill="#444" text-anchor="end">LPs&#8217; $35 stays in the vault</text>
  <!-- the pool -->
  <rect x="380" y="140" width="168" height="118" rx="8" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="538" y="158" font-size="12" font-weight="bold" text-anchor="end">pool</text>
  <circle cx="420" cy="165" r="9" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="436" y="161" font-size="11" font-weight="bold">pool_b</text>
  <text x="436" y="175" font-size="10.5" fill="#444">USDC vault</text>
  <circle cx="420" cy="220" r="9" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="436" y="216" font-size="11" font-weight="bold">pool_a</text>
  <text x="436" y="230" font-size="10.5" fill="#444">ACME vault</text>
  <!-- 92 ACME out -->
  <path d="M 408,229 C 300,262 170,244 94,200" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#amm-bob-swap-arr)"/>
  <text x="238" y="272" font-size="11" font-weight="bold" text-anchor="middle">&#8776; 92 ACME out</text>
  <!-- price slide inset -->
  <text x="538" y="272" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">spot price slides up the curve</text>
  <line x1="450" y1="380" x2="450" y2="285" stroke="#111" stroke-width="1.5" marker-end="url(#amm-bob-swap-arr)"/>
  <line x1="450" y1="380" x2="628" y2="380" stroke="#111" stroke-width="1.5" marker-end="url(#amm-bob-swap-arr)"/>
  <path d="M 468,292 C 480,330 510,352 560,362 C 585,366 610,368 626,370" fill="none" stroke="#111" stroke-width="1.8"/>
  <circle cx="539" cy="357" r="5" fill="#111"/>
  <text x="556" y="354" font-size="12" font-weight="bold">$140</text>
  <circle cx="480" cy="317" r="5" fill="#111"/>
  <text x="480" y="302" font-size="12" font-weight="bold" text-anchor="middle">$164</text>
  <path d="M 526,365 Q 498,352 474,328" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#amm-bob-swap-arr)"/>
</svg>
