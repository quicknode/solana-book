<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Georgia, serif" fill="#111">
  <defs>
    <marker id="alices-tx-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#111"/>
    </marker>
    <marker id="alices-tx-arrg" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#777"/>
    </marker>
  </defs>
  <!-- the curve -->
  <path d="M 0,36 Q 400,36 640,116" fill="none" stroke="#111" stroke-width="3.5"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="628" y="24" font-size="13" font-weight="bold" text-anchor="end">Solana Devnet</text>
  <!-- Alice: wallet account -->
  <circle cx="104" cy="37" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="104" y="25" font-size="7.5" letter-spacing="0.8" fill="#555" text-anchor="middle">PUBLIC KEY</text>
  <rect x="16" y="46" width="124" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(24,53)">
    <circle cx="7" cy="4" r="3.1" fill="none" stroke="#111" stroke-width="1.3"/>
    <path d="M 1.5,13 Q 1.5,8.4 7,8.4 Q 12.5,8.4 12.5,13" fill="none" stroke="#111" stroke-width="1.3"/>
  </g>
  <text x="46" y="64" font-size="10.5" font-weight="bold">Alice&#8217;s Account</text>
  <text x="46" y="80" font-size="9.5" fill="#444">1 &#8594; 0.95 SOL</text>
  <!-- Bob: wallet account -->
  <circle cx="300" cy="49" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="300" y="37" font-size="7.5" letter-spacing="0.8" fill="#555" text-anchor="middle">PUBLIC KEY</text>
  <rect x="240" y="62" width="118" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(248,69)">
    <circle cx="7" cy="4" r="3.1" fill="none" stroke="#111" stroke-width="1.3"/>
    <path d="M 1.5,13 Q 1.5,8.4 7,8.4 Q 12.5,8.4 12.5,13" fill="none" stroke="#111" stroke-width="1.3"/>
  </g>
  <text x="270" y="80" font-size="10.5" font-weight="bold">Bob&#8217;s Account</text>
  <text x="270" y="96" font-size="9.5" fill="#444">1 &#8594; 1.05 SOL</text>
  <!-- effects -->
  <path d="M 142,66 L 236,72" fill="none" stroke="#777" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#alices-tx-arrg)"/>
  <text x="190" y="122" font-size="10.5" fill="#444" text-anchor="middle" font-style="italic">lamports move from Alice to Bob</text>
  <!-- programs on the curve, with their instruction handlers -->
  <circle cx="404" cy="62" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="404" y="50" font-size="7.5" letter-spacing="0.8" fill="#555" text-anchor="middle">PUBLIC KEY</text>
  <rect x="352" y="79" width="118" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(358,84)">
    <circle cx="7" cy="7" r="3.4" fill="none" stroke="#111" stroke-width="1.3"/>
    <circle cx="7" cy="7" r="1.2" fill="none" stroke="#111" stroke-width="1"/>
    <g stroke="#111" stroke-width="1.3">
      <line x1="7" y1="1" x2="7" y2="3"/><line x1="7" y1="11" x2="7" y2="13"/>
      <line x1="1" y1="7" x2="3" y2="7"/><line x1="11" y1="7" x2="13" y2="7"/>
      <line x1="2.8" y1="2.8" x2="4.2" y2="4.2"/><line x1="9.8" y1="9.8" x2="11.2" y2="11.2"/>
      <line x1="11.2" y1="2.8" x2="9.8" y2="4.2"/><line x1="2.8" y1="11.2" x2="4.2" y2="9.8"/>
    </g>
  </g>
  <text x="376" y="95" font-size="10.5" font-weight="bold">System Program</text>
  <text x="358" y="113" font-size="10" font-family="Menlo, monospace">transfer()</text>
  <circle cx="520" cy="83" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="520" y="71" font-size="7.5" letter-spacing="0.8" fill="#555" text-anchor="middle">PUBLIC KEY</text>
  <rect x="470" y="105" width="112" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(476,110)">
    <circle cx="7" cy="7" r="3.4" fill="none" stroke="#111" stroke-width="1.3"/>
    <circle cx="7" cy="7" r="1.2" fill="none" stroke="#111" stroke-width="1"/>
    <g stroke="#111" stroke-width="1.3">
      <line x1="7" y1="1" x2="7" y2="3"/><line x1="7" y1="11" x2="7" y2="13"/>
      <line x1="1" y1="7" x2="3" y2="7"/><line x1="11" y1="7" x2="13" y2="7"/>
      <line x1="2.8" y1="2.8" x2="4.2" y2="4.2"/><line x1="9.8" y1="9.8" x2="11.2" y2="11.2"/>
      <line x1="11.2" y1="2.8" x2="9.8" y2="4.2"/><line x1="2.8" y1="11.2" x2="4.2" y2="9.8"/>
    </g>
  </g>
  <text x="494" y="121" font-size="10.5" font-weight="bold">Memo Program</text>
  <text x="476" y="139" font-size="10" font-family="Menlo, monospace">memo()</text>
  <!-- transaction box, below the accounts it is signed by -->
  <rect x="24" y="150" width="270" height="130" fill="none" stroke="#111" stroke-width="2"/>
  <text x="38" y="172" font-size="13" font-weight="bold">Transaction</text>
  <text x="38" y="188" font-size="11" font-style="italic" fill="#444">signed by Alice&#8217;s private key</text>
  <rect x="38" y="198" width="242" height="32" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="46" y="212" font-size="11" font-weight="bold">Instruction 1 &#8594; System Program</text>
  <text x="46" y="225" font-size="11"><tspan font-family="Menlo, monospace">transfer()</tspan>: send lamports to Bob</text>
  <rect x="38" y="236" width="242" height="32" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="46" y="250" font-size="11" font-weight="bold">Instruction 2 &#8594; Memo Program</text>
  <text x="46" y="263" font-size="11"><tspan font-family="Menlo, monospace">memo()</tspan>: write &#8220;thanks&#8221;</text>
  <!-- instruction arrows -->
  <path d="M 282,214 C 330,200 360,164 380,129" fill="none" stroke="#111" stroke-width="1.3" marker-end="url(#alices-tx-arr)"/>
  <path d="M 282,252 C 360,240 450,192 496,153" fill="none" stroke="#111" stroke-width="1.3" marker-end="url(#alices-tx-arr)"/>
  <!-- the memo's effect: a note in the transaction log -->
  <rect x="480" y="180" width="112" height="34" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="536" y="194" font-size="10.5" text-anchor="middle" font-style="italic">transaction log:</text>
  <text x="536" y="207" font-size="11" text-anchor="middle">&#8220;thanks&#8221;</text>
  <path d="M 540,151 L 537,176" fill="none" stroke="#111" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#alices-tx-arr)"/>
</svg>
