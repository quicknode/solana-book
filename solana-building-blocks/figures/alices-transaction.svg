<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Georgia, serif" fill="#111">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#111"/>
    </marker>
  </defs>
  <!-- transaction box -->
  <rect x="30" y="24" width="270" height="130" rx="8" fill="none" stroke="#111" stroke-width="2"/>
  <text x="44" y="46" font-size="13" font-weight="bold">Transaction</text>
  <text x="44" y="62" font-size="11" font-style="italic" fill="#444">signed by Alice&#8217;s private key</text>
  <rect x="44" y="72" width="242" height="32" rx="4" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="52" y="86" font-size="11" font-weight="bold">Instruction 1 &#8594; System Program</text>
  <text x="52" y="99" font-size="11"><tspan font-family="Menlo, monospace">transfer</tspan>: send lamports to Bob</text>
  <rect x="44" y="110" width="242" height="32" rx="4" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="52" y="124" font-size="11" font-weight="bold">Instruction 2 &#8594; Memo Program</text>
  <text x="52" y="137" font-size="11"><tspan font-family="Menlo, monospace">memo</tspan>: write &#8220;thanks&#8221;</text>
  <!-- the curve -->
  <path d="M 40,350 Q 320,90 600,350" fill="none" stroke="#111" stroke-width="2"/>
  <text x="320" y="372" font-size="14" font-weight="bold" text-anchor="middle">Solana Devnet</text>
  <circle cx="180" cy="252" r="6" fill="#111"/>
  <text x="150" y="282" font-size="12" font-weight="bold">Alice</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="168" y="244" font-size="9" letter-spacing="1" fill="#555" text-anchor="end">PUBLIC KEY</text>
  <circle cx="460" cy="252" r="6" fill="#111"/>
  <text x="452" y="282" font-size="12" font-weight="bold">Bob</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="472" y="266" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <!-- instruction arrows -->
  <path d="M 286,88 C 400,88 340,150 291,192" fill="none" stroke="#111" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M 286,126 C 470,120 430,165 404,200" fill="none" stroke="#111" stroke-width="1.3" marker-end="url(#arrow)"/>
  <!-- effects -->
  <path d="M 188,258 Q 320,296 452,258" fill="none" stroke="#111" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="320" y="316" font-size="11" fill="#444" text-anchor="middle" font-style="italic">lamports move from Alice to Bob</text>
  <!-- programs on the curve, with their instruction handlers -->
  <rect x="234" y="196" width="110" height="44" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="289" y="212" font-size="10.5" font-weight="bold" text-anchor="middle">System Program</text>
  <text x="289" y="230" font-size="10" text-anchor="middle" font-family="Menlo, monospace">transfer</text>
  <rect x="354" y="204" width="100" height="44" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="404" y="220" font-size="10.5" font-weight="bold" text-anchor="middle">Memo Program</text>
  <text x="404" y="238" font-size="10" text-anchor="middle" font-family="Menlo, monospace">memo</text>
  <rect x="500" y="150" width="112" height="34" rx="4" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="556" y="164" font-size="10.5" text-anchor="middle" font-style="italic">transaction log:</text>
  <text x="556" y="177" font-size="11" text-anchor="middle">&#8220;thanks&#8221;</text>
  <path d="M 456,212 C 472,200 484,186 498,172" fill="none" stroke="#111" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
</svg>
