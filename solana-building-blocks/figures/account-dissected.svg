<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Georgia, serif" fill="#111">
  <!-- account box -->
  <rect x="40" y="40" width="240" height="210" rx="6" fill="none" stroke="#111" stroke-width="2"/>
  <g transform="translate(100,15)" stroke="#111" stroke-width="1.2" fill="none">
    <rect x="1" y="2" width="12" height="10"/>
    <line x1="1" y1="5.4" x2="13" y2="5.4"/>
    <line x1="5.5" y1="5.4" x2="5.5" y2="12"/>
  </g>
  <text x="168" y="28" font-size="13" font-weight="bold" text-anchor="middle">One account</text>
  <rect x="56" y="56" width="208" height="34" fill="#f4f4f2" stroke="#888"/>
  <text x="64" y="70" font-size="11" font-weight="bold">address</text>
  <text x="64" y="83" font-size="10" fill="#444">7Zb3…kQd9 (32 bytes)</text>
  <rect x="56" y="96" width="208" height="34" fill="#f4f4f2" stroke="#888"/>
  <text x="64" y="110" font-size="11" font-weight="bold">owner program</text>
  <text x="64" y="123" font-size="10" fill="#444">the escrow program</text>
  <rect x="56" y="136" width="208" height="34" fill="#f4f4f2" stroke="#888"/>
  <text x="64" y="150" font-size="11" font-weight="bold">lamport balance</text>
  <text x="64" y="163" font-size="10" fill="#444">2,039,280 (the rent deposit)</text>
  <rect x="56" y="176" width="208" height="60" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="64" y="192" font-size="11" font-weight="bold">data bytes</text>
  <text x="64" y="206" font-size="10" fill="#444" font-family="Menlo, monospace">01 5f 3a 9c 44 07 e2 …</text>
  <!-- zoom to struct -->
  <path d="M 268,180 L 360,90 M 268,232 L 360,262" stroke="#999" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
  <rect x="360" y="80" width="248" height="192" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="376" y="104" font-size="11.5" font-family="Menlo, monospace" font-weight="bold">struct Offer {</text>
  <text x="392" y="126" font-size="11" font-family="Menlo, monospace">id: u64,</text>
  <text x="392" y="147" font-size="11" font-family="Menlo, monospace">maker: Pubkey,</text>
  <text x="392" y="168" font-size="11" font-family="Menlo, monospace">token_mint_a: Pubkey,</text>
  <text x="392" y="189" font-size="11" font-family="Menlo, monospace">token_mint_b: Pubkey,</text>
  <text x="392" y="210" font-size="9.5" font-family="Menlo, monospace">token_b_wanted_amount: u64,</text>
  <text x="392" y="231" font-size="11" font-family="Menlo, monospace">bump: u8,</text>
  <text x="376" y="254" font-size="11.5" font-family="Menlo, monospace" font-weight="bold">}</text>
  <text x="484" y="66" font-size="11" fill="#444" text-anchor="middle" font-style="italic">the same bytes, as the program sees them</text>
</svg>
