<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 318" font-family="Georgia, serif" fill="#111">
  <defs><marker id="clocktree-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <text x="44" y="26" font-size="11.5" font-weight="bold">What are you measuring?</text>
  <path d="M 44,38 L 44,278" stroke="#111" stroke-width="1.6" fill="none"/>

  <text x="58" y="62" font-size="10.5">only the order things arrived in?</text>
  <path d="M 44,70 L 348,70" stroke="#111" stroke-width="1.6" fill="none" marker-end="url(#clocktree-arr)"/>
  <rect x="356" y="52" width="248" height="36" fill="#f4f4f2" stroke="#888"/>
  <text x="366" y="68" font-size="10.5" font-weight="bold">a counter of your own</text>
  <text x="366" y="82" font-size="9.5" fill="#444" font-style="italic">neither clock; nothing to bend</text>

  <text x="58" y="132" font-size="10.5">the age of a number someone else published?</text>
  <path d="M 44,140 L 348,140" stroke="#111" stroke-width="1.6" fill="none" marker-end="url(#clocktree-arr)"/>
  <rect x="356" y="122" width="248" height="36" fill="#f4f4f2" stroke="#888"/>
  <text x="366" y="138" font-size="10.5" font-weight="bold">whichever unit they stamped</text>
  <text x="366" y="152" font-size="9.5" fill="#444" font-style="italic">if slots, add the LastRestartSlot check</text>

  <text x="58" y="202" font-size="10.5">a real-world time you promised a person?</text>
  <path d="M 44,210 L 348,210" stroke="#111" stroke-width="1.6" fill="none" marker-end="url(#clocktree-arr)"/>
  <rect x="356" y="192" width="248" height="36" fill="#f4f4f2" stroke="#888"/>
  <text x="366" y="208" font-size="10.5" font-weight="bold">the wall clock</text>
  <text x="366" y="222" font-size="9.5" fill="#444" font-style="italic">leave a margin wider than a few seconds</text>

  <text x="58" y="272" font-size="10.5">anything else, and anything worth money</text>
  <path d="M 44,278 L 348,278" stroke="#111" stroke-width="1.6" fill="none" marker-end="url(#clocktree-arr)"/>
  <rect x="356" y="260" width="248" height="36" fill="#f4f4f2" stroke="#888"/>
  <text x="366" y="276" font-size="10.5" font-weight="bold">the slot count</text>
  <text x="366" y="290" font-size="9.5" fill="#444" font-style="italic">the default; pauses when the chain does</text>
</svg>
