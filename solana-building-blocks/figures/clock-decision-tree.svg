<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 344" font-family="'Denim INK', Helvetica, Arial, sans-serif" fill="#111">
<g transform="translate(0,-16)">
  <defs><marker id="clocktree-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>

  <rect x="28" y="24" width="250" height="46" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="38" y="42" font-size="10.5">Do you only need things handled</text>
  <text x="38" y="56" font-size="10.5">in the order they arrived?</text>
  <path d="M 282,47 L 364,47" stroke="#111" stroke-width="1.6" fill="none" marker-end="url(#clocktree-arr)"/>
  <text x="323" y="41" font-size="9.5" fill="#555" font-style="italic" text-anchor="middle">yes</text>
  <rect x="372" y="24" width="236" height="46" fill="#f4f4f2" stroke="#888"/>
  <text x="382" y="42" font-size="10.5" font-weight="bold">a counter of your own</text>
  <text x="382" y="56" font-size="9.5" fill="#444" font-style="italic">neither clock, nothing to move</text>

  <path d="M 153,70 L 153,114" stroke="#111" stroke-width="1.6" fill="none" marker-end="url(#clocktree-arr)"/>
  <text x="161" y="95" font-size="9.5" fill="#555" font-style="italic">no</text>

  <rect x="28" y="118" width="250" height="46" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="38" y="136" font-size="10.5">Are you measuring the age of a</text>
  <text x="38" y="150" font-size="10.5">number someone else published?</text>
  <path d="M 282,141 L 364,141" stroke="#111" stroke-width="1.6" fill="none" marker-end="url(#clocktree-arr)"/>
  <text x="323" y="135" font-size="9.5" fill="#555" font-style="italic" text-anchor="middle">yes</text>
  <rect x="372" y="118" width="236" height="46" fill="#f4f4f2" stroke="#888"/>
  <text x="382" y="136" font-size="10.5" font-weight="bold">whichever unit they stamped</text>
  <text x="382" y="150" font-size="9.5" fill="#444" font-style="italic">and reject a price stamped before the last restart</text>

  <path d="M 153,164 L 153,208" stroke="#111" stroke-width="1.6" fill="none" marker-end="url(#clocktree-arr)"/>
  <text x="161" y="189" font-size="9.5" fill="#555" font-style="italic">no</text>

  <rect x="28" y="212" width="250" height="46" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="38" y="230" font-size="10.5">Is the span shorter than</text>
  <text x="38" y="244" font-size="10.5">about 20 seconds?</text>
  <path d="M 282,235 L 364,235" stroke="#111" stroke-width="1.6" fill="none" marker-end="url(#clocktree-arr)"/>
  <text x="323" y="229" font-size="9.5" fill="#555" font-style="italic" text-anchor="middle">yes</text>
  <rect x="372" y="212" width="236" height="46" fill="#f4f4f2" stroke="#888"/>
  <text x="382" y="230" font-size="10.5" font-weight="bold">the slot count</text>
  <text x="382" y="244" font-size="9.5" fill="#444" font-style="italic">nobody can move it; drifts under 2 seconds</text>

  <path d="M 153,258 L 153,329 L 364,329" stroke="#111" stroke-width="1.6" fill="none" marker-end="url(#clocktree-arr)"/>
  <text x="161" y="290" font-size="9.5" fill="#555" font-style="italic">no</text>
  <rect x="372" y="306" width="236" height="46" fill="#f4f4f2" stroke="#888"/>
  <text x="382" y="324" font-size="10.5" font-weight="bold">the Unix timestamp</text>
  <text x="382" y="338" font-size="9.5" fill="#444" font-style="italic">the default: give a deadline a margin</text>
</g>
</svg>
