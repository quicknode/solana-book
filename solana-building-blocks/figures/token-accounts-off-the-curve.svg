<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Georgia, serif" fill="#111">
  <path d="M 40,310 Q 320,50 600,310" fill="none" stroke="#111" stroke-width="2"/>
  <text x="320" y="332" font-size="14" font-weight="bold" text-anchor="middle">Solana Devnet</text>
  <!-- on-curve keypair addresses -->
  <circle cx="180" cy="212" r="6" fill="#111"/>
  <text x="150" y="242" font-size="12" font-weight="bold">Alice</text>
  <circle cx="460" cy="212" r="6" fill="#111"/>
  <text x="450" y="242" font-size="12" font-weight="bold">Bob</text>
  <rect x="314" y="174" width="12" height="12" fill="#111" transform="rotate(45 320 180)"/>
  <text x="320" y="206" font-size="12" font-weight="bold" text-anchor="middle">USDC mint</text>
  <!-- off-curve PDAs: the token accounts -->
  <circle cx="150" cy="90" r="7" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="150" y="66" font-size="12" font-weight="bold" text-anchor="middle">Alice&#8217;s USDC store</text>
  <text x="150" y="80" font-size="10" fill="#444" text-anchor="middle">1,000 USDC</text>
  <circle cx="490" cy="90" r="7" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="490" y="66" font-size="12" font-weight="bold" text-anchor="middle">Bob&#8217;s USDC store</text>
  <text x="490" y="80" font-size="10" fill="#444" text-anchor="middle">300 USDC</text>
  <!-- derivation lines -->
  <line x1="178" y1="205" x2="153" y2="98" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="317" y1="176" x2="158" y2="93" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="462" y1="205" x2="488" y2="98" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="324" y1="176" x2="482" y2="93" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="320" y="118" font-size="10.5" fill="#444" text-anchor="middle" font-style="italic">derived from owner + mint: off the curve, no private key</text>
  <!-- legend -->
  <circle cx="52" cy="342" r="5" fill="#111"/>
  <text x="63" y="346" font-size="10.5" fill="#444">keypair address (on the curve)</text>
  <circle cx="272" cy="342" r="5" fill="#fff" stroke="#111" stroke-width="1.6"/>
  <text x="283" y="346" font-size="10.5" fill="#444">PDA (off the curve)</text>
</svg>
