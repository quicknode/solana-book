<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" font-family="Georgia, serif" fill="#111">
  <path d="M 40,310 Q 320,50 600,310" fill="none" stroke="#111" stroke-width="2"/>
  <text x="320" y="334" font-size="14" font-weight="bold" text-anchor="middle">Solana Devnet</text>
  <!-- on-curve public keys -->
  <circle cx="180" cy="212" r="6" fill="#111"/>
  <text x="164" y="240" font-size="12" font-weight="bold">Alice</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="192" y="226" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <circle cx="460" cy="212" r="6" fill="#111"/>
  <text x="448" y="240" font-size="12" font-weight="bold">Bob</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="448" y="226" font-size="9" letter-spacing="1" fill="#555" text-anchor="end">PUBLIC KEY</text>
  <circle cx="320" cy="180" r="6" fill="#111"/>
  <text x="320" y="204" font-size="12" font-weight="bold" text-anchor="middle">USDC mint</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="332" y="176" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <!-- the ATAs: rectangles, off the curve, next to their owners -->
  <text x="150" y="16" font-size="9" letter-spacing="0.8" fill="#555" text-anchor="middle">ASSOCIATED TOKEN PROGRAM ID</text>
  <text x="150" y="29" font-size="9" letter-spacing="0.8" fill="#555" text-anchor="middle">+ ALICE&#8217;S ADDRESS + TOKEN PROGRAM ID</text>
  <text x="150" y="42" font-size="9" letter-spacing="0.8" fill="#555" text-anchor="middle">+ USDC MINT ADDRESS</text>
  <rect x="85" y="54" width="130" height="52" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="150" y="76" font-size="12" font-weight="bold" text-anchor="middle">Alice&#8217;s USDC</text>
  <text x="150" y="94" font-size="10.5" fill="#444" text-anchor="middle">1,000 USDC</text>
  <text x="490" y="16" font-size="9" letter-spacing="0.8" fill="#555" text-anchor="middle">ASSOCIATED TOKEN PROGRAM ID</text>
  <text x="490" y="29" font-size="9" letter-spacing="0.8" fill="#555" text-anchor="middle">+ BOB&#8217;S ADDRESS + TOKEN PROGRAM ID</text>
  <text x="490" y="42" font-size="9" letter-spacing="0.8" fill="#555" text-anchor="middle">+ USDC MINT ADDRESS</text>
  <rect x="425" y="54" width="130" height="52" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="490" y="76" font-size="12" font-weight="bold" text-anchor="middle">Bob&#8217;s USDC</text>
  <text x="490" y="94" font-size="10.5" fill="#444" text-anchor="middle">300 USDC</text>
  <!-- derivation lines -->
  <line x1="178" y1="205" x2="153" y2="108" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="314" y1="176" x2="218" y2="96" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="462" y1="205" x2="487" y2="108" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="326" y1="176" x2="422" y2="96" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="320" y="128" font-size="10.5" fill="#444" text-anchor="middle" font-style="italic">derived, off the curve: no private key exists</text>
  <!-- legend -->
  <circle cx="52" cy="368" r="5" fill="#111"/>
  <text x="63" y="372" font-size="10.5" fill="#444">public key (on the curve)</text>
  <rect x="230" y="360" width="18" height="13" rx="3" fill="#fff" stroke="#111" stroke-width="1.6"/>
  <text x="255" y="372" font-size="10.5" fill="#444">token account: a PDA (off the curve)</text>
</svg>
