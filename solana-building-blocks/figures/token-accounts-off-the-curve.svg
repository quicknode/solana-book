<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Georgia, serif" fill="#111">
  <path d="M 40,310 Q 320,50 600,310" fill="none" stroke="#111" stroke-width="2"/>
  <text x="320" y="334" font-size="14" font-weight="bold" text-anchor="middle">Solana Devnet</text>
  <!-- on-curve public keys -->
  <circle cx="180" cy="212" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="192" y="226" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <circle cx="460" cy="212" r="6" fill="#111"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="448" y="226" font-size="9" letter-spacing="1" fill="#555" text-anchor="end">PUBLIC KEY</text>
  <circle cx="320" cy="180" r="6" fill="#111"/>
  <text x="320" y="204" font-size="12" font-weight="bold" text-anchor="middle">USDC mint</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="332" y="176" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <!-- Alice: wallet account -->
  <rect x="150" y="240" width="124" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="165" cy="257" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M 157,268 Q 165,261 173,268" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="180" y="257" font-size="10.5" font-weight="bold">Alice&#8217;s Account</text>
  <text x="180" y="273" font-size="9.5" fill="#444">0.15 SOL</text>
  <line x1="180" y1="219" x2="180" y2="239" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- Bob: wallet account -->
  <rect x="372" y="240" width="112" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="387" cy="257" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M 379,268 Q 387,261 395,268" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="402" y="257" font-size="10.5" font-weight="bold">Bob&#8217;s Account</text>
  <text x="402" y="273" font-size="9.5" fill="#444">0.15 SOL</text>
  <line x1="460" y1="219" x2="460" y2="239" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- the ATAs: rectangles, off the curve, next to their owners; each has its own address dot -->
  <circle cx="75" cy="42" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="87" y="38" font-size="8.5" letter-spacing="0.6" fill="#555">ATA PROGRAM + ALICE&#8217;S</text>
  <text x="87" y="49" font-size="8.5" letter-spacing="0.6" fill="#555">ADDRESS + USDC MINT ADDRESS</text>
  <rect x="85" y="54" width="130" height="52" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="150" y="76" font-size="12" font-weight="bold" text-anchor="middle">Alice&#8217;s USDC</text>
  <text x="150" y="94" font-size="10.5" fill="#444" text-anchor="middle">1,000 USDC</text>
  <circle cx="415" cy="42" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="427" y="38" font-size="8.5" letter-spacing="0.6" fill="#555">ATA PROGRAM + BOB&#8217;S</text>
  <text x="427" y="49" font-size="8.5" letter-spacing="0.6" fill="#555">ADDRESS + USDC MINT ADDRESS</text>
  <rect x="425" y="54" width="130" height="52" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="490" y="76" font-size="12" font-weight="bold" text-anchor="middle">Bob&#8217;s USDC</text>
  <text x="490" y="94" font-size="10.5" fill="#444" text-anchor="middle">300 USDC</text>
</svg>
