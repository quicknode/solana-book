<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" font-family="Georgia, serif" fill="#111">
  <path d="M 0,36 Q 400,36 640,116" fill="none" stroke="#111" stroke-width="3.5"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="628" y="24" font-size="13" font-weight="bold" text-anchor="end">Solana Devnet</text>
  <!-- people: wallet accounts hang beneath their addresses on the curve -->
  <circle cx="104" cy="37" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <rect x="16" y="46" width="124" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(24,53)">
    <circle cx="7" cy="4" r="3.1" fill="none" stroke="#111" stroke-width="1.3"/>
    <path d="M 1.5,13 Q 1.5,8.4 7,8.4 Q 12.5,8.4 12.5,13" fill="none" stroke="#111" stroke-width="1.3"/>
  </g>
  <text x="46" y="64" font-size="10.5" font-weight="bold">Alice&#8217;s Account</text>
  <text x="46" y="80" font-size="9.5" fill="#444">1 SOL</text>
  <circle cx="210" cy="42" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <rect x="148" y="53" width="118" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(156,60)">
    <circle cx="7" cy="4" r="3.1" fill="none" stroke="#111" stroke-width="1.3"/>
    <path d="M 1.5,13 Q 1.5,8.4 7,8.4 Q 12.5,8.4 12.5,13" fill="none" stroke="#111" stroke-width="1.3"/>
  </g>
  <text x="178" y="71" font-size="10.5" font-weight="bold">Bob&#8217;s Account</text>
  <text x="178" y="87" font-size="9.5" fill="#444">1 SOL</text>
  <!-- programs as points on the same curve: their addresses are public keys too -->
  <circle cx="404" cy="62" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <rect x="352" y="86" width="152" height="62" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(360,91)">
    <circle cx="7" cy="7" r="3.4" fill="none" stroke="#111" stroke-width="1.3"/>
    <circle cx="7" cy="7" r="1.2" fill="none" stroke="#111" stroke-width="1"/>
    <g stroke="#111" stroke-width="1.3">
      <line x1="7" y1="1" x2="7" y2="3"/><line x1="7" y1="11" x2="7" y2="13"/>
      <line x1="1" y1="7" x2="3" y2="7"/><line x1="11" y1="7" x2="13" y2="7"/>
      <line x1="2.8" y1="2.8" x2="4.2" y2="4.2"/><line x1="9.8" y1="9.8" x2="11.2" y2="11.2"/>
      <line x1="11.2" y1="2.8" x2="9.8" y2="4.2"/><line x1="2.8" y1="11.2" x2="4.2" y2="9.8"/>
    </g>
  </g>
  <text x="380" y="104" font-size="12.5" font-weight="bold">System Program</text>
  <text x="362" y="120" font-size="10" font-family="Menlo, monospace">create_account()</text>
  <text x="362" y="136" font-size="10" font-family="Menlo, monospace">transfer()</text>
  <circle cx="548" cy="90" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <rect x="496" y="124" width="120" height="48" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(504,129)">
    <circle cx="7" cy="7" r="3.4" fill="none" stroke="#111" stroke-width="1.3"/>
    <circle cx="7" cy="7" r="1.2" fill="none" stroke="#111" stroke-width="1"/>
    <g stroke="#111" stroke-width="1.3">
      <line x1="7" y1="1" x2="7" y2="3"/><line x1="7" y1="11" x2="7" y2="13"/>
      <line x1="1" y1="7" x2="3" y2="7"/><line x1="11" y1="7" x2="13" y2="7"/>
      <line x1="2.8" y1="2.8" x2="4.2" y2="4.2"/><line x1="9.8" y1="9.8" x2="11.2" y2="11.2"/>
      <line x1="11.2" y1="2.8" x2="9.8" y2="4.2"/><line x1="2.8" y1="11.2" x2="4.2" y2="9.8"/>
    </g>
  </g>
  <text x="524" y="142" font-size="12.5" font-weight="bold">Memo Program</text>
  <text x="506" y="158" font-size="10" font-family="Menlo, monospace">memo()</text>
  <!-- legend -->
  <circle cx="52" cy="166" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="63" y="170" font-size="11" fill="#444">an address: a public key, on the curve</text>
  <text x="63" y="186" font-size="10" fill="#444" font-style="italic">people and programs alike</text>
</svg>
