<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Georgia, serif" fill="#111">
  <path d="M 40,310 Q 320,50 600,310" fill="none" stroke="#111" stroke-width="2"/>
  <text x="320" y="330" font-size="14" font-weight="bold" text-anchor="middle">Solana Devnet</text>
  <!-- people -->
  <circle cx="180" cy="212" r="6" fill="#111"/>
  <circle cx="460" cy="212" r="6" fill="#111"/>
  <!-- programs as squares on the same curve -->
  <rect x="286" y="175" width="12" height="12" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <line x1="292" y1="173" x2="270" y2="98" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="268" y="76" font-size="12.5" font-weight="bold" text-anchor="middle">System Program</text>
  <text x="268" y="90" font-size="11" fill="#444" text-anchor="middle">creates accounts, moves SOL</text>
  <rect x="372" y="179" width="12" height="12" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <line x1="378" y1="193" x2="420" y2="270" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="424" y="286" font-size="12.5" font-weight="bold" text-anchor="middle">Memo Program</text>
  <text x="424" y="300" font-size="11" fill="#444" text-anchor="middle">writes notes to the log</text>
  <!-- legend -->
  <circle cx="52" cy="52" r="5" fill="#111"/>
  <text x="63" y="56" font-size="11" fill="#444">people&#8217;s addresses</text>
  <rect x="47" y="70" width="10" height="10" fill="#fff" stroke="#111" stroke-width="1.6"/>
  <text x="63" y="79" font-size="11" fill="#444">programs&#8217; addresses</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="120" y="242" font-size="12.5" font-weight="bold">Alice&#8217;s address</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="470" y="242" font-size="12.5" font-weight="bold">Bob&#8217;s address</text>
</svg>
