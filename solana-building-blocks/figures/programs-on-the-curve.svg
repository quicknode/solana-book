<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Georgia, serif" fill="#111">
  <path d="M 40,310 Q 320,50 600,310" fill="none" stroke="#111" stroke-width="3.5"/>
  <text x="320" y="330" font-size="14" font-weight="bold" text-anchor="middle">Solana Devnet</text>
  <!-- people: wallet accounts, addresses on the curve -->
  <circle cx="180" cy="212" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <rect x="36" y="60" width="124" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(44,67)">
    <circle cx="7" cy="4" r="3.1" fill="none" stroke="#111" stroke-width="1.3"/>
    <path d="M 1.5,13 Q 1.5,8.4 7,8.4 Q 12.5,8.4 12.5,13" fill="none" stroke="#111" stroke-width="1.3"/>
  </g>
  <text x="66" y="77" font-size="10.5" font-weight="bold">Alice&#8217;s Account</text>
  <text x="66" y="93" font-size="9.5" fill="#444">1 SOL</text>
  <line x1="100" y1="104" x2="176" y2="203" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="460" cy="212" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <rect x="496" y="90" width="112" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(504,97)">
    <circle cx="7" cy="4" r="3.1" fill="none" stroke="#111" stroke-width="1.3"/>
    <path d="M 1.5,13 Q 1.5,8.4 7,8.4 Q 12.5,8.4 12.5,13" fill="none" stroke="#111" stroke-width="1.3"/>
  </g>
  <text x="526" y="107" font-size="10.5" font-weight="bold">Bob&#8217;s Account</text>
  <text x="526" y="123" font-size="9.5" fill="#444">1 SOL</text>
  <line x1="508" y1="134" x2="466" y2="205" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- programs as points on the same curve: their addresses are public keys too -->
  <circle cx="292" cy="181" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <line x1="292" y1="173" x2="268" y2="98" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="192" y="34" width="152" height="62" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(200,39)">
    <circle cx="7" cy="7" r="3.4" fill="none" stroke="#111" stroke-width="1.3"/>
    <circle cx="7" cy="7" r="1.2" fill="none" stroke="#111" stroke-width="1"/>
    <g stroke="#111" stroke-width="1.3">
      <line x1="7" y1="1" x2="7" y2="3"/><line x1="7" y1="11" x2="7" y2="13"/>
      <line x1="1" y1="7" x2="3" y2="7"/><line x1="11" y1="7" x2="13" y2="7"/>
      <line x1="2.8" y1="2.8" x2="4.2" y2="4.2"/><line x1="9.8" y1="9.8" x2="11.2" y2="11.2"/>
      <line x1="11.2" y1="2.8" x2="9.8" y2="4.2"/><line x1="2.8" y1="11.2" x2="4.2" y2="9.8"/>
    </g>
  </g>
  <text x="220" y="52" font-size="12.5" font-weight="bold">System Program</text>
  <text x="202" y="68" font-size="10" font-family="Menlo, monospace">create_account()</text>
  <text x="202" y="84" font-size="10" font-family="Menlo, monospace">transfer()</text>
  <circle cx="420" cy="197" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <line x1="420" y1="205" x2="424" y2="256" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="364" y="258" width="120" height="48" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(372,263)">
    <circle cx="7" cy="7" r="3.4" fill="none" stroke="#111" stroke-width="1.3"/>
    <circle cx="7" cy="7" r="1.2" fill="none" stroke="#111" stroke-width="1"/>
    <g stroke="#111" stroke-width="1.3">
      <line x1="7" y1="1" x2="7" y2="3"/><line x1="7" y1="11" x2="7" y2="13"/>
      <line x1="1" y1="7" x2="3" y2="7"/><line x1="11" y1="7" x2="13" y2="7"/>
      <line x1="2.8" y1="2.8" x2="4.2" y2="4.2"/><line x1="9.8" y1="9.8" x2="11.2" y2="11.2"/>
      <line x1="11.2" y1="2.8" x2="9.8" y2="4.2"/><line x1="2.8" y1="11.2" x2="4.2" y2="9.8"/>
    </g>
  </g>
  <text x="392" y="276" font-size="12.5" font-weight="bold">Memo Program</text>
  <text x="374" y="294" font-size="10" font-family="Menlo, monospace">memo()</text>
  <!-- legend -->
  <circle cx="52" cy="348" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="63" y="352" font-size="11" fill="#444">an address: a public key, on the curve</text>
  <text x="63" y="368" font-size="10" fill="#444" font-style="italic">people and programs alike</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="194" y="210" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="302" y="178" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="408" y="194" font-size="9" letter-spacing="1" fill="#555" text-anchor="end">PUBLIC KEY</text>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="472" y="226" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="120" y="242" font-size="12.5" font-weight="bold">Alice&#8217;s address</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="470" y="244" font-size="12.5" font-weight="bold">Bob&#8217;s address</text>
</svg>
