<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Georgia, serif" fill="#111">
  <defs><marker id="arr5" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <rect x="60" y="40" width="240" height="180" rx="10" fill="none" stroke="#111" stroke-width="2.2"/>
  <text x="180" y="30" font-size="12.5" font-weight="bold" text-anchor="middle">one transaction, sealed</text>
  <rect x="78" y="60" width="204" height="38" rx="4" fill="#f4f4f2" stroke="#888"/>
  <text x="86" y="76" font-size="10.5" font-weight="bold">1. lending program</text>
  <text x="86" y="90" font-size="10" fill="#444"><tspan font-family="Menlo, monospace">borrow</tspan> 1,000 USDC</text>
  <rect x="78" y="106" width="204" height="38" rx="4" fill="#f4f4f2" stroke="#888"/>
  <text x="86" y="122" font-size="10.5" font-weight="bold">2. AMM program</text>
  <text x="86" y="136" font-size="10" fill="#444"><tspan font-family="Menlo, monospace">swap</tspan> at a profit</text>
  <rect x="78" y="152" width="204" height="38" rx="4" fill="#f4f4f2" stroke="#888"/>
  <text x="86" y="168" font-size="10.5" font-weight="bold">3. lending program</text>
  <text x="86" y="182" font-size="10" fill="#444"><tspan font-family="Menlo, monospace">repay</tspan> 1,000 USDC + fee</text>
  <text x="180" y="212" font-size="10" fill="#444" text-anchor="middle" font-style="italic">a flash loan: three instructions, two programs</text>
  <!-- outcome: commit -->
  <path d="M 304,100 C 360,90 380,80 420,74" stroke="#111" stroke-width="1.6" marker-end="url(#arr5)" fill="none"/>
  <rect x="424" y="52" width="180" height="44" rx="6" fill="none" stroke="#111" stroke-width="1.8"/>
  <text x="514" y="70" font-size="11" font-weight="bold" text-anchor="middle">all three succeed</text>
  <text x="514" y="86" font-size="10" fill="#444" text-anchor="middle">every change lands, together</text>
  <!-- outcome: unwind -->
  <path d="M 304,170 C 360,180 380,190 420,196" stroke="#999" stroke-width="1.6" stroke-dasharray="6 3" marker-end="url(#arr5)" fill="none"/>
  <rect x="424" y="174" width="180" height="58" rx="6" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="514" y="192" font-size="11" font-weight="bold" text-anchor="middle" fill="#444">repayment fails</text>
  <text x="514" y="208" font-size="10" fill="#444" text-anchor="middle">the whole box unwinds:</text>
  <text x="514" y="222" font-size="10" fill="#444" text-anchor="middle">the borrow never happened</text>
</svg>
