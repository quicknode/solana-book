<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 307" font-family="'Denim INK', Helvetica, Arial, sans-serif" fill="#111">
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="16" y="24" font-size="15" font-weight="bold">A flash loan</text>
<g transform="translate(0,11)">
  <defs><marker id="atomic" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <rect x="60" y="40" width="240" height="238" fill="none" stroke="#111" stroke-width="2.2"/>
  <text x="180" y="30" font-size="12.5" font-weight="bold" text-anchor="middle">one transaction, sealed</text>
  <rect x="78" y="60" width="204" height="40" fill="#f4f4f2" stroke="#888"/>
  <text x="86" y="76" font-size="10.5" font-weight="bold" fill="#1e7a3c">1. a flash-loan lender</text>
  <text x="86" y="90" font-size="10" fill="#444"><tspan font-family="'DejaVu Sans Mono', Menlo, monospace">borrow()</tspan> 1,000 USDC</text>
  <rect x="78" y="108" width="204" height="40" fill="#f4f4f2" stroke="#888"/>
  <text x="86" y="124" font-size="10.5" font-weight="bold" fill="#1e7a3c">2. exchange program</text>
  <text x="86" y="138" font-size="10" fill="#444"><tspan font-family="'DejaVu Sans Mono', Menlo, monospace">swap()</tspan> 1,000 USDC for 5 NVDAx</text>
  <rect x="78" y="156" width="204" height="40" fill="#f4f4f2" stroke="#888"/>
  <text x="86" y="172" font-size="10.5" font-weight="bold" fill="#1e7a3c">3. another exchange program</text>
  <text x="86" y="186" font-size="10" fill="#444"><tspan font-family="'DejaVu Sans Mono', Menlo, monospace">swap()</tspan> 5 NVDAx for 1,010 USDC</text>
  <rect x="78" y="204" width="204" height="40" fill="#f4f4f2" stroke="#888"/>
  <text x="86" y="220" font-size="10.5" font-weight="bold" fill="#1e7a3c">4. the flash-loan lender</text>
  <text x="86" y="234" font-size="10" fill="#444"><tspan font-family="'DejaVu Sans Mono', Menlo, monospace">repay()</tspan> 1,000 USDC + fee</text>
  <text x="180" y="264" font-size="10" fill="#444" text-anchor="middle" font-style="italic">a flash loan: four instructions, three programs</text>
  <path d="M 304,128 C 360,114 380,93 420,85" stroke="#111" stroke-width="1.6" marker-end="url(#atomic)" fill="none"/>
  <rect x="424" y="63" width="180" height="44" fill="none" stroke="#111" stroke-width="1.8"/>
  <text x="514" y="81" font-size="11" font-weight="bold" text-anchor="middle">all four succeed</text>
  <text x="514" y="97" font-size="10" fill="#444" text-anchor="middle">every change lands, together</text>
  <path d="M 304,213 C 360,225 380,240 420,246" stroke="#999" stroke-width="1.6" stroke-dasharray="6 3" marker-end="url(#atomic)" fill="none"/>
  <rect x="424" y="218" width="180" height="58" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="514" y="236" font-size="11" font-weight="bold" text-anchor="middle" fill="#444">repayment fails</text>
  <text x="514" y="252" font-size="10" fill="#444" text-anchor="middle">the whole box unwinds:</text>
  <text x="514" y="266" font-size="10" fill="#444" text-anchor="middle">the borrow never happened</text>
</g>
</svg>
