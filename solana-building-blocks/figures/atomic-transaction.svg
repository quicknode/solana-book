<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 252" font-family="Georgia, serif" fill="#111">
  <defs><marker id="atomic" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <rect x="60" y="40" width="240" height="190" fill="none" stroke="#111" stroke-width="2.2"/>
  <text x="180" y="30" font-size="12.5" font-weight="bold" text-anchor="middle">one transaction, sealed</text>
  <rect x="78" y="60" width="204" height="40" fill="#f4f4f2" stroke="#888"/>
  <text x="86" y="76" font-size="10.5" font-weight="bold">1. lending program</text>
  <text x="86" y="90" font-size="10" fill="#444"><tspan font-family="Menlo, monospace">borrow()</tspan> 1,000 USDC</text>
  <rect x="78" y="108" width="204" height="40" fill="#f4f4f2" stroke="#888"/>
  <text x="86" y="124" font-size="10.5" font-weight="bold">2. AMM program</text>
  <text x="86" y="138" font-size="10" fill="#444"><tspan font-family="Menlo, monospace">swap()</tspan> at a profit</text>
  <rect x="78" y="156" width="204" height="40" fill="#f4f4f2" stroke="#888"/>
  <text x="86" y="172" font-size="10.5" font-weight="bold">3. lending program</text>
  <text x="86" y="186" font-size="10" fill="#444"><tspan font-family="Menlo, monospace">repay()</tspan> 1,000 USDC + fee</text>
  <text x="180" y="216" font-size="10" fill="#444" text-anchor="middle" font-style="italic">a flash loan: three instructions, two programs</text>
  <path d="M 304,110 C 360,96 380,84 420,76" stroke="#111" stroke-width="1.6" marker-end="url(#atomic)" fill="none"/>
  <rect x="424" y="54" width="180" height="44" fill="none" stroke="#111" stroke-width="1.8"/>
  <text x="514" y="72" font-size="11" font-weight="bold" text-anchor="middle">all three succeed</text>
  <text x="514" y="88" font-size="10" fill="#444" text-anchor="middle">every change lands, together</text>
  <path d="M 304,178 C 360,188 380,196 420,200" stroke="#999" stroke-width="1.6" stroke-dasharray="6 3" marker-end="url(#atomic)" fill="none"/>
  <rect x="424" y="176" width="180" height="58" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="514" y="194" font-size="11" font-weight="bold" text-anchor="middle" fill="#444">repayment fails</text>
  <text x="514" y="210" font-size="10" fill="#444" text-anchor="middle">the whole box unwinds:</text>
  <text x="514" y="224" font-size="10" fill="#444" text-anchor="middle">the borrow never happened</text>
</svg>
