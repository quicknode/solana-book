<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 194" font-family="'Denim INK', Helvetica, Arial, sans-serif" fill="#111">
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="16" y="24" font-size="15" font-weight="bold">The slot counter</text>
<g>
  <defs><marker id="slotc" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <text x="50" y="60" font-size="12" font-weight="bold">one step per slot, only forward, nobody can move the count</text>
  <text x="90" y="88" font-size="10" text-anchor="middle" font-family="'DejaVu Sans Mono', Menlo, monospace">slot n</text>
  <text x="170" y="88" font-size="10" text-anchor="middle" font-family="'DejaVu Sans Mono', Menlo, monospace">n+1</text>
  <text x="250" y="88" font-size="10" text-anchor="middle" font-family="'DejaVu Sans Mono', Menlo, monospace">n+2</text>
  <text x="330" y="88" font-size="10" text-anchor="middle" font-family="'DejaVu Sans Mono', Menlo, monospace">n+3</text>
  <text x="410" y="88" font-size="10" text-anchor="middle" font-family="'DejaVu Sans Mono', Menlo, monospace">n+4</text>
  <text x="490" y="88" font-size="10" text-anchor="middle" font-family="'DejaVu Sans Mono', Menlo, monospace">n+5</text>
  <line x1="50" y1="106" x2="590" y2="106" stroke="#111" stroke-width="2"/>
  <g stroke="#111" stroke-width="1.6"><line x1="90" y1="96" x2="90" y2="116"/><line x1="170" y1="96" x2="170" y2="116"/><line x1="250" y1="96" x2="250" y2="116"/><line x1="330" y1="96" x2="330" y2="116"/><line x1="410" y1="96" x2="410" y2="116"/><line x1="490" y1="96" x2="490" y2="116"/></g>
  <text x="590" y="132" font-size="10" fill="#444" text-anchor="end" font-style="italic">a target slot time of 200 ms</text>
  <path d="M 416,168 C 392,158 370,140 352,120" stroke="#111" stroke-width="1.3" marker-end="url(#slotc)" fill="none"/>
  <text x="424" y="166" font-size="10.5">real slots mostly run over it:</text>
  <text x="424" y="180" font-size="10.5" font-weight="bold">a count runs about 10% long</text>
</g>
</svg>
