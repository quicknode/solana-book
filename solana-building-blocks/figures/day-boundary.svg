<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 186" font-family="Georgia, serif" fill="#111">
  <defs><marker id="dayedge" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <text x="60" y="58" font-size="10.5" font-weight="bold">contribute() while elapsed days &#60; 7</text>
  <line x1="60" y1="74" x2="428" y2="74" stroke="#111" stroke-width="2"/>
  <line x1="60" y1="68" x2="60" y2="80" stroke="#111" stroke-width="2"/>
  <text x="440" y="58" font-size="10.5" font-weight="bold">refund() once elapsed days &#8805; 7</text>
  <line x1="440" y1="74" x2="578" y2="74" stroke="#111" stroke-width="2" marker-end="url(#dayedge)"/>
  <line x1="431" y1="64" x2="431" y2="120" stroke="#111" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="60" y="95" font-size="10" fill="#444">6 days and 12 hours floors to 6, so contributions are still open</text>
  <line x1="50" y1="110" x2="590" y2="110" stroke="#111" stroke-width="2"/>
  <g stroke="#111" stroke-width="1.6"><line x1="60" y1="102" x2="60" y2="118"/><line x1="113" y1="102" x2="113" y2="118"/><line x1="166" y1="102" x2="166" y2="118"/><line x1="219" y1="102" x2="219" y2="118"/><line x1="272" y1="102" x2="272" y2="118"/><line x1="325" y1="102" x2="325" y2="118"/><line x1="378" y1="102" x2="378" y2="118"/><line x1="431" y1="102" x2="431" y2="118"/></g>
  <text x="60" y="132" font-size="10" text-anchor="middle" font-family="Menlo, monospace">day 0</text>
  <text x="113" y="132" font-size="10" text-anchor="middle" font-family="Menlo, monospace">1</text>
  <text x="166" y="132" font-size="10" text-anchor="middle" font-family="Menlo, monospace">2</text>
  <text x="219" y="132" font-size="10" text-anchor="middle" font-family="Menlo, monospace">3</text>
  <text x="272" y="132" font-size="10" text-anchor="middle" font-family="Menlo, monospace">4</text>
  <text x="325" y="132" font-size="10" text-anchor="middle" font-family="Menlo, monospace">5</text>
  <text x="378" y="132" font-size="10" text-anchor="middle" font-family="Menlo, monospace">6</text>
  <text x="431" y="132" font-size="10" text-anchor="middle" font-family="Menlo, monospace">7</text>
  <text x="431" y="156" font-size="10.5" text-anchor="middle" font-style="italic">the first tick of day 7</text>
  <text x="431" y="170" font-size="10.5" text-anchor="middle">one instant: no gap, no overlap</text>
