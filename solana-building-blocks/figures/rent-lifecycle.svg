<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Georgia, serif" fill="#111">
  <defs><marker id="arr4" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <!-- the maker: wallet account -->
  <rect x="24" y="128" width="112" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="39" cy="145" r="5" fill="none" stroke="#111" stroke-width="1.3"/>
  <path d="M 31,156 Q 39,149 47,156" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="54" y="145" font-size="10.5" font-weight="bold">the maker</text>
  <text x="54" y="161" font-size="9.5" fill="#444">0.1 SOL</text>
  <!-- deposit out -->
  <path d="M 140,138 C 175,115 200,102 236,100" stroke="#111" stroke-width="1.5" marker-end="url(#arr4)" fill="none"/>
  <text x="160" y="88" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">rent deposits paid at creation</text>
  <rect x="240" y="70" width="120" height="30" rx="5" fill="#f4f4f2" stroke="#888"/>
  <text x="300" y="89" font-size="11" text-anchor="middle">offer account</text>
  <rect x="240" y="110" width="120" height="30" rx="5" fill="#f4f4f2" stroke="#888"/>
  <text x="300" y="129" font-size="11" text-anchor="middle">vault</text>
  <!-- exits -->
  <path d="M 364,85 C 440,85 470,110 500,110" stroke="#111" stroke-width="1.5" marker-end="url(#arr4)" fill="none"/>
  <text x="505" y="106" font-size="11" font-weight="bold">taken</text>
  <path d="M 364,130 C 440,130 470,150 500,150" stroke="#111" stroke-width="1.5" marker-end="url(#arr4)" fill="none"/>
  <text x="505" y="147" font-size="11" font-weight="bold">cancelled</text>
  <path d="M 560,120 C 560,230 240,240 141,164" stroke="#111" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arr4)" fill="none"/>
  <text x="260" y="278" font-size="10.5" fill="#444" font-style="italic" text-anchor="middle">both exits close the accounts and</text>
  <text x="260" y="292" font-size="10.5" fill="#444" font-style="italic" text-anchor="middle">refund every lamport to the maker</text>
  <!-- stuck path -->
  <path d="M 364,118 C 430,160 440,190 452,214" stroke="#999" stroke-width="1.4" marker-end="url(#arr4)" fill="none"/>
  <rect x="420" y="218" width="180" height="46" rx="5" fill="none" stroke="#999" stroke-width="1.3"/>
  <line x1="420" y1="218" x2="600" y2="264" stroke="#999" stroke-width="1.6"/>
  <line x1="600" y1="218" x2="420" y2="264" stroke="#999" stroke-width="1.6"/>
  <text x="510" y="288" font-size="10.5" fill="#444" text-anchor="middle">no close handler: deposit stranded forever</text>
  <text x="510" y="302" font-size="10.5" fill="#444" text-anchor="middle">(the bug this chapter forbids)</text>
</svg>
