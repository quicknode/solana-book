<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Georgia, serif" fill="#111">
  <defs>
    <marker id="rent-lifecycle-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker>
    <marker id="rent-lifecycle-arrg" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#777"/></marker>
  </defs>
  <!-- the maker: wallet account -->
  <rect x="24" y="128" width="112" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(32,135)">
    <circle cx="7" cy="4" r="3.1" fill="none" stroke="#111" stroke-width="1.3"/>
    <path d="M 1.5,13 Q 1.5,8.4 7,8.4 Q 12.5,8.4 12.5,13" fill="none" stroke="#111" stroke-width="1.3"/>
  </g>
  <text x="54" y="145" font-size="10.5" font-weight="bold">the maker</text>
  <text x="54" y="161" font-size="9.5" fill="#444">1 SOL</text>
  <!-- deposit out -->
  <path d="M 140,138 C 175,115 200,102 236,100" stroke="#777" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#rent-lifecycle-arrg)" fill="none"/>
  <text x="160" y="88" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">rent deposits paid at creation</text>
  <rect x="240" y="70" width="120" height="30" rx="6" fill="#f4f4f2" stroke="#888"/>
  <g transform="translate(248,78)" stroke="#111" stroke-width="1.2" fill="none">
    <rect x="1" y="2" width="12" height="10"/>
    <line x1="1" y1="5.4" x2="13" y2="5.4"/>
    <line x1="7" y1="5.4" x2="7" y2="12"/>
  </g>
  <text x="304" y="89" font-size="11" text-anchor="middle">offer account</text>
  <rect x="240" y="110" width="120" height="30" rx="6" fill="#f4f4f2" stroke="#888"/>
  <g transform="translate(248,117)">
    <ellipse cx="7" cy="7" rx="6" ry="4.4" fill="none" stroke="#111" stroke-width="1.2"/>
    <circle cx="12.6" cy="6.4" r="1.7" fill="none" stroke="#111" stroke-width="1"/>
    <path d="M 3.6,3.4 L 5,1.2 L 6.8,2.9" fill="none" stroke="#111" stroke-width="1"/>
    <line x1="4" y1="11.2" x2="4" y2="13" stroke="#111" stroke-width="1.2"/>
    <line x1="10" y1="11.2" x2="10" y2="13" stroke="#111" stroke-width="1.2"/>
    <line x1="6" y1="4.6" x2="8.4" y2="4.6" stroke="#111" stroke-width="1"/>
  </g>
  <text x="304" y="129" font-size="11" text-anchor="middle">vault</text>
  <!-- exits -->
  <path d="M 364,85 C 440,85 470,110 500,110" stroke="#111" stroke-width="1.5" marker-end="url(#rent-lifecycle-arr)" fill="none"/>
  <text x="505" y="106" font-size="11" font-weight="bold">taken</text>
  <path d="M 364,130 C 440,130 470,150 500,150" stroke="#111" stroke-width="1.5" marker-end="url(#rent-lifecycle-arr)" fill="none"/>
  <text x="505" y="147" font-size="11" font-weight="bold">cancelled</text>
  <path d="M 560,120 C 560,230 240,240 141,164" stroke="#777" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#rent-lifecycle-arrg)" fill="none"/>
  <text x="260" y="278" font-size="10.5" fill="#444" font-style="italic" text-anchor="middle">both exits close the accounts and</text>
  <text x="260" y="292" font-size="10.5" fill="#444" font-style="italic" text-anchor="middle">refund every lamport to the maker</text>
  <!-- stuck path -->
  <path d="M 364,118 C 430,160 440,190 452,214" stroke="#999" stroke-width="1.4" marker-end="url(#rent-lifecycle-arrg)" fill="none"/>
  <rect x="420" y="218" width="180" height="46" fill="none" stroke="#999" stroke-width="1.3"/>
  <line x1="420" y1="218" x2="600" y2="264" stroke="#999" stroke-width="1.6"/>
  <line x1="600" y1="218" x2="420" y2="264" stroke="#999" stroke-width="1.6"/>
  <text x="510" y="288" font-size="10.5" fill="#444" text-anchor="middle">no close handler: deposit stranded forever</text>
  <text x="510" y="302" font-size="10.5" fill="#444" text-anchor="middle">(the bug this chapter forbids)</text>
</svg>
