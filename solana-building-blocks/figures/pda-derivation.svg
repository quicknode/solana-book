<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 306" font-family="Georgia, serif" fill="#111">
  <defs>
    <marker id="pda-derivation-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker>
    <marker id="pda-derivation-arrg" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#777"/></marker>
  </defs>
  <!-- the curve on top: keypair addresses sit on it, the PDA hangs off it -->
  <path d="M 0,36 Q 400,36 640,116" fill="none" stroke="#111" stroke-width="3.5"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="628" y="24" font-size="13" font-weight="bold" text-anchor="end">Solana Devnet</text>
  <circle cx="104" cy="37" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="104" y="25" font-size="7.5" letter-spacing="0.8" fill="#555" text-anchor="middle">PUBLIC KEY</text>
  <circle cx="470" cy="73" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="470" y="61" font-size="7.5" letter-spacing="0.8" fill="#555" text-anchor="middle">PUBLIC KEY</text>
  <!-- seeds -->
  <text x="190" y="70" font-size="11" font-weight="bold" text-anchor="middle">seeds + program ID</text>
  <rect x="36" y="76" width="70" height="26" fill="#f4f4f2" stroke="#888"/>
  <text x="71" y="93" font-size="10.5" text-anchor="middle" font-family="Menlo, monospace">"offer"</text>
  <rect x="112" y="76" width="94" height="26" fill="#f4f4f2" stroke="#888"/>
  <text x="159" y="93" font-size="10.5" text-anchor="middle">maker&#8217;s address</text>
  <rect x="212" y="76" width="40" height="26" fill="#f4f4f2" stroke="#888"/>
  <text x="232" y="93" font-size="10.5" text-anchor="middle">ID</text>
  <rect x="258" y="76" width="86" height="26" fill="#fff" stroke="#111" stroke-width="1.4"/>
  <text x="301" y="93" font-size="10.5" text-anchor="middle">program ID</text>
  <path d="M 190,102 v 24" stroke="#111" stroke-width="1.4" marker-end="url(#pda-derivation-arr)"/>
  <rect x="130" y="130" width="120" height="30" fill="none" stroke="#111" stroke-width="1.8"/>
  <text x="190" y="149" font-size="11" text-anchor="middle">derivation</text>
  <path d="M 190,160 v 30" stroke="#111" stroke-width="1.4" marker-end="url(#pda-derivation-arr)"/>
  <!-- off-curve result -->
  <circle cx="190" cy="204" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="190" y="232" font-size="12" font-weight="bold" text-anchor="middle">the offer&#8217;s PDA</text>
  <text x="190" y="247" font-size="8.5" letter-spacing="0.6" fill="#555" text-anchor="middle">SEEDS: &#8220;OFFER&#8221; + MAKER&#8217;S ADDRESS + ID</text>
  <text x="190" y="262" font-size="10.5" fill="#444" text-anchor="middle">no private key exists</text>
  <!-- signing -->
  <rect x="400" y="112" width="204" height="96" fill="none" stroke="#111" stroke-width="1.6"/>
  <text x="502" y="134" font-size="11.5" font-weight="bold" text-anchor="middle">the owning program</text>
  <text x="502" y="152" font-size="10.5" fill="#444" text-anchor="middle">presents the same seeds</text>
  <path d="M 502,160 v 20" stroke="#111" stroke-width="1.3" marker-end="url(#pda-derivation-arr)"/>
  <text x="502" y="198" font-size="9.5" text-anchor="middle" font-style="italic">&#8220;signs&#8221; as the PDA: moves the vault it owns</text>
  <path d="M 400,178 C 340,188 258,199 200,204" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#pda-derivation-arrg)"/>
  <text x="320" y="290" font-size="10.5" fill="#444" text-anchor="middle" font-style="italic">keypair addresses live on the curve; PDAs float off it</text>
</svg>
