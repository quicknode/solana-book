<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Georgia, serif" fill="#111">
  <defs>
    <marker id="pda-derivation-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker>
    <marker id="pda-derivation-arrg" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#777"/></marker>
  </defs>
  <!-- seeds -->
  <rect x="36" y="36" width="70" height="26" fill="#f4f4f2" stroke="#888"/>
  <text x="71" y="53" font-size="10.5" text-anchor="middle" font-family="Menlo, monospace">"offer"</text>
  <rect x="112" y="36" width="94" height="26" fill="#f4f4f2" stroke="#888"/>
  <text x="159" y="53" font-size="10.5" text-anchor="middle">maker&#8217;s address</text>
  <rect x="212" y="36" width="40" height="26" fill="#f4f4f2" stroke="#888"/>
  <text x="232" y="53" font-size="10.5" text-anchor="middle">ID</text>
  <rect x="258" y="36" width="86" height="26" fill="#fff" stroke="#111" stroke-width="1.4"/>
  <text x="301" y="53" font-size="10.5" text-anchor="middle">program ID</text>
  <text x="190" y="26" font-size="11" font-weight="bold">seeds + program ID</text>
  <path d="M 190,62 v 26" stroke="#111" stroke-width="1.4" marker-end="url(#pda-derivation-arr)"/>
  <rect x="130" y="92" width="120" height="30" fill="none" stroke="#111" stroke-width="1.8"/>
  <text x="190" y="111" font-size="11" text-anchor="middle">derivation</text>
  <path d="M 190,122 v 30" stroke="#111" stroke-width="1.4" marker-end="url(#pda-derivation-arr)"/>
  <!-- off-curve result -->
  <circle cx="190" cy="166" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="210" y="162" font-size="12" font-weight="bold">the offer&#8217;s PDA</text>
  <text x="210" y="176" font-size="8.5" letter-spacing="0.6" fill="#555">SEEDS: &#8220;OFFER&#8221; + MAKER&#8217;S ADDRESS + ID</text>
  <text x="210" y="190" font-size="10.5" fill="#444">no private key exists</text>
  <!-- curve for contrast -->
  <path d="M 40,340 Q 320,180 600,340" fill="none" stroke="#111" stroke-width="3.5"/>
  <circle cx="180" cy="276" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="168" y="270" font-size="9" letter-spacing="1" fill="#555" text-anchor="end">PUBLIC KEY</text>
  <circle cx="460" cy="276" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="472" y="270" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <text x="320" y="308" font-size="10.5" fill="#444" text-anchor="middle" font-style="italic">keypair addresses live on the curve; PDAs float off it</text>
  <!-- signing -->
  <rect x="400" y="60" width="204" height="96" fill="none" stroke="#111" stroke-width="1.6"/>
  <text x="502" y="82" font-size="11.5" font-weight="bold" text-anchor="middle">the owning program</text>
  <text x="502" y="100" font-size="10.5" fill="#444" text-anchor="middle">presents the same seeds</text>
  <path d="M 502,108 v 20" stroke="#111" stroke-width="1.3" marker-end="url(#pda-derivation-arr)"/>
  <text x="502" y="146" font-size="10.5" text-anchor="middle" font-style="italic">&#8220;signs&#8221; as the PDA: moves the vault it owns</text>
  <path d="M 400,120 C 320,140 250,150 202,164" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#pda-derivation-arrg)"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="524" y="330" font-size="12" font-weight="bold">Solana Devnet</text>
</svg>
