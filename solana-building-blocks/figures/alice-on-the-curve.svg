<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Georgia, serif" fill="#111">
  <!-- ghost clusters -->
  <path d="M 60,330 Q 330,80 620,330" fill="none" stroke="#cccccc" stroke-width="1.2"/>
  <path d="M 70,345 Q 335,105 630,345" fill="none" stroke="#e0e0e0" stroke-width="1.2"/>
  <text x="608" y="352" font-size="10" fill="#bbb" text-anchor="end" font-style="italic">Localnet</text>
  <!-- the devnet curve -->
  <path d="M 40,310 Q 320,50 600,310" fill="none" stroke="#111" stroke-width="3.5"/>
  <text x="320" y="148" font-size="14" font-weight="bold" text-anchor="middle">Solana Devnet</text>
  <!-- Alice: wallet account -->
  <rect x="20" y="58" width="124" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(28,65)">
    <circle cx="7" cy="4" r="3.1" fill="none" stroke="#111" stroke-width="1.3"/>
    <path d="M 1.5,13 Q 1.5,8.4 7,8.4 Q 12.5,8.4 12.5,13" fill="none" stroke="#111" stroke-width="1.3"/>
  </g>
  <text x="50" y="75" font-size="10.5" font-weight="bold">Alice&#8217;s Account</text>
  <text x="50" y="91" font-size="9.5" fill="#444">1 SOL</text>
  <!-- Alice's private key: a bare key glyph, not an account, so no rectangle -->
  <circle cx="192" cy="81" r="7" fill="none" stroke="#111" stroke-width="1.5"/>
  <path d="M 199,81 h 24 m -8,0 v 7 m -6,-7 v 5" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="252" y="72" font-size="11.5">Private key stored securely</text>
  <text x="252" y="87" font-size="11.5">on Alice&#8217;s device</text>
  <!-- public key on the curve -->
  <circle cx="180" cy="212" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <line x1="95" y1="102" x2="177" y2="204" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="194" y="210" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="120" y="242" font-size="12.5" font-weight="bold">Alice&#8217;s address</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="598" y="322" font-size="10" fill="#999" text-anchor="end" font-style="italic">Solana Mainnet</text>
</svg>
