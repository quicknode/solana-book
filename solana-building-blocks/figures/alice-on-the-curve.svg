<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Georgia, serif" fill="#111">
  <!-- ghost clusters -->
  <path d="M 60,330 Q 330,80 620,330" fill="none" stroke="#cccccc" stroke-width="1.2"/>
  <text x="598" y="322" font-size="10" fill="#999" text-anchor="end" font-style="italic">Solana Mainnet</text>
  <path d="M 70,345 Q 335,105 630,345" fill="none" stroke="#e0e0e0" stroke-width="1.2"/>
  <text x="608" y="352" font-size="10" fill="#bbb" text-anchor="end" font-style="italic">Localnet</text>
  <!-- the devnet curve -->
  <path d="M 40,310 Q 320,50 600,310" fill="none" stroke="#111" stroke-width="2"/>
  <text x="320" y="148" font-size="14" font-weight="bold" text-anchor="middle">Solana Devnet</text>
  <!-- Alice -->
  <circle cx="95" cy="70" r="16" fill="none" stroke="#111" stroke-width="1.5"/>
  <path d="M 70,112 Q 95,90 120,112" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="95" y="130" font-size="13" text-anchor="middle">Alice</text>
  <!-- Alice's device with private key -->
  <rect x="150" y="55" width="86" height="52" rx="6" fill="none" stroke="#111" stroke-width="1.5"/>
  <circle cx="172" cy="81" r="7" fill="none" stroke="#111" stroke-width="1.5"/>
  <path d="M 179,81 h 24 m -8,0 v 7 m -6,-7 v 5" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="252" y="72" font-size="11.5">Private key stored securely</text>
  <text x="252" y="87" font-size="11.5">on Alice&#8217;s device</text>
  <!-- public key on the curve -->
  <circle cx="180" cy="212" r="6" fill="#111"/>
  <line x1="187" y1="112" x2="181" y2="200" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="196" y="166" font-size="11.5" fill="#444">public key</text>
  <text x="120" y="242" font-size="12.5" font-weight="bold">Alice&#8217;s address</text>
</svg>
