<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 186" font-family="Gelasio, Georgia, serif" fill="#111">
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="16" y="24" font-size="15" font-weight="bold">The unix timestamp</text>
<g>
  <defs><marker id="unixts" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <text x="50" y="60" font-size="12" font-weight="bold">wall-clock time, as the validators report it</text>
  <circle cx="140" cy="128" r="34" fill="none" stroke="#111" stroke-width="2"/>
  <line x1="140" y1="128" x2="140" y2="106" stroke="#111" stroke-width="1.6"/>
  <line x1="140" y1="128" x2="158" y2="134" stroke="#111" stroke-width="1.6"/>
