<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" font-family="Georgia, serif" fill="#111">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker>
  </defs>
  <!-- factory -->
  <path d="M 60,110 h 150 v 110 h -150 z M 60,110 l 30,-26 v 26 M 105,110 l 30,-26 v 26 M 150,110 l 30,-26 v 26" fill="none" stroke="#111" stroke-width="2"/>
  <text x="135" y="150" font-size="13" font-weight="bold" text-anchor="middle">USDC mint</text>
  <rect x="82" y="164" width="106" height="24" rx="4" fill="#f4f4f2" stroke="#888"/>
  <text x="135" y="180" font-size="10.5" text-anchor="middle">supply: 1,000,550</text>
  <text x="135" y="206" font-size="10" fill="#444" text-anchor="middle">decimals: 6</text>
  <!-- mint authority -->
  <circle cx="135" cy="46" r="12" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="160" y="42" font-size="11.5" font-weight="bold">mint authority</text>
  <text x="160" y="56" font-size="10" fill="#444">the boss of the factory</text>
  <path d="M 135,60 v 22" stroke="#111" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="30" y="76" font-size="10" fill="#444" font-style="italic">signs</text>
  <!-- Alice and her ATA -->
  <circle cx="395" cy="52" r="10" fill="none" stroke="#111" stroke-width="1.5"/>
  <path d="M 379,78 Q 395,62 411,78" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="395" y="94" font-size="11" text-anchor="middle">Alice</text>
  <rect x="330" y="104" width="130" height="52" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="395" y="126" font-size="12" font-weight="bold" text-anchor="middle">Alice&#8217;s USDC</text>
  <text x="395" y="144" font-size="10.5" fill="#444" text-anchor="middle">550 USDC</text>
  <!-- mint_to arrow -->
  <path d="M 212,146 L 326,133" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="266" y="124" font-size="10.5" text-anchor="middle" font-style="italic">new tokens minted</text>
  <path d="M 340,164 C 300,205 260,205 218,186" stroke="#777" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#arr)" fill="none"/>
  <text x="284" y="222" font-size="10.5" fill="#444" text-anchor="middle" font-style="italic">burning returns supply</text>
  <!-- sealed panel -->
  <rect x="450" y="60" width="160" height="180" rx="8" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="530" y="86" font-size="11.5" font-weight="bold" text-anchor="middle">authority set to none</text>
  <path d="M 505,130 h 50 v 40 h -50 z M 515,130 v -12 a 15,15 0 0 1 30,0 v 12" fill="none" stroke="#111" stroke-width="2"/>
  <text x="530" y="196" font-size="10.5" fill="#444" text-anchor="middle">supply sealed forever:</text>
  <text x="530" y="210" font-size="10.5" fill="#444" text-anchor="middle">no more can ever exist</text>
  <!-- the curve: the mint's address is a public key on it -->
  <path d="M 40,360 Q 320,250 600,360" fill="none" stroke="#111" stroke-width="2"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="524" y="352" font-size="12" font-weight="bold">Solana Devnet</text>
  <circle cx="152" cy="325" r="6" fill="#111"/>
  <line x1="140" y1="222" x2="150" y2="315" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="166" y="322" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="152" y="348" font-size="11" font-weight="bold" text-anchor="middle">the mint&#8217;s address</text>
</svg>
