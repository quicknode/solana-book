<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" font-family="Georgia, serif" fill="#111">
  <defs>
    <marker id="mint-factory-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker>
    <marker id="mint-factory-arrg" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#777"/></marker>
    <marker id="mint-factory-arr-acc" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1e7a3c"/></marker>
  </defs>
  <!-- the curve on top: the mint's address is a public key on it -->
  <path d="M 0,36 Q 400,36 640,116" fill="none" stroke="#111" stroke-width="3.5"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="628" y="24" font-size="13" font-weight="bold" text-anchor="end">Solana Devnet</text>
  <circle cx="72" cy="37" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="72" y="25" font-size="7.5" letter-spacing="0.8" fill="#555" text-anchor="middle">PUBLIC KEY</text>
  <line x1="72" y1="46" x2="72" y2="148" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="86" y="70" font-size="11" font-weight="bold">the mint&#8217;s address</text>
  <!-- mint authority -->
  <circle cx="135" cy="102" r="12" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="160" y="98" font-size="11.5" font-weight="bold">mint authority</text>
  <text x="160" y="112" font-size="10" fill="#444">the boss of the factory</text>
  <path d="M 135,116 v 20" stroke="#111" stroke-width="1.3" marker-end="url(#mint-factory-arr)"/>
  <text x="126" y="132" font-size="10" fill="#444" font-style="italic" text-anchor="end">signs</text>
  <!-- the factory: the mint account itself -->
  <path d="M 60,166 h 150 v 110 h -150 z M 60,166 l 30,-26 v 26 M 105,166 l 30,-26 v 26 M 150,166 l 30,-26 v 26" fill="none" stroke="#111" stroke-width="2"/>
  <g transform="translate(84,194)" stroke="#111" stroke-width="1.2" fill="none">
    <path d="M 1,5 L 7,1 L 13,5 Z"/>
    <line x1="3" y1="6.5" x2="3" y2="11"/>
    <line x1="7" y1="6.5" x2="7" y2="11"/>
    <line x1="11" y1="6.5" x2="11" y2="11"/>
    <line x1="1.5" y1="12.5" x2="12.5" y2="12.5"/>
  </g>
  <text x="140" y="206" font-size="13" font-weight="bold" text-anchor="middle">USDC mint</text>
  <rect x="82" y="220" width="106" height="24" fill="#f4f4f2" stroke="#888"/>
  <text x="135" y="236" font-size="10.5" text-anchor="middle">supply: 1,000,550</text>
  <text x="135" y="262" font-size="10" fill="#444" text-anchor="middle">decimals: 6</text>
  <!-- Alice's ATA, with its own address dot off the curve -->
  <circle cx="300" cy="140" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="312" y="136" font-size="8.5" letter-spacing="0.6" fill="#555">SEEDS: ATA PROGRAM + ALICE&#8217;S</text>
  <text x="312" y="147" font-size="8.5" letter-spacing="0.6" fill="#555">ADDRESS + USDC MINT ADDRESS</text>
  <rect x="308" y="152" width="130" height="52" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(316,160)">
    <path d="M 2.6,7.8 Q 0.6,7.4 0.9,5.6 Q 1.1,4.4 2.3,4.9" fill="none" stroke="#111" stroke-width="1"/><ellipse cx="8" cy="7" rx="5.4" ry="4.4" fill="none" stroke="#111" stroke-width="1.2"/>
    <ellipse cx="12.9" cy="6.4" rx="1.8" ry="1.5" fill="#fff" stroke="#111" stroke-width="1"/><circle cx="12.35" cy="6.4" r="0.35" fill="#111"/><circle cx="13.45" cy="6.4" r="0.35" fill="#111"/>
    <line x1="5.2" y1="11.4" x2="5.2" y2="13" stroke="#111" stroke-width="1.2"/>
    <line x1="10.6" y1="11.4" x2="10.6" y2="13" stroke="#111" stroke-width="1.2"/>
    <line x1="6.8" y1="4.4" x2="9.2" y2="4.4" stroke="#111" stroke-width="1"/>
  </g>
  <text x="336" y="174" font-size="12" font-weight="bold">Alice&#8217;s USDC</text>
  <text x="318" y="192" font-size="10.5" fill="#444">550 USDC</text>
  <!-- mint_to arrow -->
  <path d="M 212,196 L 304,182" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#mint-factory-arr-acc)"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="256" y="170" font-size="10.5" font-weight="bold" fill="#1e7a3c" text-anchor="middle">new tokens minted</text>
  <g transform="translate(258,189)">
    <circle cx="4" cy="2" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <circle cx="-3" cy="0" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <text x="-3" y="3" font-size="8" font-weight="bold" fill="#1e7a3c" text-anchor="middle">$</text>
  </g>
  <path d="M 330,212 C 292,252 256,252 218,242" stroke="#777" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#mint-factory-arrg)" fill="none"/>
  <text x="290" y="274" font-size="10.5" fill="#444" text-anchor="middle" font-style="italic">burning returns supply</text>
  <!-- sealed panel -->
  <rect x="466" y="116" width="144" height="180" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="538" y="142" font-size="11.5" font-weight="bold" text-anchor="middle">authority set to none</text>
  <path d="M 513,186 h 50 v 40 h -50 z M 523,186 v -12 a 15,15 0 0 1 30,0 v 12" fill="none" stroke="#111" stroke-width="2"/>
  <text x="538" y="252" font-size="10.5" fill="#444" text-anchor="middle">supply sealed forever:</text>
  <text x="538" y="266" font-size="10.5" fill="#444" text-anchor="middle">no more can ever exist</text>
</svg>
