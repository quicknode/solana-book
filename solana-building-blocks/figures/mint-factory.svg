<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" font-family="Georgia, serif" fill="#111">
  <defs>
    <marker id="mint-factory-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker>
    <marker id="mint-factory-arrg" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#777"/></marker>
    <marker id="mint-factory-arr-acc" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1e7a3c"/></marker>
  </defs>
  <!-- factory -->
  <path d="M 60,110 h 150 v 110 h -150 z M 60,110 l 30,-26 v 26 M 105,110 l 30,-26 v 26 M 150,110 l 30,-26 v 26" fill="none" stroke="#111" stroke-width="2"/>
  <g transform="translate(84,138)" stroke="#111" stroke-width="1.2" fill="none">
    <path d="M 1,5 L 7,1 L 13,5 Z"/>
    <line x1="3" y1="6.5" x2="3" y2="11"/>
    <line x1="7" y1="6.5" x2="7" y2="11"/>
    <line x1="11" y1="6.5" x2="11" y2="11"/>
    <line x1="1.5" y1="12.5" x2="12.5" y2="12.5"/>
  </g>
  <text x="140" y="150" font-size="13" font-weight="bold" text-anchor="middle">USDC mint</text>
  <rect x="82" y="164" width="106" height="24" fill="#f4f4f2" stroke="#888"/>
  <text x="135" y="180" font-size="10.5" text-anchor="middle">supply: 1,000,550</text>
  <text x="135" y="206" font-size="10" fill="#444" text-anchor="middle">decimals: 6</text>
  <!-- mint authority -->
  <circle cx="135" cy="46" r="12" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="160" y="42" font-size="11.5" font-weight="bold">mint authority</text>
  <text x="160" y="56" font-size="10" fill="#444">the boss of the factory</text>
  <path d="M 135,60 v 22" stroke="#111" stroke-width="1.3" marker-end="url(#mint-factory-arr)"/>
  <text x="30" y="76" font-size="10" fill="#444" font-style="italic">signs</text>
  <!-- Alice's ATA, with its own address dot off the curve -->
  <circle cx="300" cy="84" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="312" y="80" font-size="8.5" letter-spacing="0.6" fill="#555">SEEDS: ATA PROGRAM + ALICE&#8217;S</text>
  <text x="312" y="91" font-size="8.5" letter-spacing="0.6" fill="#555">ADDRESS + USDC MINT ADDRESS</text>
  <rect x="308" y="96" width="130" height="52" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(316,104)">
    <ellipse cx="7" cy="7" rx="6" ry="4.4" fill="none" stroke="#111" stroke-width="1.2"/>
    <circle cx="12.6" cy="6.4" r="1.7" fill="none" stroke="#111" stroke-width="1"/>
    <path d="M 3.6,3.4 L 5,1.2 L 6.8,2.9" fill="none" stroke="#111" stroke-width="1"/>
    <line x1="4" y1="11.2" x2="4" y2="13" stroke="#111" stroke-width="1.2"/>
    <line x1="10" y1="11.2" x2="10" y2="13" stroke="#111" stroke-width="1.2"/>
    <line x1="6" y1="4.6" x2="8.4" y2="4.6" stroke="#111" stroke-width="1"/>
  </g>
  <text x="336" y="118" font-size="12" font-weight="bold">Alice&#8217;s USDC</text>
  <text x="318" y="136" font-size="10.5" fill="#444">550 USDC</text>
  <!-- mint_to arrow -->
  <path d="M 212,140 L 304,126" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#mint-factory-arr-acc)"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="256" y="114" font-size="10.5" font-weight="bold" fill="#1e7a3c" text-anchor="middle">new tokens minted</text>
  <g transform="translate(258,133)">
    <circle cx="4" cy="2" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <circle cx="-3" cy="0" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <text x="-3" y="3" font-size="8" font-weight="bold" fill="#1e7a3c" text-anchor="middle">$</text>
  </g>
  <path d="M 330,156 C 292,196 256,196 218,186" stroke="#777" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#mint-factory-arrg)" fill="none"/>
  <text x="284" y="216" font-size="10.5" fill="#444" text-anchor="middle" font-style="italic">burning returns supply</text>
  <!-- sealed panel -->
  <rect x="466" y="60" width="144" height="180" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="538" y="86" font-size="11.5" font-weight="bold" text-anchor="middle">authority set to none</text>
  <path d="M 513,130 h 50 v 40 h -50 z M 523,130 v -12 a 15,15 0 0 1 30,0 v 12" fill="none" stroke="#111" stroke-width="2"/>
  <text x="538" y="196" font-size="10.5" fill="#444" text-anchor="middle">supply sealed forever:</text>
  <text x="538" y="210" font-size="10.5" fill="#444" text-anchor="middle">no more can ever exist</text>
  <!-- the curve: the mint's address is a public key on it -->
  <path d="M 40,360 Q 320,250 600,360" fill="none" stroke="#111" stroke-width="2"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="524" y="352" font-size="12" font-weight="bold">Solana Devnet</text>
  <circle cx="152" cy="325" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <line x1="140" y1="222" x2="150" y2="315" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="166" y="322" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="152" y="348" font-size="11" font-weight="bold" text-anchor="middle">the mint&#8217;s address</text>
</svg>
