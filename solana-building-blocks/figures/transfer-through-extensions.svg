<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" font-family="Georgia, serif" fill="#111">
  <defs><marker id="arr2" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <circle cx="20" cy="60" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="32" y="49" font-size="8.5" letter-spacing="0.6" fill="#555">ATA PROGRAM +</text>
  <text x="32" y="60" font-size="8.5" letter-spacing="0.6" fill="#555">ALICE&#8217;S ADDRESS +</text>
  <text x="32" y="71" font-size="8.5" letter-spacing="0.6" fill="#555">USDC MINT ADDRESS</text>
  <rect x="20" y="84" width="104" height="48" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="72" y="104" font-size="11.5" font-weight="bold" text-anchor="middle">Alice&#8217;s USDC</text>
  <text x="72" y="122" font-size="10" fill="#444" text-anchor="middle">sends 100</text>
  <rect x="170" y="38" width="300" height="122" rx="8" fill="none" stroke="#111" stroke-width="2"/>
  <text x="180" y="58" font-size="11.5" font-weight="bold">Token Extensions Program</text>
  <text x="180" y="74" font-size="10.5" font-family="Menlo, monospace">transfer_checked</text>
  <path d="M 126,110 h 40" stroke="#111" stroke-width="1.5" marker-end="url(#arr2)"/>
  <path d="M 200,110 h 60" stroke="#111" stroke-width="1.5" marker-end="url(#arr2)"/>
  <path d="M 300,110 h 60" stroke="#111" stroke-width="1.5" marker-end="url(#arr2)"/>
  <path d="M 400,110 h 104" stroke="#111" stroke-width="1.5" marker-end="url(#arr2)"/>
  <!-- fee checkpoint -->
  <circle cx="220" cy="110" r="4" fill="#111"/>
  <path d="M 220,116 v 44" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr2)"/>
  <text x="220" y="176" font-size="10" fill="#444" text-anchor="middle">1 peeled off as</text>
  <text x="220" y="188" font-size="10" fill="#444" text-anchor="middle">transfer fee</text>
  <!-- hook checkpoint -->
  <circle cx="330" cy="110" r="4" fill="#111"/>
  <path d="M 330,104 v -24" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr2)"/>
  <text x="342" y="78" font-size="10" fill="#444">transfer hook runs:</text>
  <circle cx="508" cy="60" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="520" y="49" font-size="8.5" letter-spacing="0.6" fill="#555">ATA PROGRAM +</text>
  <text x="520" y="60" font-size="8.5" letter-spacing="0.6" fill="#555">BOB&#8217;S ADDRESS +</text>
  <text x="520" y="71" font-size="8.5" letter-spacing="0.6" fill="#555">USDC MINT ADDRESS</text>
  <rect x="508" y="84" width="104" height="48" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <text x="560" y="104" font-size="11.5" font-weight="bold" text-anchor="middle">Bob&#8217;s USDC</text>
  <text x="560" y="122" font-size="10" fill="#444" text-anchor="middle">receives 99</text>
  <text x="320" y="225" font-size="10.5" fill="#444" text-anchor="middle" font-style="italic">extensions can change what &#8220;I transferred 100&#8221; means</text>
  <text x="342" y="91" font-size="10" fill="#444" font-style="italic">the issuer&#8217;s program</text>
  <!-- the curve: the token program's address is a public key on it -->
  <path d="M 40,290 Q 320,220 600,290" fill="none" stroke="#111" stroke-width="2"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="70" y="284" font-size="12" font-weight="bold">Solana Devnet</text>
  <circle cx="490" cy="268" r="6" fill="#111"/>
  <line x1="468" y1="162" x2="488" y2="260" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" x="502" y="264" font-size="9" letter-spacing="1" fill="#555">PUBLIC KEY</text>
</svg>
