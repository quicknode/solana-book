<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 311" font-family="Gelasio, Georgia, serif" fill="#111">
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="16" y="24" font-size="15" font-weight="bold">The two clocks</text>
<g transform="translate(0,29)">
  <defs><marker id="clocks" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#111"/></marker></defs>
  <text x="50" y="36" font-size="12" font-weight="bold">the slot counter: even steps, guaranteed to only go up</text>
  <line x1="50" y1="80" x2="590" y2="80" stroke="#111" stroke-width="2"/>
  <g stroke="#111" stroke-width="1.6"><line x1="90" y1="70" x2="90" y2="90"/><line x1="170" y1="70" x2="170" y2="90"/><line x1="250" y1="70" x2="250" y2="90"/><line x1="330" y1="70" x2="330" y2="90"/><line x1="410" y1="70" x2="410" y2="90"/><line x1="490" y1="70" x2="490" y2="90"/></g>
  <text x="90" y="62" font-size="10" text-anchor="middle" font-family="'DejaVu Sans Mono', Menlo, monospace">slot n</text>
  <text x="170" y="62" font-size="10" text-anchor="middle" font-family="'DejaVu Sans Mono', Menlo, monospace">n+1</text>
  <text x="250" y="62" font-size="10" text-anchor="middle" font-family="'DejaVu Sans Mono', Menlo, monospace">n+2</text>
  <text x="330" y="62" font-size="10" text-anchor="middle" font-family="'DejaVu Sans Mono', Menlo, monospace">n+3</text>
  <text x="410" y="62" font-size="10" text-anchor="middle" font-family="'DejaVu Sans Mono', Menlo, monospace">n+4</text>
  <text x="490" y="62" font-size="10" text-anchor="middle" font-family="'DejaVu Sans Mono', Menlo, monospace">n+5</text>
  <text x="560" y="100" font-size="10" fill="#444" text-anchor="end" font-style="italic">a fixed slot time, hundreds of ms</text>
  <path d="M 418,130 C 400,116 380,104 360,92" stroke="#111" stroke-width="1.3" marker-end="url(#clocks)" fill="none"/>
  <text x="424" y="140" font-size="10.5">price staleness, deadlines, expiry:</text>
  <text x="424" y="154" font-size="10.5" font-weight="bold">anything an adversary could bend</text>
  <text x="50" y="178" font-size="12" font-weight="bold">the unix timestamp: right to within seconds</text>
  <circle cx="120" cy="238" r="34" fill="none" stroke="#111" stroke-width="2"/>
  <line x1="120" y1="238" x2="120" y2="216" stroke="#111" stroke-width="1.6"/>
  <line x1="120" y1="238" x2="138" y2="244" stroke="#111" stroke-width="1.6"/>
  <path d="M 120,196 A 42,42 0 0 1 158,222" fill="none" stroke="#bbb" stroke-width="6"/>
  <text x="172" y="216" font-size="10" fill="#777" font-style="italic">wobble: validator-influenced</text>
  <path d="M 418,254 C 340,258 255,254 165,246" stroke="#111" stroke-width="1.3" marker-end="url(#clocks)" fill="none"/>
  <text x="424" y="250" font-size="10.5">display, records, a year&#8217;s management fee:</text>
  <text x="424" y="264" font-size="10.5" font-weight="bold">human time</text>
</g>
</svg>
