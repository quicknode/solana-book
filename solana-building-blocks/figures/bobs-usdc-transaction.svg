<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" font-family="Georgia, serif" fill="#111">
  <defs>
    <marker id="bobs-usdc-arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#111"/>
    </marker>
    <marker id="bobs-usdc-arr-acc" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#1e7a3c"/>
    </marker>
  </defs>
  <!-- the curve -->
  <path d="M 0,36 Q 400,36 640,116" fill="none" stroke="#111" stroke-width="3.5"/>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="628" y="24" font-size="13" font-weight="bold" text-anchor="end">Solana Devnet</text>
  <!-- Alice's column: wallet, then her USDC token account -->
  <circle cx="104" cy="37" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <rect x="16" y="46" width="124" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(24,53)">
    <circle cx="7" cy="4" r="3.1" fill="none" stroke="#111" stroke-width="1.3"/>
    <path d="M 1.5,13 Q 1.5,8.4 7,8.4 Q 12.5,8.4 12.5,13" fill="none" stroke="#111" stroke-width="1.3"/>
  </g>
  <text x="46" y="64" font-size="10.5" font-weight="bold">Alice&#8217;s Account</text>
  <text x="46" y="80" font-size="9.5" fill="#444">0.95 SOL</text>
  <g>
    <circle cx="24" cy="144" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="34" y="139" font-size="7" letter-spacing="0.3" fill="#555">ATA PROGRAM +</text>
    <text x="34" y="148" font-size="7" letter-spacing="0.3" fill="#555">ALICE&#8217;S ADDRESS +</text>
    <text x="34" y="157" font-size="7" letter-spacing="0.3" fill="#555">USDC MINT</text>
    <rect x="16" y="162" width="104" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <g transform="translate(24,167)">
      <path d="M 2.6,7.8 Q 0.6,7.4 0.9,5.6 Q 1.1,4.4 2.3,4.9" fill="none" stroke="#111" stroke-width="1"/><ellipse cx="8" cy="7" rx="5.4" ry="4.4" fill="none" stroke="#111" stroke-width="1.2"/>
      <ellipse cx="12.9" cy="6.4" rx="1.8" ry="1.5" fill="#fff" stroke="#111" stroke-width="1"/><circle cx="12.35" cy="6.4" r="0.35" fill="#111"/><circle cx="13.45" cy="6.4" r="0.35" fill="#111"/>
      <line x1="5.2" y1="11.4" x2="5.2" y2="13" stroke="#111" stroke-width="1.2"/>
      <line x1="10.6" y1="11.4" x2="10.6" y2="13" stroke="#111" stroke-width="1.2"/>
      <line x1="6.8" y1="4.4" x2="9.2" y2="4.4" stroke="#111" stroke-width="1"/>
    </g>
    <text x="42" y="179" font-size="10.5" font-weight="bold">Alice&#8217;s USDC</text>
    <text x="26" y="193" font-size="9" fill="#444">975 &#8594; 1,000 USDC</text>
  </g>
  <!-- Bob's column: wallet, then his USDC token account -->
  <circle cx="300" cy="49" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <rect x="240" y="62" width="118" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(248,69)">
    <circle cx="7" cy="4" r="3.1" fill="none" stroke="#111" stroke-width="1.3"/>
    <path d="M 1.5,13 Q 1.5,8.4 7,8.4 Q 12.5,8.4 12.5,13" fill="none" stroke="#111" stroke-width="1.3"/>
  </g>
  <text x="270" y="80" font-size="10.5" font-weight="bold">Bob&#8217;s Account</text>
  <text x="270" y="96" font-size="9.5" fill="#444">1.05 SOL</text>
  <g>
    <circle cx="248" cy="144" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="258" y="139" font-size="7" letter-spacing="0.3" fill="#555">ATA PROGRAM +</text>
    <text x="258" y="148" font-size="7" letter-spacing="0.3" fill="#555">BOB&#8217;S ADDRESS +</text>
    <text x="258" y="157" font-size="7" letter-spacing="0.3" fill="#555">USDC MINT</text>
    <rect x="240" y="162" width="104" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <g transform="translate(248,167)">
      <path d="M 2.6,7.8 Q 0.6,7.4 0.9,5.6 Q 1.1,4.4 2.3,4.9" fill="none" stroke="#111" stroke-width="1"/><ellipse cx="8" cy="7" rx="5.4" ry="4.4" fill="none" stroke="#111" stroke-width="1.2"/>
      <ellipse cx="12.9" cy="6.4" rx="1.8" ry="1.5" fill="#fff" stroke="#111" stroke-width="1"/><circle cx="12.35" cy="6.4" r="0.35" fill="#111"/><circle cx="13.45" cy="6.4" r="0.35" fill="#111"/>
      <line x1="5.2" y1="11.4" x2="5.2" y2="13" stroke="#111" stroke-width="1.2"/>
      <line x1="10.6" y1="11.4" x2="10.6" y2="13" stroke="#111" stroke-width="1.2"/>
      <line x1="6.8" y1="4.4" x2="9.2" y2="4.4" stroke="#111" stroke-width="1"/>
    </g>
    <text x="266" y="179" font-size="10.5" font-weight="bold">Bob&#8217;s USDC</text>
    <text x="250" y="193" font-size="9" fill="#444">325 &#8594; 300 USDC</text>
  </g>
  <!-- effect: the balance moves between token accounts -->
  <path d="M 238,182 L 126,182" fill="none" stroke="#1e7a3c" stroke-width="1.8" marker-end="url(#bobs-usdc-arr-acc)"/>
  <g transform="translate(181,180)">
    <circle cx="4" cy="2" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <circle cx="-3" cy="0" r="6" fill="#fff" stroke="#1e7a3c" stroke-width="1.3"/>
    <text x="-3" y="3" font-size="8" font-weight="bold" fill="#1e7a3c" text-anchor="middle">$</text>
  </g>
  <text stroke="#fff" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round" x="181" y="168" font-size="11" font-weight="bold" fill="#1e7a3c" text-anchor="middle">25 USDC</text>
  <!-- the Token Program, on the curve -->
  <circle cx="472" cy="73" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <rect x="464" y="120" width="120" height="44" rx="6" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <g transform="translate(470,125)">
    <circle cx="7" cy="7" r="3.4" fill="none" stroke="#111" stroke-width="1.3"/>
    <circle cx="7" cy="7" r="1.2" fill="none" stroke="#111" stroke-width="1"/>
    <g stroke="#111" stroke-width="1.3">
      <line x1="7" y1="1" x2="7" y2="3"/><line x1="7" y1="11" x2="7" y2="13"/>
      <line x1="1" y1="7" x2="3" y2="7"/><line x1="11" y1="7" x2="13" y2="7"/>
      <line x1="2.8" y1="2.8" x2="4.2" y2="4.2"/><line x1="9.8" y1="9.8" x2="11.2" y2="11.2"/>
      <line x1="11.2" y1="2.8" x2="9.8" y2="4.2"/><line x1="2.8" y1="11.2" x2="4.2" y2="9.8"/>
    </g>
  </g>
  <text x="488" y="136" font-size="10.5" font-weight="bold">Token Program</text>
  <text x="470" y="154" font-size="10" font-family="Menlo, monospace">transfer()</text>
  <!-- transaction box -->
  <rect x="360" y="190" width="272" height="104" fill="none" stroke="#111" stroke-width="2"/>
  <text x="374" y="212" font-size="13" font-weight="bold">Transaction</text>
  <text x="374" y="228" font-size="11" font-style="italic" fill="#444">signed by Bob&#8217;s private key</text>
  <rect x="374" y="238" width="244" height="40" fill="#f4f4f2" stroke="#888" stroke-width="1"/>
  <text x="382" y="253" font-size="11" font-weight="bold">Instruction 1 &#8594; Token Program</text>
  <text x="382" y="267" font-size="11"><tspan font-family="Menlo, monospace">transfer()</tspan>: send 25 USDC to Alice</text>
  <!-- instruction arrow -->
  <path d="M 460,188 C 475,180 490,174 501,168" fill="none" stroke="#111" stroke-width="1.3" marker-end="url(#bobs-usdc-arr)"/>
</svg>
