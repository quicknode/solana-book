<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Options, Animated</title>
<style>
  /* Denim INK is not in the repository (assets/fonts/DenimINK-*.ttf is
     ignored), so these load only where the author has the files. */
  @font-face { font-family: "Denim INK"; src: url("../../assets/fonts/DenimINK-Regular.ttf"); font-weight: normal; font-style: normal; }
  @font-face { font-family: "Denim INK"; src: url("../../assets/fonts/DenimINK-RegularItalic.ttf"); font-weight: normal; font-style: italic; }
  @font-face { font-family: "Denim INK"; src: url("../../assets/fonts/DenimINK-Bold.ttf"); font-weight: bold; font-style: normal; }
  @font-face { font-family: "Denim INK"; src: url("../../assets/fonts/DenimINK-BoldItalic.ttf"); font-weight: bold; font-style: italic; }
  @font-face { font-family: "DejaVu Sans Mono"; src: url("../../assets/fonts/DejaVuSansMono.ttf"); font-weight: normal; }
  @font-face { font-family: "DejaVu Sans Mono"; src: url("../../assets/fonts/DejaVuSansMono-Bold.ttf"); font-weight: bold; }

  :root { --letterbox: #0b0d0f; --hint: #8d9196; }
  html, body { margin: 0; height: 100%; background: var(--letterbox); overflow: hidden; }
  body {
    display: grid;
    place-items: center;
    font-family: "Denim INK", Helvetica, Arial, sans-serif;
  }
  /* The frame is 16:9 at the largest size the window allows. */
  #stage { width: min(100vw, 100vh * 16 / 9); aspect-ratio: 16 / 9; cursor: pointer; }
  #stage svg { display: block; width: 100%; height: 100%; }
  #hint {
    position: fixed; right: 12px; bottom: 10px;
    font-size: 12px; color: var(--hint);
    transition: opacity 0.6s;
  }
  #hint.hidden { opacity: 0; }
  kbd { font-family: inherit; border: 1px solid #444; border-radius: 3px; padding: 0 4px; }
</style>
</head>
<body>
<div id="stage"><svg viewBox="0 0 1120 630" font-family="'Denim INK', Helvetica, Arial, sans-serif" fill="#e6e6e3" role="img" aria-label="Animated account diagram"></svg></div>
<div id="hint"><kbd>→</kbd> next · <kbd>←</kbd> back · <kbd>P</kbd> play / pause · <kbd>F</kbd> full screen</div>
<script src="../engine.js"></script>
<script src="scene.js"></script>
<script>
  const scene = window.OPTIONS_SCENE;
  const svg = document.querySelector("#stage svg");
  svg.setAttribute("viewBox", `0 0 ${scene.canvas.width} ${scene.canvas.height}`);
  const player = new AccountAnimation.Player(scene, svg);
  // Exposed for scripts/animation-frames.mjs and the browser console.
  window.player = player;

  const hint = document.getElementById("hint");
  let hintTimer = setTimeout(() => hint.classList.add("hidden"), 4000);
  const touch = () => {
    hint.classList.remove("hidden");
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => hint.classList.add("hidden"), 2500);
  };

  // A step plays once and then holds until the next key; autoplay holds each
  // finished step for scene.hold before moving on. Presentation remotes send
  // PageDown and PageUp.
  document.addEventListener("keydown", (e) => {
    touch();
    if (["ArrowRight", " ", "PageDown", "Enter"].includes(e.key)) { e.preventDefault(); player.stopAutoplay(); player.next(); }
    else if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); player.prev(); }
    else if (e.key === "Home") { player.stopAutoplay(); player.goto(0); }
    else if (e.key === "End") { player.stopAutoplay(); player.goto(scene.steps.length - 1); }
    else if (e.key === "p" || e.key === "P") { player.autoplay ? player.stopAutoplay() : player.startAutoplay(); }
    else if (e.key === "f" || e.key === "F") {
      document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    }
  });
  document.getElementById("stage").addEventListener("click", () => { player.stopAutoplay(); player.next(); });
  if (new URLSearchParams(location.search).has("autoplay")) player.startAutoplay();
</script>
</body>
</html>
